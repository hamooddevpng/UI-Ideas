name: Apply Design 42 balanced palette v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-design42-balanced-palette-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply palette
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text()
          start='/* Design 42: balanced daylight palette v3 */'
          if start in s:
              s=s[:s.index(start)]
              # keep the document closing tags that follow old override removal
              if '</body>' not in s:
                  s += '\n</body>\n</html>\n'
          css=r'''
<style>
/* Design 42: balanced daylight palette v3 */
:root{
  --deep-bg:#356f8f;
  --page-blue:#f1f4f4;
  --page-blue-2:#e8eef0;
  --page-blue-3:#dce7eb;
  --feature-blue:#2d6f98;
  --feature-blue-2:#3d80a3;
  --feature-blue-3:#5b97b1;
  --footer-blue:#2b5876;
  --footer-blue-2:#234761;
  --ink:#173546;
  --muted:#657e89;
}
html,body{background:#f1f4f4!important;color:#173546!important}

/* Calm page rhythm, light without becoming a white sheet */
.offers,.raffle-offers,.updates,.updates-live{background:#f4f6f5!important}
.services,.service-lab{background:#e9eff1!important}
.support,.support-orbit{background:#e2eaed!important}
.quick-actions,.quick-launchpad{background:transparent!important}

/* Hero: slate-blue, not cyan/teal */
.site-header.scrolled{background:rgba(43,88,118,.96)!important;border-bottom-color:rgba(255,255,255,.18)!important}
.hero{background:#2c6687!important}
.scene-phone{
  background:
    radial-gradient(circle at 78% 42%,rgba(137,202,229,.20),transparent 31%),
    linear-gradient(118deg,#245a79 0%,#347391 55%,#4a88a2 100%)!important;
}
.scene-phone:after{background:linear-gradient(90deg,rgba(27,65,86,.52) 0%,rgba(38,89,113,.26) 45%,rgba(65,126,148,.04) 74%,transparent 100%)!important}
.scene-enterprise{
  background:
    radial-gradient(circle at 77% 49%,rgba(151,209,230,.18),transparent 29%),
    linear-gradient(120deg,#285f7f 0%,#397793 58%,#4e8ba3 100%)!important;
}
.hero[data-scene-index="2"] .scene-enterprise:after{background:linear-gradient(90deg,rgba(28,69,91,.42) 0%,rgba(43,98,120,.18) 52%,rgba(73,137,158,.02) 78%,transparent 100%)!important}
.scene-tabs{background:rgba(35,76,101,.64)!important;border-color:rgba(255,255,255,.22)!important}

/* Services retain one strong branded visual anchor */
.service-stage{background:linear-gradient(145deg,#316f94 0%,#3f83a4 58%,#5a9ab3 100%)!important;box-shadow:0 24px 58px rgba(41,90,115,.14)!important}
.service-art{background:radial-gradient(circle at 72% 35%,rgba(183,224,239,.20),transparent 27%),linear-gradient(145deg,#306c90,#4b8ba8)!important}
.service-caption p{color:#e4f0f4!important}

/* Business & Government: light enterprise canvas, not another blue wall */
.business.business-dual{background:#e5ecef!important;color:#173546!important}
.business-dual .business-dual-head .title,
.business-dual .dual-world-copy h3{color:#173546!important}
.business-dual .business-dual-head .lead,
.business-dual .dual-world-copy>p{color:#607985!important}
.business-dual .business-dual-head .kicker{color:#0875c9!important}
.business-dual .dual-world{
  background:linear-gradient(135deg,#f2f5f5 0%,#e9eff1 100%)!important;
  border:1px solid rgba(38,83,105,.12)!important;
  box-shadow:0 14px 34px rgba(45,86,104,.07)!important;
}
.business-dual .business-world{background:linear-gradient(135deg,#f1f5f6 0%,#e4eef2 100%)!important}
.business-dual .government-world{background:linear-gradient(135deg,#f0f5f2 0%,#e4eee9 100%)!important}
.business-dual .dual-world-top{color:#597682!important}
.business-dual .dual-world-top b{color:#2c6f93!important}
.business-dual .government-world .dual-world-top b{color:#278263!important}
.business-dual .mission-service-card{background:rgba(255,255,255,.68)!important;border-color:rgba(43,91,112,.11)!important;box-shadow:none!important}
.business-dual .portfolio-rail-heading b{color:#173546!important}

/* Customer care: daylight panel with strong blue focal orb */
.support-orbit .support-stage{
  background:
    radial-gradient(circle at 78% 45%,rgba(8,117,201,.08),transparent 34%),
    linear-gradient(145deg,#edf3f5 0%,#dfeaec 52%,#d7e5e9 100%)!important;
  color:#173546!important;
  box-shadow:0 22px 50px rgba(45,86,104,.10)!important;
}
.support-orbit .support-stage .title{color:#173546!important}
.support-orbit .support-stage .lead{color:#607985!important}
.support-orbit .support-stage .kicker{color:#0875c9!important}
.support-orbit .support-link{
  background:rgba(255,255,255,.74)!important;
  color:#173546!important;
  border-color:rgba(43,91,112,.16)!important;
  box-shadow:0 9px 22px rgba(45,86,104,.06)!important;
}
.support-orbit .support-link:hover{background:#fff!important;color:#173546!important}
.support-orbit .support-link small{color:#6a838e!important}
.support-orbit .support-radar i,.support-orbit .support-radar span{border-color:rgba(42,112,145,.22)!important}
.support-hint{color:#718892!important}

/* Assistant: light utility drawer with Telikom blue accents */
.telikom-ai-panel{
  background:linear-gradient(180deg,#f1f5f6 0%,#e5edef 58%,#dde7ea 100%)!important;
  color:#173546!important;
  box-shadow:-18px 0 55px rgba(42,77,94,.18)!important;
}
.telikom-ai-head{background:rgba(226,236,240,.96)!important;border-bottom-color:rgba(38,83,105,.12)!important;color:#173546!important}
.telikom-ai-chip,.telikom-ai-msg.bot,.telikom-ai-form{background:rgba(255,255,255,.62)!important;border-color:rgba(43,91,112,.15)!important;color:#173546!important}
.telikom-ai-chip:hover{background:#fff!important;border-color:rgba(8,117,201,.28)!important}
.telikom-ai-compose{background:#dce7eb!important;border-top-color:rgba(38,83,105,.12)!important}
.telikom-ai-panel p,.telikom-ai-panel small{color:#627d89!important}
.telikom-ai-panel input{color:#173546!important}
.telikom-ai-panel input::placeholder{color:#7f949d!important}

/* Small active elements use the actual brand blue */
.btn.dark,.personal-offer-icon{background:#0875c9!important;border-color:#0875c9!important}
.offer-option:hover,.offer-option.active{background:#2d6f98!important;color:#fff!important}
.offer-option:hover small,.offer-option.active small{color:#d9ebf3!important}
.float-pill,.scene-tabs,.news-live-badge{background:rgba(43,88,118,.72)!important}

/* Footer: grounded slate, clearly lighter than the old navy */
footer{background:linear-gradient(180deg,#2b5876 0%,#234761 100%)!important}
.footer-top{border-bottom-color:rgba(255,255,255,.22)!important}
.footer-brand p,.footer-col a,.footer-bottom{color:#d5e2e8!important}
.footer-col b{color:#fff!important}
.footer-social-icon{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.25)!important}
</style>
'''
          # insert before closing body
          if '</body>' in s:
              s=s.replace('</body>',css+'\n</body>',1)
          else:
              s += css
          p.write_text(s)
          PY
      - name: Commit palette and remove patch workflow
        run: |
          rm -f .github/workflows/apply-design42-balanced-palette-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/apply-design42-balanced-palette-v3.yml
          git commit -m "design: rebalance Design 42 to a lighter daylight palette"
          git pull --rebase origin main
          git push origin main
