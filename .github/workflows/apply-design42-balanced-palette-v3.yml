name: Apply Design 42 balanced palette v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-design42-balanced-palette-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply palette
        run: |
          echo '' | base64 -d > /tmp/apply_palette.py
          python3 /tmp/apply_palette.py
      - name: Commit palette and remove patch workflow
        run: |
          rm -f .github/workflows/apply-design42-balanced-palette-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/apply-design42-balanced-palette-v3.yml
          git commit -m "design: rebalance Design 42 to a lighter daylight palette"
          git pull --rebase origin main
          git push origin main
