name: Seed Public-Service Semantic Analysis

on:
  push:
    paths:
      - ".github/workflows/seed-public-semantic-analysis.yml"

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate reviewed semantic JSON for remaining public-service screenshots
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reference-screenshots/png-public-sites-curated/full-page-1440")
          out = Path("research/website-patterns/cohorts/png-public-services/sites")
          out.mkdir(parents=True, exist_ok=True)
          metadata = json.loads((root / "capture-results.json").read_text(encoding="utf-8"))
          meta = {x["slug"]:x for x in metadata.get("results", [])}

          # type, human label, normalized END y, confidence
          D = {
            "casa-png":[
              ("navigation","CASA PNG institutional header and navigation",.16,.96),
              ("hero_cta","Aviation / aerodrome visual banner",.56,.94),
              ("service_categories","Aerodromes information with news, training and vacancies shortcuts",1,.91)],
            "dherst-noas":[
              ("navigation","DHERST / NOAS institutional header",.08,.94),
              ("online_service","NOAS application-cycle guidance and applicant login form",.92,.97),
              ("footer","NOAS copyright / institutional footer",1,.91)],
            "dherst":[
              ("capture_partial","Robot challenge screen returned instead of the DHERST website",1,.99)],
            "education":[
              ("capture_partial","Loading / protection screen returned instead of the Education website",1,.99)],
            "health":[
              ("capture_partial","Loading / protection screen returned instead of the Health website",1,.99)],
            "immigration-ica":[
              ("capture_partial","Security verification challenge returned instead of the Immigration website",1,.99)],
            "ipa-registry":[
              ("navigation","IPA Registry Services header and navigation",.13,.96),
              ("hero_cta","Welcome to PNG Registry Services hero",.32,.95),
              ("notices","Notices and registry service announcements",.56,.94),
              ("quick_actions","Quick links to company, business and association searches",.70,.96),
              ("regulation_info","Registry service information and public guidance",.95,.91),
              ("footer","IPA Registry footer",1,.92)],
            "irc-tax":[
              ("capture_partial","Internal Revenue Commission server error page; intended homepage was not captured",1,.99)],
            "labour":[
              ("navigation","Department of Labour utility and primary navigation",.20,.96),
              ("hero_cta","Promoting Decent Work and Industrial Harmony hero",.68,.96),
              ("news","Latest News, Announcements and Upcoming Events",1,.94)],
            "ncdc":[
              ("navigation","NCDC logo, utility links and service navigation",.035,.95),
              ("hero_cta","Land Tax and Garbage Rates online-payment hero",.14,.96),
              ("capture_partial","Extremely long blank remainder caused by incomplete full-page capture",1,.99)],
            "png-judiciary":[
              ("navigation","National and Supreme Courts institutional navigation",.17,.97),
              ("hero_cta","National and Supreme Courts hero banner",.48,.96),
              ("quick_actions","Supreme Court, National Court, filing and court-list shortcuts",.66,.96),
              ("footer","Judiciary links and institutional footer",1,.98)],
            "pngcir-nid":[
              ("navigation","PNG Civil and Identity Registry navigation",.055,.97),
              ("hero_cta","Archiving / national data bank hero carousel",.28,.95),
              ("service_categories","Birth, marriage, adoption, divorce, legitimize and death services",.41,.98),
              ("content_feature","About PNG Civil and Identity Registry",.53,.94),
              ("projects","National Identification Project reports and rollout initiatives",.67,.94),
              ("notices","Vacancy and volunteer notices",.73,.92),
              ("form_contact","Nationwide locations and map",.89,.92),
              ("footer","Site statistics, policy, quick links and project footer",1,.95)],
            "pnguot":[
              ("navigation","PNGUoT utility and primary navigation",.045,.98),
              ("quick_actions","Applications, fees, programmes and library resource panel",.36,.96),
              ("content_feature","University profile / About the University",.48,.95),
              ("service_categories","Library, schools and alumni services",.57,.95),
              ("news","Campus News and Announcements",.72,.96),
              ("projects","Upcoming events and service-department features",.82,.91),
              ("content_feature","Academic calendar",.94,.94),
              ("footer","PNGUoT institutional footer",1,.98)],
            "road-traffic-authority":[
              ("navigation","Road Traffic Authority header and navigation",.22,.97),
              ("hero_cta","RTA building / Home banner",.50,.93),
              ("content_feature","Road Traffic Authority welcome and mandate statement",.90,.94),
              ("footer","RTA footer",1,.97)],
            "teaching-service-commission":[
              ("navigation","Teaching Service Commission header and navigation",.08,.98),
              ("hero_cta","Serving Every Teacher hero banner",.30,.97),
              ("content_feature","Welcome messages from Teaching Service Commission leadership",.49,.94),
              ("trust_stats","Three functional wings, leadership and responsibilities",.82,.95),
              ("news","Teaching Service Commission News Updates",.93,.96),
              ("footer","About, related sites and contact footer",1,.98)],
            "university-of-goroka":[
              ("capture_partial","University of Goroka page rendered incompletely with a large loading area",1,.99)],
            "upng":[
              ("capture_partial","Loading / protection screen returned instead of the UPNG homepage",1,.99)]
          }

          existing = {p.stem for p in out.glob("*.json")}
          expected = {p.stem for p in root.glob("*.png")} - existing
          if set(D) != expected:
              raise SystemExit(f"Public semantic inventory mismatch. Missing={sorted(expected-set(D))}; extra={sorted(set(D)-expected)}")

          for slug, items in D.items():
              m = meta.get(slug,{})
              y = 0.0
              sections=[]
              for typ,label,end,confidence in items:
                  end=float(end)
                  if not (y < end <= 1.000001):
                      raise SystemExit(f"{slug}: invalid semantic boundary {y} -> {end}")
                  sections.append({
                    "bounds_normalized":{"x":0.0,"y":round(y,6),"width":1.0,"height":round(end-y,6)},
                    "type":typ,
                    "label":label,
                    "confidence":confidence
                  })
                  y=end
              status = "partial" if any(x["type"]=="capture_partial" for x in sections) else "ok"
              doc={
                "schema_version":"1.0",
                "cohort":"png-public-services",
                "site":{
                  "slug":slug,
                  "name":m.get("name") or slug.replace("-"," ").title(),
                  "url":m.get("requestedUrl") or m.get("finalUrl") or "",
                  "source_repo_path":f"reference-screenshots/png-public-sites-curated/full-page-1440/{slug}.png",
                  "capture_status":status,
                  "coordinate_mode":"normalized",
                  "analysis_method":"AI vision on downscaled proxy of repository screenshot; normalized boundaries mapped to original image",
                  "sections":sections
                }
              }
              (out/f"{slug}.json").write_text(json.dumps(doc,indent=2),encoding="utf-8")
          print(f"Generated {len(D)} reviewed public-service semantic manifests")
          PY

      - name: Commit public-service semantic manifests once
        shell: bash
        run: |
          git add research/website-patterns/cohorts/png-public-services/sites
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: add remaining PNG public-service semantic analysis"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
