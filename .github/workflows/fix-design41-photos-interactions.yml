name: Fix Design 41 photos and interactions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-design41-photos-interactions.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Design 41 photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/design41
          get_photo(){
            url="$1"; out="$2"; fallback="${3:-}"
            if curl -A 'Mozilla/5.0' -fL --retry 3 --retry-delay 2 "$url" -o "$out"; then
              echo "downloaded $out"
            elif [ -n "$fallback" ] && [ -s "$fallback" ]; then
              cp "$fallback" "$out"
              echo "used fallback $fallback for $out"
            else
              return 1
            fi
          }
          get_photo 'https://www.worldbank.org/content/dam/Worldbank/Feature%20Story/EAP/Papua%20New%20Guinea/papua-communication-735x490.jpg' assets/design41/png-community.jpg assets/design40/banner-travel.jpg
          get_photo 'https://mb.cision.com/Public/15029/2108514/94c87f17a0ea051a_org.jpg' assets/design41/png-highlands.jpg assets/design41/png-community.jpg
          get_photo 'https://www.telikom.com.pg/assets/news/308723936_1146629262939133_7327105151876426519_n.jpg' assets/design41/png-port-moresby.jpg assets/design41/png-community.jpg
          get_photo 'https://4.bp.blogspot.com/-tHxq0VE37BU/Wla1Nts9gPI/AAAAAAAAkRw/-MO6a7wuBMYEMfLFRRFGCF6tVsl1ZrQ6gCK4BGAYYCw/s1600/Telikom%2Bin%2BPangia.jpg' assets/design41/png-family.jpg assets/design41/png-port-moresby.jpg
          cp assets/design41/png-highlands.jpg assets/design41/png-coast.jpg
          for f in assets/design41/*.jpg; do test -s "$f"; file "$f"; done

      - name: Make interactions more alive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('41.html')
          s=p.read_text(encoding='utf-8')

          # Quick Support should actually open the action panel rather than only scroll.
          s=s.replace("if(key==='support'&&el.closest('#quick'))document.getElementById('support').scrollIntoView({behavior:reduce?'auto':'smooth'});else openDrawer(key)","openDrawer(key)")

          marker='/* DESIGN 41 LIVELINESS PASS */'
          if marker not in s:
              css=r'''
/* DESIGN 41 LIVELINESS PASS */
.service-row,.segment-tab,.story-step,.notice-head,.command,.footer-col button,.search-result,.drawer .submit{transition:translate .8s var(--ease),background .7s var(--ease),color .7s var(--ease),border-color .7s var(--ease),box-shadow .7s var(--ease)}
.service-row:hover,.segment-tab:hover,.story-step:hover{translate:7px 0}
.notice-head:hover,.command:hover{translate:5px 0}
.hero-side-label{animation:ambientLabel 7s ease-in-out infinite alternate}
.story-badge{animation:ambientBadge 9s ease-in-out infinite alternate}
.enterprise .signal{animation:ambientSignal 12s ease-in-out infinite alternate}
@keyframes ambientLabel{from{translate:0 0}to{translate:-7px 5px}}
@keyframes ambientBadge{from{translate:0 0;rotate:-2deg}to{translate:8px -8px;rotate:2deg}}
@keyframes ambientSignal{from{opacity:.72;translate:0 0}to{opacity:1;translate:-8px 5px}}
@media(prefers-reduced-motion:reduce){.hero-side-label,.story-badge,.enterprise .signal{animation:none!important}}
'''
              s=s.replace('</style>',css+'\n</style>',1)

          js_marker='DESIGN 41 LIVE STATE PREVIEWS'
          if js_marker not in s:
              extra=r'''
<script>
/* DESIGN 41 LIVE STATE PREVIEWS */
(()=>{
  const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(fine){
    document.querySelectorAll('.service-row').forEach(el=>el.addEventListener('pointerenter',()=>{if(!el.classList.contains('active')) el.click();},{passive:true}));
    document.querySelectorAll('.segment-tab').forEach(el=>el.addEventListener('pointerenter',()=>{if(!el.classList.contains('active')) el.click();},{passive:true}));
    document.querySelectorAll('.story-step').forEach(el=>el.addEventListener('pointerenter',()=>{if(!el.classList.contains('active')) el.click();},{passive:true}));
  }
  document.querySelectorAll('.service-row,.segment-tab,.story-step').forEach(el=>el.addEventListener('focus',()=>{if(!el.classList.contains('active')) el.click();}));
  const ambient=[...document.querySelectorAll('.offer-feature,.offer-card,.service-stage,.enterprise-media,.story-collage,.news-card,.support-panel')];
  if(!reduce){
    let t=0;
    const tick=()=>{
      t+=0.006;
      ambient.forEach((el,i)=>{
        if(el.matches(':hover')) return;
        const x=Math.sin(t+i*.9)*1.4;
        const y=Math.cos(t*.83+i*.7)*1.8;
        if(!el.hasAttribute('data-react')) el.style.translate=`${x}px ${y}px`;
      });
      requestAnimationFrame(tick);
    };
    tick();
  }
})();
</script>
'''
              s=s.replace('</body>',extra+'\n</body>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate page and interactions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/design41/png-community.jpg' 41.html
          grep -q 'DESIGN 41 LIVE STATE PREVIEWS' 41.html
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/d41-http.log 2>&1 &
          sleep 1
          node <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const failed=[];
            page.on('requestfailed',r=>failed.push(r.url()));
            await page.goto('http://127.0.0.1:4173/41.html',{waitUntil:'networkidle',timeout:30000});
            await page.waitForTimeout(700);
            const imgs=await page.$$eval('.photo img',els=>els.map(x=>({src:x.getAttribute('src'),ok:x.complete&&x.naturalWidth>0,w:x.naturalWidth})));
            if(imgs.some(x=>!x.ok)) throw new Error('Broken photos: '+JSON.stringify(imgs.filter(x=>!x.ok)));
            await page.click('[data-next]');
            if(!(await page.locator('.hero-slide').nth(1).evaluate(e=>e.classList.contains('active')))) throw new Error('Carousel next failed');
            await page.click('[data-action="recharge"]');
            if(!(await page.locator('.drawer').evaluate(e=>e.classList.contains('open')))) throw new Error('Quick action drawer failed');
            await page.click('.drawer-close');
            await page.hover('[data-service="internet"]');
            await page.waitForTimeout(350);
            if((await page.locator('#serviceTitle').textContent()).trim()!=='Home Internet') throw new Error('Service preview failed');
            await page.hover('[data-segment="government"]');
            await page.waitForTimeout(200);
            if(!(await page.locator('[data-segment="government"]').evaluate(e=>e.classList.contains('active')))) throw new Error('Government preview failed');
            await page.hover('[data-story="2"]');
            await page.waitForTimeout(200);
            if(!(await page.locator('[data-story="2"]').evaluate(e=>e.classList.contains('active')))) throw new Error('Story preview failed');
            await page.click('.notice-head');
            if(!(await page.locator('.notice').first().evaluate(e=>e.classList.contains('open')))) throw new Error('Notice accordion failed');
            await page.click('[data-search-open]');
            if(!(await page.locator('.search-overlay').evaluate(e=>e.classList.contains('open')))) throw new Error('Search failed');
            console.log('photos',imgs.length,'request failures',failed);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

      - name: Commit fixed Design 41
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-design41-photos-interactions.yml
          git add 41.html assets/design41 .github/workflows/fix-design41-photos-interactions.yml
          git commit -m 'Restore Design 41 photography and live interactions'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
