name: One-time design metadata 7-34

on:
  push:
    paths:
      - '.github/workflows/one-time-design-metadata.yml'

permissions:
  contents: write

jobs:
  metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract metadata
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re,urllib.parse
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.in_h1=False; self.h1=[]; self.sections=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='h1': self.in_h1=True
              if tag=='section' and a.get('id'): self.sections.append(a['id'])
            def handle_endtag(self,tag):
              if tag=='h1': self.in_h1=False
            def handle_data(self,d):
              if self.in_h1 and d.strip(): self.h1.append(d.strip())
          out={}
          for n in range(7,35):
            html=Path(f'{n}.html').read_text(encoding='utf-8')
            p=P(); p.feed(html)
            root=''
            m=re.search(r':root\s*\{([^}]*)\}',html,re.I|re.S)
            if m: root=m.group(1)
            colors=[]
            for c in re.findall(r'#[0-9A-Fa-f]{3,8}\b',root):
              c=c.upper()
              if c not in colors: colors.append(c)
            if not colors:
              for c in re.findall(r'#[0-9A-Fa-f]{6}\b',html):
                c=c.upper()
                if c not in colors: colors.append(c)
                if len(colors)>=8: break
            urls=re.findall(r'https?://[^\s"\'\)<>]+',html)
            domains=[]
            for u in urls:
              try: d=urllib.parse.urlparse(u).netloc.lower()
              except: continue
              if d and d not in domains: domains.append(d)
            out[str(n)]={
              'bytes':len(html.encode('utf-8')),
              'h1':' '.join(p.h1),
              'sections':p.sections,
              'palette':colors[:10],
              'external_domains':domains,
              'uses_three':bool(re.search(r'three(?:\.min)?\.js|THREE\.',html,re.I)),
              'uses_webgl':bool(re.search(r'WebGL|canvas|getContext\(["\']webgl',html,re.I)),
              'uses_brand_script':'assets/telikom-brand.js' in html,
              'image_count':len(re.findall(r'<img\b',html,re.I)),
              'button_count':len(re.findall(r'<button\b',html,re.I)),
              'section_count':len(p.sections)
            }
          Path('design-metadata.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-metadata.json
          git commit -m "Add design metadata for concepts 7-34" || true
          git pull --rebase origin main
          git push
