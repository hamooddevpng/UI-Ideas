name: Design 42 compact Digital PNG patch

on:
  push:
    paths:
      - '.github/workflows/_design42_compact_digital_png.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact Digital PNG rail
        run: python scripts/_design42_compact_digital_png.py
      - name: Verify layout markers
        run: |
          grep -q 'id="digital-png-rail"' 42.html
          grep -q 'Services for every<br>part of PNG.' 42.html
          grep -q 'Kumul Cloud' 42.html
          grep -q 'T-Cash' 42.html
          grep -q 'Starlink' 42.html
          test "$(grep -o 'service-story-card' 42.html | wc -l)" -ge 5
          git diff --check
          git diff --stat
      - name: Commit patch and remove temporary files
        run: |
          rm scripts/_design42_compact_digital_png.py
          rm .github/workflows/_design42_compact_digital_png.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add compact Digital PNG service rail'
          git push
