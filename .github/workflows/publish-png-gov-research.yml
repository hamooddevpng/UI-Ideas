name: Publish PNG Government Screenshots to Research

on:
  push:
    paths:
      - '.github/workflows/publish-png-gov-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy curated government screenshots into research folder
        run: |
          set -euo pipefail
          src="reference-screenshots/png-public-sites-curated/full-page-1440"
          dst="assets/banners/research"
          mkdir -p "$dst"

          count=0
          for f in "$src"/*.png; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            cp "$f" "$dst/png-gov-$base"
            count=$((count+1))
          done

          echo "Copied $count PNG government/public-service screenshots to $dst"
          test "$count" -ge 20

      - name: Commit research screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banners/research
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "research: add PNG government website screenshots"
          git pull --rebase origin main
          git push origin main
