name: Fix Design 40 carousel autoplay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-design40-carousel-autoplay.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make carousel autoplay reliably
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('40.html')
          s = p.read_text(encoding='utf-8')
          old = "const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let index=0,timer,startX=0;\n  const show=n=>{index=(n+slides.length)%slides.length;track.style.transform=`translateX(-${index*100}%)`;slides.forEach((s,i)=>s.setAttribute('aria-hidden',i===index?'false':'true'));dots.forEach((d,i)=>d.setAttribute('aria-current',i===index?'true':'false'))};\n  const stop=()=>{clearInterval(timer);timer=null};const start=()=>{if(!reduced&&!document.hidden){stop();timer=setInterval(()=>show(index+1),5200)}};"
          new = "const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let index=0,timer,startX=0;\n  if(reduced)track.style.transition='none';\n  const show=n=>{index=(n+slides.length)%slides.length;track.style.transform=`translateX(-${index*100}%)`;slides.forEach((s,i)=>s.setAttribute('aria-hidden',i===index?'false':'true'));dots.forEach((d,i)=>d.setAttribute('aria-current',i===index?'true':'false'))};\n  const stop=()=>{clearInterval(timer);timer=null};const start=()=>{if(!document.hidden){stop();timer=setInterval(()=>show(index+1),4500)}};"
          if old not in s:
              raise SystemExit('Expected carousel autoplay block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q "setInterval(()=>show(index+1),4500)" 40.html

      - name: Commit change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-design40-carousel-autoplay.yml
          git add 40.html .github/workflows/fix-design40-carousel-autoplay.yml
          git commit -m "Make Design 40 carousel auto scroll reliably"
          git pull --rebase origin main
          git push origin main
