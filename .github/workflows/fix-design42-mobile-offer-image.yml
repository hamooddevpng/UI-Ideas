name: Fix Design 42 Mobile Offer Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-design42-mobile-offer-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace mismatched mobile offer image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42-base.html')
          s=p.read_text()
          old="{tag:'Mobile',icon:'⌁',title:'More data for today.',body:'Explore Telikom mobile data options and choose the bundle that fits what you are doing.',cta:'See mobile options ↗',href:'#services',image:'assets/common/web-sourced/telikom/news-01.jpg',alt:'Telikom mobile service in Papua New Guinea',media:'mobile'}"
          new="{tag:'Mobile',icon:'⌁',title:'More data for today.',body:'Explore Telikom mobile data options and choose the bundle that fits what you are doing.',cta:'See mobile options ↗',href:'#services',image:'assets/common/web-sourced/telikom/news-05.jpg',alt:'Telikom mobile network service in Papua New Guinea',media:'mobile'}"
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('Expected mobile offer object not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42-base.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: use relevant image for Design 42 mobile offer"
          git pull --rebase origin main
          git push origin main
