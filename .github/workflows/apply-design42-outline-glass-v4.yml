name: Apply Design 42 outline glass v4

on:
  push:
    branches: [palette/design42-v4]
    paths:
      - '.github/workflows/apply-design42-outline-glass-v4.yml'

permissions:
  contents: write

actions:

jobs:
  patch-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inject outlined palette into rendered Design 42
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text()
          marker="data-design42-outline-v4"
          if marker not in s:
              css=r'''
/* Design 42 outline glass v4 */
:root{
  --deep-bg:#356f8f;
  --ink:#173546;
  --muted:#657e89;
}
html,body{background:#f3f4f1!important;color:#173546!important}
.offers,.raffle-offers,.updates,.updates-live{background:#f6f7f4!important}
.services,.service-lab{background:#edf1f0!important}
.business.business-dual{background:#eef2f2!important;color:#173546!important}

/* Hero stays branded, but more slate than cyan. */
.site-header.scrolled{background:rgba(46,91,118,.95)!important}
.hero{background:#315f7d!important}
.scene-phone{background:radial-gradient(circle at 78% 42%,rgba(151,205,228,.18),transparent 30%),linear-gradient(118deg,#28556f 0%,#376c88 56%,#527f95 100%)!important}
.scene-phone:after{background:linear-gradient(90deg,rgba(29,61,79,.54) 0%,rgba(42,83,103,.25) 45%,rgba(75,126,145,.03) 76%,transparent 100%)!important}
.scene-enterprise{background:radial-gradient(circle at 77% 49%,rgba(162,215,234,.17),transparent 29%),linear-gradient(120deg,#2c5b76 0%,#3d728a 58%,#568396 100%)!important}
.hero[data-scene-index="2"] .scene-enterprise:after{background:linear-gradient(90deg,rgba(30,65,82,.42) 0%,rgba(46,91,108,.17) 52%,transparent 80%)!important}

/* Large business cards become outlined surfaces instead of filled slabs. */
.business-dual .business-dual-head .title,.business-dual .dual-world-copy h3{color:#173546!important}
.business-dual .business-dual-head .lead,.business-dual .dual-world-copy>p{color:#607985!important}
.business-dual .business-dual-head .kicker{color:#0875c9!important}
.business-dual .dual-world,.business-dual .business-world,.business-dual .government-world{
  background:rgba(255,255,255,.16)!important;
  border:1px solid rgba(40,86,105,.20)!important;
  box-shadow:0 16px 38px rgba(45,86,104,.055)!important;
  backdrop-filter:blur(8px);
}
.business-dual .mission-service-card{background:rgba(255,255,255,.42)!important;border-color:rgba(43,91,112,.12)!important;box-shadow:none!important}
.business-dual .dual-world-top{color:#607c88!important}
.business-dual .dual-world-top b{color:#2c6f93!important}
.business-dual .government-world .dual-world-top b{color:#278263!important}

/* Customer care: neutral canvas, transparent outlined stage, motion behind it. */
.support-orbit{
  position:relative!important;
  isolation:isolate!important;
  overflow:hidden!important;
  background:#f2f3ef!important;
}
.support-orbit:before{
  content:"";
  position:absolute;
  z-index:0;
  width:720px;
  height:720px;
  right:-220px;
  top:-250px;
  border-radius:50%;
  background:radial-gradient(circle at 42% 42%,rgba(8,117,201,.14),rgba(77,160,191,.06) 38%,transparent 70%);
  filter:blur(3px);
  pointer-events:none;
  animation:supportAmbientFloat 13s ease-in-out infinite alternate;
}
.support-orbit:after{
  content:"";
  position:absolute;
  z-index:0;
  inset:-15%;
  pointer-events:none;
  opacity:.48;
  background-image:linear-gradient(rgba(47,102,124,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(47,102,124,.045) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at 72% 53%,#000 0 16%,rgba(0,0,0,.7) 38%,transparent 74%);
  animation:supportGridDrift 22s linear infinite;
}
@keyframes supportAmbientFloat{from{transform:translate3d(-36px,24px,0) scale(.96)}to{transform:translate3d(30px,-22px,0) scale(1.06)}}
@keyframes supportGridDrift{to{background-position:48px 24px,24px 48px}}
.support-orbit .support-stage{
  position:relative!important;
  z-index:2!important;
  background:rgba(255,255,255,.10)!important;
  color:#173546!important;
  border:1px solid rgba(34,85,106,.24)!important;
  box-shadow:0 22px 55px rgba(41,78,94,.065)!important;
  backdrop-filter:blur(9px)!important;
}
.support-orbit .support-stage .title{color:#173546!important}
.support-orbit .support-stage .lead{color:#536f7b!important}
.support-orbit .support-stage .kicker{color:#0875c9!important}
.support-orbit .support-search,.support-orbit form{
  box-shadow:0 10px 28px rgba(40,82,101,.07)!important;
}
.support-orbit .support-link{
  background:rgba(255,255,255,.24)!important;
  color:#173546!important;
  border-color:rgba(43,91,112,.19)!important;
  box-shadow:none!important;
  backdrop-filter:blur(8px)!important;
}
.support-orbit .support-link:hover{background:rgba(255,255,255,.76)!important;color:#173546!important;border-color:rgba(8,117,201,.30)!important}
.support-orbit .support-link small{color:#657f8a!important}
.support-orbit .support-radar i,.support-orbit .support-radar span{border-color:rgba(42,112,145,.22)!important}
.support-orbit .support-hub{box-shadow:0 14px 34px rgba(8,117,201,.18)!important}
.support-hint{color:#718892!important}

/* Assistant follows the same outlined utility language. */
.telikom-ai-panel{background:rgba(239,243,242,.97)!important;color:#173546!important;box-shadow:-18px 0 55px rgba(42,77,94,.16)!important;border-left:1px solid rgba(40,86,105,.16)!important}
.telikom-ai-head{background:rgba(255,255,255,.28)!important;border-bottom-color:rgba(38,83,105,.12)!important;color:#173546!important}
.telikom-ai-chip,.telikom-ai-msg.bot,.telikom-ai-form{background:rgba(255,255,255,.32)!important;border-color:rgba(43,91,112,.16)!important;color:#173546!important;box-shadow:none!important}
.telikom-ai-chip:hover{background:rgba(255,255,255,.72)!important;border-color:rgba(8,117,201,.28)!important}
.telikom-ai-compose{background:rgba(229,236,237,.92)!important;border-top-color:rgba(38,83,105,.12)!important}
.telikom-ai-panel p,.telikom-ai-panel small{color:#627d89!important}
.telikom-ai-panel input{color:#173546!important}
.telikom-ai-panel input::placeholder{color:#7f949d!important}

/* Footer is the only clearly filled large block. */
footer{background:linear-gradient(180deg,#315b75 0%,#284b63 100%)!important}
.footer-brand p,.footer-col a,.footer-bottom{color:#d6e3e8!important}
.footer-col b{color:#fff!important}

@media(max-width:820px){
  .support-orbit:before{width:520px;height:520px;right:-240px;top:220px;opacity:.86}
  .support-orbit:after{background-size:38px 38px;opacity:.36}
  .support-orbit .support-stage{background:rgba(255,255,255,.08)!important;border-color:rgba(34,85,106,.22)!important}
  .support-orbit .support-link{background:rgba(255,255,255,.22)!important}
}
@media(prefers-reduced-motion:reduce){.support-orbit:before,.support-orbit:after{animation:none!important}}
'''
              needle="    document.open();"
              inject="""    const palette=page.createElement('style');\n    palette.setAttribute('data-design42-outline-v4','');\n    palette.textContent=String.raw`"""+css.replace('`','\\`')+"""`;\n    page.head.appendChild(palette);\n\n"""
              if needle not in s:
                  raise SystemExit('document.open marker missing')
              s=s.replace(needle,inject+needle,1)
              p.write_text(s)
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/design42-v4-http.log 2>&1 &
          sleep 1
      - name: Capture visual QA
        run: |
          mkdir -p qa/design42-v4
          node <<'EOF'
          const { chromium } = require('playwright');
          const path=require('path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const cfg of [
              {name:'support-desktop.jpg',viewport:{width:1440,height:900}},
              {name:'support-mobile.jpg',viewport:{width:390,height:844}}
            ]){
              const ctx=await browser.newContext({viewport:cfg.viewport,deviceScaleFactor:1});
              const page=await ctx.newPage();
              await page.goto('http://127.0.0.1:4173/42.html',{waitUntil:'networkidle',timeout:30000});
              await page.waitForTimeout(2200);
              const target=page.locator('#support');
              if(await target.count()){
                await target.scrollIntoViewIfNeeded();
                await page.waitForTimeout(900);
                await target.screenshot({path:path.join('qa','design42-v4',cfg.name),type:'jpeg',quality:90,animations:'disabled',timeout:30000});
              }else{
                await page.screenshot({path:path.join('qa','design42-v4',cfg.name),type:'jpeg',quality:90,fullPage:true,animations:'disabled',timeout:30000});
              }
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: design42-outline-v4-qa
          path: qa/design42-v4/*.jpg
          retention-days: 7
      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-design42-outline-glass-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/apply-design42-outline-glass-v4.yml
          git commit -m "design: try outlined glass palette for Design 42"
          git pull --rebase origin palette/design42-v4
          git push origin palette/design42-v4
