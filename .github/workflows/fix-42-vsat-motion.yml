name: One-time Design 42 VSAT motion refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-42-vsat-motion.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine Design 42 carousel and VSAT scene
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('42.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected fragment: {label}')
              s = s.replace(old, new, 1)

          rep(
            '.hero.phone-peek .phone-launch{z-index:220;transform:translate3d(-24px,-10px,170px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.27);filter:drop-shadow(0 38px 58px rgba(0,0,0,.5)) drop-shadow(0 0 32px rgba(69,195,255,.52))}',
            '.hero.phone-peek .phone-launch{z-index:220;transform:translate3d(-16px,-7px,135px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.14);filter:drop-shadow(0 32px 52px rgba(0,0,0,.46)) drop-shadow(0 0 28px rgba(69,195,255,.48))}',
            'phone hover scale'
          )

          rep(
            '.scene-art{position:absolute;z-index:12;right:0;top:0;width:58%;height:100%;pointer-events:none;perspective:1200px}.hero.phone-peek .scene-art[data-art="0"]{z-index:180}',
            '.scene-art{position:absolute;z-index:12;right:0;top:0;width:58%;height:100%;pointer-events:none;perspective:1200px;opacity:0;visibility:hidden;transform:translate3d(34px,0,0) scale(.985);transition:opacity .72s var(--ease),transform .92s var(--ease),visibility .72s}.scene-art.active-art{opacity:1;visibility:visible;transform:none}.hero.phone-peek .scene-art[data-art="0"]{z-index:180}',
            'scene art transition'
          )

          rep(
            '.satellite{position:absolute;right:9%;top:9%;width:170px;height:74px;transform:translate3d(calc(var(--px)*28px),calc(var(--py)*18px),0) rotate(calc(var(--px)*2deg));filter:drop-shadow(0 20px 20px rgba(0,0,0,.2));transition:transform .12s linear}',
            '.satellite{position:absolute;right:9%;top:9%;width:170px;height:74px;transform:translate3d(calc(var(--hx,0)*92px),calc(var(--hy,0)*52px),0) rotate(calc(var(--hx,0)*7deg));filter:drop-shadow(0 20px 20px rgba(0,0,0,.2));transition:transform .18s ease-out}.satellite:before{content:"";position:absolute;left:82px;top:31px;width:10px;height:10px;border-radius:50%;background:#d9f5ff;box-shadow:0 0 0 0 rgba(217,245,255,.5);animation:satPing 1.8s ease-out infinite}@keyframes satPing{70%,100%{box-shadow:0 0 0 18px rgba(217,245,255,0)}}',
            'satellite tracking'
          )

          rep(
            '.dish-rig{position:absolute;width:330px;height:380px;right:14%;top:17%;transform:translate3d(calc(var(--px)*18px),calc(var(--py)*10px),0)}',
            '.dish-rig{position:absolute;width:330px;height:380px;right:14%;top:17%;transform:translate3d(calc(var(--hx,0)*24px),calc(var(--hy,0)*14px),0);transition:transform .2s ease-out}',
            'dish rig tracking'
          )

          rep(
            '.dish-head{position:absolute;width:245px;height:150px;left:43px;top:23px;transform-style:preserve-3d;transform:rotateY(calc(var(--px)*15deg)) rotateX(calc(var(--py)*-10deg)) rotateZ(-13deg);transition:transform .12s linear}',
            '.dish-head{position:absolute;width:245px;height:150px;left:43px;top:23px;transform-style:preserve-3d;transform:rotateY(calc(var(--hx,0)*30deg)) rotateX(calc(var(--hy,0)*-20deg)) rotateZ(-13deg);transition:transform .18s ease-out}',
            'dish head tracking'
          )

          rep(
            '.signal{position:absolute;left:50%;top:-40px;width:330px;height:225px;transform:translateX(-49%) rotate(calc(var(--px)*2deg));opacity:.56}',
            '.signal{position:absolute;left:50%;top:-40px;width:330px;height:225px;transform:translateX(-49%) rotate(calc(var(--hx,0)*5deg));opacity:.56;transition:transform .18s ease-out;animation:signalBreath 2.2s ease-in-out infinite alternate}@keyframes signalBreath{to{opacity:.82;filter:drop-shadow(0 0 8px rgba(255,255,255,.25))}}',
            'signal tracking'
          )

          rep(
            '.hero-nav{position:absolute;z-index:45;left:50%;bottom:66px;transform:translateX(-50%);width:min(1380px,calc(100% - 80px));display:flex;align-items:center;gap:13px}',
            '.hero-nav{position:absolute;z-index:45;left:auto;right:max(34px,calc((100vw - 1380px)/2));bottom:66px;transform:none;width:auto;display:flex;align-items:center;gap:13px}',
            'desktop hero nav position'
          )

          rep(
            '.hero-copy h1{font-family:"Space Grotesk";font-size:clamp(56px,6.15vw,94px);line-height:.84;letter-spacing:-.068em;margin:16px 0 18px}',
            '.hero-copy h1{font-family:"Space Grotesk";font-size:clamp(56px,6.15vw,94px);line-height:.84;letter-spacing:-.068em;margin:16px 0 18px}.hero[data-scene-index="1"] .hero-copy{max-width:610px}.hero[data-scene-index="1"] .hero-copy h1{font-size:clamp(42px,4.55vw,70px);line-height:.9;letter-spacing:-.055em;max-width:610px;margin:13px 0 14px}.hero[data-scene-index="1"] .hero-copy p{max-width:545px;line-height:1.55}.hero[data-scene-index="1"] .hero-actions{margin-top:16px}',
            'remote scene typography'
          )

          rep(
            '<section class="hero" id="top" tabindex="0">',
            '<section class="hero" id="top" tabindex="0" data-scene-index="0">',
            'hero scene attribute'
          )

          rep(
            '<div class="scene-art" data-art="0">',
            '<div class="scene-art active-art" data-art="0">',
            'initial active art'
          )
          rep(
            '<div class="scene-art" data-art="1" hidden>',
            '<div class="scene-art" data-art="1">',
            'remote art hidden removal'
          )
          rep(
            '<div class="scene-art" data-art="2" hidden>',
            '<div class="scene-art" data-art="2">',
            'network art hidden removal'
          )

          rep(
            "{eyebrow:'VSAT Services',title:'Connecting the Unconnected<br>in rural Papua New Guinea',body:'Remote telecommunications solutions for business and communities, with connectivity options designed for locations beyond the usual network edge.'",
            "{eyebrow:'VSAT Services',title:'Connecting the<br>Unconnected in rural<br>Papua New Guinea',body:'Remote telecommunications solutions for business and communities, with connectivity options designed for locations beyond the usual network edge.'",
            'remote title line breaks'
          )

          rep(
            "arts.forEach((a,n)=>a.hidden=n!==i);tabs.forEach((b,n)=>b.classList.toggle('active',n===i));",
            "arts.forEach((a,n)=>a.classList.toggle('active-art',n===i));tabs.forEach((b,n)=>b.classList.toggle('active',n===i));hero.dataset.sceneIndex=String(i);",
            'art class switching'
          )

          anchor = "hero.addEventListener('keydown',e=>{if(phoneOpen)return;if(e.key==='ArrowRight')setScene(active+1);if(e.key==='ArrowLeft')setScene(active-1)});startAuto();"
          insert = "hero.addEventListener('keydown',e=>{if(phoneOpen)return;if(e.key==='ArrowRight')setScene(active+1);if(e.key==='ArrowLeft')setScene(active-1)});hero.addEventListener('pointermove',e=>{if(coarse)return;const r=hero.getBoundingClientRect();const hx=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2));const hy=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2));hero.style.setProperty('--hx',hx.toFixed(3));hero.style.setProperty('--hy',hy.toFixed(3))});hero.addEventListener('pointerleave',()=>{hero.style.setProperty('--hx','0');hero.style.setProperty('--hy','0')});startAuto();"
          rep(anchor, insert, 'hero pointer tracking')

          rep(
            '.hero-nav{bottom:58px}.scene-tabs',
            '.hero-nav{left:17px;right:17px;bottom:58px;width:auto}.scene-tabs',
            'mobile hero nav'
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check Design 42 JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('42.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          if not blocks:
              raise SystemExit('No script block found')
          Path('/tmp/design42.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/design42.js

      - name: Commit refinement and remove one-time workflow
        run: |
          rm .github/workflows/fix-42-vsat-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/fix-42-vsat-motion.yml
          git commit -m "Refine Design 42 carousel transitions and VSAT motion"
          git push
