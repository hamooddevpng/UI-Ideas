name: Apply Design 42 province bolts v22
on:
  push:
    branches: [fix/design42-canvas-lasers-v18-clean]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply synced bolt rebuild
        run: python3 .patches/apply_design42_province_bolts_v22.py
      - name: Run Design 42 architecture guardrails
        run: node tests/design42-css-architecture.test.mjs
      - name: Verify literal bolt constraints
        run: |
          grep -q "province-bolt-v12" 42-base.html
          grep -q "width:5px;height:1.5px" assets/design42/design42-components.css
          grep -q "bolt.animate" 42-base.html
          grep -q "box-shadow:none" assets/design42/design42-components.css
      - name: Remove temporary patch files
        run: rm -f .patches/apply_design42_province_bolts_v22.py .github/workflows/design42-province-bolts-v22.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync and rebuild Design 42 province bolts"
          git push
