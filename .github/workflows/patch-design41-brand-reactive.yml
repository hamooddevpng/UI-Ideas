name: Patch Design 41 brand and hover motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-design41-brand-reactive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch page
        run: python3 .github/scripts/patch_design41_brand_reactive.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/patch-design41-brand-reactive.yml
          rm .github/scripts/patch_design41_brand_reactive.py
          git add 41.html .github/workflows/patch-design41-brand-reactive.yml .github/scripts/patch_design41_brand_reactive.py
          git commit -m 'Use official Telikom logo and expand Design 41 hover motion'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
