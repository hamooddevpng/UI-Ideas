name: Fix PNG Private Sector Reference Captures

on:
  push:
    paths:
      - '.github/workflows/capture-png-private-sector-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture Daltron retry and Boroko Motors replacement
        run: |
          cat > capture-private-fixes.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const sites = [
            {slug:'daltron', name:'Daltron PNG', category:'Technology / Retail', url:'https://www.daltronpng.com/'},
            {slug:'boroko-motors', name:'Boroko Motors', category:'Automotive / Retail', url:'https://borokomotors.com/'}
          ];
          const outDir = 'reference-screenshots/png-private-sector/full-page-1440';
          const researchDir = 'assets/banners/research';
          fs.mkdirSync(outDir, {recursive:true});
          fs.mkdirSync(researchDir, {recursive:true});

          async function scroll(page) {
            try {
              await page.evaluate(async () => {
                await new Promise(resolve => {
                  let total = 0;
                  const timer = setInterval(() => {
                    const step = Math.max(650, Math.floor(innerHeight * 0.85));
                    scrollBy(0, step); total += step;
                    const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
                    if (total >= h || total > 25000) { clearInterval(timer); scrollTo(0,0); resolve(); }
                  }, 100);
                });
              });
            } catch {}
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1440,height:900}, ignoreHTTPSErrors:true});
            const results = [];
            for (const site of sites) {
              const page = await context.newPage();
              page.setDefaultTimeout(60000);
              let response = null, error = null;
              try { response = await page.goto(site.url, {waitUntil:'domcontentloaded', timeout:45000}); }
              catch (e) { error = String(e); }
              try { await page.waitForTimeout(1800); await scroll(page); await page.waitForTimeout(500); } catch {}
              const file = path.join(outDir, site.slug + '.png');
              let status = 'ok';
              try {
                await page.screenshot({path:file, fullPage:true, animations:'disabled'});
                fs.copyFileSync(file, path.join(researchDir, 'png-private-' + site.slug + '.png'));
              } catch (e) { status='failed'; error=(error ? error+'\n':'')+String(e); }
              results.push({...site, finalUrl:page.url(), title:await page.title().catch(()=>''), httpStatus:response?response.status():null, status, error});
              console.log(site.slug, status, response ? response.status() : '');
              await page.close();
            }
            await browser.close();
            fs.writeFileSync(path.join(outDir,'fix-results.json'), JSON.stringify({capturedAt:new Date().toISOString(),results},null,2));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          node capture-private-fixes.cjs

      - name: Remove blocked RH screenshot from curated research folder
        run: rm -f assets/banners/research/png-private-rh-hypermarket.png

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reference-screenshots/png-private-sector assets/banners/research
          git commit -m "research: replace blocked PNG private-sector references" || exit 0
          git pull --rebase origin main
          git push origin main
