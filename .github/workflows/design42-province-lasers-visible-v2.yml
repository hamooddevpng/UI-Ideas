name: Apply Design 42 province lasers visible v2

on:
  push:
    branches:
      - fix/design42-province-lasers-visible
    paths:
      - .github/workflows/design42-province-lasers-visible-v2.yml

permissions:
  contents: write

jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-province-lasers-visible
          fetch-depth: 0

      - name: Add clearly visible province-to-province laser shots
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('42.html')
          html = path.read_text(encoding='utf-8')

          css_marker = '/* Design 42: province laser shots visible v3 */'
          css = r'''
/* Design 42: province laser shots visible v3 */
.province-laser-layer{pointer-events:none}
.province-laser-route,.province-laser-shot{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.province-laser-route{stroke:#45c8f3;stroke-width:1.4;opacity:.22;filter:url(#nationalLaserGlow);stroke-dasharray:4 9}
.province-laser-shot{stroke:#0875c9;stroke-width:3.6;opacity:0;filter:url(#nationalLaserGlow) drop-shadow(0 0 7px rgba(8,117,201,.82));stroke-dasharray:.16 .84;stroke-dashoffset:1}
.province-laser-impact{fill:none;stroke:#10baf1;stroke-width:2.2;vector-effect:non-scaling-stroke;filter:url(#nationalLaserGlow);transform-box:fill-box;transform-origin:center;animation:provinceLaserImpact .9s ease-out forwards}
.province-laser-spark{fill:#fff;stroke:#0875c9;stroke-width:1.6;vector-effect:non-scaling-stroke;filter:url(#nationalLaserGlow);animation:provinceLaserSpark .9s ease-out forwards}
@keyframes provinceLaserImpact{0%{r:3;opacity:0}15%{opacity:1}100%{r:19;opacity:0}}
@keyframes provinceLaserSpark{0%{r:2;opacity:0}20%{r:4.8;opacity:1}100%{r:2.3;opacity:0}}
@media(prefers-reduced-motion:reduce){.province-laser-shot,.province-laser-impact,.province-laser-spark{display:none!important}.province-laser-route{opacity:.18!important}}
'''

          js_marker = '// Design 42: province laser shots visible v3'
          js = r'''
<script>
// Design 42: province laser shots visible v3
(()=>{
  const section=document.querySelector('.national-story-map');
  const overlay=document.getElementById('nationalProvinceOverlay');
  if(!section||!overlay||document.getElementById('provinceLaserLayer'))return;

  const NS='http://www.w3.org/2000/svg';
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const layer=document.createElementNS(NS,'g');
  layer.id='provinceLaserLayer';
  layer.setAttribute('class','province-laser-layer');
  overlay.appendChild(layer);

  let visible=false;
  const io=new IntersectionObserver(([entry])=>{visible=entry.isIntersecting},{threshold:.08});
  io.observe(section);

  const pointFromNode=node=>{
    const t=node.getAttribute('transform')||'';
    const m=t.match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/);
    return m?{x:+m[1],y:+m[2]}:null;
  };

  const fallback=[
    {x:230,y:360},{x:300,y:332},{x:365,y:302},{x:430,y:327},{x:500,y:300},
    {x:560,y:278},{x:620,y:258},{x:680,y:230},{x:738,y:204},{x:798,y:182},
    {x:845,y:265},{x:770,y:330},{x:690,y:360},{x:600,y:390},{x:505,y:408},
    {x:410,y:405},{x:320,y:420}
  ];

  const points=()=>{
    const live=[...overlay.querySelectorAll('.national-mesh-node')].map(pointFromNode).filter(Boolean);
    return live.length>=8?live:fallback;
  };

  const make=(tag,attrs={})=>{
    const el=document.createElementNS(NS,tag);
    Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,String(v)));
    return el;
  };

  const routePath=(a,b,bend=0)=>{
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2+bend;
    return `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
  };

  const addBackbone=()=>{
    const pts=points();
    const pairs=[[0,3],[2,6],[4,8],[7,10],[3,12],[6,14],[9,11],[11,15],[1,13]];
    pairs.forEach(([i,j],n)=>{
      if(!pts[i]||!pts[j])return;
      layer.appendChild(make('path',{class:'province-laser-route',d:routePath(pts[i],pts[j],(n%2?1:-1)*(10+n*2))}));
    });
  };
  setTimeout(addBackbone,250);

  const choosePair=pts=>{
    for(let attempt=0;attempt<20;attempt++){
      const a=Math.floor(Math.random()*pts.length);
      let b=Math.floor(Math.random()*pts.length);
      if(a===b)b=(b+1)%pts.length;
      const p=pts[a],q=pts[b];
      const d=Math.hypot(q.x-p.x,q.y-p.y);
      if(d>75&&d<430)return [p,q];
    }
    return [pts[0],pts[Math.min(pts.length-1,Math.floor(pts.length*.7))]];
  };

  const fire=()=>{
    if(reduce||!visible||document.hidden)return;
    const pts=points();
    if(pts.length<2)return;
    const [a,b]=choosePair(pts);
    const bend=(Math.random()>.5?1:-1)*(14+Math.random()*34);
    const d=routePath(a,b,bend);

    const shot=make('path',{class:'province-laser-shot',d,pathLength:'1'});
    const impact=make('circle',{class:'province-laser-impact',cx:b.x,cy:b.y,r:'3'});
    const spark=make('circle',{class:'province-laser-spark',cx:b.x,cy:b.y,r:'2'});
    layer.append(shot,impact,spark);

    const duration=500+Math.random()*260;
    const anim=shot.animate([
      {strokeDashoffset:'1',opacity:0,offset:0},
      {opacity:1,offset:.08},
      {opacity:1,offset:.82},
      {strokeDashoffset:'-.18',opacity:0,offset:1}
    ],{duration,easing:'cubic-bezier(.18,.72,.18,1)',fill:'forwards'});
    anim.finished.catch(()=>{}).finally(()=>setTimeout(()=>{shot.remove();impact.remove();spark.remove()},100));
  };

  if(reduce)return;

  const tick=()=>{
    if(visible&&!document.hidden){
      fire();
      setTimeout(fire,120);
      if(Math.random()>.45)setTimeout(fire,260);
    }
    setTimeout(tick,480+Math.random()*420);
  };
  setTimeout(tick,380);
})();
</script>
'''

          if css_marker not in html:
              html = html.replace('</style>', css + '\n</style>', 1)
          if js_marker not in html:
              html = html.replace('</body>', js + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')

          for wf in [
              Path('.github/workflows/design42-province-lasers-visible.yml'),
              Path('.github/workflows/design42-province-lasers-visible-v2.yml')
          ]:
              if wf.exists():
                  wf.unlink()

      - name: Commit branch implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/design42-province-lasers-visible.yml .github/workflows/design42-province-lasers-visible-v2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: make Design 42 province lasers visible"
          git push origin HEAD:fix/design42-province-lasers-visible
