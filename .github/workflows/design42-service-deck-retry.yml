name: Retry Design 42 magnetic service deck
on:
  push:
    paths:
      - '.github/workflows/design42-service-deck-retry.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply magnetic service deck and compact layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/design42-service-deck.yml').read_text().splitlines()
          marker='      - name: Build magnetic service deck and compact sections'
          k=lines.index(marker)
          start=next(i for i in range(k,len(lines)) if "python3 - <<'PY'" in lines[i])+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          body='\n'.join((l[10:] if l.startswith('          ') else l) for l in lines[start:end])+'\n'
          Path('/tmp/apply_service_deck.py').write_text(body)
          PY
          python3 /tmp/apply_service_deck.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html');s=p.read_text()
          s=s.replace("ghost.className='service-flight'","ghost.className='service-card service-flight'",1)
          compact='''\n@media(min-width:821px){.offers .offer-loading-stage{min-height:0;padding-top:105px}.offers .personal-offer{min-height:330px}.offers .personal-offer-media{height:125px}.offers .personal-offer-body{padding:18px 21px 20px}.offers .personal-offer-icon{width:38px;height:38px;margin:14px 0 12px}.offers .personal-offer h3{font-size:25px}.offers .personal-offer p{margin-bottom:16px}.offers .offer-personal-note{margin-top:12px}.offers-loaded .offer-loading-stage{padding-top:8px}}\n'''
          s=s.replace('</style>',compact+'</style>',1)
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});
            const heights=await page.evaluate(()=>Object.fromEntries(['offers','services','business','png-story','updates','support'].map(id=>{const e=document.getElementById(id)||document.querySelector('.'+id);return [id,e?e.getBoundingClientRect().height:0]})));
            for(const [id,h] of Object.entries(heights)){if(h>810)throw Error(id+' exceeds 90vh comfort limit: '+h)}
            await page.evaluate(()=>document.getElementById('services').scrollIntoView({block:'center'}));await page.waitForTimeout(950);
            const fan=await page.evaluate(()=>({ready:services.classList.contains('services-ready'),cards:[...document.querySelectorAll('.service-card[data-service]')].map(c=>({o:parseFloat(getComputedStyle(c).opacity),t:getComputedStyle(c).transform}))}));if(!fan.ready||fan.cards.some(c=>c.o<.95)||new Set(fan.cards.map(c=>c.t)).size<4)throw Error('service fan failed '+JSON.stringify(fan));
            const sr=await page.locator('#services').boundingBox();await page.mouse.move(sr.x+sr.width*.18,sr.y+sr.height*.48);await page.waitForTimeout(180);const t1=await page.evaluate(()=>getComputedStyle(serviceDeck).transform);await page.mouse.move(sr.x+sr.width*.78,sr.y+sr.height*.30);await page.waitForTimeout(180);const t2=await page.evaluate(()=>getComputedStyle(serviceDeck).transform);if(t1===t2)throw Error('mouse tilt did not react');
            await page.hover('.service-card[data-service="3"]');await page.waitForTimeout(180);const hover=await page.evaluate(()=>({title:serviceTitle.textContent,magnet:serviceMagnet.classList.contains('over-card'),active:[...document.querySelectorAll('.service-card[data-service]')].findIndex(c=>c.classList.contains('active'))}));if(!hover.title.includes('Business')||!hover.magnet||hover.active!==3)throw Error('hover preview failed '+JSON.stringify(hover));
            await page.click('.service-card[data-service="3"]');await page.waitForTimeout(100);const flight=await page.evaluate(()=>({ghost:!!document.querySelector('.service-flight'),styled:document.querySelector('.service-flight')?.classList.contains('service-card'),title:serviceTitle.textContent}));if(!flight.ghost||!flight.styled||!flight.title.includes('Business'))throw Error('card launch failed '+JSON.stringify(flight));await page.waitForTimeout(900);if(await page.$('.service-flight'))throw Error('launch ghost did not clean up');
            await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(250);await page.hover('.hero');await page.click('.scene-tab[data-scene="1"]');await page.waitForTimeout(720);await page.mouse.move(1090,180);await page.waitForTimeout(280);const a=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));await page.mouse.move(760,420);await page.waitForTimeout(280);const b=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));if(a.s===b.s||a.d===b.d)throw Error('hero satellite/dish regression');await page.click('.scene-tab[data-scene="2"]');await page.waitForTimeout(700);await page.mouse.move(430,250);let pulse=0,end=Date.now()+2200;while(Date.now()<end){pulse=Math.max(pulse,await page.evaluate(()=>Number(document.querySelector('.tower').dataset.pulseCount||0)));await page.waitForTimeout(40)}if(pulse<1)throw Error('tower heartbeat regression');
            if(errors.length)throw Error(errors.join(' | '));console.log('Section heights',heights);console.log('Service deck interaction OK',hover,flight);console.log('Hero interactions OK',{pulse});await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit safely on latest main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/design42-service-deck.yml .github/workflows/design42-service-deck-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-service-deck.yml .github/workflows/design42-service-deck-retry.yml
          git commit -m 'Add magnetic service deck and compact Design 42 sections'
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n*2))
          done
          exit 1
