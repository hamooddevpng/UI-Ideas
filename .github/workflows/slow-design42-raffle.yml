name: One-time slower Design 42 raffle refinement
on:
  push:
    paths:
      - '.github/workflows/slow-design42-raffle.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slow and strengthen offer raffle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text()
          replacements={
            '.raffle-running .raffle-reel{animation:raffleSpin .92s cubic-bezier(.22,.68,.19,1) both}':'.raffle-running .raffle-reel{animation:raffleSpin 2.15s cubic-bezier(.18,.72,.16,1) both}',
            '.raffle-running .raffle-machine{animation:raffleKick .92s ease-in-out both}':'.raffle-running .raffle-machine{animation:raffleKick 2.15s ease-in-out both}',
            '@keyframes raffleSpin{0%{transform:translateY(0)}18%{transform:translateY(-40px)}58%{transform:translateY(-150px)}84%{transform:translateY(-92px)}100%{transform:translateY(-124px)}}':'@keyframes raffleSpin{0%{transform:translateY(0)}12%{transform:translateY(-124px)}24%{transform:translateY(-31px)}38%{transform:translateY(-155px)}52%{transform:translateY(-62px)}68%{transform:translateY(-186px)}82%{transform:translateY(-93px)}92%{transform:translateY(-142px)}100%{transform:translateY(-124px)}}',
            '@keyframes raffleKick{0%,100%{rotate:0deg}18%{rotate:-1.2deg}32%{rotate:1deg}47%{rotate:-.7deg}68%{rotate:.45deg}}':'@keyframes raffleKick{0%,100%{rotate:0deg}10%{rotate:-1.4deg}18%{rotate:1.1deg}28%{rotate:-.82deg}40%{rotate:.62deg}55%{rotate:-.46deg}70%{rotate:.28deg}85%{rotate:-.12deg}}',
            'transform:translate3d(var(--throw-x),-220px,0) rotate(var(--throw-r)) scale(.46);filter:blur(4px);':'transform:translate3d(var(--throw-x),-280px,0) rotate(var(--throw-r)) scale(.08);filter:blur(8px);',
            'transition:transform .92s calc(var(--delay) + .08s) cubic-bezier(.12,.84,.2,1.08),opacity .38s calc(var(--delay) + .1s) ease,filter .48s calc(var(--delay) + .1s) ease,box-shadow .3s ease,border-color .3s ease':'transition:transform 1.75s calc(var(--delay) + .14s) cubic-bezier(.12,.76,.12,1.12),opacity .62s calc(var(--delay) + .22s) ease,filter .85s calc(var(--delay) + .18s) ease,box-shadow .3s ease,border-color .3s ease',
            '--delay:95ms':'--delay:220ms',
            '--delay:185ms':'--delay:440ms',
            'transition:.5s 1.15s':'transition:.7s 1.7s',
            'transition:padding-top 1s .9s var(--spring)':'transition:padding-top 1.2s .65s var(--spring)',
            'transition:opacity .75s .85s var(--ease),transform .85s .85s var(--spring),filter .75s .85s var(--ease)':'transition:opacity 1.1s .45s var(--ease),transform 1.2s .45s var(--spring),filter 1.1s .45s var(--ease)',
          }
          for old,new in replacements.items():
            assert old in s, f'missing anchor: {old[:90]}'
            s=s.replace(old,new,1)
          old="if(offersSection){let raffleDone=false;const runOfferRaffle=()=>{if(raffleDone)return;raffleDone=true;if(reduce){offersSection.classList.add('offers-loaded');return}offersSection.classList.add('raffle-running');setTimeout(()=>offersSection.classList.add('offers-loaded'),760)};const offerObserver=new IntersectionObserver(([entry])=>{if(entry.isIntersecting){runOfferRaffle();offerObserver.disconnect()}},{threshold:.22,rootMargin:'0px 0px -7% 0px'});offerObserver.observe(offersSection)};"
          new="if(offersSection){let raffleDone=false,offerInView=false;const runOfferRaffle=()=>{if(raffleDone)return;raffleDone=true;if(reduce){offersSection.classList.add('offers-loaded');return}offersSection.classList.add('raffle-running');setTimeout(()=>offersSection.classList.add('offers-loaded'),1950)};const maybeRunOfferRaffle=()=>{if(raffleDone||!offerInView||scrollY<=1)return;runOfferRaffle();offerObserver.disconnect();removeEventListener('scroll',maybeRunOfferRaffle)};const offerObserver=new IntersectionObserver(([entry])=>{offerInView=entry.isIntersecting;if(offerInView)maybeRunOfferRaffle()},{threshold:.22,rootMargin:'0px 0px -7% 0px'});offerObserver.observe(offersSection);addEventListener('scroll',maybeRunOfferRaffle,{passive:true})};"
          assert old in s, 'offer trigger anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const gate=await browser.newPage({viewport:{width:1440,height:2500}});
            await gate.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});
            await gate.waitForTimeout(900);
            const atZero=await gate.evaluate(()=>({y:scrollY,running:document.getElementById('offers').classList.contains('raffle-running'),loaded:document.getElementById('offers').classList.contains('offers-loaded'),top:document.getElementById('offers').getBoundingClientRect().top}));
            if(atZero.y!==0||atZero.running||atZero.loaded)throw new Error('Raffle started at scroll 0 '+JSON.stringify(atZero));
            await gate.close();

            const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});
            await page.evaluate(()=>document.getElementById('offers').scrollIntoView({block:'center'}));
            await page.waitForTimeout(1200);
            const mid1=await page.evaluate(()=>({running:document.getElementById('offers').classList.contains('raffle-running'),loaded:document.getElementById('offers').classList.contains('offers-loaded'),cardOpacity:parseFloat(getComputedStyle(document.querySelector('.personal-offer')).opacity),transform:getComputedStyle(document.querySelector('.personal-offer')).transform}));
            if(!mid1.running||mid1.loaded||mid1.cardOpacity>.05)throw new Error('Raffle no longer has a deliberate spin phase '+JSON.stringify(mid1));
            await page.waitForTimeout(1500);
            const mid2=await page.evaluate(()=>({loaded:document.getElementById('offers').classList.contains('offers-loaded'),cards:[...document.querySelectorAll('.personal-offer')].map(c=>({o:parseFloat(getComputedStyle(c).opacity),tr:getComputedStyle(c).transform}))}));
            if(!mid2.loaded||mid2.cards.every(c=>c.tr==='none'))throw new Error('Cards did not grow through a visible throw phase '+JSON.stringify(mid2));
            await page.waitForTimeout(2200);
            const done=await page.evaluate(()=>({machine:parseFloat(getComputedStyle(document.getElementById('offerRaffle')).opacity),cards:[...document.querySelectorAll('.personal-offer')].map(c=>({o:parseFloat(getComputedStyle(c).opacity),tr:getComputedStyle(c).transform,title:c.querySelector('h3').textContent.trim()}))}));
            if(done.machine>.12||done.cards.some(c=>c.o<.98||c.tr!=='none'||!c.title||c.title.includes('Finding')))throw new Error('Raffle did not settle cleanly '+JSON.stringify(done));
            await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(250);await page.click('.scene-tab[data-scene="1"]');await page.waitForTimeout(760);await page.mouse.move(1080,180);await page.waitForTimeout(300);const a=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));await page.mouse.move(760,430);await page.waitForTimeout(300);const b=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));if(a.s===b.s||a.d===b.d)throw new Error('Satellite/dish regression');
            if(errors.length)throw new Error(errors.join(' | '));console.log('Scroll-zero gate OK',atZero);console.log('Slow raffle phases OK',{mid1,mid2,done});console.log('Hero tracking OK');await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit safely on latest main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/slow-design42-raffle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/slow-design42-raffle.yml
          git commit -m 'Slow Design 42 offer raffle and wait for scroll'
          git fetch origin main
          git rebase origin/main
          git push origin main
