name: Starlink SVG Refresh

on:
  push:
    paths:
      - '.github/workflows/starlink-svg-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh Design 42 Starlink artwork
        shell: python
        run: |
          from pathlib import Path

          p = Path('42.html')
          s = p.read_text(encoding='utf-8')

          old_satellite = '''<div class="satellite"><div class="sat-panel left"></div><div class="sat-body"></div><div class="sat-panel right"></div><div class="sat-dish"></div></div>'''
          new_satellite = '''<div class="satellite" aria-hidden="true"><svg class="starlink-satellite-svg" viewBox="0 0 260 120" role="presentation"><defs><linearGradient id="starSatPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#153a4b"/><stop offset=".52" stop-color="#0b2431"/><stop offset="1" stop-color="#061720"/></linearGradient><linearGradient id="starSatBody" x1="0" x2="1"><stop offset="0" stop-color="#d8e2e5"/><stop offset=".45" stop-color="#f7fbfc"/><stop offset="1" stop-color="#71848b"/></linearGradient><linearGradient id="starSatArray" x1="0" x2="1"><stop offset="0" stop-color="#142f3d"/><stop offset=".5" stop-color="#1e5269"/><stop offset="1" stop-color="#0b2532"/></linearGradient><filter id="starSatGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g class="starlink-sat-array"><path d="M8 42 L102 25 L109 82 L18 99 Z" fill="url(#starSatArray)" stroke="#6c9fb3" stroke-opacity=".7" stroke-width="1.2"/><path d="M24 39 L32 96 M43 35 L50 92 M62 32 L68 88 M81 29 L87 85" class="starlink-sat-grid"/><path d="M10 56 L104 39 M13 72 L106 55 M16 87 L108 70" class="starlink-sat-grid"/></g><g class="starlink-sat-bus"><path d="M101 39 L183 31 L210 49 L199 78 L112 89 L94 67 Z" fill="url(#starSatBody)" stroke="#f1f7f8" stroke-opacity=".72" stroke-width="1.4"/><path d="M112 44 L178 38 L195 51 L188 70 L119 78 L105 65 Z" fill="#657981" opacity=".38"/><path d="M176 35 L201 25 L215 31 L205 47 Z" fill="#e7eff1" stroke="#84979d" stroke-width="1"/><path d="M198 48 L229 42 L239 51 L232 67 L201 73 Z" fill="url(#starSatPanel)" stroke="#99b7c2" stroke-width="1"/><path d="M112 86 L101 102 M126 84 L119 105" stroke="#cbd9dd" stroke-width="3.5" stroke-linecap="round"/><text class="starlink-sat-label" x="126" y="63" transform="rotate(-7 126 63)">STARLINK</text><circle class="starlink-sat-beacon" cx="213" cy="58" r="3.5" fill="#dff8ff" filter="url(#starSatGlow)"/></g></svg></div>'''

          old_dish = '''<div class="dish-rig" aria-hidden="true"><svg class="vsat-dish-svg" viewBox="0 0 360 420" role="presentation"><defs><linearGradient id="dishMetal" x1="0" x2="1"><stop offset="0" stop-color="#74868d"/><stop offset=".24" stop-color="#eaf4f4"/><stop offset=".5" stop-color="#a9bbc0"/><stop offset=".74" stop-color="#f6fbfa"/><stop offset="1" stop-color="#71848a"/></linearGradient><radialGradient id="dishFace" cx="35%" cy="28%" r="72%"><stop offset="0" stop-color="#fff"/><stop offset=".36" stop-color="#edf5f4"/><stop offset=".72" stop-color="#bac8c8"/><stop offset="1" stop-color="#71878a"/></radialGradient><linearGradient id="dishEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9ffff"/><stop offset="1" stop-color="#7f9296"/></linearGradient><linearGradient id="dishSignalGradient" x1="0" x2="1"><stop offset="0" stop-color="#e9fbff" stop-opacity=".9"/><stop offset="1" stop-color="#aee9ff" stop-opacity="0"/></linearGradient></defs><ellipse class="dish-svg-base" cx="180" cy="382" rx="92" ry="24" fill="url(#dishMetal)"/><ellipse cx="180" cy="380" rx="68" ry="12" fill="#61757b" opacity=".38"/><rect class="dish-svg-mast" x="169" y="188" width="22" height="188" rx="11" fill="url(#dishMetal)"/><path d="M180 224 L143 186" fill="none" stroke="#d8e6e6" stroke-width="8" stroke-linecap="round"/><circle cx="180" cy="203" r="19" fill="#87999d"/><circle cx="180" cy="203" r="10" fill="#dce8e8"/><g class="dish-signal-svg"><path d="M181 108 Q250 73 320 82"/><path d="M184 119 Q252 93 318 105"/><path d="M186 130 Q252 113 312 128"/></g><g class="dish-head-svg"><ellipse cx="176" cy="126" rx="112" ry="51" fill="url(#dishFace)" stroke="url(#dishEdge)" stroke-width="5" transform="rotate(-13 176 126)"/><path d="M89 145 Q174 184 275 135" fill="none" stroke="#71878a" stroke-width="4" opacity=".6"/><path d="M176 139 L222 191" fill="none" stroke="#e4eeee" stroke-width="9" stroke-linecap="round"/><path d="M220 188 L236 205" fill="none" stroke="#819398" stroke-width="12" stroke-linecap="round"/><ellipse cx="240" cy="209" rx="14" ry="9" fill="#d8e6e7" transform="rotate(42 240 209)"/><circle cx="177" cy="138" r="7" fill="#6d8288"/></g></svg></div>'''
          new_dish = '''<div class="dish-rig" aria-hidden="true"><svg class="vsat-dish-svg" viewBox="0 0 360 420" role="presentation"><defs><linearGradient id="dishMetal" x1="0" x2="1"><stop offset="0" stop-color="#6c7c82"/><stop offset=".35" stop-color="#edf4f5"/><stop offset=".68" stop-color="#a5b4b8"/><stop offset="1" stop-color="#596c72"/></linearGradient><linearGradient id="starlinkDishFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#eef2f2"/><stop offset="1" stop-color="#c3ccce"/></linearGradient><linearGradient id="starlinkDishBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#697a80"/><stop offset="1" stop-color="#3c5058"/></linearGradient><linearGradient id="dishSignalGradient" x1="0" x2="1"><stop offset="0" stop-color="#eefcff" stop-opacity=".96"/><stop offset="1" stop-color="#aee9ff" stop-opacity="0"/></linearGradient><filter id="starlinkDishShadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><ellipse class="dish-svg-base" cx="181" cy="385" rx="90" ry="17" fill="#17323e" opacity=".28"/><g class="dish-svg-base" fill="none" stroke="url(#dishMetal)" stroke-linecap="round"><path d="M178 350 L111 388" stroke-width="10"/><path d="M181 350 L250 387" stroke-width="10"/><path d="M180 350 L181 397" stroke-width="9"/></g><rect class="dish-svg-mast" x="171" y="183" width="18" height="174" rx="9" fill="url(#dishMetal)" transform="rotate(-3 180 270)"/><path d="M178 214 L215 184" fill="none" stroke="#c9d5d8" stroke-width="9" stroke-linecap="round"/><circle cx="180" cy="210" r="15" fill="#75878c"/><circle cx="180" cy="210" r="7" fill="#e8eff0"/><g class="dish-signal-svg"><path d="M226 92 Q274 58 326 57"/><path d="M232 106 Q281 79 328 82"/><path d="M236 120 Q282 101 324 107"/></g><g class="dish-head-svg" filter="url(#starlinkDishShadow)"><path d="M92 72 Q94 62 105 60 L274 46 Q286 45 289 57 L301 149 Q303 162 290 165 L119 184 Q106 185 103 173 Z" fill="url(#starlinkDishBack)" opacity=".82" transform="translate(5 7)"/><path d="M84 65 Q86 54 98 53 L269 39 Q281 38 284 50 L296 143 Q298 155 285 158 L112 177 Q100 178 97 166 Z" fill="url(#starlinkDishFace)" stroke="#f7fbfb" stroke-width="3"/><path d="M100 157 L284 138" fill="none" stroke="#aebabc" stroke-width="2" opacity=".55"/><path d="M192 165 L213 194" stroke="#eaf1f2" stroke-width="10" stroke-linecap="round"/><path d="M210 192 L222 207" stroke="#697c82" stroke-width="12" stroke-linecap="round"/><rect x="214" y="199" width="22" height="13" rx="5" fill="#dce5e7" transform="rotate(48 225 205)"/><text class="starlink-dish-label" x="171" y="112" transform="rotate(-6 171 112)">STARLINK</text><path class="starlink-dish-mark" d="M138 124 Q171 105 207 111"/></g></svg></div>'''

          if s.count(old_satellite) != 1:
              raise SystemExit(f'Expected one legacy satellite block, found {s.count(old_satellite)}')
          if s.count(old_dish) != 1:
              raise SystemExit(f'Expected one legacy dish block, found {s.count(old_dish)}')

          s = s.replace(old_satellite, new_satellite, 1)
          s = s.replace(old_dish, new_dish, 1)

          css = r'''

/* Design 42: Starlink hardware refresh only. Banner composition and copy intentionally untouched. */
.satellite{right:7.5%!important;top:5.5%!important;width:230px!important;height:108px!important;filter:drop-shadow(0 20px 22px rgba(0,0,0,.24))!important}
.satellite:before{display:none!important}
.starlink-satellite-svg{width:100%;height:100%;overflow:visible}
.starlink-sat-grid{fill:none;stroke:rgba(157,211,232,.28);stroke-width:1;vector-effect:non-scaling-stroke}
.starlink-sat-array{filter:drop-shadow(0 7px 8px rgba(0,0,0,.18))}
.starlink-sat-bus{filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
.starlink-sat-label,.starlink-dish-label{font-family:Manrope,Arial,sans-serif;font-weight:800;letter-spacing:.16em;fill:#18313b}
.starlink-sat-label{font-size:8px}
.starlink-sat-beacon{transform-box:fill-box;transform-origin:center;animation:starSatPulse 1.8s ease-out infinite}
@keyframes starSatPulse{0%{opacity:1;transform:scale(.75)}70%,100%{opacity:.18;transform:scale(2.65)}}
.dish-rig{width:330px!important;height:405px!important;right:8.5%!important}
.starlink-dish-label{font-size:13px;fill:#3b4d53;opacity:.92}
.starlink-dish-mark{fill:none;stroke:#677a80;stroke-width:2.3;stroke-linecap:round;opacity:.58}
.hero[data-scene-index="1"].hero-in-view .satellite{filter:drop-shadow(0 24px 28px rgba(0,0,0,.25)) drop-shadow(0 0 12px rgba(215,246,255,.2))!important}
.hero:not(.hero-in-view) .starlink-sat-beacon{animation-play-state:paused}
@media(max-width:820px){.satellite{right:-2%!important;top:1%!important;width:188px!important;height:88px!important;scale:.74!important}.dish-rig{right:-14%!important;width:315px!important;height:392px!important}}
@media(prefers-reduced-motion:reduce){.starlink-sat-beacon{animation:none!important}}
'''
          marker = '/* Design 42: Starlink hardware refresh only.'
          if marker in s:
              raise SystemExit('Starlink CSS marker already exists')
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify only intended artwork changed
        shell: bash
        run: |
          grep -q 'starlink-satellite-svg' 42.html
          grep -q 'starlinkDishFace' 42.html
          grep -q 'Banner composition and copy intentionally untouched' 42.html
          git diff --check

      - name: Commit artwork and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html
          git rm .github/workflows/starlink-svg-refresh.yml
          git commit -m 'Polish Design 42 Starlink satellite and dish SVG [skip ci]'
          git push
