name: Starlink SVG Refresh

on:
  push:
    paths:
      - '.github/workflows/starlink-svg-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Design 42 artwork
        run: python scripts/_starlink_svg_refresh.py

      - name: Verify patch
        run: |
          grep -q 'starlink-satellite-svg' 42.html
          grep -q 'starlinkDishFace' 42.html
          grep -q 'Banner composition and copy intentionally untouched' 42.html
          git diff --check

      - name: Commit patch and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html
          git rm .github/workflows/starlink-svg-refresh.yml scripts/_starlink_svg_refresh.py
          git commit -m 'Polish Design 42 Starlink satellite and dish SVG [skip ci]'
          git push
