name: Inspect Design 42 story and news markup
on:
  push:
    paths:
      - '.github/workflows/inspect42-story-news.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('42.html').read_text()
          for needle in ['id="png-story"','id="updates"']:
              i=s.find(needle)
              print('\n===== '+needle+' =====')
              print(s[max(0,i-1000):i+9000] if i>=0 else 'NOT FOUND')
          PY
      - name: Self delete
        run: |
          rm -f .github/workflows/inspect42-story-news.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Design 42 markup inspector'
          git push origin HEAD:main
