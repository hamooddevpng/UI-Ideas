name: Design 42 HTMLPreview Hotfix

on:
  push:
    branches:
      - fix/design42-htmlpreview-assets
    paths:
      - '42.html'
      - 'tests/design42-htmlpreview-source-root.test.mjs'
      - '.github/workflows/design42-htmlpreview-hotfix.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reproduce and verify HTMLPreview source-root handling
        run: node tests/design42-htmlpreview-source-root.test.mjs
      - name: Install browser check
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verify the real HTMLPreview main URL loads Design 42
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const assert = require('assert/strict');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const url='https://htmlpreview.github.io/?https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/refs/heads/main/42.html';
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('.hero',{timeout:30000});
            const bodyText=await page.locator('body').innerText();
            assert.ok(!bodyText.includes('Design 42 could not load.'),'HTMLPreview still shows the Design 42 loader error');
            assert.equal(errors.length,0,`Browser errors: ${errors.join(' | ')}`);
            await browser.close();
            console.log('Real HTMLPreview main URL loaded Design 42 successfully.');
          })().catch(error=>{console.error(error);process.exit(1)});
          EOF
