name: One-time Design 42 dish and tower refinement v2
on:
  push:
    paths:
      - '.github/workflows/refine-42-dish-tower-v2.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace dish and tower visuals and pulse logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('42.html'); s=p.read_text()
          dish_css=re.compile(r"\.dish-rig\{.*?\.signal i:nth-child\(4\)\{transform:rotate\(19deg\)\}",re.S)
          s,n=dish_css.subn(r'''.dish-rig{position:absolute;width:350px;height:405px;right:12%;top:14%;transform:translate3d(calc(var(--sat-x,0)*11px),calc(var(--sat-y,0)*7px),0);transition:transform .24s ease-out;filter:drop-shadow(0 28px 34px rgba(0,0,0,.22))}.vsat-dish-svg{width:100%;height:100%;overflow:visible}.dish-svg-base{filter:drop-shadow(0 14px 12px rgba(0,0,0,.22))}.dish-svg-mast{filter:drop-shadow(0 8px 9px rgba(0,0,0,.15))}.dish-head-svg{transform-box:fill-box;transform-origin:50% 55%;transform:translateY(var(--dish-nod,0px)) rotate(var(--dish-rotate,0deg));transition:transform .15s linear;filter:drop-shadow(0 14px 17px rgba(0,0,0,.22))}.dish-signal-svg{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(var(--dish-beam,0deg));transition:transform .15s linear;opacity:.74}.dish-signal-svg path{fill:none;stroke:url(#dishSignalGradient);stroke-linecap:round;animation:dishSignalBreath 2.1s ease-in-out infinite alternate}.dish-signal-svg path:nth-child(1){stroke-width:2.2;opacity:.85}.dish-signal-svg path:nth-child(2){stroke-width:1.7;opacity:.58}.dish-signal-svg path:nth-child(3){stroke-width:1.2;opacity:.38}@keyframes dishSignalBreath{to{opacity:.46;filter:drop-shadow(0 0 5px rgba(222,250,255,.38))}}''',s,count=1); assert n==1,f'dish CSS {n}'
          tower_css=re.compile(r"\.tower\{.*?\.hero\[data-scene-index=\"2\"\]\.hero-in-view \.tower\.aiming \.tower-laser\.l2\{opacity:\.16\}",re.S)
          s,n=tower_css.subn(r'''.tower{position:absolute;right:13%;bottom:5%;width:220px;height:305px;filter:drop-shadow(0 28px 34px rgba(0,0,0,.34));overflow:visible;z-index:6}.network-tower-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.tower-truss{filter:drop-shadow(0 9px 8px rgba(0,0,0,.24))}.tower-emitter{transform-box:fill-box;transform-origin:center;animation:emitterIdle 2.6s ease-in-out infinite alternate}.tower.firing .tower-emitter{animation:emitterFire .42s ease-out both}@keyframes emitterIdle{to{filter:drop-shadow(0 0 8px rgba(116,214,255,.55))}}@keyframes emitterFire{0%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(116,214,255,.45))}38%{transform:scale(1.65);filter:drop-shadow(0 0 18px rgba(156,233,255,.95))}100%{transform:scale(1);filter:drop-shadow(0 0 7px rgba(116,214,255,.48))}}.tower-radio-ring{fill:none;stroke:rgba(126,218,255,.42);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:towerRadio 2.8s ease-out infinite}.tower-radio-ring.r2{animation-delay:.85s}.tower-radio-ring.r3{animation-delay:1.7s}@keyframes towerRadio{0%{opacity:.75;transform:scale(.74)}100%{opacity:0;transform:scale(1.23)}}.tower-pulse-track{position:absolute;left:50%;top:18px;width:var(--pulse-length,140px);height:5px;transform-origin:0 50%;transform:rotate(var(--pulse-angle,0deg));pointer-events:none;opacity:0;z-index:12}.tower-pulse-track.p2{top:20px;transform:rotate(calc(var(--pulse-angle,0deg) + .8deg))}.tower-pulse-track i{position:absolute;left:0;top:50%;width:74px;height:2px;border-radius:999px;background:linear-gradient(90deg,rgba(184,241,255,0),rgba(170,236,255,.98) 38%,#fff 64%,rgba(89,198,247,0));box-shadow:0 0 7px rgba(105,211,255,.78),0 0 16px rgba(67,173,231,.36);transform:translateY(-50%);opacity:0}.tower-pulse-track.p2 i{width:52px;height:1.5px}.tower.firing .tower-pulse-track{opacity:1}.tower.firing .tower-pulse-track.p1 i{animation:towerBolt .48s cubic-bezier(.15,.75,.2,1) both}.tower.firing .tower-pulse-track.p2 i{animation:towerBolt .44s .12s cubic-bezier(.15,.75,.2,1) both}@keyframes towerBolt{0%{opacity:0;transform:translateY(-50%) translateX(0) scaleX(.2)}12%{opacity:1}72%{opacity:.9}100%{opacity:0;transform:translateY(-50%) translateX(max(0px,calc(var(--pulse-length,140px) - 74px))) scaleX(.82)}}.hero:not(.hero-in-view) .tower-radio-ring,.hero:not(.hero-in-view) .tower-emitter{animation-play-state:paused}''',s,count=1); assert n==1,f'tower CSS {n}'
          old_dish=re.compile(r'<div class="dish-rig"><div class="signal"><i></i><i></i><i></i><i></i></div><div class="dish-shadow"></div><div class="base"></div><div class="mast"></div><div class="dish-head"><div class="dish-face"></div><div class="dish-arm"></div></div></div>')
          new_dish='''<div class="dish-rig" aria-hidden="true"><svg class="vsat-dish-svg" viewBox="0 0 360 420" role="presentation"><defs><linearGradient id="dishMetal" x1="0" x2="1"><stop offset="0" stop-color="#74868d"/><stop offset=".24" stop-color="#eaf4f4"/><stop offset=".5" stop-color="#a9bbc0"/><stop offset=".74" stop-color="#f6fbfa"/><stop offset="1" stop-color="#71848a"/></linearGradient><radialGradient id="dishFace" cx="35%" cy="28%" r="72%"><stop offset="0" stop-color="#fff"/><stop offset=".36" stop-color="#edf5f4"/><stop offset=".72" stop-color="#bac8c8"/><stop offset="1" stop-color="#71878a"/></radialGradient><linearGradient id="dishEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9ffff"/><stop offset="1" stop-color="#7f9296"/></linearGradient><linearGradient id="dishSignalGradient" x1="0" x2="1"><stop offset="0" stop-color="#e9fbff" stop-opacity=".9"/><stop offset="1" stop-color="#aee9ff" stop-opacity="0"/></linearGradient></defs><ellipse class="dish-svg-base" cx="180" cy="382" rx="92" ry="24" fill="url(#dishMetal)"/><ellipse cx="180" cy="380" rx="68" ry="12" fill="#61757b" opacity=".38"/><rect class="dish-svg-mast" x="169" y="188" width="22" height="188" rx="11" fill="url(#dishMetal)"/><path d="M180 224 L143 186" fill="none" stroke="#d8e6e6" stroke-width="8" stroke-linecap="round"/><circle cx="180" cy="203" r="19" fill="#87999d"/><circle cx="180" cy="203" r="10" fill="#dce8e8"/><g class="dish-signal-svg"><path d="M181 108 Q250 73 320 82"/><path d="M184 119 Q252 93 318 105"/><path d="M186 130 Q252 113 312 128"/></g><g class="dish-head-svg"><ellipse cx="176" cy="126" rx="112" ry="51" fill="url(#dishFace)" stroke="url(#dishEdge)" stroke-width="5" transform="rotate(-13 176 126)"/><path d="M89 145 Q174 184 275 135" fill="none" stroke="#71878a" stroke-width="4" opacity=".6"/><path d="M176 139 L222 191" fill="none" stroke="#e4eeee" stroke-width="9" stroke-linecap="round"/><path d="M220 188 L236 205" fill="none" stroke="#819398" stroke-width="12" stroke-linecap="round"/><ellipse cx="240" cy="209" rx="14" ry="9" fill="#d8e6e7" transform="rotate(42 240 209)"/><circle cx="177" cy="138" r="7" fill="#6d8288"/></g></svg></div>'''
          s,n=old_dish.subn(new_dish,s,count=1); assert n==1,f'dish HTML {n}'
          old_tower=re.compile(r'<div class="tower"><div class="tower-core"></div><div class="tower-ring r1"></div><div class="tower-ring r2"></div><div class="tower-ring r3"></div><i class="tower-laser l1"></i><i class="tower-laser l2"></i></div>')
          new_tower='''<div class="tower" aria-hidden="true"><svg class="network-tower-svg" viewBox="0 0 220 305" role="presentation"><defs><linearGradient id="towerSteel" x1="0" x2="1"><stop offset="0" stop-color="#284752"/><stop offset=".48" stop-color="#c8dce3"/><stop offset="1" stop-color="#294955"/></linearGradient><linearGradient id="towerAntenna" x1="0" x2="1"><stop offset="0" stop-color="#6f8994"/><stop offset=".5" stop-color="#e5f4f8"/><stop offset="1" stop-color="#607a86"/></linearGradient></defs><g class="tower-truss" fill="none" stroke="url(#towerSteel)" stroke-linecap="round"><path d="M110 40 L55 292 M110 40 L165 292" stroke-width="8"/><path d="M55 292 L165 292" stroke-width="8"/><path d="M99 91 L133 91 M89 137 L143 137 M79 184 L153 184 M69 230 L160 230" stroke-width="5"/><path d="M98 91 L141 137 M132 91 L90 137 M89 137 L151 184 M142 137 L80 184 M79 184 L159 230 M152 184 L70 230 M69 230 L164 292 M160 230 L56 292" stroke-width="3.5" opacity=".9"/></g><rect x="101" y="24" width="18" height="52" rx="6" fill="url(#towerAntenna)"/><rect x="78" y="68" width="13" height="45" rx="5" fill="url(#towerAntenna)" transform="rotate(-8 84 90)"/><rect x="129" y="68" width="13" height="45" rx="5" fill="url(#towerAntenna)" transform="rotate(8 136 90)"/><circle class="tower-emitter" cx="110" cy="25" r="8" fill="#a9ebff"/><ellipse class="tower-radio-ring r1" cx="110" cy="30" rx="54" ry="18"/><ellipse class="tower-radio-ring r2" cx="110" cy="30" rx="78" ry="27"/><ellipse class="tower-radio-ring r3" cx="110" cy="30" rx="101" ry="36"/></svg><span class="tower-pulse-track p1"><i></i></span><span class="tower-pulse-track p2"><i></i></span></div>'''
          s,n=old_tower.subn(new_tower,s,count=1); assert n==1,f'tower HTML {n}'
          block=re.compile(r"const tower=document\.querySelector\('\.tower'\);let heroVisible=true.*?document\.addEventListener\('visibilitychange',\(\)=>syncHeroSceneEffects\(\)\);startAuto\(\);",re.S)
          logic=r'''const tower=document.querySelector('.tower');let heroVisible=true,satTX=0,satTY=0,satX=0,satY=0,heroHX=0,heroHY=0,satRAF=null,pointerInsideHero=false,towerTargetX=0,towerTargetY=0,towerPulseTimer=null,towerPulseKick=null;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function effectsLive(){return heroVisible&&!document.hidden}function stopTowerPulseLoop(){clearInterval(towerPulseTimer);clearTimeout(towerPulseKick);towerPulseTimer=null;towerPulseKick=null;if(tower)tower.classList.remove('firing')}function runSatellite(){if(!effectsLive()||active!==1){satRAF=null;return}satX+=(satTX-satX)*.14;satY+=(satTY-satY)*.14;hero.style.setProperty('--sat-x',satX.toFixed(3));hero.style.setProperty('--sat-y',satY.toFixed(3));const depth=1+Math.min(.075,Math.hypot(satX,satY)*.05);hero.style.setProperty('--sat-scale',depth.toFixed(3));hero.style.setProperty('--dish-yaw',(satX*30).toFixed(2)+'deg');hero.style.setProperty('--dish-pitch',(satY*-20).toFixed(2)+'deg');hero.style.setProperty('--dish-rotate',(satX*18).toFixed(2)+'deg');hero.style.setProperty('--dish-nod',(satY*8).toFixed(2)+'px');hero.style.setProperty('--dish-beam',(satX*5.2).toFixed(2)+'deg');if(Math.abs(satTX-satX)>.0015||Math.abs(satTY-satY)>.0015)satRAF=requestAnimationFrame(runSatellite);else satRAF=null}function startSatellite(){if(!effectsLive()||active!==1)return;satTX=clamp(heroHX*1.08,-1,1);satTY=clamp(heroHY*.88,-.88,.88);if(!satRAF)satRAF=requestAnimationFrame(runSatellite)}function setTowerTarget(x,y){towerTargetX=x;towerTargetY=y}function fireTowerPulse(){if(!tower||!effectsLive()||active!==2||!pointerInsideHero)return;const tr=tower.getBoundingClientRect(),sx=tr.left+tr.width/2,sy=tr.top+18,dx=towerTargetX-sx,dy=towerTargetY-sy;const len=Math.min(1600,Math.max(120,Math.hypot(dx,dy))),ang=Math.atan2(dy,dx)*180/Math.PI;tower.style.setProperty('--pulse-length',len.toFixed(1)+'px');tower.style.setProperty('--pulse-angle',ang.toFixed(2)+'deg');tower.classList.remove('firing');void tower.offsetWidth;tower.dataset.pulseCount=String((Number(tower.dataset.pulseCount)||0)+1);tower.classList.add('firing');setTimeout(()=>tower.classList.remove('firing'),720)}function startTowerPulseLoop(){stopTowerPulseLoop();if(!effectsLive()||active!==2||!pointerInsideHero)return;towerPulseKick=setTimeout(()=>{fireTowerPulse();towerPulseTimer=setInterval(fireTowerPulse,1850)},420)}function syncHeroSceneEffects(){if(active!==2)stopTowerPulseLoop();if(!effectsLive()){if(satRAF){cancelAnimationFrame(satRAF);satRAF=null}stopTowerPulseLoop();return}if(active===1)startSatellite();if(active===2&&pointerInsideHero)startTowerPulseLoop()}hero.addEventListener('pointerenter',e=>{if(e.pointerType==='touch')return;pointerInsideHero=true;setTowerTarget(e.clientX,e.clientY);if(active===2)startTowerPulseLoop()});hero.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!effectsLive())return;pointerInsideHero=true;setTowerTarget(e.clientX,e.clientY);const r=hero.getBoundingClientRect();heroHX=clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1);heroHY=clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1);hero.style.setProperty('--hx',heroHX.toFixed(3));hero.style.setProperty('--hy',heroHY.toFixed(3));if(active===1){satTX=clamp(heroHX*1.08,-1,1);satTY=clamp(heroHY*.88,-.88,.88);startSatellite()}});hero.addEventListener('pointerleave',()=>{pointerInsideHero=false;heroHX=0;heroHY=0;hero.style.setProperty('--hx','0');hero.style.setProperty('--hy','0');stopTowerPulseLoop()});const heroObserver=new IntersectionObserver(([entry])=>{heroVisible=entry.isIntersecting;hero.classList.toggle('hero-in-view',heroVisible);syncHeroSceneEffects()},{threshold:.04});heroObserver.observe(hero);hero.classList.add('hero-in-view');document.addEventListener('visibilitychange',()=>syncHeroSceneEffects());startAuto();'''
          s,n=block.subn(logic,s,count=1); assert n==1,f'logic {n}'
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text(); pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser smoke test
        shell: bash
        run: |
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          cat >/tmp/test.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage({viewport:{width:1440,height:900}});const errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:8000/42.html',{waitUntil:'domcontentloaded'});await p.click('.scene-tab[data-scene="1"]');await p.waitForTimeout(760);await p.mouse.move(1120,170);await p.waitForTimeout(350);const a=await p.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));await p.mouse.move(760,430);await p.waitForTimeout(350);const c=await p.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));if(a.s===c.s||a.d===c.d)throw Error('tracking failed');await p.click('.scene-tab[data-scene="2"]');await p.waitForTimeout(760);await p.mouse.move(430,250);await p.waitForTimeout(2450);const q=await p.evaluate(()=>({n:Number(document.querySelector('.tower').dataset.pulseCount||0),w:parseFloat(getComputedStyle(document.querySelector('.tower-pulse-track')).width),tower:!!document.querySelector('.network-tower-svg'),dish:!!document.querySelector('.vsat-dish-svg')}));if(q.n<1||q.w<100||!q.tower||!q.dish)throw Error('pulse/SVG failed '+JSON.stringify(q));const before=q.n;await p.evaluate(()=>scrollTo(0,900));await p.waitForTimeout(2200);const after=await p.evaluate(()=>Number(document.querySelector('.tower').dataset.pulseCount||0));if(after!==before)throw Error('offscreen firing continued');if(errs.length)throw Error(errs.join('|'));console.log({a,c,q,before,after});await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/test.js
      - name: Commit on latest main safely
        shell: bash
        run: |
          rm -f .github/workflows/refine-42-dish-tower.yml .github/workflows/refine-42-dish-tower-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/refine-42-dish-tower.yml .github/workflows/refine-42-dish-tower-v2.yml
          git commit -m "Refine Design 42 dish tower and heartbeat pulses"
          git pull --rebase origin main
          git push origin main
