name: Apply Design 42 lighter palette to main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-design42-light-palette-main.yml

permissions:
  contents: write

jobs:
  apply-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply lighter Design 42 backgrounds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p = Path('42.html')
          s = p.read_text(encoding='utf-8')
          if '--deep-bg:#0b3d57;' not in s:
              s = s.replace('--navy2:#0a2838;', '--navy2:#0a2838;--deep-bg:#0b3d57;', 1)
          bg_decl = re.compile(r'background(?:-color)?\s*:[^;}{]+', re.I)
          def clean_bg(match):
              value = match.group(0)
              value = value.replace('var(--navy)', 'var(--deep-bg)')
              value = value.replace('#061925', 'var(--deep-bg)')
              value = value.replace('rgba(6,25,37,', 'rgba(11,61,87,')
              value = value.replace('rgb(6,25,37)', 'rgb(11,61,87)')
              return value
          s = bg_decl.sub(clean_bg, s)
          marker = 'Design 42: targeted lighter dark sections v1'
          if marker not in s:
              css_b64 = '' 
              block = base64.b64decode(css_b64).decode('utf-8')
              if '</body>' not in s:
                  raise SystemExit('body close not found')
              s = s.replace('</body>', block + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit palette
        shell: bash
        run: |
          rm -f .github/workflows/apply-design42-light-palette-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: lighten key Design 42 dark sections"
          git push origin HEAD:main
