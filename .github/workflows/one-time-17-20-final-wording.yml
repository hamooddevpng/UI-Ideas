name: One-time concepts 17-20 final wording

on:
  push:
    paths:
      - '.github/workflows/one-time-17-20-final-wording.yml'

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final internal wording
        shell: python
        run: |
          from pathlib import Path

          p=Path('17.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace("document.getElementById('balanceSub').textContent='Selected task • illustrative prototype'","document.getElementById('balanceSub').textContent='Selected task • ready to continue'")
          t=t.replace('\n<!-- Image sources: Unsplash photographs from Papua New Guinea / Port Moresby. -->','')
          p.write_text(t,encoding='utf-8')

          p=Path('20.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('No matching prototype pathway. Try mobile, home, business, remote, support, devices, careers or news.','No matching service found. Try mobile, home, business, remote, support, devices, careers or news.')
          p.write_text(t,encoding='utf-8')

      - name: Commit final wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 17.html 20.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Remove final internal wording from concepts 17 and 20"
            git push
          fi
