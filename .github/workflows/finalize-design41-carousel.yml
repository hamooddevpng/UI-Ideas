name: Finalize Design 41 carousel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-design41-carousel.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep carousel moving
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('41.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="#quick-actions"', 'href="#quick"')
          s = s.replace("  hero.addEventListener('mouseenter',()=>{paused=true;stop();progress?.classList.remove('running')});\n", '')
          s = s.replace("  hero.addEventListener('mouseleave',()=>{paused=false;start()});\n", '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-design41-carousel.yml
          git add 41.html .github/workflows/finalize-design41-carousel.yml
          git commit -m "Keep Design 41 carousel moving"
          git pull --rebase origin main
          git push origin main
