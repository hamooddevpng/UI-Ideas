name: Apply Design 42 province laser bolt v16
on:
  push:
    branches:
      - fix/design42-laser-segment-v15
    paths:
      - .patches/apply_design42_laser_bolt_v16.py
      - .github/workflows/design42-laser-bolt-v16-apply.yml
jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-laser-segment-v15
      - name: Patch only the Design 42 laser section
        run: python3 .patches/apply_design42_laser_bolt_v16.py
      - name: Verify fixed 5px travelling bolt
        run: python3 tests/design42-laser-bolt-v16.test.py
      - name: Remove temporary patch and test files
        run: |
          rm -f .patches/apply_design42_laser_bolt_v16.py
          rm -f tests/design42-laser-bolt-v16.test.py
          rm -f .github/workflows/design42-laser-bolt-v16-test.yml
          rm -f .github/workflows/design42-laser-bolt-v16-apply.yml
      - name: Commit isolated laser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42-base.html .patches tests .github/workflows
          git commit -m "fix: use hero-style 5px province laser bolt"
          git push origin HEAD:fix/design42-laser-segment-v15
