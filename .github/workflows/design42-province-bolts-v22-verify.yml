name: Verify Design 42 province bolts v22
on:
  push:
    branches: [fix/design42-canvas-lasers-v18-clean]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m pip install pillow --quiet
      - name: Verify one physical bolt moves and capture animation
        run: |
          mkdir -p visual-debug
          python3 -m http.server 8080 >/tmp/design42-http.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:900},deviceScaleFactor:1});
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            await page.goto('http://127.0.0.1:8080/42.html',{waitUntil:'networkidle'});
            await page.waitForSelector('#png-story');
            const section=page.locator('#png-story');
            await section.scrollIntoViewIfNeeded();
            await page.waitForTimeout(500);

            const motion=await page.evaluate(async()=>{
              const sleep=ms=>new Promise(r=>setTimeout(r,ms));
              for(let attempt=0;attempt<30;attempt++){
                const bolt=document.querySelector('.province-bolt-v12');
                if(!bolt){await sleep(25);continue}
                const anim=bolt.getAnimations()[0];
                const timing=anim?.effect?.getComputedTiming?.();
                if(!anim||!timing||timing.progress==null||timing.progress>.58){await sleep(20);continue}
                const cs=getComputedStyle(bolt);
                const r1=bolt.getBoundingClientRect();
                const t1=anim.currentTime;
                await sleep(90);
                if(!bolt.isConnected)continue;
                const r2=bolt.getBoundingClientRect();
                const t2=anim.currentTime;
                return {
                  start:{x:r1.x,y:r1.y},end:{x:r2.x,y:r2.y},
                  moved:Math.hypot(r2.x-r1.x,r2.y-r1.y),
                  animationTimeAdvanced:Number(t2)-Number(t1),
                  cssWidth:cs.width,cssHeight:cs.height,boxShadow:cs.boxShadow,
                  stats:window.__provinceLaserV12Stats||null
                };
              }
              return null;
            });
            if(!motion)throw new Error('Could not capture one bolt across two live positions');
            console.log('MOTION',JSON.stringify(motion));
            if(motion.cssWidth!=='5px')throw new Error(`Bolt width is ${motion.cssWidth}, expected 5px`);
            if(motion.moved<18)throw new Error(`Same bolt moved only ${motion.moved}px`);
            if(motion.animationTimeAdvanced<50)throw new Error('Bolt animation clock did not advance');
            fs.writeFileSync('visual-debug/motion.json',JSON.stringify(motion,null,2));

            for(let i=0;i<28;i++){
              await section.screenshot({path:`visual-debug/frame-${String(i).padStart(2,'0')}.png`});
              await page.waitForTimeout(55);
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
          python3 <<'PY'
          from PIL import Image
          from pathlib import Path
          files=sorted(Path('visual-debug').glob('frame-*.png'))
          frames=[Image.open(p).convert('RGB') for p in files]
          frames[0].save('visual-debug/design42-bolts-v22.gif',save_all=True,append_images=frames[1:],duration=55,loop=0,optimize=False)
          print('GIF frames:',len(frames))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: design42-province-bolts-v22-visual
          path: visual-debug
          retention-days: 3
