name: One-time Design 42 editorial business pass
on:
  push:
    paths:
      - '.github/workflows/design42-editorial-business.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PNG replacement photo
        run: |
          test -s assets/design42/png-people.jpg
          python3 - <<'PY'
          from pathlib import Path
          patch=Path('.github/scripts/design42_editorial_business.py')
          s=patch.read_text()
          s=s.replace('assets/design42/png-photographer.jpg','assets/design42/png-people.jpg')
          s=s.replace('Papua New Guinea photographer working outdoors','People in Papua New Guinea')
          if "\nattr=Path('assets/design42/ATTRIBUTION.md')" in s:
              s=s.split("\nattr=Path('assets/design42/ATTRIBUTION.md')",1)[0]+'\n'
          patch.write_text(s)
          verify=Path('.github/scripts/verify42_editorial_business.js')
          v=verify.read_text().replace('assets/design42/png-photographer.jpg','assets/design42/png-people.jpg')
          verify.write_text(v)
          PY
      - name: Apply editorial business redesign
        run: python3 .github/scripts/design42_editorial_business.py
      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        run: |
          npm install --prefix /tmp/design42-pw --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          NODE_PATH=/tmp/design42-pw/node_modules node .github/scripts/verify42_editorial_business.js
      - name: Commit verified redesign
        run: |
          rm -f .github/workflows/design42-editorial-business.yml \
                .github/scripts/design42_editorial_business.py \
                .github/scripts/verify42_editorial_business.js
          if grep -RIn --exclude-dir=.git 'photo-1728957467648-ad5e95eafa1e' .; then
            echo 'Removed Unsplash photo still exists somewhere in repository'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Design 42 business services editorial and readable'
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
