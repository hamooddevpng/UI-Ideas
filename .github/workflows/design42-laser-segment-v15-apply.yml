name: Apply Design 42 laser segment v15
on:
  push:
    branches:
      - fix/design42-laser-tail-v14
    paths:
      - '.github/workflows/design42-laser-segment-v15-apply.yml'
jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the Design 42 laser section
        run: python .patches/apply_design42_laser_segment_v15.py
      - name: Verify 5px travelling laser segment
        run: python .patches/test_design42_laser_segment_v15.py
      - name: Remove temporary patch and test files
        run: |
          rm .patches/apply_design42_laser_segment_v15.py
          rm .patches/test_design42_laser_segment_v15.py
          rm .github/workflows/design42-laser-segment-v15-test.yml
          rm .github/workflows/design42-laser-segment-v15-apply.yml
      - name: Commit isolated laser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42-base.html .patches .github/workflows
          git commit -m "fix: cap Design 42 laser segment at five pixels"
          git push
