name: Sync Telikom logo asset

on:
  push:
    paths:
      - '.github/workflows/sync-telikom-logo.yml'

permissions:
  contents: write

jobs:
  sync-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Telikom logo
        run: |
          set -euo pipefail
          mkdir -p assets/brand
          curl -fL --retry 3 --retry-delay 2 \
            'https://www.telikom.com.pg/assets/misc/TPNGLOGO.png' \
            -o assets/brand/telikom-logo.png
          test -s assets/brand/telikom-logo.png
          file assets/brand/telikom-logo.png

      - name: Commit local logo asset
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/telikom-logo.png
          if git diff --cached --quiet; then
            echo 'Logo already up to date.'
            exit 0
          fi
          git commit -m 'Add official Telikom logo asset'
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Push attempt $attempt"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Could not push logo asset after retries.' >&2
          exit 1
