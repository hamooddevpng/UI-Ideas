name: Fix Design 42 laser runtime v8

on:
  push:
    branches:
      - fix/design42-laser-runtime-v8
    paths:
      - .github/workflows/design42-laser-runtime-v8.yml

permissions:
  contents: write

jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-laser-runtime-v8
          fetch-depth: 0
      - name: Patch laser runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text(encoding='utf-8')
          old="""    const nodesGroup=network.querySelector('g:last-child');
    if(nodesGroup)network.insertBefore(layer,nodesGroup);else network.appendChild(layer);"""
          new="""    const nodesGroup=network.lastElementChild;
    if(nodesGroup&&nodesGroup.parentNode===network)network.insertBefore(layer,nodesGroup);else network.appendChild(layer);"""
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/design42-laser-runtime-v8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: start Design 42 laser runtime"
          git push origin HEAD:fix/design42-laser-runtime-v8
