name: Compact and fluid Design 41

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-fluid-design41.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Design 41
        run: python3 scripts/compact_and_fluid_design41.py

      - name: Install browser test dependency
        run: |
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Browser validate 80vh rhythm and fluid motion
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/d41-http.log 2>&1 &
          sleep 1
          node scripts/test_design41_compact_fluid.js

      - name: Commit safely and remove one-time helpers
        run: |
          set -euo pipefail
          rm -f .github/workflows/compact-fluid-design41.yml scripts/compact_and_fluid_design41.py scripts/test_design41_compact_fluid.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 41.html .github/workflows/compact-fluid-design41.yml scripts/compact_and_fluid_design41.py scripts/test_design41_compact_fluid.js
          git commit -m 'Cap Design 41 sections and restore fluid depth motion'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
