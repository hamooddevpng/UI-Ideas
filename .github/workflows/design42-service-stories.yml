name: One-time Design 42 service story wall
on:
  push:
    paths:
      - '.github/workflows/design42-service-stories.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace service portal with PNG story cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('42.html'); s=p.read_text()
          section='''<section class="services service-stories" id="services"><div class="story-cursor" id="storyCursor" aria-hidden="true"><span>READ</span></div><div class="shell"><div class="head-row reveal service-stories-head"><div><div class="kicker">Service categories</div><h2 class="title">Services for every<br>part of PNG.</h2></div><p class="lead">Explore Telikom through real stories, people and places. Move across the cards to bring each service into focus.</p></div><div class="service-story-grid" id="serviceStoryGrid"><article class="service-story-card story-feature" data-story="0" style="--deal-x:330px;--deal-y:95px;--deal-r:-9deg;--delay:0ms"><div class="service-story-inner"><img class="service-story-photo" loading="lazy" src="https://images.unsplash.com/photo-1728957437280-4010c8a8a627?auto=format&fit=crop&w=1500&q=82" alt="People at Ela Beach, Port Moresby, Papua New Guinea"><div class="story-shade"></div><div class="story-copy"><span>01 / Mobile</span><h3>Mobile that moves with PNG.</h3><p>Plans, passes, roaming and everyday account services.</p><a href="#offers">Explore mobile ↗</a></div><a class="story-credit" href="https://unsplash.com/photos/Hd8iV-pVdoU" target="_blank" rel="noreferrer">Photo · PNG</a></div></article><article class="service-story-card" data-story="1" style="--deal-x:-145px;--deal-y:115px;--deal-r:7deg;--delay:90ms"><div class="service-story-inner"><img class="service-story-photo" loading="lazy" src="https://images.unsplash.com/photo-1657458584946-e9fbf69b7521?auto=format&fit=crop&w=1200&q=82" alt="Community group in Papua New Guinea"><div class="story-shade"></div><div class="story-copy"><span>02 / Fixed Broadband</span><h3>Home internet.</h3><p>Fixed connectivity for homes and communities.</p><a href="#offers">Explore broadband ↗</a></div><a class="story-credit" href="https://unsplash.com/photos/psSgFqlUnOs" target="_blank" rel="noreferrer">Photo · PNG</a></div></article><article class="service-story-card" data-story="2" style="--deal-x:-345px;--deal-y:115px;--deal-r:11deg;--delay:170ms"><div class="service-story-inner"><img class="service-story-photo" loading="lazy" src="https://images.unsplash.com/photo-1728957467648-ad5e95eafa1e?auto=format&fit=crop&w=1200&q=82" alt="Women at Ela Beach, Port Moresby, Papua New Guinea"><div class="story-shade"></div><div class="story-copy"><span>03 / Devices</span><h3>Phones & devices.</h3><p>Connected hardware for work, life and everything between.</p><a href="#support">Explore devices ↗</a></div><a class="story-credit" href="https://unsplash.com/photos/9bmuXZWB4W4" target="_blank" rel="noreferrer">Photo · PNG</a></div></article><article class="service-story-card" data-story="3" style="--deal-x:-145px;--deal-y:-115px;--deal-r:-6deg;--delay:250ms"><div class="service-story-inner"><img class="service-story-photo" loading="lazy" src="https://images.unsplash.com/photo-1652355076566-eab4a2f9cfe1?auto=format&fit=crop&w=1200&q=82" alt="Local work scene in Papua New Guinea"><div class="story-shade"></div><div class="story-copy"><span>04 / Business</span><h3>Business services.</h3><p>Data, voice, hosting and remote connectivity.</p><a href="#business">Explore business ↗</a></div><a class="story-credit" href="https://unsplash.com/photos/Lyu49gW7F7E" target="_blank" rel="noreferrer">Photo · PNG</a></div></article><article class="service-story-card" data-story="4" style="--deal-x:-345px;--deal-y:-115px;--deal-r:8deg;--delay:330ms"><div class="service-story-inner"><img class="service-story-photo" loading="lazy" src="https://images.unsplash.com/photo-1728957526752-b195c3584c37?auto=format&fit=crop&w=1200&q=82" alt="Family at Ela Beach, Port Moresby, Papua New Guinea"><div class="story-shade"></div><div class="story-copy"><span>05 / Support</span><h3>Help when you need it.</h3><p>Customer Care, service help and account assistance.</p><a href="#support">Get support ↗</a></div><a class="story-credit" href="https://unsplash.com/photos/Wa9xAyJ8h5Q" target="_blank" rel="noreferrer">Photo · PNG</a></div></article></div></div></section>'''
          pat=r'<section class="services[^"]*" id="services">.*?</section>\s*<section class="business"'
          m=re.search(pat,s,re.S); assert m,'services section not found'
          s=s[:m.start()]+section+'\n<section class="business"'+s[m.end():]
          js='''const serviceStoriesSection=document.getElementById('services'),serviceStoryGrid=document.getElementById('serviceStoryGrid'),storyCursor=document.getElementById('storyCursor'),serviceStoryCards=[...document.querySelectorAll('.service-story-card')];if(serviceStoriesSection&&serviceStoryGrid){const storyObserver=new IntersectionObserver(([entry])=>{if(entry.isIntersecting){serviceStoriesSection.classList.add('stories-ready');storyObserver.disconnect()}},{threshold:.18});storyObserver.observe(serviceStoriesSection);serviceStoriesSection.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')serviceStoriesSection.classList.add('story-pointer-live')});serviceStoriesSection.addEventListener('pointerleave',()=>{serviceStoriesSection.classList.remove('story-pointer-live','stories-focused');serviceStoryCards.forEach(c=>{c.classList.remove('focused');c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');c.style.setProperty('--photo-x','0px');c.style.setProperty('--photo-y','0px')});storyCursor?.classList.remove('over-story')});serviceStoriesSection.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=serviceStoriesSection.getBoundingClientRect();if(storyCursor){storyCursor.style.left=(e.clientX-r.left)+'px';storyCursor.style.top=(e.clientY-r.top)+'px';const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.service-story-card');storyCursor.classList.toggle('over-story',!!hit)}} ,{passive:true});serviceStoryCards.forEach(card=>{card.addEventListener('pointerenter',()=>{serviceStoriesSection.classList.add('stories-focused');serviceStoryCards.forEach(c=>c.classList.toggle('focused',c===card))});card.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.setProperty('--ry',(x*7).toFixed(2)+'deg');card.style.setProperty('--rx',(y*-6).toFixed(2)+'deg');card.style.setProperty('--photo-x',(x*-12).toFixed(1)+'px');card.style.setProperty('--photo-y',(y*-10).toFixed(1)+'px')});card.addEventListener('pointerleave',()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');card.style.setProperty('--photo-x','0px');card.style.setProperty('--photo-y','0px');setTimeout(()=>{if(!serviceStoryGrid.matches(':hover')){serviceStoriesSection.classList.remove('stories-focused');serviceStoryCards.forEach(c=>c.classList.remove('focused'))}},20)})})}'''
          js_pat=r'const serviceData=.*?(?=document\.querySelectorAll\(\'\.notice-head\'\))'
          jm=re.search(js_pat,s,re.S); assert jm,'old service js not found'
          s=s[:jm.start()]+js+s[jm.end():]
          css='''\n/* Design 42: PNG editorial service stories */\n.service-stories{position:relative;background:var(--ice);overflow:hidden}\n.service-stories-head{margin-bottom:20px}.service-stories-head .title{font-size:clamp(44px,5.1vw,74px)}\n.service-story-grid{height:430px;display:grid;grid-template-columns:1.15fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;perspective:1200px}\n.service-story-card{position:relative;min-width:0;min-height:0;border-radius:24px;opacity:0;transform:translate3d(var(--deal-x),var(--deal-y),0) rotate(var(--deal-r)) scale(.34);transform-origin:center;transition:transform 1.05s var(--delay) var(--spring),opacity .58s var(--delay) ease,filter .32s ease;filter:saturate(.78) brightness(.94);z-index:1}.service-story-card:nth-child(1){grid-row:1/3;grid-column:1}.service-story-card:nth-child(2){grid-row:1;grid-column:2}.service-story-card:nth-child(3){grid-row:1;grid-column:3}.service-story-card:nth-child(4){grid-row:2;grid-column:2}.service-story-card:nth-child(5){grid-row:2;grid-column:3}.stories-ready .service-story-card{opacity:1;transform:none}.service-story-inner{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:#092231;box-shadow:0 18px 46px rgba(15,53,75,.13);transform:perspective(950px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .16s ease-out,box-shadow .32s var(--spring);transform-style:preserve-3d}.service-story-photo{position:absolute;inset:-4%;width:108%;height:108%;max-width:none;object-fit:cover;transform:translate3d(var(--photo-x,0px),var(--photo-y,0px),0) scale(1.035);filter:saturate(.9) contrast(1.03);transition:transform .18s ease-out,filter .32s}.story-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,20,30,.02) 15%,rgba(3,20,30,.22) 48%,rgba(3,20,30,.92) 100%)}.story-copy{position:absolute;z-index:3;left:21px;right:20px;bottom:19px;color:#fff;transform:translateZ(24px)}.story-copy span{font-size:7px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#aee8ff}.story-copy h3{font-family:"Space Grotesk";font-size:clamp(21px,2vw,32px);line-height:.95;letter-spacing:-.045em;margin:7px 0 7px}.story-feature .story-copy h3{font-size:clamp(34px,3.4vw,51px);max-width:470px}.story-copy p{font-size:8.5px;line-height:1.45;color:#c9dbe4;margin:0 0 10px;max-width:330px}.story-copy a{font-size:8px;font-weight:800;color:#fff}.story-credit{position:absolute;z-index:4;right:12px;top:11px;padding:6px 8px;border-radius:999px;background:rgba(4,25,36,.48);backdrop-filter:blur(8px);color:#d8edf5;font-size:6px;font-weight:700;letter-spacing:.04em}.stories-focused .service-story-card:not(.focused){filter:saturate(.48) brightness(.72);transform:scale(.985)}.service-story-card.focused{z-index:8;filter:saturate(1.05) brightness(1.03);transform:translateY(-8px) scale(1.025)}.service-story-card.focused .service-story-inner{box-shadow:0 30px 72px rgba(6,25,37,.24)}.service-story-card.focused .service-story-photo{filter:saturate(1.08) contrast(1.04)}\n.story-cursor{position:absolute;z-index:50;left:0;top:0;width:18px;height:18px;border:1px solid rgba(28,160,232,.52);border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%);transition:width .18s,height .18s,opacity .18s,background .18s;display:grid;place-items:center;color:#fff;font-size:6px;font-weight:800;letter-spacing:.09em}.story-cursor span{opacity:0;transition:.18s}.story-pointer-live .story-cursor{opacity:.62}.story-cursor.over-story{width:54px;height:54px;background:rgba(6,25,37,.86);border-color:rgba(174,232,255,.68);box-shadow:0 12px 28px rgba(6,25,37,.2)}.story-cursor.over-story span{opacity:1}\n@media(min-width:821px){.service-stories{height:min(80vh,720px);min-height:620px;padding:45px 0}.service-stories .shell{height:100%;display:flex;flex-direction:column}.service-story-grid{flex:1;min-height:0}.service-stories-head{flex:0 0 auto}}\n@media(max-width:820px){.service-stories{height:auto;min-height:0;padding:72px 0}.service-stories-head{margin-bottom:26px}.service-story-grid{height:auto;display:flex;gap:12px;overflow-x:auto;padding:3px 2px 20px;scroll-snap-type:x mandatory;perspective:none;scrollbar-width:none}.service-story-card,.stories-ready .service-story-card,.stories-focused .service-story-card:not(.focused),.service-story-card.focused{position:relative;flex:0 0 82%;height:380px;opacity:1;transform:none;filter:none;scroll-snap-align:center}.service-story-card:nth-child(n){grid-row:auto;grid-column:auto}.story-feature .story-copy h3{font-size:36px}.story-cursor{display:none}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text();pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900}}),errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>document.getElementById('services').scrollIntoView({block:'center'}));await page.waitForTimeout(1900);
            const base=await page.evaluate(()=>({height:services.getBoundingClientRect().height,ready:services.classList.contains('stories-ready'),cards:document.querySelectorAll('.service-story-card').length,oldPortal:!!document.querySelector('.service-portal'),imgs:[...document.querySelectorAll('.service-story-photo')].map(i=>({w:i.naturalWidth,src:i.currentSrc}))}));
            if(base.height>810||!base.ready||base.cards!==5||base.oldPortal||base.imgs.some(x=>x.w<200))throw Error('story wall base failed '+JSON.stringify(base));
            const card=page.locator('.service-story-card[data-story="2"]');await card.hover();await page.waitForTimeout(350);const before=await card.evaluate(el=>({f:el.classList.contains('focused'),t:getComputedStyle(el.querySelector('.service-story-inner')).transform,c:document.getElementById('storyCursor').classList.contains('over-story')}));const box=await card.boundingBox();await page.mouse.move(box.x+box.width*.82,box.y+box.height*.24);await page.waitForTimeout(200);const after=await card.evaluate(el=>getComputedStyle(el.querySelector('.service-story-inner')).transform);if(!before.f||!before.c||before.t===after)throw Error('story hover/tilt failed '+JSON.stringify({before,after}));
            await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(250);await page.hover('.hero');await page.click('.scene-tab[data-scene="1"]');await page.waitForTimeout(720);await page.mouse.move(1090,180);await page.waitForTimeout(260);const a=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));await page.mouse.move(760,420);await page.waitForTimeout(260);const b=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));if(a.s===b.s||a.d===b.d)throw Error('hero regression');
            if(errors.length)throw Error(errors.join(' | '));console.log('Service stories OK',base);console.log('Pointer tilt OK');await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit safely on latest main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/design42-service-stories.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-service-stories.yml
          git commit -m 'Replace Design 42 service portal with PNG story cards'
          git pull --rebase origin main
          git push origin main
