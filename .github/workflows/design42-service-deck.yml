name: One-time Design 42 magnetic service deck
on:
  push:
    paths:
      - '.github/workflows/design42-service-deck.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build magnetic service deck and compact sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('42.html')
          s=p.read_text()

          new_section='''<section class="services service-lab" id="services"><div class="service-magnet" id="serviceMagnet" aria-hidden="true"><span>VIEW</span></div><div class="shell"><div class="head-row reveal service-head"><div><div class="kicker">Service categories</div><h2 class="title">Pick a service.<br>Watch it come alive.</h2></div><p class="lead">Move through Telikom services like a deck. Hover to preview, click to launch a service into the network.</p></div><div class="service-lab-grid"><div class="service-deck-wrap reveal"><div class="service-deck" id="serviceDeck"><button class="service-card active" data-service="0" style="--x:-190px;--y:-48px;--r:-10deg;--i:0;--accent:#1ca0e8"><span class="service-card-num">01</span><span class="service-card-icon">⌁</span><b>Mobile</b><small>Plans, passes, roaming and account services.</small><span class="service-card-arrow">↗</span></button><button class="service-card" data-service="1" style="--x:-102px;--y:52px;--r:-5deg;--i:1;--accent:#20a957"><span class="service-card-num">02</span><span class="service-card-icon">⌂</span><b>Fixed Broadband</b><small>Home and fixed internet connectivity.</small><span class="service-card-arrow">↗</span></button><button class="service-card" data-service="2" style="--x:0px;--y:102px;--r:0deg;--i:2;--accent:#9a78ff"><span class="service-card-num">03</span><span class="service-card-icon">▣</span><b>Devices</b><small>Phones, tablets and connected hardware.</small><span class="service-card-arrow">↗</span></button><button class="service-card" data-service="3" style="--x:102px;--y:52px;--r:5deg;--i:3;--accent:#ff9f43"><span class="service-card-num">04</span><span class="service-card-icon">↗</span><b>Business</b><small>Data, voice, hosting and remote connectivity.</small><span class="service-card-arrow">↗</span></button><button class="service-card" data-service="4" style="--x:190px;--y:-48px;--r:10deg;--i:4;--accent:#2ec7c9"><span class="service-card-num">05</span><span class="service-card-icon">?</span><b>Support</b><small>Customer Care, help and account assistance.</small><span class="service-card-arrow">↗</span></button></div><div class="service-deck-hint">Move your pointer across the deck · click a card to launch it</div></div><div class="service-portal reveal" id="servicePortal"><div class="portal-grid"></div><span class="portal-ring pr1"></span><span class="portal-ring pr2"></span><span class="portal-ring pr3"></span><span class="portal-node pn1"></span><span class="portal-node pn2"></span><span class="portal-node pn3"></span><div class="portal-orb" id="serviceObject"></div><div class="service-caption"><small id="serviceTag">01 / Mobile</small><h3 id="serviceTitle">Mobile services.</h3><p id="serviceBody">Explore mobile plans, passes, roaming and account services.</p><a class="btn" href="#support">Explore service ↗</a></div></div></div></div></section>'''
          pat=r'<section class="services" id="services">.*?</section>\s*<section class="business"'
          m=re.search(pat,s,re.S)
          assert m,'services section anchor missing'
          s=s[:m.start()]+new_section+'\n<section class="business"'+s[m.end():]

          css='''
          /* Design 42: magnetic service deck */
          .service-lab{position:relative;background:var(--ice);overflow:hidden}
          .service-head{margin-bottom:22px}
          .service-lab-grid{display:grid;grid-template-columns:1.13fr .87fr;gap:28px;align-items:stretch}
          .service-deck-wrap{position:relative;height:420px;min-width:0}
          .service-deck{position:relative;height:100%;transform-style:preserve-3d;transform:perspective(1100px) rotateX(var(--deck-rx,0deg)) rotateY(var(--deck-ry,0deg));transition:transform .16s ease-out}
          .service-card{position:absolute;left:50%;top:43%;width:232px;min-height:154px;padding:18px 19px;border:1px solid rgba(16,43,60,.12);border-radius:23px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(239,248,252,.96));box-shadow:0 18px 42px rgba(16,52,72,.11);text-align:left;cursor:pointer;overflow:hidden;opacity:0;transform:translate(-50%,-50%) translate3d(0,70px,0) rotate(0deg) scale(.72);transition:transform .82s calc(var(--i)*85ms) var(--spring),opacity .55s calc(var(--i)*85ms) ease,box-shadow .28s ease,border-color .28s ease;z-index:calc(5 + var(--i))}
          .service-card:before{content:"";position:absolute;inset:auto -20% -54% 38%;height:120px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 68%);opacity:.12;filter:blur(5px);transition:.35s}
          .services-ready .service-card{opacity:1;transform:translate(-50%,-50%) translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(1)}
          .services-ready .service-card:hover,.services-ready .service-card:focus-visible{z-index:30;transform:translate(-50%,-50%) translate3d(var(--x),calc(var(--y) - 18px),70px) rotate(0deg) scale(1.07);border-color:color-mix(in srgb,var(--accent) 42%,transparent);box-shadow:0 34px 70px rgba(14,58,82,.2),0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent);outline:none}
          .services-ready .service-card.active{z-index:24;border-color:color-mix(in srgb,var(--accent) 48%,transparent);box-shadow:0 28px 62px rgba(14,58,82,.17),0 0 0 1px color-mix(in srgb,var(--accent) 15%,transparent)}
          .service-card:hover:before,.service-card.active:before{opacity:.25;transform:scale(1.25)}
          .service-card-num{font-size:7px;font-weight:800;letter-spacing:.16em;color:#8aa0ad}
          .service-card-icon{position:absolute;right:17px;top:16px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--navy);color:#aee9ff;font-size:15px;box-shadow:0 10px 24px rgba(6,25,37,.12)}
          .service-card b{display:block;margin:31px 0 7px;font-family:"Space Grotesk";font-size:21px;line-height:.96;letter-spacing:-.045em;max-width:178px}
          .service-card small{display:block;color:var(--muted);font-size:8px;line-height:1.5;max-width:175px}
          .service-card-arrow{position:absolute;right:18px;bottom:16px;font-size:14px;color:var(--accent);font-weight:800}
          .service-deck-hint{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);white-space:nowrap;font-size:7px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#94a8b2}
          .service-portal{position:relative;min-height:420px;border-radius:31px;background:radial-gradient(circle at 54% 35%,rgba(33,160,243,.18),transparent 27%),linear-gradient(145deg,#061925,#0a3043);overflow:hidden;color:#fff;--portal-accent:#1ca0e8;box-shadow:0 25px 60px rgba(6,25,37,.16)}
          .portal-grid{position:absolute;inset:-30%;background-image:linear-gradient(rgba(112,208,248,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(112,208,248,.08) 1px,transparent 1px);background-size:36px 36px;transform:perspective(700px) rotateX(61deg) translateY(-11%);mask-image:radial-gradient(circle,#000 0 32%,transparent 69%)}
          .portal-ring{position:absolute;left:50%;top:39%;border:1px solid color-mix(in srgb,var(--portal-accent) 44%,transparent);border-radius:50%;transform:translate(-50%,-50%) rotateX(68deg);opacity:.6;animation:portalSpin 16s linear infinite}
          .pr1{width:245px;height:245px}.pr2{width:315px;height:315px;border-style:dashed;animation-duration:23s;animation-direction:reverse}.pr3{width:390px;height:390px;opacity:.26;animation-duration:31s}
          @keyframes portalSpin{to{rotate:360deg}}
          .portal-orb{position:absolute;left:50%;top:39%;width:148px;height:148px;border-radius:50%;background:radial-gradient(circle at 31% 24%,#fff 0 5%,color-mix(in srgb,var(--portal-accent) 75%,#aee9ff) 18%,var(--portal-accent) 42%,#0875c9 68%,#052d46 100%);box-shadow:0 32px 64px rgba(0,0,0,.32),0 0 55px color-mix(in srgb,var(--portal-accent) 32%,transparent);transform:translate(calc(-50% + var(--portal-x,0px)),calc(-50% + var(--portal-y,0px))) rotate(var(--service-rotate,0deg));transition:background .45s,box-shadow .45s,transform .16s ease-out}
          .portal-orb:after{content:"";position:absolute;inset:13%;border:1px solid rgba(255,255,255,.24);border-radius:50%;transform:rotate(33deg) scaleY(.32)}
          .portal-node{position:absolute;width:7px;height:7px;border-radius:50%;background:#b8efff;box-shadow:0 0 14px var(--portal-accent);animation:portalNode 2.4s ease-in-out infinite alternate}.pn1{left:17%;top:23%}.pn2{right:15%;top:28%;animation-delay:.5s}.pn3{right:21%;top:58%;animation-delay:1s}@keyframes portalNode{to{transform:scale(1.7);opacity:.42}}
          .service-portal .service-caption{left:27px;right:27px;bottom:24px}.service-portal .service-caption small{color:#9ce3ff}.service-portal .service-caption h3{font-size:35px;margin:7px 0 7px}.service-portal .service-caption p{font-size:9px;line-height:1.55;max-width:330px;margin:0 0 13px}
          .service-portal.burst .portal-ring{animation:portalBurst .72s var(--spring) both}.service-portal.burst .portal-orb{animation:orbPunch .72s var(--spring) both}
          @keyframes portalBurst{0%{opacity:.7;scale:.7}70%{opacity:.95;scale:1.18}100%{opacity:.6;scale:1}}@keyframes orbPunch{0%{filter:brightness(1);scale:1}38%{filter:brightness(1.5);scale:1.18}100%{filter:brightness(1);scale:1}}
          .service-magnet{position:absolute;z-index:60;left:0;top:0;width:18px;height:18px;border:1px solid rgba(28,160,232,.55);border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.7);transition:width .22s,height .22s,opacity .2s,background .22s,border-color .22s;display:grid;place-items:center;color:#fff;font-size:6px;font-weight:800;letter-spacing:.08em;mix-blend-mode:multiply}
          .service-lab.pointer-live .service-magnet{opacity:.68}.service-magnet.over-card{width:58px;height:58px;background:rgba(6,25,37,.9);border-color:rgba(142,219,255,.7);mix-blend-mode:normal;box-shadow:0 12px 30px rgba(6,25,37,.2)}.service-magnet span{opacity:0;transition:.2s}.service-magnet.over-card span{opacity:1}
          .service-flight{position:fixed!important;z-index:400!important;margin:0!important;pointer-events:none!important;opacity:.95!important;transform:none!important;box-shadow:0 28px 70px rgba(6,25,37,.28)!important}
          @media(min-width:821px){.offers,.services,.business,.updates,.support{padding:clamp(48px,6vh,68px) 0}.services{height:min(80vh,720px);min-height:640px;padding:48px 0}.business .biz-visual{min-height:440px}.png-story{height:min(80vh,720px);min-height:560px}.news-feature{min-height:330px}.support-stage{min-height:420px}}
          @media(max-width:820px){.services{height:auto;min-height:0;padding:72px 0;overflow:hidden}.service-head{margin-bottom:30px}.service-lab-grid{grid-template-columns:1fr;gap:22px}.service-deck-wrap{height:auto;overflow:visible}.service-deck{height:auto;display:flex;gap:11px;overflow-x:auto;padding:8px 2px 20px;scroll-snap-type:x mandatory;transform:none!important;scrollbar-width:none}.service-card,.services-ready .service-card,.services-ready .service-card:hover,.services-ready .service-card:focus-visible{position:relative;left:auto;top:auto;flex:0 0 78%;min-height:178px;transform:none;opacity:1;scroll-snap-align:center}.service-deck-hint{position:relative;left:auto;bottom:auto;transform:none;margin-top:8px;white-space:normal}.service-portal{min-height:360px}.portal-orb{width:120px;height:120px;top:34%}.portal-ring{top:34%}.pr1{width:200px;height:200px}.pr2{width:255px;height:255px}.pr3{width:310px;height:310px}.service-magnet{display:none}.service-portal .service-caption h3{font-size:29px}}
          '''
          s=s.replace('</style>',css+'\n</style>',1)

          new_js='''const serviceData=[['01 / Mobile','Mobile services.','Explore mobile plans, passes, roaming and account services.','0deg','#1ca0e8'],['02 / Fixed Broadband','Home internet.','Explore fixed broadband and home data services.','38deg','#20a957'],['03 / Devices','Phones & tablets.','Browse device and connected hardware categories.','72deg','#9a78ff'],['04 / Business','Business services.','Data, systems, voice, hosting and VSAT services.','118deg','#ff9f43'],['05 / Support','Customer Care.','Call 1555 for assistance and support.','155deg','#2ec7c9']];const servicesSection=document.getElementById('services'),serviceDeck=document.getElementById('serviceDeck'),servicePortal=document.getElementById('servicePortal'),serviceMagnet=document.getElementById('serviceMagnet'),serviceCards=[...document.querySelectorAll('.service-card[data-service]')];function burstServicePortal(){servicePortal.classList.remove('burst');void servicePortal.offsetWidth;servicePortal.classList.add('burst');setTimeout(()=>servicePortal.classList.remove('burst'),760)}function flyServiceCard(card){if(reduce)return;const a=card.getBoundingClientRect(),b=document.getElementById('serviceObject').getBoundingClientRect(),ghost=card.cloneNode(true);ghost.className='service-flight';Object.assign(ghost.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(ghost);const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);const anim=ghost.animate([{transform:'translate3d(0,0,0) rotate(0deg) scale(1)',opacity:.95},{transform:'translate3d('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px,0) rotate(16deg) scale(.16)',opacity:0}],{duration:720,easing:'cubic-bezier(.16,.82,.18,1)',fill:'forwards'});setTimeout(burstServicePortal,380);anim.finished.finally(()=>ghost.remove())}function setService(i,launch=false){const d=serviceData[i],card=serviceCards[i];serviceCards.forEach((x,n)=>x.classList.toggle('active',n===i));document.getElementById('serviceTag').textContent=d[0];document.getElementById('serviceTitle').textContent=d[1];document.getElementById('serviceBody').textContent=d[2];document.getElementById('serviceObject').style.setProperty('--service-rotate',d[3]);servicePortal.style.setProperty('--portal-accent',d[4]);if(launch&&card)flyServiceCard(card)}serviceCards.forEach((card,i)=>{card.addEventListener('pointerenter',()=>{setService(i,false);serviceMagnet?.classList.add('over-card')});card.addEventListener('pointerleave',()=>serviceMagnet?.classList.remove('over-card'));card.addEventListener('focus',()=>setService(i,false));card.addEventListener('click',()=>setService(i,true))});if(servicesSection){const serviceObserver=new IntersectionObserver(([entry])=>{if(entry.isIntersecting){servicesSection.classList.add('services-ready');serviceObserver.disconnect()}},{threshold:.18});serviceObserver.observe(servicesSection);let svcRAF=null,svcX=0,svcY=0;servicesSection.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')servicesSection.classList.add('pointer-live')});servicesSection.addEventListener('pointerleave',()=>{servicesSection.classList.remove('pointer-live');serviceMagnet?.classList.remove('over-card');serviceDeck.style.setProperty('--deck-rx','0deg');serviceDeck.style.setProperty('--deck-ry','0deg');servicePortal.style.setProperty('--portal-x','0px');servicePortal.style.setProperty('--portal-y','0px')});servicesSection.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=servicesSection.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;svcX=(x-.5)*2;svcY=(y-.5)*2;if(serviceMagnet){serviceMagnet.style.left=(e.clientX-r.left)+'px';serviceMagnet.style.top=(e.clientY-r.top)+'px'}if(!svcRAF)svcRAF=requestAnimationFrame(()=>{serviceDeck.style.setProperty('--deck-rx',(svcY*-3.8).toFixed(2)+'deg');serviceDeck.style.setProperty('--deck-ry',(svcX*5.2).toFixed(2)+'deg');servicePortal.style.setProperty('--portal-x',(svcX*9).toFixed(1)+'px');servicePortal.style.setProperty('--portal-y',(svcY*7).toFixed(1)+'px');svcRAF=null})},{passive:true})}'''
          js_pat=r'const serviceData=.*?(?=document\.querySelectorAll\(\'\.notice-head\'\))'
          m=re.search(js_pat,s,re.S)
          assert m,'service JS anchor missing'
          s=s[:m.start()]+new_js+s[m.end():]
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});
            const heights=await page.evaluate(()=>Object.fromEntries(['offers','services','business','png-story','support'].map(id=>{const e=document.getElementById(id);return [id,e?e.getBoundingClientRect().height:0]})));
            if(heights.services>820||heights.offers>840||heights.business>840||heights['png-story']>820||heights.support>840)throw Error('desktop sections too tall '+JSON.stringify(heights));
            await page.evaluate(()=>document.getElementById('services').scrollIntoView({block:'center'}));await page.waitForTimeout(900);
            const fan=await page.evaluate(()=>({ready:services.classList.contains('services-ready'),cards:[...document.querySelectorAll('.service-card')].map(c=>({o:parseFloat(getComputedStyle(c).opacity),t:getComputedStyle(c).transform}))}));
            if(!fan.ready||fan.cards.some(c=>c.o<.95)||new Set(fan.cards.map(c=>c.t)).size<4)throw Error('service fan failed '+JSON.stringify(fan));
            const sr=await page.locator('#services').boundingBox();await page.mouse.move(sr.x+sr.width*.18,sr.y+sr.height*.48);await page.waitForTimeout(180);const t1=await page.evaluate(()=>getComputedStyle(serviceDeck).transform);await page.mouse.move(sr.x+sr.width*.78,sr.y+sr.height*.3);await page.waitForTimeout(180);const t2=await page.evaluate(()=>getComputedStyle(serviceDeck).transform);if(t1===t2)throw Error('mouse tilt did not react');
            await page.hover('.service-card[data-service="3"]');await page.waitForTimeout(180);const hover=await page.evaluate(()=>({title:serviceTitle.textContent,magnet:serviceMagnet.classList.contains('over-card'),active:[...document.querySelectorAll('.service-card')].findIndex(c=>c.classList.contains('active'))}));if(!hover.title.includes('Business')||!hover.magnet||hover.active!==3)throw Error('hover preview failed '+JSON.stringify(hover));
            await page.click('.service-card[data-service="3"]');await page.waitForTimeout(120);const flight=await page.evaluate(()=>({ghost:!!document.querySelector('.service-flight'),burst:servicePortal.classList.contains('burst')}));if(!flight.ghost)throw Error('card launch ghost missing');await page.waitForTimeout(850);if(await page.$('.service-flight'))throw Error('launch ghost did not clean up');
            await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(250);await page.hover('.hero');await page.click('.scene-tab[data-scene="1"]');await page.waitForTimeout(720);await page.mouse.move(1090,180);await page.waitForTimeout(260);const a=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));await page.mouse.move(760,420);await page.waitForTimeout(260);const b=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));if(a.s===b.s||a.d===b.d)throw Error('hero satellite/dish regression');await page.click('.scene-tab[data-scene="2"]');await page.waitForTimeout(700);await page.mouse.move(430,250);let pulse=0,end=Date.now()+2200;while(Date.now()<end){pulse=Math.max(pulse,await page.evaluate(()=>Number(document.querySelector('.tower').dataset.pulseCount||0)));await page.waitForTimeout(40)}if(pulse<1)throw Error('tower heartbeat regression');
            if(errors.length)throw Error(errors.join(' | '));console.log('Section heights',heights);console.log('Service deck OK',hover,flight);console.log('Hero interactions OK',{pulse});await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit safely on latest main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/design42-service-deck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-service-deck.yml
          git commit -m 'Add magnetic Design 42 service deck interaction'
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n*2))
          done
          exit 1
