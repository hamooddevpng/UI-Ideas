name: Build Design 41 from Design 10

on:
  push:
    paths:
      - '.github/workflows/design41-from-design10.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy Design 10 exactly into Design 41
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp 10.html 41.html
          test "$(git hash-object 10.html)" = "$(git hash-object 41.html)"
          git add 41.html
          git commit -m 'Reset Design 41 to exact Design 10 baseline'
          git push origin HEAD:main

      - name: Apply Telikom 41 content layer
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/design41_patch.py

      - name: Validate inherited Design 10 motion and final structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('41.html').read_text()
          assert 'new Lenis({duration:1.18' in s
          assert 'const motionFrame=()=>{' in s
          assert 'new THREE.TorusKnotGeometry' in s
          assert "mx+=(tx-mx)*.055" in s
          assert 'data-depth="-24"' in s
          assert 'assets/brand/telikom-logo.png' in s
          assert 'stay-connected-from-png-to-the-world.webp' in s
          assert 'festive-png-telecom-deals.webp' in s
          assert 'gerehu-market-wide.jpg' not in s
          markers=['01 / OFFERS + PLANS','02 / SERVICE CATEGORIES','03 / BUSINESS + GOVERNMENT','04 / PNG + NATIONAL STORY','05 / NOTICES + NEWS','06 / HELP + SUPPORT + STORES']
          for marker in markers:
              assert marker in s, marker
          positions=[s.index(x) for x in markers]
          assert positions == sorted(positions)
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/design41.js').write_text(scripts[-1])
          print('depth layers',s.count('data-depth'))
          print('campaign images',s.count('assets/banners/research/'))
          PY
          node --check /tmp/design41.js

      - name: Commit final Design 41 and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/design41-from-design10.yml .github/scripts/design41_patch.py
          git add 41.html .github/workflows/design41-from-design10.yml .github/scripts/design41_patch.py
          git commit -m 'Layer Telikom content onto Design 10 motion baseline'
          git push origin HEAD:main
