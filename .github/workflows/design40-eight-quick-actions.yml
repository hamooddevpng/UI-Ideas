name: Design 40 eight quick actions

on:
  push:
    paths:
      - '.github/workflows/design40-eight-quick-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply quick action patch
        run: python .tmp/design40_quick8.py
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/design40-eight-quick-actions.yml .tmp/design40_quick8.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 40.html .github/workflows/design40-eight-quick-actions.yml .tmp/design40_quick8.py
          git commit -m 'Try eight quick actions in Design 40'
          git pull --rebase origin main
          git push origin HEAD:main
