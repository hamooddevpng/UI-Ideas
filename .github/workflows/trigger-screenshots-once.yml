name: Trigger screenshots once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-screenshots-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch screenshot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/capture-screenshots.yml/dispatches \
            -d '{"ref":"main"}'
      - name: Remove one-time trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/trigger-screenshots-once.yml
          git add .github/workflows/trigger-screenshots-once.yml
          git commit -m "chore: remove one-time screenshot trigger"
          git push origin main
