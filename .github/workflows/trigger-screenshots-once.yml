name: Trigger screenshots once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-screenshots-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch screenshot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run capture-screenshots.yml --ref main
      - name: Remove one-time trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/trigger-screenshots-once.yml
          git add .github/workflows/trigger-screenshots-once.yml
          git commit -m "chore: remove one-time screenshot trigger"
          git push origin main
