name: Design 42 Visual QA

on:
  push:
    branches: [main]
    paths:
      - '42.html'
      - '42-base.html'
      - 'design42-ecosystem-v2.html'
      - '.github/design42-qa-trigger.txt'

permissions:
  contents: write

concurrency:
  group: design42-visual-qa
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/design42-http.log 2>&1 &
          sleep 1
      - name: Capture Design 42 desktop and mobile
        run: |
          mkdir -p qa/design42
          node <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');
          const primePage = async page => {
            await page.waitForTimeout(1800);
            // Scroll dynamically because offer loading and injected content can change page height.
            await page.evaluate(async () => {
              const sleep = ms => new Promise(r => setTimeout(r, ms));
              let y = 0;
              let stableBottomPasses = 0;
              while (stableBottomPasses < 3) {
                const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
                if (y >= max - 8) {
                  window.scrollTo(0, max);
                  await sleep(260);
                  const nextMax = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
                  if (Math.abs(nextMax - max) < 8) stableBottomPasses++;
                  else stableBottomPasses = 0;
                  y = Math.min(nextMax, max + Math.max(320, Math.floor(window.innerHeight * .55)));
                } else {
                  y = Math.min(max, y + Math.max(320, Math.floor(window.innerHeight * .55)));
                  window.scrollTo(0, y);
                  await sleep(170);
                }
              }
            });
            // Explicitly wake late reveal/IO sections and allow offer loader to finish.
            for (const selector of ['#updates', '#support']) {
              const el = page.locator(selector);
              if (await el.count()) {
                await el.scrollIntoViewIfNeeded();
                await page.waitForTimeout(700);
              }
            }
            await page.waitForTimeout(2600);
            await page.evaluate(() => window.scrollTo(0,0));
            await page.waitForTimeout(500);
          };
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1440,height:900}, deviceScaleFactor:1});
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/42.html', {waitUntil:'networkidle', timeout:30000});
            await page.waitForTimeout(1600);
            await page.evaluate(() => window.scrollTo(0,0));
            await page.screenshot({path:path.join('qa','design42','latest-desktop-fold.jpg'),type:'jpeg',quality:90,fullPage:false,animations:'disabled',timeout:30000});
            await primePage(page);
            await page.screenshot({path:path.join('qa','design42','latest-desktop-full.jpg'),type:'jpeg',quality:84,fullPage:true,animations:'disabled',timeout:30000});
            await context.close();

            const mobileContext = await browser.newContext({viewport:{width:390,height:844}, deviceScaleFactor:1});
            const mobile = await mobileContext.newPage();
            await mobile.goto('http://127.0.0.1:4173/42.html', {waitUntil:'networkidle', timeout:30000});
            await primePage(mobile);
            await mobile.screenshot({path:path.join('qa','design42','latest-mobile-full.jpg'),type:'jpeg',quality:84,fullPage:true,animations:'disabled',timeout:30000});
            await mobileContext.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: design42-visual-qa
          path: qa/design42/*.jpg
          retention-days: 7
      - name: Commit visual QA screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/design42/latest-desktop-fold.jpg qa/design42/latest-desktop-full.jpg qa/design42/latest-mobile-full.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh Design 42 visual QA screenshots"
          git pull --rebase origin main
          git push origin main
