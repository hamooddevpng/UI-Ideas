name: Add Design 42 footer social icons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-design42-footer-social.yml

permissions:
  contents: write

jobs:
  add-social-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add social icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('42.html')
          s=p.read_text(encoding='utf-8')
          marker='Design 42 footer social icons'
          if marker in s:
              raise SystemExit(0)
          old='<p>100% PNG owned telecommunications company.</p></div>'
          social=base64.b64decode('').decode()
          css=base64.b64decode('').decode()
          if old not in s:
              raise SystemExit('footer target not found')
          s=s.replace(old,social,1)
          if '</body>' not in s:
              raise SystemExit('body close not found')
          s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit social icons
        shell: bash
        run: |
          rm -f .github/workflows/add-design42-footer-social.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: add social media icons to Design 42 footer"
          git push origin HEAD:main
