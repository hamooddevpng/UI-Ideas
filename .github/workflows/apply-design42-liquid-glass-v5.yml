name: Apply Design 42 liquid glass v5

on:
  push:
    branches:
      - palette/design42-v4
    paths:
      - '.github/workflows/apply-design42-liquid-glass-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply liquid glass support treatment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text()
          if 'Design 42 liquid glass v5' in s:
              raise SystemExit('already applied')
          anchor='@media(prefers-reduced-motion:reduce){.support-orbit:before,.support-orbit:after{animation:none!important}}'
          css=r'''

/* Design 42 liquid glass v5 */
.support-orbit{
  position:relative!important;
  isolation:isolate!important;
  overflow:hidden!important;
  background:
    radial-gradient(circle at 18% 24%,rgba(8,117,201,.11),transparent 25%),
    radial-gradient(circle at 82% 28%,rgba(88,190,220,.15),transparent 26%),
    radial-gradient(circle at 68% 78%,rgba(111,196,170,.08),transparent 24%),
    linear-gradient(135deg,#eef2f1 0%,#f4f4ef 48%,#e9f0f2 100%)!important;
  background-size:115% 115%,120% 120%,118% 118%,100% 100%!important;
  animation:supportCanvasBreath 18s ease-in-out infinite alternate;
}
@keyframes supportCanvasBreath{
  from{background-position:0% 0%,100% 0%,100% 100%,0 0}
  to{background-position:6% 5%,92% 8%,94% 90%,0 0}
}
.support-orbit:before{
  content:""!important;
  position:absolute!important;
  z-index:0!important;
  width:650px!important;
  height:650px!important;
  right:-180px!important;
  top:-240px!important;
  border-radius:50%!important;
  background:radial-gradient(circle at 42% 42%,rgba(74,174,210,.20),rgba(49,139,177,.07) 38%,transparent 68%)!important;
  filter:blur(10px)!important;
  pointer-events:none!important;
  animation:supportAmbientFloatV5 14s ease-in-out infinite alternate!important;
}
.support-orbit:after{
  content:""!important;
  position:absolute!important;
  z-index:0!important;
  inset:-18%!important;
  pointer-events:none!important;
  opacity:.24!important;
  background-image:linear-gradient(rgba(47,102,124,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(47,102,124,.055) 1px,transparent 1px)!important;
  background-size:54px 54px!important;
  mask-image:radial-gradient(ellipse at 70% 54%,#000 0 13%,rgba(0,0,0,.56) 34%,transparent 72%)!important;
  animation:supportGridDriftV5 26s linear infinite!important;
}
@keyframes supportAmbientFloatV5{from{transform:translate3d(-26px,24px,0) scale(.96)}to{transform:translate3d(34px,-18px,0) scale(1.08)}}
@keyframes supportGridDriftV5{to{background-position:54px 27px,27px 54px}}

.support-orbit .support-stage{
  position:relative!important;
  z-index:2!important;
  background:rgba(255,255,255,.035)!important;
  background-image:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.025))!important;
  color:#173546!important;
  border:1px solid rgba(255,255,255,.74)!important;
  box-shadow:
    0 24px 70px rgba(37,72,88,.10),
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 0 -1px 0 rgba(39,91,111,.08)!important;
  -webkit-backdrop-filter:blur(28px) saturate(145%)!important;
  backdrop-filter:blur(28px) saturate(145%)!important;
}
.support-orbit .support-stage:before{
  content:"";
  position:absolute;
  z-index:2;
  inset:1px;
  border-radius:35px;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.35);
  background:linear-gradient(155deg,rgba(255,255,255,.16),transparent 24%,transparent 76%,rgba(8,117,201,.035));
}
.support-orbit .support-stage:after{
  content:"";
  position:absolute;
  z-index:2;
  top:-42%;
  left:-46%;
  width:26%;
  height:190%;
  pointer-events:none;
  transform:rotate(15deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  filter:blur(1px);
  opacity:.5;
  animation:supportGlassSheen 10s ease-in-out infinite;
}
@keyframes supportGlassSheen{0%,18%{left:-46%;opacity:0}34%{opacity:.45}58%{left:122%;opacity:.22}100%{left:122%;opacity:0}}
.support-orbit .support-copy{position:relative!important;z-index:6!important}
.support-orbit .support-stage .title{color:#173546!important;text-shadow:none!important}
.support-orbit .support-stage .lead{color:#59737e!important}
.support-orbit .support-stage .kicker{color:#0875c9!important}

.support-orbit .support-search{
  background:rgba(255,255,255,.58)!important;
  border:1px solid rgba(255,255,255,.88)!important;
  box-shadow:0 12px 32px rgba(41,78,94,.08),inset 0 1px rgba(255,255,255,.8)!important;
  -webkit-backdrop-filter:blur(22px) saturate(135%)!important;
  backdrop-filter:blur(22px) saturate(135%)!important;
}
.support-orbit .support-search input{background:transparent!important}

.support-orbit .support-link{
  background:rgba(255,255,255,.075)!important;
  background-image:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.025))!important;
  color:#173546!important;
  border:1px solid rgba(255,255,255,.66)!important;
  box-shadow:0 12px 28px rgba(42,79,95,.06),inset 0 1px rgba(255,255,255,.62)!important;
  -webkit-backdrop-filter:blur(20px) saturate(145%)!important;
  backdrop-filter:blur(20px) saturate(145%)!important;
}
.support-orbit .support-link:hover{
  background:rgba(255,255,255,.40)!important;
  color:#173546!important;
  border-color:rgba(255,255,255,.92)!important;
  box-shadow:0 16px 34px rgba(42,79,95,.09),inset 0 1px rgba(255,255,255,.88)!important;
}
.support-orbit .support-link small{color:#667f89!important}
.support-orbit .support-radar i,.support-orbit .support-radar span{border-color:rgba(42,112,145,.17)!important}
.support-orbit .support-radar span{background:linear-gradient(rgba(63,143,177,.34),transparent)!important}
.support-hint{color:#708892!important}

@media(max-width:820px){
  .support-orbit{background-size:140% 140%,150% 150%,145% 145%,100% 100%!important}
  .support-orbit:before{width:500px!important;height:500px!important;right:-240px!important;top:210px!important;opacity:.72!important}
  .support-orbit:after{background-size:42px 42px!important;opacity:.18!important}
  .support-orbit .support-stage{
    background:rgba(255,255,255,.028)!important;
    border-color:rgba(255,255,255,.78)!important;
    -webkit-backdrop-filter:blur(24px) saturate(145%)!important;
    backdrop-filter:blur(24px) saturate(145%)!important;
  }
  .support-orbit .support-link{background:rgba(255,255,255,.055)!important;border-color:rgba(255,255,255,.62)!important}
}
@media(prefers-reduced-motion:reduce){
  .support-orbit,.support-orbit:before,.support-orbit:after,.support-orbit .support-stage:after{animation:none!important}
}
'''
          if anchor not in s:
              raise SystemExit('anchor missing')
          s=s.replace(anchor,anchor+css,1)
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-design42-liquid-glass-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/apply-design42-liquid-glass-v5.yml
          git commit -m "design: make Design 42 support section true liquid glass"
          git pull --rebase origin palette/design42-v4
          git push origin palette/design42-v4
