name: Apply Design 42 visible lasers v9

on:
  push:
    branches:
      - fix/design42-visible-lasers-v9
    paths:
      - .github/workflows/design42-lasers-v9.yml
      - scripts/patch_design42_lasers_v9.py

permissions:
  contents: write

jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-visible-lasers-v9
          fetch-depth: 0
      - name: Patch Design 42
        run: python scripts/patch_design42_lasers_v9.py
      - name: Commit result
        run: |
          rm -f .github/workflows/design42-lasers-v9.yml scripts/patch_design42_lasers_v9.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: make Design 42 province lasers visibly fire"
          git push origin HEAD:fix/design42-visible-lasers-v9
