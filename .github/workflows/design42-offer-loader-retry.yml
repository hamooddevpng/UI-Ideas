name: Retry Design 42 offer loader verification
on:
  push:
    paths:
      - '.github/workflows/design42-offer-loader-retry.yml'
permissions:
  contents: write
jobs:
  retry-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply offer loader patch safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/design42-offer-loader.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if "python3 - <<'PY'" in l)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          body='\n'.join((l[10:] if l.startswith('          ') else l) for l in lines[start:end])+'\n'
          Path('/tmp/apply_loader.py').write_text(body)
          PY
          python3 /tmp/apply_loader.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html');s=p.read_text()
          s=s.replace("assets/banners/research/festive-png-telecom-deals.webp","assets/design42/png-people.jpg")
          s=s.replace("alt:'Telikom mobile offer artwork',media:'deal'","alt:'People in Papua New Guinea',media:'people'")
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const gate=await browser.newPage({viewport:{width:1440,height:2500}});await gate.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});await gate.waitForTimeout(600);const zero=await gate.evaluate(()=>({y:scrollY,loading:offers.classList.contains('offers-loading'),loaded:offers.classList.contains('offers-loaded'),machine:!!document.querySelector('.raffle-machine')}));if(zero.y!==0||zero.loading||zero.loaded||zero.machine)throw Error('zero scroll / machine regression '+JSON.stringify(zero));await gate.close();
            const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});await page.evaluate(()=>offers.scrollIntoView({block:'center'}));await page.waitForTimeout(500);const loading=await page.evaluate(()=>({loading:offers.classList.contains('offers-loading'),loaded:offers.classList.contains('offers-loaded'),loader:parseFloat(getComputedStyle(offerLoader).opacity),card:parseFloat(getComputedStyle(document.querySelector('.personal-offer')).opacity)}));if(!loading.loading||loading.loaded||loading.loader<.8||loading.card>.05)throw Error('loading state failed '+JSON.stringify(loading));await page.waitForTimeout(1100);const still=await page.evaluate(()=>({loading:offers.classList.contains('offers-loading'),loaded:offers.classList.contains('offers-loaded')}));if(!still.loading||still.loaded)throw Error('two second loader too short '+JSON.stringify(still));await page.waitForTimeout(1800);const done=await page.evaluate(()=>({loaded:offers.classList.contains('offers-loaded'),loader:parseFloat(getComputedStyle(offerLoader).opacity),machine:!!document.querySelector('.raffle-machine'),cards:[...document.querySelectorAll('.personal-offer')].map(c=>({o:parseFloat(getComputedStyle(c).opacity),tr:getComputedStyle(c).transform,w:c.querySelector('img').naturalWidth,src:c.querySelector('img').getAttribute('src'),title:c.querySelector('h3').textContent.trim()}))}));if(!done.loaded||done.loader>.12||done.machine||done.cards.some(c=>c.o<.98||c.tr!=='none'||c.w<1||!c.src||!c.title||c.title.includes('Finding')))throw Error('final cards failed '+JSON.stringify(done));
            await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(250);await page.click('.scene-tab[data-scene="1"]');await page.waitForTimeout(760);await page.mouse.move(1080,180);await page.waitForTimeout(300);const a=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));await page.mouse.move(760,430);await page.waitForTimeout(300);const b=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));if(a.s===b.s||a.d===b.d)throw Error('satellite/dish regression');await page.click('.scene-tab[data-scene="2"]');await page.waitForTimeout(720);await page.mouse.move(430,250);let pulse=0,max=0,end=Date.now()+2300;while(Date.now()<end){const v=await page.evaluate(()=>({c:Number(document.querySelector('.tower').dataset.pulseCount||0),o:parseFloat(getComputedStyle(document.querySelector('.tower-pulse-track.p1 i')).opacity)}));pulse=Math.max(pulse,v.c);max=Math.max(max,v.o||0);await page.waitForTimeout(30)}if(pulse<1||max<.7)throw Error('laser regression '+JSON.stringify({pulse,max}));if(errors.length)throw Error(errors.join(' | '));console.log('Offer loader OK',done);console.log('Hero interactions OK',{pulse,max});await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit safely on latest main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/design42-offer-loader.yml .github/workflows/design42-offer-loader-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-offer-loader.yml .github/workflows/design42-offer-loader-retry.yml
          git commit -m 'Replace Design 42 raffle with offer loading reveal'
          git fetch origin main
          git rebase origin/main
          git push origin main
