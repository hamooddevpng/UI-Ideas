name: Apply Design 40 people photography refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-design40-photo-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify Design 40
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_design40_photos.py
          file assets/common/png-people/*.jpg
          grep -q 'Design 40 people-photo refresh' 40.html
          grep -q 'community-harbour.jpg' 40.html
          grep -q 'family-digital.jpg' 40.html
          grep -q 'market-connectivity.jpg' 40.html
          grep -q 'young-professionals.jpg' 40.html

      - name: Commit refresh and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-design40-photo-refresh.yml
          rm .github/scripts/patch_design40_photos.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 40.html .github/workflows/apply-design40-photo-refresh.yml .github/scripts/patch_design40_photos.py
          git commit -m 'Humanize Design 40 with PNG people photography'
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
