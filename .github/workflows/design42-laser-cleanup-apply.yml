name: Design 42 Laser Cleanup Apply

on:
  push:
    branches:
      - refactor/design42-css-cleanup
    paths:
      - 'scripts/cleanup-design42-lasers.mjs'
      - '.github/workflows/design42-laser-cleanup-apply.yml'

permissions:
  contents: write

concurrency:
  group: design42-laser-cleanup-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preview deterministic cleanup
        run: node scripts/cleanup-design42-lasers.mjs
      - name: Apply deterministic cleanup
        run: node scripts/cleanup-design42-lasers.mjs --apply
      - name: Verify architecture guardrails
        run: node tests/design42-css-architecture.test.mjs
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42-base.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "refactor: remove superseded Design 42 laser passes"
          git push origin HEAD:refactor/design42-css-cleanup
