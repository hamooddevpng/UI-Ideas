          }

          expected = {p.stem for p in root.glob("*.png")}
          if set(D) != expected:
              raise SystemExit(f"Semantic inventory mismatch. Missing={sorted(expected-set(D))}; extra={sorted(set(D)-expected)}")

          for slug, items in D.items():
              m = meta.get(slug, {})
              y = 0.0
              sections = []
              for typ, label, end, confidence in items:
                  end = float(end)
                  if not (y < end <= 1.000001):
                      raise SystemExit(f"{slug}: bad semantic boundary {y} -> {end}")
                  sections.append({
                      "bounds_normalized":{"x":0.0,"y":round(y,6),"width":1.0,"height":round(end-y,6)},
                      "type":typ,
                      "label":label,
                      "confidence":confidence
                  })
                  y = end

              status = "blocked" if slug == "rh-hypermarket" else ("partial" if any(s["type"] == "capture_partial" for s in sections) else "ok")
              doc = {
                  "schema_version":"1.0",
                  "cohort":"png-private-sector",
                  "site":{
                      "slug":slug,
                      "name":m.get("name") or slug.replace("-"," ").title(),
                      "url":m.get("url") or m.get("finalUrl") or "",
                      "source_repo_path":f"reference-screenshots/png-private-sector/full-page-1440/{slug}.png",
                      "capture_status":status,
                      "coordinate_mode":"normalized",
                      "analysis_method":"AI vision on downscaled proxy of repository screenshot; normalized boundaries mapped to original image",
                      "sections":sections
                  }
              }
              (out / f"{slug}.json").write_text(json.dumps(doc, indent=2), encoding="utf-8")

          print(f"Generated {len(D)} reviewed semantic manifests")
          PY

      - name: Commit all semantic manifests once
        shell: bash
        run: |
          git add research/website-patterns/cohorts/png-private-sector/sites
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: add PNG private-sector semantic analysis"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
