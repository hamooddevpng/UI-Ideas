name: Fix Design 42 htmlpreview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-design42-htmlpreview.yml

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove JSON-LD block that htmlpreview executes as JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('42.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'\n<script type="application/ld\+json" id="telikomSeoSchema">.*?</script>\n', re.S)
          replacement = '\n<!-- Structured data omitted in this static prototype so htmlpreview.github.io can execute inline scripts safely. -->\n'
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one telikomSeoSchema block, found {count}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          rm -f .github/workflows/fix-design42-htmlpreview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: restore Design 42 htmlpreview compatibility"
          git push origin HEAD:main
