name: One-time Design 42 carousel repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-42-carousel.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair carousel behaviour
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('42.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  ".hero-nav{position:absolute;z-index:30;left:50%;bottom:16px;",
                  ".hero-nav{position:absolute;z-index:45;left:50%;bottom:66px;"
              ),
              (
                  ".hero-nav{bottom:11px}.scene-tabs",
                  ".hero-nav{bottom:58px}.scene-tabs"
              ),
              (
                  "tabs=[...document.querySelectorAll('[data-scene]')]",
                  "tabs=[...document.querySelectorAll('.scene-tab[data-scene]')]"
              ),
              (
                  "function startAuto(){clearInterval(timer);if(!reduce)timer=setInterval(()=>{if(!hover&&!phoneOpen&&!document.hidden)setScene(active+1)},3000)}",
                  "function startAuto(){clearInterval(timer);timer=setInterval(()=>{if(!hover&&!phoneOpen&&!document.hidden)setScene(active+1)},3000)}"
              ),
              (
                  "hero.addEventListener('mouseenter',()=>hover=true);hero.addEventListener('mouseleave',()=>hover=false);",
                  "hero.addEventListener('mouseenter',()=>{hover=true;clearInterval(timer)});hero.addEventListener('mouseleave',()=>{hover=false;startAuto()});"
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected carousel fragment not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check Design 42 JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('42.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          if not blocks:
              raise SystemExit('No script block found')
          Path('/tmp/design42.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/design42.js

      - name: Commit repaired page and remove one-time workflow
        run: |
          rm .github/workflows/fix-42-carousel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/fix-42-carousel.yml
          git commit -m "Fix Design 42 carousel autoplay and controls"
          git push
