name: Sync Design 41 PNG photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-design41-photos.yml'

permissions:
  contents: write

jobs:
  sync-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PNG photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/design41
          curl -fL --retry 4 --retry-delay 2 'https://unsplash.com/photos/2d6UohbZWS0/download?force=true' -o assets/design41/png-community.jpg
          curl -fL --retry 4 --retry-delay 2 'https://unsplash.com/photos/psSgFqlUnOs/download?force=true' -o assets/design41/png-family.jpg
          curl -fL --retry 4 --retry-delay 2 'https://unsplash.com/photos/RdHssi7KvkI/download?force=true' -o assets/design41/png-highlands.jpg
          curl -fL --retry 4 --retry-delay 2 'https://unsplash.com/photos/hPzLCXLD63s/download?force=true' -o assets/design41/png-coast.jpg
          curl -fL --retry 4 --retry-delay 2 'https://unsplash.com/photos/XDPjn4pvVc0/download?force=true' -o assets/design41/png-port-moresby.jpg
          file assets/design41/*
          test -s assets/design41/png-community.jpg
          test -s assets/design41/png-family.jpg
          test -s assets/design41/png-highlands.jpg
          test -s assets/design41/png-coast.jpg
          test -s assets/design41/png-port-moresby.jpg

      - name: Commit photography
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/design41
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add local PNG photography for Design 41'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
