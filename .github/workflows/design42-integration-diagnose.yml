name: Design 42 Integration Diagnose

on:
  push:
    branches:
      - integration/design42-css-refactor-main
    paths:
      - '.github/workflows/design42-integration-diagnose.yml'

permissions:
  contents: read

env:
  DESIGN42_REFERENCE_SHA: d8fd930bfeebf39addfc41a3d81e60f2e6bc9000

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Prepare reference and servers
        run: |
          rm -rf /tmp/design42-reference
          git worktree add --detach /tmp/design42-reference "$DESIGN42_REFERENCE_SHA"
          python3 <<'PY'
          from pathlib import Path
          p=Path('/tmp/design42-reference/42.html')
          t=p.read_text()
          old='https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/'
          if old not in t: raise SystemExit('reference source root not found')
          p.write_text(t.replace(old,'http://127.0.0.1:4174/'))
          PY
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/current.log 2>&1 &
          (cd /tmp/design42-reference && python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/reference.log 2>&1) &
          sleep 1
      - name: Compare footer computed styles and child geometry
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const selectors=['footer','.footer-top','.footer-brand','.footer-logo','.footer-logo img','.footer-brand p','.footer-social','.footer-social-icon','.footer-col','.footer-bottom'];
          const props=['display','height','minHeight','paddingTop','paddingBottom','marginTop','marginBottom','gap','rowGap','columnGap','fontFamily','fontSize','lineHeight','gridTemplateColumns','alignItems'];
          const capture=async(browser,url)=>{
            const ctx=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            const page=await ctx.newPage();
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('.footer-bottom',{timeout:15000});
            await page.evaluate(()=>document.fonts?.ready||Promise.resolve());
            await page.waitForTimeout(800);
            const out=await page.evaluate(({selectors,props})=>{
              const result={scrollHeight:document.documentElement.scrollHeight,items:{}};
              for(const selector of selectors){
                const matches=[...document.querySelectorAll(selector)];
                result.items[selector]=matches.map((el,index)=>{
                  const r=el.getBoundingClientRect();
                  const cs=getComputedStyle(el);
                  const computed={};
                  for(const prop of props)computed[prop]=cs[prop];
                  return {index,box:{x:r.x,y:r.y+scrollY,width:r.width,height:r.height},computed,
                    naturalWidth:el.naturalWidth??null,naturalHeight:el.naturalHeight??null,
                    text:el.textContent.trim().replace(/\s+/g,' ').slice(0,80)};
                });
              }
              return result;
            },{selectors,props});
            await ctx.close();return out;
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ref=await capture(browser,'http://127.0.0.1:4174/42.html');
            const cur=await capture(browser,'http://127.0.0.1:4173/42.html');
            console.log('REFERENCE FOOTER',JSON.stringify(ref,null,2));
            console.log('CURRENT FOOTER',JSON.stringify(cur,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
