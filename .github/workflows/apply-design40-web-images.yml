name: Apply Design 40 web image refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-design40-web-images.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet requests beautifulsoup4 pillow

      - name: Download online images and patch Design 40
        run: |
          python .github/scripts/design40_web_image_refresh.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          roots = [Path('assets/common/web-sourced/telikom'), Path('assets/common/web-sourced/commons')]
          files = [p for root in roots for p in root.glob('*.jpg')]
          assert len(files) >= 12, f'Expected at least 12 web-sourced images, got {len(files)}'
          for p in files:
              with Image.open(p) as im:
                  im.verify()
              assert p.stat().st_size > 8000, p
          html = Path('40.html').read_text(encoding='utf-8')
          assert 'assets/common/web-sourced/telikom/' in html
          assert 'assets/common/web-sourced/commons/' in html
          assert 'Mt. Kegum High-Capacity Network tower restored' in html
          print('Verified', len(files), 'web-sourced JPEGs and Design 40 references.')
          PY

      - name: Commit assets and Design 40, then remove one-time helpers
        run: |
          set -e
          rm -f .github/workflows/apply-design40-web-images.yml .github/scripts/design40_web_image_refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 40.html assets/common/web-sourced .github/workflows/apply-design40-web-images.yml .github/scripts/design40_web_image_refresh.py
          git commit -m "Diversify Design 40 with web-sourced PNG and Telikom imagery"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
