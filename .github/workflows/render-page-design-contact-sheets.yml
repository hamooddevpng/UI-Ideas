name: Render Page Design Contact Sheets

on:
  workflow_dispatch:
  push:
    paths:
      - 'reference-screenshots/page-design/**'
      - 'scripts/render_page_design_contact_sheets.py'
      - '.github/workflows/render-page-design-contact-sheets.yml'

permissions:
  contents: write

concurrency:
  group: page-design-contact-sheets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow==11.3.0
      - name: Render contact sheets
        run: python scripts/render_page_design_contact_sheets.py
      - name: Commit contact sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/page-design-reference/contact-sheets
          if git diff --cached --quiet; then
            echo "No contact sheet changes to commit"
            exit 0
          fi
          git commit -m "research: render expanded page design contact sheets"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
