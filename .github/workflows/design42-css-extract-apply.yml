name: Design 42 CSS Extraction Apply

# One-shot migration workflow for deterministic inline-CSS extraction.
on:
  push:
    branches:
      - refactor/design42-css-cleanup
    paths:
      - 'scripts/extract-design42-css.mjs'
      - '.github/workflows/design42-css-extract-apply.yml'

permissions:
  contents: write

concurrency:
  group: design42-css-extract-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preview deterministic extraction
        run: node scripts/extract-design42-css.mjs

      - name: Apply deterministic extraction
        run: node scripts/extract-design42-css.mjs --apply

      - name: Verify architecture guardrails
        run: node tests/design42-css-architecture.test.mjs

      - name: Commit extracted CSS ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42-base.html assets/design42/design42-core.css assets/design42/design42-components.css
          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
            exit 0
          fi
          git commit -m "refactor: extract Design 42 inline CSS ownership"
          git push
