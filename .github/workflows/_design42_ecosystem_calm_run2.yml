name: Design 42 ecosystem cleanup rerun

on:
  push:
    paths:
      - '.github/workflows/_design42_ecosystem_calm_run2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calmer ecosystem hierarchy
        run: python scripts/_design42_ecosystem_calm_v2.py
      - name: Verify focused change
        run: |
          grep -q 'Design 42 ecosystem iteration 3: calm topology' 42.html
          grep -q 'Services for every<br>part of PNG.' 42.html
          grep -q 'eco-story-overlay' 42.html
          git diff --check
          git diff -- 42.html | grep -q 'calm topology'
      - name: Commit cleanup and remove temporary files
        run: |
          rm -f scripts/_design42_ecosystem_calm.py scripts/_design42_ecosystem_calm_v2.py
          rm -f .github/workflows/_design42_ecosystem_calm_run.yml .github/workflows/_design42_ecosystem_calm_run2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Calm Design 42 digital ecosystem'
          git push