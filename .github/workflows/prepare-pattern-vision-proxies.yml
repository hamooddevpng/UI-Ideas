name: Prepare Pattern Vision Proxies

on:
  push:
    paths:
      - ".github/workflows/prepare-pattern-vision-proxies.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Build compact vision proxies from existing screenshots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import json

          Image.MAX_IMAGE_PIXELS = None
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          roots = {
              "private": Path("reference-screenshots/png-private-sector/full-page-1440"),
              "public": Path("reference-screenshots/png-public-sites-curated/full-page-1440"),
          }
          out = Path("vision-proxies")
          manifest = []

          for cohort, root in roots.items():
              target = out / cohort
              target.mkdir(parents=True, exist_ok=True)
              for src in sorted(root.glob("*.png")):
                  try:
                      with Image.open(src) as im:
                          im = im.convert("RGB")
                          w, h = im.size
                          # Preserve enough width for visual structure, while capping pathological heights.
                          scale = min(420 / w, 6000 / h, 1.0)
                          nw = max(1, round(w * scale))
                          nh = max(1, round(h * scale))
                          if (nw, nh) != (w, h):
                              im = im.resize((nw, nh), Image.Resampling.LANCZOS)
                          dst = target / f"{src.stem}.jpg"
                          im.save(dst, "JPEG", quality=78, optimize=True, progressive=True)
                          manifest.append({
                              "cohort": cohort,
                              "slug": src.stem,
                              "source": str(src),
                              "source_width": w,
                              "source_height": h,
                              "proxy": str(dst),
                              "proxy_width": nw,
                              "proxy_height": nh,
                          })
                          print(f"{cohort}/{src.stem}: {w}x{h} -> {nw}x{nh}")
                  except Exception as exc:
                      manifest.append({"cohort": cohort, "slug": src.stem, "source": str(src), "error": repr(exc)})
                      print(f"ERROR {src}: {exc}")

          (out / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(f"Prepared {sum('proxy' in x for x in manifest)} proxies")
          PY

      - name: Upload vision proxy bundle
        uses: actions/upload-artifact@v4
        with:
          name: pattern-vision-proxies
          path: vision-proxies/
          retention-days: 1
          compression-level: 6
