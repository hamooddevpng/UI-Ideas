name: Normalize Telikom logo once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-brand-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject shared brand normalizer into concepts 11-20
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src="assets/telikom-brand.js" defer></script>'
          changed = []
          for n in range(11, 21):
              p = Path(f'{n}.html')
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if tag in s:
                  continue
              if '</head>' not in s:
                  raise SystemExit(f'{p} has no </head>')
              s = s.replace('</head>', tag + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))
          print('updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit normalized concepts and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/normalize-brand-once.yml
          git add 11.html 12.html 13.html 14.html 15.html 16.html 17.html 18.html 19.html 20.html assets/telikom-brand.js .github/workflows/normalize-brand-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Normalize official Telikom logo across concepts 11-20"
          git push origin main
