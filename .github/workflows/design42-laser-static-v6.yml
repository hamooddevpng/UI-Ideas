name: Apply Design 42 static province lasers v6

on:
  push:
    branches:
      - fix/design42-static-province-lasers-v6
    paths:
      - .github/workflows/design42-laser-static-v6.yml

permissions:
  contents: write

jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-static-province-lasers-v6
          fetch-depth: 0
      - name: Patch Design 42
        run: python .github/scripts/patch_design42_laser_v6.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bake Design 42 laser anchors from province SVG"
          git push origin HEAD:fix/design42-static-province-lasers-v6
