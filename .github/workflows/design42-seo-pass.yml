name: One-time Design 42 SEO pass
on:
  push:
    paths:
      - '.github/workflows/design42-seo-pass.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SEO pass
        run: python3 .github/scripts/design42_seo_pass.py
      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script(?![^>]*type="application/ld\+json")[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Validate JSON-LD syntax
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          s=pathlib.Path('42.html').read_text()
          m=re.search(r'<script type="application/ld\+json" id="telikomSeoSchema">(.*?)</script>',s,re.S)
          assert m, 'JSON-LD schema missing'
          data=json.loads(m.group(1))
          assert data['@context']=='https://schema.org'
          assert len(data['@graph'])>=4
          print('JSON-LD valid')
          PY
      - name: Browser verification
        run: |
          npm install --prefix /tmp/design42-pw --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          NODE_PATH=/tmp/design42-pw/node_modules node .github/scripts/verify42_seo_pass.js
      - name: Commit verified SEO
        run: |
          rm -f .github/workflows/design42-seo-pass.yml \
                .github/scripts/design42_seo_pass.py \
                .github/scripts/verify42_seo_pass.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-seo-pass.yml .github/scripts/design42_seo_pass.py .github/scripts/verify42_seo_pass.js
          git commit -m 'Add comprehensive SEO metadata to Design 42'
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
