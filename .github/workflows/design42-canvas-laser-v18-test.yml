name: Test Design 42 canvas lasers v18
on:
  push:
    branches: [fix/design42-canvas-lasers-v18]
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Assert 5px moving canvas laser
        run: |
          python3 -m http.server 8080 >/tmp/design42-http.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1600,height:900}});
            await page.goto('http://127.0.0.1:8080/42-base.html', {waitUntil:'domcontentloaded'});
            await page.locator('#png-story').scrollIntoViewIfNeeded();
            await page.waitForTimeout(1400);
            const result = await page.evaluate(() => ({
              canvas: !!document.getElementById('provinceLaserCanvasV18'),
              stats: window.__provinceLaserV18Stats || null
            }));
            console.log(JSON.stringify(result));
            if (!result.canvas) throw new Error('canvas laser layer missing');
            if (!result.stats || result.stats.frames < 8) throw new Error('laser animation did not render enough frames');
            if (result.stats.maxSegmentPx > 5.1) throw new Error(`laser exceeded 5px: ${result.stats.maxSegmentPx}`);
            if (result.stats.travelSamples < 3) throw new Error('laser did not visibly travel between nodes');
            await browser.close();
          })().catch(err=>{ console.error(err); process.exit(1); });
          JS
