name: One-time Design 42 target lock effects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-42-target-lock.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add satellite lock-on and tower laser effects
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('42.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected fragment: {label}')
              s = s.replace(old, new, 1)

          rep(
            '.satellite{position:absolute;right:9%;top:9%;width:170px;height:74px;transform:translate3d(calc(var(--hx,0)*92px),calc(var(--hy,0)*52px),0) rotate(calc(var(--hx,0)*7deg));filter:drop-shadow(0 20px 20px rgba(0,0,0,.2));transition:transform .18s ease-out}',
            '.satellite{position:absolute;right:9%;top:9%;width:170px;height:74px;transform:translate3d(calc(var(--sat-x,0)*190px),calc(var(--sat-y,0)*120px),0) rotate(calc(var(--sat-x,0)*8deg)) scale(var(--sat-scale,1));filter:drop-shadow(0 20px 20px rgba(0,0,0,.2));transition:filter .3s ease}.hero[data-scene-index="1"].hero-in-view .satellite{filter:drop-shadow(0 24px 26px rgba(0,0,0,.24)) drop-shadow(0 0 10px rgba(215,246,255,.16))}',
            'satellite chase transform'
          )

          rep(
            '.dish-rig{position:absolute;width:330px;height:380px;right:14%;top:17%;transform:translate3d(calc(var(--hx,0)*24px),calc(var(--hy,0)*14px),0);transition:transform .2s ease-out}',
            '.dish-rig{position:absolute;width:330px;height:380px;right:14%;top:17%;transform:translate3d(calc(var(--sat-x,0)*12px),calc(var(--sat-y,0)*7px),0);transition:transform .26s ease-out}',
            'dish rig follows satellite'
          )

          rep(
            '.dish-head{position:absolute;width:245px;height:150px;left:43px;top:23px;transform-style:preserve-3d;transform:rotateY(calc(var(--hx,0)*30deg)) rotateX(calc(var(--hy,0)*-20deg)) rotateZ(-13deg);transition:transform .18s ease-out}',
            '.dish-head{position:absolute;width:245px;height:150px;left:43px;top:23px;transform-style:preserve-3d;transform:rotateY(var(--dish-yaw,0deg)) rotateX(var(--dish-pitch,0deg)) rotateZ(-13deg);transition:transform .16s linear}',
            'dish head lock on'
          )

          rep(
            '.signal{position:absolute;left:50%;top:-40px;width:330px;height:225px;transform:translateX(-49%) rotate(calc(var(--hx,0)*5deg));opacity:.56;transition:transform .18s ease-out;animation:signalBreath 2.2s ease-in-out infinite alternate}',
            '.signal{position:absolute;left:50%;top:-40px;width:330px;height:225px;transform:translateX(-49%) rotate(var(--dish-beam,0deg));opacity:.56;transition:transform .16s linear;animation:signalBreath 2.2s ease-in-out infinite alternate}',
            'signal lock on'
          )

          rep(
            '.tower-ring.r3{width:235px;height:88px;top:-20px;animation-delay:1.35s}@keyframes ring{0%{opacity:.9;scale:.7}100%{opacity:0;scale:1.2}}',
            '.tower-ring.r3{width:235px;height:88px;top:-20px;animation-delay:1.35s}@keyframes ring{0%{opacity:.9;scale:.7}100%{opacity:0;scale:1.2}}.tower-laser{position:absolute;left:50%;top:10px;width:var(--laser-length,0px);height:1px;transform-origin:0 50%;transform:rotate(var(--laser-angle,0deg));background:linear-gradient(90deg,rgba(130,224,255,.34),rgba(104,207,248,.16) 55%,rgba(104,207,248,.04));box-shadow:0 0 6px rgba(104,207,248,.18);opacity:0;pointer-events:none;transition:opacity .22s ease,width .08s linear,transform .08s linear}.tower-laser.l2{top:16px;transform:rotate(calc(var(--laser-angle,0deg) + 1.1deg));opacity:0}.tower-laser:after{content:"";position:absolute;right:-2px;top:50%;width:5px;height:5px;border-radius:50%;background:rgba(175,235,255,.72);box-shadow:0 0 10px rgba(112,213,255,.55);transform:translateY(-50%);animation:laserPoint 1.2s ease-in-out infinite alternate}@keyframes laserPoint{to{opacity:.35;scale:.72}}.hero[data-scene-index="2"].hero-in-view .tower.aiming .tower-laser{opacity:.24}.hero[data-scene-index="2"].hero-in-view .tower.aiming .tower-laser.l2{opacity:.11}.hero:not(.hero-in-view) .satellite:before,.hero:not(.hero-in-view) .signal,.hero:not(.hero-in-view) .tower-ring,.hero:not(.hero-in-view) .tower-laser:after{animation-play-state:paused}',
            'tower laser css'
          )

          rep(
            '<div class="tower"><div class="tower-core"></div><div class="tower-ring r1"></div><div class="tower-ring r2"></div><div class="tower-ring r3"></div></div>',
            '<div class="tower"><div class="tower-core"></div><div class="tower-ring r1"></div><div class="tower-ring r2"></div><div class="tower-ring r3"></div><i class="tower-laser l1"></i><i class="tower-laser l2"></i></div>',
            'tower laser html'
          )

          old_pointer = "hero.addEventListener('keydown',e=>{if(phoneOpen)return;if(e.key==='ArrowRight')setScene(active+1);if(e.key==='ArrowLeft')setScene(active-1)});hero.addEventListener('pointermove',e=>{if(coarse)return;const r=hero.getBoundingClientRect();const hx=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2));const hy=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2));hero.style.setProperty('--hx',hx.toFixed(3));hero.style.setProperty('--hy',hy.toFixed(3))});hero.addEventListener('pointerleave',()=>{hero.style.setProperty('--hx','0');hero.style.setProperty('--hy','0')});startAuto();"

          new_pointer = "hero.addEventListener('keydown',e=>{if(phoneOpen)return;if(e.key==='ArrowRight')setScene(active+1);if(e.key==='ArrowLeft')setScene(active-1)});const tower=document.querySelector('.tower');let heroVisible=true,satTX=0,satTY=0,satX=0,satY=0,satRAF=null;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function runSatellite(){if(!heroVisible||active!==1||reduce||coarse){satRAF=null;return}satX+=(satTX-satX)*.13;satY+=(satTY-satY)*.13;hero.style.setProperty('--sat-x',satX.toFixed(3));hero.style.setProperty('--sat-y',satY.toFixed(3));const depth=1+Math.min(.09,Math.hypot(satX,satY)*.055);hero.style.setProperty('--sat-scale',depth.toFixed(3));hero.style.setProperty('--dish-yaw',(satX*27).toFixed(2)+'deg');hero.style.setProperty('--dish-pitch',(satY*-18).toFixed(2)+'deg');hero.style.setProperty('--dish-beam',(satX*4.6).toFixed(2)+'deg');if(Math.abs(satTX-satX)>.002||Math.abs(satTY-satY)>.002)satRAF=requestAnimationFrame(runSatellite);else satRAF=null}function aimTower(e){if(!heroVisible||active!==2||reduce||coarse||!tower)return;const tr=tower.getBoundingClientRect(),sx=tr.left+tr.width/2,sy=tr.top+10,dx=e.clientX-sx,dy=e.clientY-sy;const len=Math.min(1500,Math.hypot(dx,dy)),ang=Math.atan2(dy,dx)*180/Math.PI;tower.style.setProperty('--laser-length',len.toFixed(1)+'px');tower.style.setProperty('--laser-angle',ang.toFixed(2)+'deg');tower.classList.add('aiming')}hero.addEventListener('pointermove',e=>{if(coarse||reduce||!heroVisible)return;const r=hero.getBoundingClientRect();const hx=clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1),hy=clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1);hero.style.setProperty('--hx',hx.toFixed(3));hero.style.setProperty('--hy',hy.toFixed(3));if(active===1){satTX=clamp(hx*1.05,-1,1);satTY=clamp(hy*.82,-.82,.82);if(!satRAF)satRAF=requestAnimationFrame(runSatellite)}else if(active===2)aimTower(e)});hero.addEventListener('pointerleave',()=>{hero.style.setProperty('--hx','0');hero.style.setProperty('--hy','0');if(tower)tower.classList.remove('aiming')});const heroObserver=new IntersectionObserver(([entry])=>{heroVisible=entry.isIntersecting;hero.classList.toggle('hero-in-view',heroVisible);if(!heroVisible){if(tower)tower.classList.remove('aiming');if(satRAF){cancelAnimationFrame(satRAF);satRAF=null}}else if(active===1&&!satRAF&&!reduce&&!coarse)satRAF=requestAnimationFrame(runSatellite)},{threshold:.04});heroObserver.observe(hero);hero.classList.add('hero-in-view');startAuto();"
          rep(old_pointer, new_pointer, 'hero target tracking js')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check Design 42 JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('42.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          if not blocks:
              raise SystemExit('No script block found')
          Path('/tmp/design42.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/design42.js

      - name: Commit effect and remove one-time workflow
        run: |
          rm .github/workflows/fix-42-target-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/fix-42-target-lock.yml
          git commit -m "Add Design 42 satellite lock-on and tower pointer beams"
          git push
