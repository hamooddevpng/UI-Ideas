name: Design 42 light digital ecosystem patch

on:
  push:
    paths:
      - '.github/workflows/_design42_ecosystem_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build light Digital PNG ecosystem
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('42.html')
          text = path.read_text(encoding='utf-8')
          original = text

          css_marker = '/* Design 42: compact Digital PNG service rail. Kept outside Service Categories so the original grid is untouched. */'
          if css_marker not in text:
              raise SystemExit('Digital PNG CSS marker not found')
          if '<section class="digital-png-rail"' not in text:
              raise SystemExit('Current Digital PNG rail not found')
          if 'digital-ecosystem-board' in text:
              raise SystemExit('Ecosystem already present')

          hero_start = original.index('<section class="hero"')
          hero_end = original.index('</section>', hero_start) + len('</section>')
          hero_before = original[hero_start:hero_end]
          services_start = original.index('<section class="services service-stories"')
          services_end = original.index('</section>', services_start) + len('</section>')
          services_before = original[services_start:services_end]

          new_css = r'''/* Design 42: light interactive Digital PNG ecosystem. */
          .digital-ecosystem{position:relative;padding:36px 0 42px;background:linear-gradient(180deg,#f3fbfd 0%,#f8fcfb 58%,#f4faf8 100%);border-top:1px solid rgba(16,43,60,.06);border-bottom:1px solid rgba(16,43,60,.07);overflow:hidden}
          .digital-ecosystem:before{content:"";position:absolute;inset:-160px -8% auto;height:360px;background:radial-gradient(circle at 20% 52%,rgba(28,160,232,.08),transparent 31%),radial-gradient(circle at 76% 48%,rgba(32,169,87,.06),transparent 29%);pointer-events:none}
          .digital-ecosystem-head{position:relative;z-index:2;display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:15px}
          .digital-ecosystem-head h2{font-family:"Space Grotesk",Manrope,sans-serif;font-size:clamp(28px,3.1vw,42px);line-height:.98;letter-spacing:-.045em;margin:7px 0 0;color:#102f3f}
          .digital-ecosystem-head p{max-width:530px;margin:0;font-size:11px;line-height:1.55;color:#607c89}
          .digital-ecosystem-board{position:relative;z-index:2;border:1px solid rgba(29,101,128,.11);border-radius:24px;background:rgba(255,255,255,.76);box-shadow:0 18px 48px rgba(25,86,108,.07);overflow:hidden;isolation:isolate}
          .eco-map-scroll{position:relative;overflow:hidden;scrollbar-width:thin;scrollbar-color:rgba(8,117,201,.2) transparent}
          .eco-map{position:relative;width:100%;height:390px;min-width:760px;background:linear-gradient(180deg,#edf9fb 0 49%,#edf8f3 49% 100%)}
          .eco-scene{display:block;width:100%;height:100%}
          .eco-grid{fill:url(#ecoGrid);opacity:.36}.eco-water{fill:#dff4f6}.eco-land{fill:#edf8f0}.eco-road{fill:none;stroke:#fff;stroke-width:36;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 1px rgba(47,105,120,.06))}.eco-road-edge{fill:none;stroke:#bcd8dc;stroke-width:39;stroke-linecap:round;stroke-linejoin:round;opacity:.34}.eco-road-mark{fill:none;stroke:#9bbcc1;stroke-width:1.4;stroke-dasharray:7 10;opacity:.35}
          .eco-building{fill:#fff;stroke:#a8ccd4;stroke-width:1.2}.eco-building-side{fill:#e3f0f3;stroke:#a8ccd4;stroke-width:1}.eco-window{fill:#83cbe0;opacity:.5}.eco-green{fill:#d8f0df;stroke:#9bc7a9;stroke-width:1}.eco-tree-trunk{stroke:#9db7aa;stroke-width:2}.eco-person{fill:#fff;stroke:#65a8bc;stroke-width:1.2}.eco-person-head{fill:#8dd3e5}.eco-label{font-family:Manrope,Arial,sans-serif;font-size:9px;font-weight:800;letter-spacing:.12em;fill:#477181}.eco-small{font-size:6.5px;letter-spacing:.1em;fill:#73909a}.eco-telikom{fill:#fafdfe;stroke:#58afd0;stroke-width:1.6;filter:drop-shadow(0 8px 15px rgba(25,106,137,.10))}.eco-telikom-band{fill:#0875c9}.eco-cloud-core{fill:#f9fffc;stroke:#77bfa8;stroke-width:1.5;filter:drop-shadow(0 8px 16px rgba(49,133,108,.08))}.eco-cloud-light{fill:#34b987;filter:drop-shadow(0 0 4px rgba(52,185,135,.45));animation:ecoServer 2.8s ease-in-out infinite}.eco-satellite{transform-box:fill-box;transform-origin:center;animation:ecoSatFloat 7s ease-in-out infinite}.eco-sat-panel{fill:#cce1e7;stroke:#6d9cab;stroke-width:1}.eco-sat-body{fill:#fff;stroke:#8caab2;stroke-width:1}.eco-dish{fill:#fff;stroke:#74a9b9;stroke-width:1.2}.eco-dish-mast{stroke:#79a3af;stroke-width:2;stroke-linecap:round}.eco-phone{fill:#fff;stroke:#70aabc;stroke-width:1.4}.eco-phone-screen{fill:#e9f7fb}.eco-phone-check{fill:#20a957}.eco-zone{transition:opacity .28s var(--ease),filter .28s var(--ease)}
          .eco-route{fill:none;stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.32;transition:opacity .28s,stroke-width .28s,filter .28s}.route-network{stroke:#1ca0e8}.route-starlink{stroke:#56abc5;stroke-dasharray:7 8}.route-compute{stroke:#20a957}.route-tcash{stroke:#0875c9;stroke-dasharray:3 7}.eco-board-focused .eco-route{opacity:.07}.eco-board-focused .eco-route.is-active{opacity:.95;stroke-width:3;filter:drop-shadow(0 0 4px rgba(42,173,214,.24))}.eco-board-focused .eco-zone{opacity:.38}.eco-board-focused .eco-zone.is-active{opacity:1;filter:saturate(1.04)}
          .eco-data-dot{fill:#fff;stroke:#1ca0e8;stroke-width:1.2;filter:drop-shadow(0 0 4px rgba(28,160,232,.55))}.eco-compute-dot{fill:#effff9;stroke:#20a957;stroke-width:1.2;filter:drop-shadow(0 0 4px rgba(32,169,87,.45))}.eco-kina-token circle{fill:#fff;stroke:#0875c9;stroke-width:1.5;filter:drop-shadow(0 0 5px rgba(8,117,201,.38))}.eco-kina-token text{font-family:"Space Grotesk",Manrope,sans-serif;font-size:10px;font-weight:800;fill:#0875c9;text-anchor:middle;dominant-baseline:middle}.eco-beam{fill:none;stroke:#76bfd2;stroke-width:1.6;stroke-dasharray:5 7;opacity:.34;animation:ecoBeam 3s linear infinite}
          .eco-node{position:absolute;z-index:7;display:flex;align-items:center;gap:6px;padding:6px 9px 6px 6px;border:1px solid rgba(27,108,137,.13);border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(28,88,108,.07);color:#365f70;font-size:7px;font-weight:800;letter-spacing:.06em;cursor:pointer;outline:none;transition:transform .24s var(--spring),box-shadow .24s,border-color .24s,opacity .24s}.eco-node i{width:17px;height:17px;border-radius:50%;background:#e7f6fa;display:grid;place-items:center;color:#0875c9;font-style:normal;font-size:8px}.eco-node:hover,.eco-node:focus-visible,.eco-node.active{transform:translateY(-2px);border-color:rgba(8,117,201,.35);box-shadow:0 10px 24px rgba(22,94,122,.12);background:#fff}.eco-board-focused .eco-node:not(.active){opacity:.68}.eco-node[data-eco="starlink"]{left:8.5%;top:12%}.eco-node[data-eco="network"]{left:13%;top:68%}.eco-node[data-eco="telikom"]{left:43.5%;top:47%}.eco-node[data-eco="compute"]{right:9.5%;top:32%}.eco-node[data-eco="tcash"]{right:10%;top:73%}
          .eco-insight{min-height:88px;display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:20px;padding:16px 20px;border-top:1px solid rgba(22,96,123,.09);background:rgba(252,254,254,.94)}.eco-insight-key small{display:block;font-size:6px;font-weight:800;letter-spacing:.16em;color:#7b939d;margin-bottom:5px}.eco-insight-key b{font-family:"Space Grotesk";font-size:13px;line-height:1;color:#0875c9}.eco-insight-copy h3{font-family:"Space Grotesk";font-size:18px;line-height:1;margin:0 0 5px;color:#173d4d;letter-spacing:-.025em}.eco-insight-copy p{margin:0;max-width:720px;font-size:8.5px;line-height:1.5;color:#66808b}.eco-more{height:34px;padding:0 13px;border-radius:999px;border:1px solid rgba(8,117,201,.18);background:#eef8fc;color:#0875c9;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;white-space:nowrap;transition:.22s}.eco-more:hover,.eco-more:focus-visible{outline:none;background:#0875c9;color:#fff;border-color:#0875c9}
          .eco-hint{position:absolute;z-index:5;right:14px;bottom:9px;font-size:5.5px;font-weight:800;letter-spacing:.12em;color:#75919d;pointer-events:none}.eco-mobile-cue{display:none}
          @keyframes ecoSatFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(5px) rotate(1deg)}}@keyframes ecoBeam{to{stroke-dashoffset:-36}}@keyframes ecoServer{0%,100%{opacity:.5}50%{opacity:1}}
          @media(max-width:820px){.digital-ecosystem{padding:31px 0 36px}.digital-ecosystem-head{display:block;margin-bottom:13px}.digital-ecosystem-head p{margin-top:8px;font-size:10px}.eco-map-scroll{overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity}.eco-map{width:760px;height:340px}.eco-mobile-cue{display:inline}.eco-hint{right:auto;left:14px}.eco-insight{grid-template-columns:1fr auto;gap:9px 14px;padding:14px 15px}.eco-insight-key{grid-column:1}.eco-insight-copy{grid-column:1 / -1;grid-row:2}.eco-more{grid-column:2;grid-row:1;align-self:center}.eco-insight-copy p{font-size:8px}.eco-node{font-size:6.5px}.eco-node[data-eco="starlink"]{left:7%;top:10%}.eco-node[data-eco="network"]{left:12%;top:70%}.eco-node[data-eco="telikom"]{left:43%;top:48%}.eco-node[data-eco="compute"]{right:8%;top:31%}.eco-node[data-eco="tcash"]{right:8%;top:74%}}
          @media(prefers-reduced-motion:reduce){.eco-satellite,.eco-cloud-light,.eco-beam,.eco-node,.eco-zone,.eco-route,.eco-more{animation:none!important;transition:none!important}.eco-data-dot,.eco-compute-dot,.eco-kina-token{display:none!important}}
          '''

          new_section = r'''<section class="digital-ecosystem" id="digital-png-rail" aria-labelledby="digitalPngTitle">
            <div class="shell">
              <div class="digital-ecosystem-head reveal">
                <div><div class="kicker">Digital PNG ecosystem</div><h2 id="digitalPngTitle">One network. Many journeys.</h2></div>
                <p>A light interactive view of how people, remote communities, digital services and sovereign compute can connect through Telikom.</p>
              </div>

              <div class="digital-ecosystem-board reveal" id="digitalEcosystemBoard">
                <div class="eco-map-scroll" id="ecoMapScroll">
                  <div class="eco-map" id="ecoMap">
                    <svg class="eco-scene" id="ecoScene" viewBox="0 0 960 390" role="img" aria-label="Illustrated Telikom digital ecosystem with city users, remote Starlink connectivity, Telikom hub, Kumul Cloud compute and T-Cash transfer">
                      <defs>
                        <pattern id="ecoGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7eb8c5" stroke-width=".6"/></pattern>
                        <linearGradient id="ecoTowerGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f5f9"/></linearGradient>
                      </defs>

                      <rect width="960" height="390" class="eco-grid"/>
                      <path class="eco-water" d="M0 0H960V72C855 93 760 74 668 78C548 83 468 112 362 97C245 80 156 48 0 72Z" opacity=".48"/>
                      <path class="eco-land" d="M0 77C158 52 247 92 364 106C491 121 574 84 689 89C801 94 864 108 960 86V390H0Z"/>

                      <path class="eco-road-edge" d="M38 302C170 254 273 270 383 225S592 178 715 229S842 286 925 257"/>
                      <path class="eco-road" d="M38 302C170 254 273 270 383 225S592 178 715 229S842 286 925 257"/>
                      <path class="eco-road-mark" d="M38 302C170 254 273 270 383 225S592 178 715 229S842 286 925 257"/>
                      <path class="eco-road-edge" d="M466 214C456 270 470 323 525 371" opacity=".55"/>
                      <path class="eco-road" d="M466 214C456 270 470 323 525 371"/>
                      <path class="eco-road-mark" d="M466 214C456 270 470 323 525 371"/>

                      <g class="eco-zone zone-remote" data-zone="starlink">
                        <path d="M44 129h202v80H44z" fill="#e7f5ea" opacity=".58" rx="18"/>
                        <g transform="translate(78 143)"><rect width="54" height="38" rx="4" class="eco-building"/><path d="M-5 3L27-15 59 3" class="eco-building-side"/><rect x="9" y="14" width="10" height="14" class="eco-window"/><rect x="32" y="11" width="12" height="9" class="eco-window"/></g>
                        <g transform="translate(157 154)"><rect width="48" height="31" rx="4" class="eco-building"/><path d="M-4 3L24-12 52 3" class="eco-building-side"/><rect x="9" y="12" width="9" height="11" class="eco-window"/></g>
                        <g transform="translate(216 143)"><path d="M0 32V9" class="eco-dish-mast"/><ellipse cx="0" cy="6" rx="17" ry="7" transform="rotate(-19 0 6)" class="eco-dish"/><path d="M-12 32H15" class="eco-dish-mast"/></g>
                        <text x="73" y="199" class="eco-label">REMOTE PNG</text><text x="73" y="211" class="eco-small">COMMUNITY + SITE</text>
                      </g>

                      <g class="eco-zone zone-city" data-zone="network">
                        <g transform="translate(80 236)"><rect width="54" height="61" rx="5" class="eco-building"/><rect x="9" y="12" width="10" height="8" class="eco-window"/><rect x="27" y="12" width="10" height="8" class="eco-window"/><rect x="9" y="28" width="10" height="8" class="eco-window"/><rect x="27" y="28" width="10" height="8" class="eco-window"/></g>
                        <g transform="translate(146 218)"><rect width="64" height="75" rx="5" class="eco-building"/><rect x="10" y="14" width="12" height="9" class="eco-window"/><rect x="30" y="14" width="12" height="9" class="eco-window"/><rect x="10" y="32" width="12" height="9" class="eco-window"/><rect x="30" y="32" width="12" height="9" class="eco-window"/></g>
                        <g transform="translate(225 246)"><rect width="50" height="49" rx="5" class="eco-building"/><rect x="9" y="12" width="9" height="8" class="eco-window"/><rect x="27" y="12" width="9" height="8" class="eco-window"/></g>
                        <g transform="translate(110 313)"><circle cy="-8" r="6" class="eco-person-head"/><path d="M0-1V20M-9 7L0 2l9 5M0 20l-8 13M0 20l8 13" fill="none" stroke="#65a8bc" stroke-width="2" stroke-linecap="round"/></g>
                        <g transform="translate(192 322)"><circle cy="-8" r="6" class="eco-person-head"/><path d="M0-1V20M-9 7L0 2l9 5M0 20l-8 13M0 20l8 13" fill="none" stroke="#65a8bc" stroke-width="2" stroke-linecap="round"/></g>
                        <g transform="translate(251 316)"><circle cy="-8" r="6" class="eco-person-head"/><path d="M0-1V20M-9 7L0 2l9 5M0 20l-8 13M0 20l8 13" fill="none" stroke="#65a8bc" stroke-width="2" stroke-linecap="round"/></g>
                        <text x="82" y="358" class="eco-label">PEOPLE + CITY</text><text x="82" y="370" class="eco-small">MOBILE · HOME · BUSINESS</text>
                      </g>

                      <g class="eco-zone zone-telikom" data-zone="telikom">
                        <g transform="translate(405 132)"><path d="M20 25L65 0l46 25v101H20z" fill="url(#ecoTowerGrad)" class="eco-telikom"/><rect x="20" y="77" width="91" height="21" class="eco-telikom-band"/><text x="65" y="90" text-anchor="middle" style="font:800 11px Manrope;letter-spacing:.09em;fill:white">TELIKOM</text><rect x="38" y="38" width="15" height="16" rx="2" class="eco-window"/><rect x="63" y="38" width="15" height="16" rx="2" class="eco-window"/><rect x="38" y="61" width="15" height="10" rx="2" class="eco-window"/><rect x="63" y="61" width="15" height="10" rx="2" class="eco-window"/><circle cx="98" cy="14" r="5" fill="#20a957" opacity=".88"/></g>
                        <text x="425" y="276" class="eco-label">TELIKOM HUB</text><text x="425" y="288" class="eco-small">NETWORK + DIGITAL CORE</text>
                      </g>

                      <g class="eco-zone zone-compute" data-zone="compute">
                        <g transform="translate(714 120)"><rect width="152" height="104" rx="12" class="eco-cloud-core"/><rect x="15" y="18" width="122" height="16" rx="4" fill="#e7f6f1"/><rect x="15" y="43" width="122" height="16" rx="4" fill="#e7f6f1"/><rect x="15" y="68" width="122" height="16" rx="4" fill="#e7f6f1"/><circle cx="125" cy="26" r="3.5" class="eco-cloud-light"/><circle cx="125" cy="51" r="3.5" class="eco-cloud-light" style="animation-delay:.45s"/><circle cx="125" cy="76" r="3.5" class="eco-cloud-light" style="animation-delay:.9s"/><path d="M52 0C48-17 65-25 76-14C84-29 111-26 112-7C128-8 136 4 132 16H56C45 14 42 6 52 0Z" fill="#fafffd" stroke="#8bcab6" stroke-width="1.2"/></g>
                        <text x="734" y="245" class="eco-label">KUMUL CLOUD</text><text x="734" y="257" class="eco-small">SOVEREIGN AI + COMPUTE</text>
                      </g>

                      <g class="eco-zone zone-tcash" data-zone="tcash">
                        <g transform="translate(642 285)"><rect width="42" height="67" rx="9" class="eco-phone"/><rect x="6" y="9" width="30" height="45" rx="5" class="eco-phone-screen"/><circle cx="21" cy="60" r="2" fill="#8db2bd"/></g>
                        <g transform="translate(813 285)"><rect width="42" height="67" rx="9" class="eco-phone"/><rect x="6" y="9" width="30" height="45" rx="5" class="eco-phone-screen"/><circle cx="21" cy="60" r="2" fill="#8db2bd"/><circle cx="21" cy="31" r="10" fill="#dff4e8"/><path d="M16 31l4 4 8-9" fill="none" stroke="#20a957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
                        <text x="698" y="366" class="eco-label">T-CASH</text><text x="698" y="378" class="eco-small">VALUE MOVES USER TO USER</text>
                      </g>

                      <g class="eco-zone zone-satellite" data-zone="starlink">
                        <g class="eco-satellite" transform="translate(622 35) rotate(-7)"><rect x="-46" y="4" width="62" height="25" rx="3" class="eco-sat-panel"/><path d="M-34 5v23M-19 5v23M-4 5v23M-45 12h60M-45 21h60" fill="none" stroke="#8fb7c2" stroke-width=".8"/><path d="M19 8h35l13 8-5 20H25L13 26z" class="eco-sat-body"/><circle cx="57" cy="22" r="3" fill="#8de0f2"/></g>
                        <text x="563" y="79" class="eco-small">LOW-EARTH ORBIT</text>
                      </g>

                      <path id="ecoNetworkRoute" class="eco-route route-network" data-route="network" d="M206 302C282 287 340 248 432 221"/>
                      <path id="ecoStarlinkRoute" class="eco-route route-starlink" data-route="starlink" d="M216 160C288 155 357 171 434 200"/>
                      <path class="eco-beam" data-route="starlink" d="M674 54C548 79 399 106 220 150"/>
                      <path id="ecoComputeRoute" class="eco-route route-compute" data-route="compute" d="M500 204C582 186 644 167 716 170"/>
                      <path id="ecoCashRoute" class="eco-route route-tcash" data-route="tcash" d="M663 319C591 317 528 289 471 257C544 280 650 318 833 319"/>

                      <circle r="4" class="eco-data-dot"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#ecoNetworkRoute"/></animateMotion></circle>
                      <circle r="3" class="eco-data-dot" opacity=".7"><animateMotion dur="3.8s" begin="1.25s" repeatCount="indefinite"><mpath href="#ecoNetworkRoute"/></animateMotion></circle>
                      <circle r="4" class="eco-compute-dot"><animateMotion dur="3.3s" repeatCount="indefinite"><mpath href="#ecoComputeRoute"/></animateMotion></circle>
                      <circle r="3" class="eco-compute-dot" opacity=".72"><animateMotion dur="3.3s" begin="1.1s" repeatCount="indefinite"><mpath href="#ecoComputeRoute"/></animateMotion></circle>
                      <g class="eco-kina-token"><circle r="10"/><text y=".5">K</text><animateMotion dur="4.6s" repeatCount="indefinite"><mpath href="#ecoCashRoute"/></animateMotion></g>
                    </svg>

                    <button class="eco-node" type="button" data-eco="starlink"><i>◌</i><span>Starlink / Remote</span></button>
                    <button class="eco-node" type="button" data-eco="network"><i>⌁</i><span>People + Network</span></button>
                    <button class="eco-node" type="button" data-eco="telikom"><i>T</i><span>Telikom Hub</span></button>
                    <button class="eco-node" type="button" data-eco="compute"><i>▦</i><span>Kumul Cloud</span></button>
                    <button class="eco-node" type="button" data-eco="tcash"><i>K</i><span>T-Cash</span></button>
                    <div class="eco-hint"><span class="eco-mobile-cue">SWIPE MAP · </span>HOVER OR TAP A SERVICE</div>
                  </div>
                </div>

                <div class="eco-insight" id="ecoInsight" aria-live="polite">
                  <div class="eco-insight-key"><small id="ecoInsightEyebrow">DIGITAL PNG</small><b id="ecoInsightCode">ECOSYSTEM</b></div>
                  <div class="eco-insight-copy"><h3 id="ecoInsightTitle">One Telikom ecosystem.</h3><p id="ecoInsightText">Connectivity, remote access, sovereign compute and digital transactions shown as parts of one shared Telikom layer.</p></div>
                  <a class="eco-more" id="ecoInsightLink" href="#services">Show more ↗</a>
                </div>
              </div>
            </div>
          </section>
          <script>
          ;(()=>{
            const section=document.getElementById('digital-png-rail'),board=document.getElementById('digitalEcosystemBoard'),scene=document.getElementById('ecoScene');
            if(!section||!board)return;
            const nodes=[...board.querySelectorAll('.eco-node')],routes=[...board.querySelectorAll('[data-route]')],zones=[...board.querySelectorAll('[data-zone]')];
            const eyebrow=document.getElementById('ecoInsightEyebrow'),code=document.getElementById('ecoInsightCode'),title=document.getElementById('ecoInsightTitle'),text=document.getElementById('ecoInsightText'),link=document.getElementById('ecoInsightLink');
            const data={
              network:{eyebrow:'CONNECT',code:'CITY + PEOPLE',title:'Everyday traffic enters the Telikom network.',text:'People, homes and businesses send mobile and data traffic into Telikom, where it can continue toward digital services and compute.',href:'#services',routes:['network'],zones:['network','telikom']},
              starlink:{eyebrow:'CONNECT',code:'STARLINK',title:'Remote PNG connects back into the same ecosystem.',text:'A remote site can use satellite connectivity to reach Telikom services beyond the usual terrestrial network edge.',href:'#business',routes:['starlink'],zones:['starlink','telikom']},
              telikom:{eyebrow:'CORE',code:'TELIKOM HUB',title:'Telikom is the shared digital layer.',text:'The central network hub links customer connectivity, remote access, digital transactions and sovereign compute into one ecosystem.',href:'#services',routes:['network','starlink','compute','tcash'],zones:['network','starlink','telikom','compute','tcash']},
              compute:{eyebrow:'COMPUTE',code:'KUMUL CLOUD',title:'Traffic can continue into sovereign compute.',text:'Kumul Cloud represents PNG-hosted cloud and AI infrastructure for resilient workloads and modern enterprise services.',href:'#business',routes:['compute'],zones:['telikom','compute']},
              tcash:{eyebrow:'TRANSACT',code:'T-CASH',title:'Kina moves from one user to another through Telikom.',text:'A simple value journey shows one user sending Kina through the Telikom digital layer to another user, without implying unsupported wallet features.',href:'#services',routes:['tcash'],zones:['telikom','tcash']}
            };
            const clear=()=>{board.classList.remove('eco-board-focused');nodes.forEach(n=>n.classList.remove('active'));routes.forEach(r=>r.classList.remove('is-active'));zones.forEach(z=>z.classList.remove('is-active'))};
            const activate=key=>{const d=data[key];if(!d)return;board.classList.add('eco-board-focused');nodes.forEach(n=>n.classList.toggle('active',n.dataset.eco===key));routes.forEach(r=>r.classList.toggle('is-active',d.routes.includes(r.dataset.route)));zones.forEach(z=>z.classList.toggle('is-active',d.zones.includes(z.dataset.zone)));eyebrow.textContent=d.eyebrow;code.textContent=d.code;title.textContent=d.title;text.textContent=d.text;link.href=d.href};
            nodes.forEach(node=>{node.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')activate(node.dataset.eco)});node.addEventListener('focus',()=>activate(node.dataset.eco));node.addEventListener('click',()=>activate(node.dataset.eco))});
            board.addEventListener('pointerleave',e=>{if(e.pointerType==='touch')return;clear();eyebrow.textContent='DIGITAL PNG';code.textContent='ECOSYSTEM';title.textContent='One Telikom ecosystem.';text.textContent='Connectivity, remote access, sovereign compute and digital transactions shown as parts of one shared Telikom layer.';link.href='#services'});
            if(matchMedia('(prefers-reduced-motion: reduce)').matches&&scene&&scene.pauseAnimations)scene.pauseAnimations();
          })();
          </script>'''

          css_start = text.index(css_marker)
          css_end = text.index('\n\n</style>', css_start)
          text = text[:css_start] + new_css + text[css_end:]

          section_start = text.index('<section class="digital-png-rail"')
          m = re.search(r'\n<section class="business\b', text[section_start:])
          if not m:
              raise SystemExit('Business section after Digital PNG not found')
          section_end = section_start + m.start()
          text = text[:section_start] + new_section + text[section_end:]

          hero_start_after = text.index('<section class="hero"')
          hero_end_after = text.index('</section>', hero_start_after) + len('</section>')
          if text[hero_start_after:hero_end_after] != hero_before:
              raise SystemExit('Hero changed unexpectedly')
          services_start_after = text.index('<section class="services service-stories"')
          services_end_after = text.index('</section>', services_start_after) + len('</section>')
          if text[services_start_after:services_end_after] != services_before:
              raise SystemExit('Services section changed unexpectedly')

          required = ['digital-ecosystem-board','ecoNetworkRoute','ecoStarlinkRoute','ecoComputeRoute','ecoCashRoute','ecoInsight','prefers-reduced-motion']
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing required marker: {marker}')
          if 'digital-png-card' in text[text.index('/* Design 42: light interactive Digital PNG ecosystem. */'):text.index('\n\n</style>', text.index('/* Design 42: light interactive Digital PNG ecosystem. */'))]:
              raise SystemExit('Old card CSS survived inside ecosystem block')

          path.write_text(text, encoding='utf-8')
          print('Built light Digital PNG ecosystem without touching hero or Services markup')
          PY
      - name: Verify focused change
        run: |
          grep -q 'digital-ecosystem-board' 42.html
          grep -q 'One network. Many journeys.' 42.html
          grep -q 'Starlink / Remote' 42.html
          grep -q 'Kumul Cloud' 42.html
          grep -q 'T-Cash' 42.html
          grep -q 'Services for every<br>part of PNG.' 42.html
          git diff --check
          git diff -- 42.html
      - name: Commit ecosystem and remove workflow
        run: |
          rm .github/workflows/_design42_ecosystem_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build light Design 42 digital ecosystem'
          git push
