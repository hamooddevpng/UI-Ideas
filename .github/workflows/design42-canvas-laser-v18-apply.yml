name: Apply Design 42 canvas lasers v18
on:
  push:
    branches:
      - fix/design42-canvas-lasers-v18
    paths:
      - .github/workflows/design42-canvas-laser-v18-apply.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-canvas-lasers-v18
          fetch-depth: 0
      - name: Apply canvas renderer
        run: python3 .patches/apply_design42_canvas_lasers_v18.py
      - name: Verify canvas implementation
        run: |
          grep -q 'clean canvas province lasers v18' 42-base.html
          grep -q "canvas.id='provinceLaserCanvasV18'" 42-base.html
          grep -q 'headDist-5' 42-base.html
          ! grep -q 'Design 42: animated laser shots v7' 42-base.html
          ! grep -q 'Design 42: robust province lasers v9' 42-base.html
          ! grep -q 'Design 42: simple province lasers v11' 42-base.html
          ! grep -q 'Design 42: endpoint lasers v12' 42-base.html
      - name: Remove temporary patch files
        run: rm .patches/apply_design42_canvas_lasers_v18.py .github/workflows/design42-canvas-laser-v18-apply.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42-base.html .patches/apply_design42_canvas_lasers_v18.py .github/workflows/design42-canvas-laser-v18-apply.yml
          git commit -m 'fix: rebuild Design 42 lasers with a canvas renderer'
          git push origin HEAD:fix/design42-canvas-lasers-v18
