name: One-time Design 42 copy and particle refinement
# retry with NASA Louisiade image
on:
  push:
    paths:
      - '.github/workflows/design42-clean-copy-particles.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Design 42 copy and particle changes
        run: python3 .github/scripts/design42_clean_copy_particles.py
      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser smoke test
        run: |
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          node .github/scripts/verify42_clean_copy_particles.js
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/design42-clean-copy-particles.yml .github/scripts/design42_clean_copy_particles.py .github/scripts/verify42_clean_copy_particles.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-clean-copy-particles.yml .github/scripts/design42_clean_copy_particles.py .github/scripts/verify42_clean_copy_particles.js
          git commit -m 'Clean Design 42 copy and add offer pop particles'
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
