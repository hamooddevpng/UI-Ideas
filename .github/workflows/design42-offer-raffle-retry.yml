name: One-time Design 42 offer raffle retry
on:
  push:
    paths:
      - '.github/workflows/design42-offer-raffle-retry.yml'
permissions:
  contents: write
jobs:
  retry-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified raffle patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/design42-offer-raffle.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if "python3 - <<'PY'" in l)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          body='\n'.join((l[10:] if l.startswith('          ') else l) for l in lines[start:end])+'\n'
          Path('/tmp/apply_raffle.py').write_text(body)
          PY
          python3 /tmp/apply_raffle.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html');s=p.read_text()
          old="transition:transform 1.12s calc(var(--delay) + .88s) cubic-bezier(.12,.84,.2,1.08),opacity .42s calc(var(--delay) + .92s) ease,filter .6s calc(var(--delay) + .92s) ease"
          new="transition:transform .92s calc(var(--delay) + .08s) cubic-bezier(.12,.84,.2,1.08),opacity .38s calc(var(--delay) + .1s) ease,filter .48s calc(var(--delay) + .1s) ease"
          assert old in s
          s=s.replace(old,new,1).replace('transition:.5s 1.75s','transition:.5s 1.15s',1)
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});const before=await page.evaluate(()=>({title:document.querySelector('#offers .title')?.textContent.trim(),cards:document.querySelectorAll('.personal-offer').length,loaded:document.getElementById('offers').classList.contains('offers-loaded')}));if(before.title!=='Offers for you.'||before.cards!==3||before.loaded)throw Error('Initial raffle state '+JSON.stringify(before));await page.evaluate(()=>document.getElementById('offers').scrollIntoView({block:'center'}));await page.waitForTimeout(2500);const after=await page.evaluate(()=>({loaded:document.getElementById('offers').classList.contains('offers-loaded'),machine:parseFloat(getComputedStyle(document.getElementById('offerRaffle')).opacity),cards:[...document.querySelectorAll('.personal-offer')].map(c=>({o:parseFloat(getComputedStyle(c).opacity),t:c.querySelector('h3').textContent.trim()}))}));if(!after.loaded||after.machine>.12||after.cards.some(c=>c.o<.98||!c.t||c.t.includes('Finding')))throw Error('Raffle reveal '+JSON.stringify(after));await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(250);await page.click('.scene-tab[data-scene="1"]');await page.waitForTimeout(760);await page.mouse.move(1080,180);await page.waitForTimeout(300);const a=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));await page.mouse.move(760,430);await page.waitForTimeout(300);const b=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));if(a.s===b.s||a.d===b.d)throw Error('Satellite/dish regression');await page.click('.scene-tab[data-scene="2"]');await page.waitForTimeout(720);await page.mouse.move(430,250);let pulse=0,max=0,end=Date.now()+2400;while(Date.now()<end){const v=await page.evaluate(()=>({c:Number(document.querySelector('.tower').dataset.pulseCount||0),o:parseFloat(getComputedStyle(document.querySelector('.tower-pulse-track.p1 i')).opacity)}));pulse=Math.max(pulse,v.c);max=Math.max(max,v.o||0);await page.waitForTimeout(30)}if(pulse<1||max<.7)throw Error('Laser regression '+JSON.stringify({pulse,max}));if(errors.length)throw Error(errors.join(' | '));console.log('Raffle OK',after);console.log('Hero interactions OK',{pulse,max});await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit safely on latest main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/design42-offer-raffle.yml .github/workflows/design42-offer-raffle-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-offer-raffle.yml .github/workflows/design42-offer-raffle-retry.yml
          git commit -m 'Turn Design 42 offers into personalized raffle reveal'
          git fetch origin main
          git rebase origin/main
          git push origin main
