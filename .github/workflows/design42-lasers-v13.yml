name: Apply Design 42 laser tuning v13

on:
  push:
    branches:
      - tune/design42-lasers-v13
    paths:
      - .github/workflows/design42-lasers-v13.yml
      - scripts/patch_design42_lasers_v13.py

permissions:
  contents: write

jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tune/design42-lasers-v13
          fetch-depth: 0
      - name: Patch Design 42 laser speed and styling
        run: python scripts/patch_design42_lasers_v13.py
      - name: Commit result
        run: |
          rm -f .github/workflows/design42-lasers-v13.yml scripts/patch_design42_lasers_v13.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "tune: make Design 42 lasers faster and thinner"
          git push origin HEAD:tune/design42-lasers-v13
