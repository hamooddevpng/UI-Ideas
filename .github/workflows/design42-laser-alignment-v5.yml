name: Apply Design 42 laser alignment v5

on:
  push:
    branches:
      - fix/design42-laser-alignment-v5
    paths:
      - .github/workflows/design42-laser-alignment-v5.yml

permissions:
  contents: write

jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-laser-alignment-v5
          fetch-depth: 0

      - name: Patch Design 42
        run: python tools/patch_design42_laser_v5.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/design42-laser-alignment-v5.yml tools/patch_design42_laser_v5.py
          git add -A
          git commit -m "fix: anchor Design 42 lasers to real province nodes"
          git push origin HEAD:fix/design42-laser-alignment-v5
