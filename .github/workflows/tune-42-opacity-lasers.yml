name: One-time Design 42 opacity and laser reliability check
on:
  push:
    paths:
      - '.github/workflows/tune-42-opacity-lasers.yml'
permissions:
  contents: write
jobs:
  tune-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune atmosphere and make heartbeat bolts reliable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text()

          replacements={
            'opacity:.105;filter:saturate(.62)':'opacity:.15;filter:saturate(.62)',
            'opacity:.19;filter:saturate(.72)':'opacity:.24;filter:saturate(.72)',
            'opacity:.095;filter:grayscale(1)':'opacity:.14;filter:grayscale(1)',
            '@media(max-width:820px){.hero-people{opacity:.075;':'@media(max-width:820px){.hero-people{opacity:.105;',
            '.hero-island{opacity:.14;object-position:64% 50%}':'.hero-island{opacity:.18;object-position:64% 50%}',
            '.hero-map{width:92%;right:-18%;opacity:.075}':'.hero-map{width:92%;right:-18%;opacity:.105}',
            'width:74px;height:2.35px;border-radius:999px;background:linear-gradient(90deg,rgba(184,241,255,0),rgba(170,236,255,.98) 34%,#fff 61%,rgba(89,198,247,0));box-shadow:0 0 8px rgba(105,211,255,.88),0 0 20px rgba(67,173,231,.46);transform:translateY(-50%);opacity:0':'width:96px;height:3.2px;border-radius:999px;background:linear-gradient(90deg,rgba(184,241,255,0),rgba(170,236,255,.98) 28%,#fff 58%,rgba(89,198,247,.18) 82%,rgba(89,198,247,0));box-shadow:0 0 9px rgba(139,226,255,.96),0 0 24px rgba(67,173,231,.58),0 0 38px rgba(33,160,243,.22);transform:translateY(-50%);opacity:0;mix-blend-mode:screen',
            '.tower-pulse-track.p2 i{width:52px;height:1.5px}':'.tower-pulse-track.p2 i{width:64px;height:2px;box-shadow:0 0 8px rgba(139,226,255,.85),0 0 18px rgba(67,173,231,.42)}',
          }
          for old,new in replacements.items():
            assert old in s, f'missing anchor: {old[:80]}'
            s=s.replace(old,new,1)

          old='function effectsLive(){return heroVisible&&!document.hidden}'
          new='function effectsLive(){const r=hero.getBoundingClientRect();return heroVisible&&!document.hidden&&r.bottom>0&&r.top<innerHeight}'
          assert old in s, 'effectsLive anchor missing'
          s=s.replace(old,new,1)

          old="tower.style.setProperty('--pulse-length',len.toFixed(1)+'px');tower.style.setProperty('--pulse-angle',ang.toFixed(2)+'deg');tower.style.setProperty('--pulse-travel-1',Math.max(0,len-74).toFixed(1)+'px');tower.style.setProperty('--pulse-travel-2',Math.max(0,len-52).toFixed(1)+'px');tower.classList.remove('firing');void tower.offsetWidth;tower.dataset.pulseCount=String((Number(tower.dataset.pulseCount)||0)+1);tower.classList.add('firing');setTimeout(()=>tower.classList.remove('firing'),720)"
          new="tower.style.setProperty('--pulse-length',len.toFixed(1)+'px');tower.style.setProperty('--pulse-angle',ang.toFixed(2)+'deg');const bolts=[...tower.querySelectorAll('.tower-pulse-track i')],travels=[Math.max(0,len-96),Math.max(0,len-64)],durations=[620,520],delays=[0,135];tower.classList.remove('firing');void tower.offsetWidth;tower.dataset.pulseCount=String((Number(tower.dataset.pulseCount)||0)+1);tower.classList.add('firing');bolts.forEach((bolt,n)=>{bolt.getAnimations().forEach(a=>a.cancel());bolt.animate([{opacity:0,transform:'translateY(-50%) translateX(0) scaleX(.18)'},{opacity:1,transform:'translateY(-50%) translateX(10px) scaleX(1)',offset:.14},{opacity:.96,transform:'translateY(-50%) translateX('+Math.max(16,travels[n]*.72).toFixed(1)+'px) scaleX(.94)',offset:.72},{opacity:0,transform:'translateY(-50%) translateX('+travels[n].toFixed(1)+'px) scaleX(.72)'}],{duration:durations[n],delay:delays[n],easing:'cubic-bezier(.15,.75,.2,1)',fill:'none'})});setTimeout(()=>tower.classList.remove('firing'),760)"
          assert old in s, 'fireTowerPulse anchor missing'
          s=s.replace(old,new,1)

          old="towerPulseKick=setTimeout(()=>{fireTowerPulse();towerPulseTimer=setInterval(fireTowerPulse,1850)},420)"
          new="towerPulseKick=setTimeout(()=>{fireTowerPulse();towerPulseTimer=setInterval(fireTowerPulse,1900)},260)"
          assert old in s, 'pulse timing anchor missing'
          s=s.replace(old,new,1)

          old="hero.addEventListener('pointerenter',e=>{if(e.pointerType==='touch')return;pointerInsideHero=true;setTowerTarget(e.clientX,e.clientY);if(active===2)startTowerPulseLoop()});hero.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!effectsLive())return;pointerInsideHero=true;setTowerTarget(e.clientX,e.clientY);const r=hero.getBoundingClientRect();heroHX=clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1);heroHY=clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1);hero.style.setProperty('--hx',heroHX.toFixed(3));hero.style.setProperty('--hy',heroHY.toFixed(3));if(active===1){satTX=clamp(heroHX*1.08,-1,1);satTY=clamp(heroHY*.88,-.88,.88);startSatellite()}});hero.addEventListener('pointerleave',()=>{pointerInsideHero=false;heroHX=0;heroHY=0;hero.style.setProperty('--hx','0');hero.style.setProperty('--hy','0');stopTowerPulseLoop()});"
          new="addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=hero.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;if(!inside){if(pointerInsideHero){pointerInsideHero=false;heroHX=0;heroHY=0;hero.style.setProperty('--hx','0');hero.style.setProperty('--hy','0');stopTowerPulseLoop()}return}const wasInside=pointerInsideHero;pointerInsideHero=true;setTowerTarget(e.clientX,e.clientY);if(!effectsLive())return;heroHX=clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1);heroHY=clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1);hero.style.setProperty('--hx',heroHX.toFixed(3));hero.style.setProperty('--hy',heroHY.toFixed(3));if(active===1){satTX=clamp(heroHX*1.08,-1,1);satTY=clamp(heroHY*.88,-.88,.88);startSatellite()}if(active===2&&!wasInside&&!towerPulseTimer&&!towerPulseKick)startTowerPulseLoop()},{passive:true});"
          assert old in s, 'hero pointer handlers anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});
            const opacity=await page.evaluate(()=>({people:parseFloat(getComputedStyle(document.querySelector('.hero-people')).opacity),island:parseFloat(getComputedStyle(document.querySelector('.hero-island')).opacity),map:parseFloat(getComputedStyle(document.querySelector('.hero-map')).opacity)}));
            if(opacity.people<.14||opacity.island<.23||opacity.map<.13) throw new Error('Atmosphere opacity too low '+JSON.stringify(opacity));
            await page.click('.scene-tab[data-scene="1"]'); await page.waitForTimeout(760); await page.mouse.move(1080,180); await page.waitForTimeout(300); const a=await page.evaluate(()=>({sat:getComputedStyle(document.querySelector('.satellite')).transform,dish:getComputedStyle(document.querySelector('.dish-head-svg')).transform})); await page.mouse.move(760,430); await page.waitForTimeout(300); const b=await page.evaluate(()=>({sat:getComputedStyle(document.querySelector('.satellite')).transform,dish:getComputedStyle(document.querySelector('.dish-head-svg')).transform})); if(a.sat===b.sat||a.dish===b.dish) throw new Error('Satellite/dish regression');
            await page.click('.scene-tab[data-scene="2"]'); await page.waitForTimeout(720); await page.mouse.move(420,245);
            let maxOpacity=0,pulseCount=0,moving=false,lastTransform='';const deadline=Date.now()+3100;while(Date.now()<deadline){const v=await page.evaluate(()=>{const t=document.querySelector('.tower'),b=document.querySelector('.tower-pulse-track.p1 i'),cs=getComputedStyle(b);return {count:Number(t.dataset.pulseCount||0),opacity:parseFloat(cs.opacity),transform:cs.transform,animations:b.getAnimations().length}});pulseCount=Math.max(pulseCount,v.count);maxOpacity=Math.max(maxOpacity,v.opacity||0);if(lastTransform&&v.transform!==lastTransform&&v.animations)moving=true;lastTransform=v.transform;await page.waitForTimeout(24)}if(pulseCount<1||maxOpacity<.7||!moving)throw new Error('Visible heartbeat failed '+JSON.stringify({pulseCount,maxOpacity,moving}));
            await page.evaluate(()=>scrollTo(0,900)); await page.waitForTimeout(250); const before=await page.evaluate(()=>Number(document.querySelector('.tower').dataset.pulseCount||0)); await page.waitForTimeout(2200); const after=await page.evaluate(()=>Number(document.querySelector('.tower').dataset.pulseCount||0)); if(after!==before) throw new Error('Pulse continued offscreen '+before+' '+after);
            if(errors.length) throw new Error(errors.join(' | '));console.log('Opacity',opacity);console.log('Satellite/dish OK');console.log('Laser visible',{pulseCount,maxOpacity,moving});console.log('Offscreen stable',{before,after});await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit safely on latest main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tune-42-opacity-lasers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/tune-42-opacity-lasers.yml
          git commit -m 'Tune Design 42 hero imagery and heartbeat lasers'
          git fetch origin main
          git rebase origin/main
          git push origin main
