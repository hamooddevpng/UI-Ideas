name: One-time Design 42 business command table
on:
  push:
    paths:
      - '.github/workflows/design42-business-command.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply business command patch
        run: |
          python3 .github/scripts/design42_business_command.py
          python3 .github/scripts/design42_business_hoverfix.py
          python3 .github/scripts/design42_business_perspectivefix.py
      - name: Syntax check JavaScript
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('42.html').read_text(); pathlib.Path('/tmp/42.js').write_text('\\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))"
          node --check /tmp/42.js
      - name: Browser verification
        run: |
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          node .github/scripts/verify42_business_command.js
      - name: Commit verified change
        run: |
          rm -f .github/workflows/design42-business-command.yml .github/scripts/design42_business_command.py .github/scripts/design42_business_hoverfix.py .github/scripts/design42_business_perspectivefix.py .github/scripts/verify42_business_command.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-business-command.yml .github/scripts/design42_business_command.py .github/scripts/design42_business_hoverfix.py .github/scripts/design42_business_perspectivefix.py .github/scripts/verify42_business_command.js
          git commit -m 'Turn Design 42 business section into PNG network command table'
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
