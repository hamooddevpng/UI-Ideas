name: One-time Design 42 business command table
on:
  push:
    paths:
      - '.github/workflows/design42-business-command.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PNG business network command table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('42.html')
          s=p.read_text()
          old=re.search(r'<section class="business" id="business">.*?</section>\s*<section class="png-story"',s,re.S)
          if not old:
              raise SystemExit('business section not found')
