name: One-time visible-copy QA 7-34

on:
  push:
    paths:
      - '.github/workflows/final-qa-7-34.yml'

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan visible copy
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re
          class Visible(HTMLParser):
            def __init__(self): super().__init__(); self.skip=0; self.parts=[]
            def handle_starttag(self,tag,attrs):
              if tag in {'script','style','head','template'}: self.skip+=1
            def handle_endtag(self,tag):
              if tag in {'script','style','head','template'} and self.skip: self.skip-=1
            def handle_data(self,data):
              if not self.skip and data.strip(): self.parts.append(data.strip())
          terms=[
            r'prototype',r'placeholder',r'photography required',r'concept\s*\d*',
            r'stakeholder',r'feedback',r'before production',r'approved photography',
            r'approved imagery',r'homepage',r'visual language',r'layout',r'design ',
            r'fake ',r'illustrative prototype',r'example account',r'account preview'
          ]
          out={}
          for n in range(7,35):
            html=Path(f'{n}.html').read_text(encoding='utf-8')
            p=Visible(); p.feed(html); text=' '.join(p.parts)
            hits=[]
            for pat in terms:
              for m in re.finditer(pat,text,re.I):
                s=max(0,m.start()-100); e=min(len(text),m.end()+150)
                hits.append({'term':pat,'snippet':re.sub(r'\s+',' ',text[s:e]).strip()})
            # dedupe snippets
            seen=set(); clean=[]
            for h in hits:
              key=h['snippet']
              if key not in seen: seen.add(key); clean.append(h)
            out[str(n)]=clean
          Path('final-visible-copy-report.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-visible-copy-report.json
          git commit -m "Add visible-copy QA report for designs 7-34" || true
          git pull --rebase origin main
          git push
