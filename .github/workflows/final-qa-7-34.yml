name: One-time final static QA 7-34

on:
  push:
    paths:
      - '.github/workflows/final-qa-7-34.yml'

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all designs
        shell: python
        run: |
          from pathlib import Path
          import json,re
          OFFICIAL='https://www.telikom.com.pg/assets/misc/TPNGLOGO.png'
          patterns={
            'prototype':r'prototype',
            'placeholder':r'placeholder',
            'photography-required':r'photography required',
            'concept-number':r'concept\s+\d+',
            'validate-before-production':r'validate before production',
            'approved-imagery':r'approved (?:png )?(?:photo|photography|imagery)',
            'stakeholder':r'stakeholder',
            'feedback':r'requested in the feedback|feedback requested|in the feedback',
            'mockup':r'mockup',
            'example-account':r'example account|example balance|account preview',
            'fake-copy':r'fake (?:data|content|input|metric|precision)'
          }
          report={'designs':{},'summary':{}}
          for n in range(7,35):
            html=Path(f'{n}.html').read_text(encoding='utf-8')
            flags=[]
            h1=len(re.findall(r'<h1\b',html,re.I))
            logos=html.count(OFFICIAL)
            noindex=bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex[^"\']*nofollow',html,re.I))
            for name,pat in patterns.items():
              c=len(re.findall(pat,html,re.I))
              if c: flags.append({'name':name,'count':c})
            if h1!=1: flags.append({'name':'h1-count','value':h1})
            if logos<1: flags.append({'name':'official-logo-missing'})
            if not noindex: flags.append({'name':'noindex-missing'})
            if re.search(r'unsplash\.com',html,re.I): flags.append({'name':'unsplash-present'})
            real_green=sorted(set(x.lower() for x in re.findall(r'#(?:43a047|52b848|4caf50|00a651|21a366)',html,re.I)))
            if real_green: flags.append({'name':'green-colors','value':real_green})
            price_hits=re.findall(r'\bK\s?\d+(?:\.\d+)?\b|\b\d+(?:\.\d+)?\s?GB\b',html,re.I)
            if price_hits: flags.append({'name':'numeric-commercial-data','value':price_hits[:20]})
            report['designs'][str(n)]={'h1':h1,'officialLogoOccurrences':logos,'noindex':noindex,'flags':flags}
          report['summary']['flagged']=[int(k) for k,v in report['designs'].items() if v['flags']]
          Path('final-qa-report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-qa-report.json
          git commit -m "Add final static QA report for designs 7-34" || true
          git pull --rebase origin main
          git push
