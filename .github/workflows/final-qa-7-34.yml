name: One-time final QA 7-34

on:
  push:
    paths:
      - '.github/workflows/final-qa-7-34.yml'

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Static scan
        shell: python
        run: |
          from pathlib import Path
          import json,re
          OFFICIAL='https://www.telikom.com.pg/assets/misc/TPNGLOGO.png'
          patterns={
            'prototype':r'prototype',
            'placeholder':r'placeholder',
            'photography-required':r'photography required',
            'concept-number':r'concept\s+\d+',
            'validate-before-production':r'validate before production',
            'approved-imagery':r'approved (?:png )?(?:photo|photography|imagery)',
            'mockup':r'mockup',
            'lorem':r'lorem ipsum',
            'fake-copy':r'fake (?:data|content|input|metric|precision)'
          }
          report={'designs':{},'summary':{}}
          for n in range(7,35):
            p=Path(f'{n}.html'); html=p.read_text(encoding='utf-8')
            flags=[]
            h1=len(re.findall(r'<h1\b',html,re.I))
            logos=html.count(OFFICIAL)
            noindex=bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex[^"\']*nofollow',html,re.I))
            for name,pat in patterns.items():
              c=len(re.findall(pat,html,re.I))
              if c: flags.append({'name':name,'count':c})
            if h1!=1: flags.append({'name':'h1-count','value':h1})
            if logos<1: flags.append({'name':'official-logo-missing'})
            if not noindex: flags.append({'name':'noindex-missing'})
            if re.search(r'unsplash\.com',html,re.I): flags.append({'name':'unsplash-present'})
            greens=sorted(set(x.lower() for x in re.findall(r'#(?:43a047|52b848|4caf50|00a651|21a366)|\blime\b|--green\b',html,re.I)))
            if greens: flags.append({'name':'green-tokens','value':greens})
            report['designs'][str(n)]={'static':{'h1':h1,'officialLogoOccurrences':logos,'noindex':noindex},'flags':flags}
          report['summary']['staticFlagged']=[int(k) for k,v in report['designs'].items() if v['flags']]
          Path('final-qa-report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
      - name: Browser load check
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/ui-ideas-server.log 2>&1 &
          sleep 2
          : > /tmp/browser.tsv
          for n in $(seq 7 34); do
            desktop=ok
            mobile=ok
            npx playwright screenshot --browser=chromium --viewport-size="1440,1000" --wait-for-timeout=900 --full-page "http://127.0.0.1:4173/${n}.html" "/tmp/${n}-desktop.png" >/tmp/pw-desktop.log 2>&1 || desktop=fail
            npx playwright screenshot --browser=chromium --device="iPhone 13" --wait-for-timeout=900 --full-page "http://127.0.0.1:4173/${n}.html" "/tmp/${n}-mobile.png" >/tmp/pw-mobile.log 2>&1 || mobile=fail
            printf '%s\t%s\t%s\n' "$n" "$desktop" "$mobile" >> /tmp/browser.tsv
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('final-qa-report.json'); report=json.loads(p.read_text())
          browser_fail=[]
          for line in Path('/tmp/browser.tsv').read_text().splitlines():
            n,d,m=line.split('\t')
            report['designs'][n]['browser']={'desktop':d,'mobile':m}
            if d!='ok' or m!='ok': browser_fail.append(int(n))
          report['summary']['browserFailed']=browser_fail
          p.write_text(json.dumps(report,indent=2))
          PY
      - name: Commit QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-qa-report.json
          git commit -m "Add final QA report for designs 7-34"
          git push
