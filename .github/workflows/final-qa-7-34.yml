name: One-time final browser QA 7-34

on:
  push:
    paths:
      - '.github/workflows/final-qa-7-34.yml'

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser and interaction smoke test
        run: |
          python3 -m http.server 4173 >/tmp/ui-ideas-server.log 2>&1 &
          cat > qa-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[];
            const warnings=[];
            const forbidden=[
              'prototype assistant','requested in the feedback','photography required',
              'concept only','homepage concept 12','telikom command / concept 20',
              'guided connection / concept 24','no fake live metrics','example account preview'
            ];
            for(let n=7;n<=34;n++){
              for(const [mode,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
                const ctx=await browser.newContext({viewport});
                const page=await ctx.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message||String(e)));
                try{
                  await page.goto(`http://127.0.0.1:4173/${n}.html`,{waitUntil:'domcontentloaded',timeout:20000});
                  await page.waitForTimeout(1200);
                  const r=await page.evaluate(({forbidden})=>{
                    const text=document.body.innerText.toLowerCase();
                    const broken=[...document.images].filter(i=>{
                      const s=getComputedStyle(i),b=i.getBoundingClientRect();
                      return b.width>2&&b.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&i.complete&&i.naturalWidth===0;
                    }).map(i=>i.currentSrc||i.src||i.alt);
                    return {
                      h1:document.querySelectorAll('h1').length,
                      logos:[...document.images].filter(i=>(i.currentSrc||i.src).includes('/assets/misc/TPNGLOGO.png')).length,
                      forbidden:forbidden.filter(x=>text.includes(x)),
                      broken,
                      overflow:document.documentElement.scrollWidth>window.innerWidth+5
                    };
                  },{forbidden});
                  if(r.h1!==1) failures.push(`${n} ${mode}: H1 count ${r.h1}`);
                  if(r.logos<1) failures.push(`${n} ${mode}: official logo not rendered`);
                  if(r.forbidden.length) failures.push(`${n} ${mode}: visible internal wording: ${r.forbidden.join(', ')}`);
                  if(errors.length) failures.push(`${n} ${mode}: JS errors: ${errors.join(' | ')}`);
                  if(r.broken.length) warnings.push(`${n} ${mode}: broken visible images: ${r.broken.join(' | ')}`);
                  if(r.overflow) warnings.push(`${n} ${mode}: document horizontal overflow`);
                }catch(e){failures.push(`${n} ${mode}: load failed: ${e.message}`)}
                await ctx.close();
              }
            }
            // Targeted Design 13 interaction check.
            const ctx=await browser.newContext({viewport:{width:1280,height:800}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/13.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(300);
            const before=await page.locator('.story.active').getAttribute('data-title');
            await page.locator('.story.active [data-next]').first().click();
            await page.waitForTimeout(150);
            const after=await page.locator('.story.active').getAttribute('data-title');
            if(!after||after===before) failures.push('13 interaction: next story did not advance');
            await page.locator('#browseTop').click();
            await page.waitForTimeout(150);
            if(!(await page.locator('#browse').evaluate(el=>el.classList.contains('open')))) failures.push('13 interaction: browse overlay did not open');
            await ctx.close();
            await browser.close();
            console.log('WARNINGS'); warnings.forEach(x=>console.log(' - '+x));
            console.log('FAILURES'); failures.forEach(x=>console.log(' - '+x));
            if(failures.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa-smoke.cjs
