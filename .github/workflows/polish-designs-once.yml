name: Polish design content once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-designs-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Polish top-level design pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          images = [
              'https://images.unsplash.com/photo-1590364623978-7268baee5715?auto=format&fit=crop&w=1800&q=82',
              'https://images.unsplash.com/photo-1653260194391-3a250b35e703?auto=format&fit=crop&w=1800&q=82',
              'https://images.unsplash.com/photo-1728957526752-b195c3584c37?auto=format&fit=crop&w=1800&q=82',
              'https://images.unsplash.com/photo-1728957467648-ad5e95eafa1e?auto=format&fit=crop&w=1800&q=82',
          ]

          explainer = re.compile(
              r'(?:placeholder|illustrative[^<]{0,100}not coverage data|this (?:section|concept|design|treatment)|'
              r'(?:design|creative) direction|mock[- ]?up|prototype|for (?:demo|demonstration) purposes?|'
              r'experimental (?:homepage )?concept|the idea (?:here )?is|shown here to|used here to|'
              r'designed here to|concept note|design note)',
              re.I,
          )

          leaf_tag = re.compile(
              r'<(p|small|span|aside|label|figcaption)(\s[^>]*)?>\s*([^<>]{1,280})\s*</\1>',
              re.I | re.S,
          )

          changed = []
          for p in sorted(Path('.').glob('*.html'), key=lambda x: int(x.stem) if x.stem.isdigit() else 999999):
              if not p.stem.isdigit():
                  continue
              original = p.read_text(encoding='utf-8')
              s = original
              n = int(p.stem)
              had_placeholder = bool(re.search(r'placeholder', s, re.I))
              had_map_note = bool(re.search(r'illustrative[^\n<]{0,120}not coverage data', s, re.I))

              # Browser metadata should read like a finished page, not a design-generation note.
              s = re.sub(
                  r'<title>\s*Telikom PNG\s*[—-]\s*Concept\s*\d+\s*/\s*[^<]+</title>',
                  f'<title>Telikom PNG — Homepage Design {n}</title>',
                  s,
                  flags=re.I,
              )
              s = re.sub(
                  r'(<meta\s+name=["\']description["\']\s+content=["\'])[^"\']*(?:experimental|concept|mock[- ]?up|prototype)[^"\']*(["\'])',
                  r'\1Telikom PNG homepage design.\2',
                  s,
                  flags=re.I,
              )

              # Remove small visible notes that talk about the design itself.
              def clean_leaf(m):
                  text = re.sub(r'\s+', ' ', m.group(3)).strip()
                  return '' if explainer.search(text) else m.group(0)
              s = leaf_tag.sub(clean_leaf, s)

              # Remove CSS pseudo-element labels such as PNG IMAGE PLACEHOLDER / map disclaimers.
              s = re.sub(
                  r'content\s*:\s*(["\'])[^"\']*PLACEHOLDER[^"\']*\1\s*;?',
                  'content:"";',
                  s,
                  flags=re.I,
              )
              s = re.sub(
                  r'content\s*:\s*(["\'])[^"\']*ILLUSTRATIVE[^"\']*NOT COVERAGE DATA[^"\']*\1\s*;?',
                  'content:"";',
                  s,
                  flags=re.I,
              )
              s = re.sub(
                  r'content\s*:\s*(["\'])[^"\']*(?:DESIGN NOTE|CONCEPT NOTE)[^"\']*\1\s*;?',
                  'content:"";',
                  s,
                  flags=re.I,
              )

              # Replace explicit image-placeholder surfaces with real PNG/Port Moresby photography.
              if had_placeholder and 'id="telikom-image-polish"' not in s:
                  a = images[n % len(images)]
                  b = images[(n + 2) % len(images)]
                  polish = f'''\n<style id="telikom-image-polish">
                  .portrait.one{{background-image:url("{a}")!important;background-size:cover!important;background-position:center!important}}
                  .portrait.two{{background-image:url("{b}")!important;background-size:cover!important;background-position:center!important}}
                  .portrait:before{{content:""!important;display:none!important}}
                  [class*="image-placeholder"],[class*="photo-placeholder"],[class*="placeholder-image"],[class~="placeholder"]{{background-image:url("{a}")!important;background-size:cover!important;background-position:center!important;color:transparent!important}}
                  [class*="image-placeholder"]:before,[class*="photo-placeholder"]:before,[class*="placeholder-image"]:before,[class~="placeholder"]:before{{content:""!important;display:none!important}}
                  </style>\n'''
                  s = s.replace('</head>', polish + '</head>', 1)

              if had_map_note and 'id="telikom-note-polish"' not in s:
                  s = s.replace(
                      '</head>',
                      '<style id="telikom-note-polish">.map-wrap:before{content:""!important;display:none!important}</style>\n</head>',
                      1,
                  )

              if s != original:
                  if 'Image sources: Unsplash photographs from Papua New Guinea / Port Moresby.' not in s:
                      s += '\n<!-- Image sources: Unsplash photographs from Papua New Guinea / Port Moresby. -->\n'
                  p.write_text(s, encoding='utf-8')
                  changed.append(p.name)

          print('updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit polished designs and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/polish-designs-once.yml
          git add -- '*.html' .github/workflows/polish-designs-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix placeholder imagery and remove design-note copy"
          git push origin main
