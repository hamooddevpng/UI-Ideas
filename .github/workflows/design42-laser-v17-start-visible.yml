name: Start Design 42 lasers immediately
on:
  push:
    branches:
      - fix/design42-laser-track-v17
    paths:
      - .github/workflows/design42-laser-v17-start-visible.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-laser-track-v17
          fetch-depth: 0
      - name: Keep laser loop active before observer callback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('42-base.html')
          s=p.read_text()
          old="""    let visible=true;\n    if('IntersectionObserver' in window){\n      visible=false;\n      new IntersectionObserver(([entry])=>{visible=entry.isIntersecting},{threshold:.03}).observe(section);\n    }\n"""
          new="""    let visible=true;\n    if('IntersectionObserver' in window){\n      new IntersectionObserver(([entry])=>{visible=entry.isIntersecting},{threshold:.03}).observe(section);\n    }\n"""
          if old not in s: raise SystemExit('laser visibility block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify
        run: |
          grep -q 'let visible=true' 42-base.html
          ! grep -A2 "if('IntersectionObserver' in window)" 42-base.html | grep -q 'visible=false'
      - name: Cleanup workflow
        run: rm .github/workflows/design42-laser-v17-start-visible.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42-base.html .github/workflows/design42-laser-v17-start-visible.yml
          git commit -m 'fix: start Design 42 laser firing immediately'
          git push origin HEAD:fix/design42-laser-track-v17
