name: Fix Design 40 government photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-design40-government-photo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace non-photo scrape with Telikom partnership photo
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('40.html')
          s=p.read_text(encoding='utf-8')
          old='assets/common/web-sourced/telikom/news-07.jpg'
          new='assets/common/web-sourced/telikom/news-02.jpg'
          if old not in s:
              raise SystemExit('Expected government image reference not found')
          if new in s:
              raise SystemExit('Replacement image already used elsewhere in Design 40')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'news-02.jpg' 40.html
          ! grep -q 'news-07.jpg' 40.html
      - name: Commit and clean one-time workflow
        run: |
          rm -f .github/workflows/fix-design40-government-photo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 40.html .github/workflows/fix-design40-government-photo.yml
          git commit -m "Use proper Telikom photo for Design 40 government section"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
