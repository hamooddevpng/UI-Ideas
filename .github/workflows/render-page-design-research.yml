name: Render Page Design Research Boards

on:
  push:
    paths:
      - 'research/page-design/page-research.json'
      - 'scripts/render_page_design_research.py'
      - 'reference-screenshots/page-design/**'
      - '.github/workflows/render-page-design-research.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page-design-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render research boards
        run: python scripts/render_page_design_research.py
      - name: Commit generated research boards
        run: |
          git add research/page-design/generated
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: render page design competitor boards"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
