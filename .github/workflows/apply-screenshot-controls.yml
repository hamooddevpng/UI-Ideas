name: Apply screenshot controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-screenshot-controls.yml'
      - 'tools/apply_capture_controls.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/apply_capture_controls.py
      - name: Commit updated review page
        run: |
          if git diff --quiet -- all.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all.html
          git commit -m "Add full-page screenshot controls"
          git push
