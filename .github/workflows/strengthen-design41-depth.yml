name: Strengthen Design 41 depth field

on:
  push:
    branches: [main]
    paths:
      - 'scripts/strengthen_design41_depth.py'
      - '.github/workflows/strengthen-design41-depth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        run: python3 scripts/strengthen_design41_depth.py
      - name: Commit safely
        run: |
          set -euo pipefail
          rm -f scripts/strengthen_design41_depth.py .github/workflows/strengthen-design41-depth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 41.html scripts/strengthen_design41_depth.py .github/workflows/strengthen-design41-depth.yml
          git commit -m 'Strengthen Design 41 ambient depth motion'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
