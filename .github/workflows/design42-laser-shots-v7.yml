name: Apply Design 42 laser shots v7

on:
  push:
    branches:
      - feature/design42-laser-shots-v7
    paths:
      - .github/workflows/design42-laser-shots-v7.yml

permissions:
  contents: write

jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/design42-laser-shots-v7
          fetch-depth: 0
      - name: Patch Design 42
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('42.html'); h=p.read_text(encoding='utf-8'); b=base64.b64decode('').decode('utf-8'); p.write_text(h if 'Design 42: animated laser shots v7' in h else h.replace('</body>', b+'\n</body>'), encoding='utf-8')"
          rm -f .github/workflows/design42-laser-shots-v7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: animate province laser shots in Design 42"
          git push origin HEAD:feature/design42-laser-shots-v7
