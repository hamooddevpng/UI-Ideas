name: One-time Design 42 phone hover bounds fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-42-phone-hover-bounds.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix phone size and hover bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('42.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              '.hero.phone-peek .phone-launch{z-index:220;transform:translate3d(-16px,-7px,135px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.14);filter:drop-shadow(0 32px 52px rgba(0,0,0,.46)) drop-shadow(0 0 28px rgba(69,195,255,.48))}',
              '.hero.phone-peek .phone-launch{z-index:220;transform:translate3d(-10px,-4px,105px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.07);filter:drop-shadow(0 28px 46px rgba(0,0,0,.42)) drop-shadow(0 0 24px rgba(69,195,255,.44))}'
            ),
            (
              '.phone-launch{width:165px;height:325px;right:7%;top:2%}',
              '.phone-launch{width:145px;height:285px;right:8%;top:5%}.hero.phone-peek .phone-launch{transform:translate3d(-4px,-2px,70px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.04)}'
            ),
            (
              "scenes.forEach((s,n)=>s.classList.toggle('active',n===i));arts.forEach((a,n)=>a.classList.toggle('active-art',n===i));",
              "if(i!==0)hero.classList.remove('phone-peek');scenes.forEach((s,n)=>s.classList.toggle('active',n===i));arts.forEach((a,n)=>a.classList.toggle('active-art',n===i));"
            ),
            (
              "hero.addEventListener('mouseleave',()=>{hover=false;startAuto()});",
              "hero.addEventListener('mouseleave',()=>{hover=false;hero.classList.remove('phone-peek');startAuto()});"
            ),
            (
              "phoneLaunch.addEventListener('pointerenter',()=>hero.classList.add('phone-peek'));phoneLaunch.addEventListener('pointerleave',()=>hero.classList.remove('phone-peek'));phoneLaunch.addEventListener('focusin',()=>hero.classList.add('phone-peek'));phoneLaunch.addEventListener('focusout',()=>hero.classList.remove('phone-peek'));",
              "phoneLaunch.addEventListener('pointerenter',()=>{if(active===0&&!phoneOpen)hero.classList.add('phone-peek')});phoneLaunch.addEventListener('pointerleave',()=>hero.classList.remove('phone-peek'));phoneLaunch.addEventListener('focusin',()=>{if(active===0&&!phoneOpen)hero.classList.add('phone-peek')});phoneLaunch.addEventListener('focusout',()=>hero.classList.remove('phone-peek'));addEventListener('pointermove',e=>{if(!hero.classList.contains('phone-peek')||phoneOpen)return;const r=hero.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)hero.classList.remove('phone-peek')},{passive:true});addEventListener('scroll',()=>hero.classList.remove('phone-peek'),{passive:true});"
            )
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected fragment not found: ' + old[:140])
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check Design 42 JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('42.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          if not blocks:
              raise SystemExit('No script block found')
          Path('/tmp/design42.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/design42.js

      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-42-phone-hover-bounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/fix-42-phone-hover-bounds.yml
          git commit -m "Fix Design 42 phone hover size and reset bounds"
          git push
