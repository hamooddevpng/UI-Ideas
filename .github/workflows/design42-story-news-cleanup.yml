name: One-time Design 42 story and news cleanup
on:
  push:
    paths:
      - '.github/workflows/design42-story-news-cleanup.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Milne Bay aerial
        run: |
          mkdir -p assets/design42
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' 'https://cdn.tripspoint.com/uploads/photos/6967/tawali-resort-stay-7-pay-5-diving-package_QnCtx.jpeg' -o assets/design42/milne-bay-aerial.jpg
          test -s assets/design42/milne-bay-aerial.jpg
          file assets/design42/milne-bay-aerial.jpg
      - name: Apply cleanup
        run: python3 .github/scripts/design42_story_news_cleanup.py
      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        run: |
          npm install --prefix /tmp/design42-pw --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          NODE_PATH=/tmp/design42-pw/node_modules node .github/scripts/verify42_story_news_cleanup.js
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/design42-story-news-cleanup.yml \
                .github/scripts/design42_story_news_cleanup.py \
                .github/scripts/verify42_story_news_cleanup.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html assets/design42/milne-bay-aerial.jpg assets/design42/ATTRIBUTION.md \
                  .github/workflows/design42-story-news-cleanup.yml \
                  .github/scripts/design42_story_news_cleanup.py \
                  .github/scripts/verify42_story_news_cleanup.js
          git commit -m 'Refresh Design 42 PNG story and simplify live news'
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
