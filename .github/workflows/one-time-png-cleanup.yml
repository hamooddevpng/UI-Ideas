name: One-time PNG imagery cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-png-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace generic imagery and add cleanup hook
        shell: python
        run: |
          import re
          from pathlib import Path

          images = [
              'https://www.fao.org/images/faoraplibraries/default-album/farmers-and-agripreneurs-actively-participate-in-a-hands-on-training-session-provided-by-the-eu-streit-png-programme.jpg?sfvrsn=4cc42070_1',
              'https://www.pnglng.com/media/PNG-LNG-Media/Media%20Release%20Images/Flying-labs_PNG-LNG-Article.png?ext=.png',
              'https://pngbusinessnews.b-cdn.net/uploads/article/image/3959/large_625349331_1329153339253229_7698291451399085164_n.jpg',
              'https://blog.apnic.net/wp-content/uploads/2016/04/Goroka-EHP.jpg',
              'https://www.telikom.com.pg/assets/misc/pabx-connect.jpg',
              'https://www.telikom.com.pg/assets/business/voice-and-data.jpg',
              'https://www.telikom.com.pg/assets/products/RED-X_Quest_Plus.png',
          ]
          alts = [
              'Papua New Guinean community',
              'Papua New Guinean students',
              'Papua New Guinean professionals',
              'Papua New Guinea landscape',
              'Telecommunications infrastructure',
              'Telikom business communications',
              'Telikom connected device',
          ]

          targets = [Path('8.html')] + [Path(f'{n}.html') for n in range(11, 31)]
          bad_url = re.compile(r'https://(?:images|source)\.unsplash\.com/[^\s\"\'<>)]*|https://images\.pexels\.com/[^\s\"\'<>)]*|https://picsum\.photos/[^\s\"\'<>)]*', re.I)

          for file_index, path in enumerate(targets):
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              counter = [file_index]

              def replace_url(match):
                  value = images[counter[0] % len(images)]
                  counter[0] += 1
                  return value

              text = bad_url.sub(replace_url, text)

              # Remove stock/prototype wording from common image alt/caption strings.
              text = re.sub(r'Prototype placeholder for approved Papua New Guinea[^\"<]*', 'Papua New Guinea', text, flags=re.I)
              text = re.sub(r'Prototype placeholder for approved[^\"<]*', 'Papua New Guinea', text, flags=re.I)
              text = re.sub(r'Prototype image only[^<\n]*', 'Papua New Guinea', text, flags=re.I)
              text = re.sub(r'Replace with approved Papua New Guinea photography[^<\n]*', 'Papua New Guinea', text, flags=re.I)

              # Design 8 predates the shared brand/content layer; wire it in now.
              if path.name == '8.html' and 'assets/telikom-brand.js' not in text:
                  text = text.replace('</head>', '<script src="assets/telikom-brand.js" defer></script>\n</head>', 1)

              path.write_text(text, encoding='utf-8')

      - name: Commit cleaned concepts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 8.html 11.html 12.html 13.html 14.html 15.html 16.html 17.html 18.html 19.html 20.html 21.html 22.html 23.html 24.html 25.html 26.html 27.html 28.html 29.html 30.html
          if git diff --cached --quiet; then
            echo "No cleanup changes needed"
          else
            git commit -m "Use PNG imagery and client-facing content across concepts"
            git push
          fi
