name: One-time Design 42 Starlink CONNECT patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_design42-connect.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Starlink CONNECT experience
        run: python scripts/_design42_connect_patch.py
      - name: Verify patch
        run: |
          git diff --check
          grep -F 'id="digitalPngLab"' 42.html
          grep -F 'data-starlink-use="remote"' 42.html
          grep -F 'digitalPngConnectScript' 42.html
      - name: Commit patch and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_design42-connect.yml scripts/_design42_connect_patch.py
          git add 42.html
          git commit -m 'Build Design 42 Starlink CONNECT experience [skip ci]'
          git push origin main
