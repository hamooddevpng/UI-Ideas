name: Mirror Design 40 hero assets

on:
  push:
    paths:
      - '.github/workflows/mirror-design40-hero-assets.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Telikom hero assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/design40/hero

          download() {
            local url="$1"
            local out="$2"
            echo "Downloading $url"
            curl -fL --retry 6 --retry-delay 4 --retry-all-errors --connect-timeout 25 --max-time 180 "$url" -o "$out"
          }

          download 'https://www.telikom.com.pg/assets/homebanner/NewYear_NewDeals_Together_2026.jpg' 'assets/design40/hero/telikom-new-year-2026.jpg'
          download 'https://www.telikom.com.pg/assets/homebanner/Wantok_e-SIM.jpg' 'assets/design40/hero/telikom-wantok-esim.jpg'
          download 'https://www.telikom.com.pg/assets/homebanner/Device_Bundled_Deals_v2.jpg' 'assets/design40/hero/telikom-device-bundles.jpg'
          download 'https://www.telikom.com.pg/assets/homebanner/Mifi.jpg' 'assets/design40/hero/telikom-mifi.jpg'
          download 'https://www.telikom.com.pg/assets/homebanner/International_Prepaid_Plans.jpg' 'assets/design40/hero/telikom-international-prepaid.jpg'
          download 'https://www.telikom.com.pg/assets/homebanner/Double_Data_1.jpg' 'assets/design40/hero/telikom-double-data.jpg'

      - name: Validate downloaded files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for f in assets/design40/hero/*.{jpg,jpeg,png}; do
            [ -e "$f" ] || continue
            test -s "$f"
            mime="$(file --brief --mime-type "$f")"
            case "$mime" in
              image/jpeg|image/png) ;;
              *) echo "Unexpected MIME for $f: $mime"; exit 1 ;;
            esac
            size="$(stat -c%s "$f")"
            test "$size" -gt 50000
            echo "$f  $mime  $size bytes"
            count=$((count+1))
          done
          test "$count" -eq 6

      - name: Point Design 40 at GitHub mirrors
        shell: python
        run: |
          from pathlib import Path

          path = Path('40.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "https://www.telikom.com.pg/assets/homebanner/NewYear_NewDeals_Together_2026.jpg":
                  "https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/assets/design40/hero/telikom-new-year-2026.jpg",
              "https://www.telikom.com.pg/assets/homebanner/Wantok_e-SIM.jpg":
                  "https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/assets/design40/hero/telikom-wantok-esim.jpg",
              "https://www.telikom.com.pg/assets/homebanner/Device_Bundled_Deals_v2.jpg":
                  "https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/assets/design40/hero/telikom-device-bundles.jpg",
              "https://telikom-frontend.vercel.app/images/png/banner.png":
                  "https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/assets/design40/hero/telikom-mifi.jpg",
              "https://telikom-frontend.vercel.app/images/png/top-banner-highlands.png":
                  "https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/assets/design40/hero/telikom-international-prepaid.jpg",
              "https://telikom-frontend.vercel.app/images/png/starlink_horizon_concept.png":
                  "https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/assets/design40/hero/telikom-double-data.jpg",
              "Telikom PNG coastal connectivity campaign": "Telikom MiFi campaign",
              "Telikom Highlands connectivity campaign": "Telikom international prepaid plans campaign",
              "Telikom remote connectivity campaign": "Telikom Double Data campaign",
          }

          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit('Expected Design 40 carousel values missing: ' + ', '.join(missing))

          for old, new in replacements.items():
              text = text.replace(old, new)

          external_runtime_hosts = ['www.telikom.com.pg/assets/homebanner/', 'telikom-frontend.vercel.app/images/png/']
          if any(host in text for host in external_runtime_hosts):
              raise SystemExit('External hero runtime dependency remains in 40.html')

          path.write_text(text, encoding='utf-8')

      - name: Save source manifest
        shell: bash
        run: |
          cat > assets/design40/hero/SOURCES.md <<'EOF'
          # Design 40 hero assets

          Local mirrors of official Telikom campaign banners, kept in this repository so Design 40 does not depend on the production Telikom server at runtime.

          - `telikom-new-year-2026.jpg` ← `https://www.telikom.com.pg/assets/homebanner/NewYear_NewDeals_Together_2026.jpg`
          - `telikom-wantok-esim.jpg` ← `https://www.telikom.com.pg/assets/homebanner/Wantok_e-SIM.jpg`
          - `telikom-device-bundles.jpg` ← `https://www.telikom.com.pg/assets/homebanner/Device_Bundled_Deals_v2.jpg`
          - `telikom-mifi.jpg` ← `https://www.telikom.com.pg/assets/homebanner/Mifi.jpg`
          - `telikom-international-prepaid.jpg` ← `https://www.telikom.com.pg/assets/homebanner/International_Prepaid_Plans.jpg`
          - `telikom-double-data.jpg` ← `https://www.telikom.com.pg/assets/homebanner/Double_Data_1.jpg`
          EOF

      - name: Commit mirrored assets and cleanup helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mirror-design40-hero-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 40.html assets/design40/hero .github/workflows/mirror-design40-hero-assets.yml
          git commit -m 'Host Design 40 Telikom banners in repo'
          git pull --rebase origin main
          git push origin HEAD:main
