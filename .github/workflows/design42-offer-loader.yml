name: One-time Design 42 offer loader refinement
on:
  push:
    paths:
      - '.github/workflows/design42-offer-loader.yml'
permissions:
  contents: write
jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace raffle with two-second offer loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('42.html')
          s=p.read_text()

          section='''<section class="offers raffle-offers" id="offers"><div class="shell"><div class="head-row reveal offer-head"><div><div class="kicker">Picked for you</div><h2 class="title">Offers for you.</h2></div><p class="lead">A few Telikom service ideas, shuffled each visit so there is always something useful to explore.</p></div><div class="offer-loading-stage reveal" id="offerLoadingStage"><div class="offer-loader" id="offerLoader" aria-live="polite"><div class="offer-loader-mark"><span></span><span></span><span></span></div><div class="offer-loader-copy"><small>ONE MOMENT</small><strong>We're getting the best offers for you.</strong><p>Checking mobile, home, remote and support options…</p></div><div class="offer-loader-line"><i></i></div></div><div class="offer-card-grid" id="personalOfferGrid"><article class="personal-offer" style="--delay:0ms"><div class="personal-offer-media"><img src="assets/design42/png-people.jpg" alt=""></div><div class="personal-offer-body"><div class="personal-offer-top"><span class="personal-offer-tag">Mobile</span><span class="personal-offer-index">01</span></div><div class="personal-offer-icon">⌁</div><h3>Finding an offer…</h3><p>Looking through Telikom services.</p><a href="#services">Explore ↗</a></div></article><article class="personal-offer" style="--delay:120ms"><div class="personal-offer-media"><img src="assets/design42/png-remote-coast.jpg" alt=""></div><div class="personal-offer-body"><div class="personal-offer-top"><span class="personal-offer-tag">Home</span><span class="personal-offer-index">02</span></div><div class="personal-offer-icon">＋</div><h3>Finding an offer…</h3><p>Looking through Telikom services.</p><a href="#services">Explore ↗</a></div></article><article class="personal-offer" style="--delay:240ms"><div class="personal-offer-media"><img src="assets/design42/png-admin1-simplemaps.svg" alt=""></div><div class="personal-offer-body"><div class="personal-offer-top"><span class="personal-offer-tag">Connect</span><span class="personal-offer-index">03</span></div><div class="personal-offer-icon">◉</div><h3>Finding an offer…</h3><p>Looking through Telikom services.</p><a href="#services">Explore ↗</a></div></article></div><div class="offer-personal-note"><span></span> Suggestions reshuffle on your next visit.</div></div></div></section>'''
          pat=r'<section class="offers raffle-offers" id="offers">.*?</section>\s*<section class="services"'
          m=re.search(pat,s,re.S); assert m,'offers section missing'
          s=s[:m.start()]+section+'\n<section class="services"'+s[m.end():]

          css='''.raffle-offers{position:relative;overflow:hidden;background:#fff}.offer-head{position:relative;z-index:5}.offer-loading-stage{position:relative;min-height:520px;padding-top:190px;transition:padding-top .9s var(--spring)}.offer-loader{position:absolute;z-index:6;left:50%;top:24px;width:min(620px,calc(100% - 30px));transform:translateX(-50%) translateY(10px) scale(.98);opacity:0;visibility:hidden;text-align:center;transition:opacity .45s var(--ease),transform .55s var(--spring),visibility .45s}.offers-loading .offer-loader{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0) scale(1)}.offers-loaded .offer-loader{opacity:0;visibility:hidden;transform:translateX(-50%) translateY(-14px) scale(.98)}.offer-loader-mark{height:48px;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px}.offer-loader-mark span{width:10px;height:10px;border-radius:50%;background:#1598e8;opacity:.24;transform:scale(.72)}.offers-loading .offer-loader-mark span{animation:offerLoadDot 1.05s ease-in-out infinite}.offers-loading .offer-loader-mark span:nth-child(2){animation-delay:.14s}.offers-loading .offer-loader-mark span:nth-child(3){animation-delay:.28s}@keyframes offerLoadDot{0%,100%{opacity:.22;transform:translateY(0) scale(.72)}45%{opacity:1;transform:translateY(-6px) scale(1.15)}}.offer-loader-copy small{display:block;color:var(--blue);font-size:8px;font-weight:800;letter-spacing:.17em;margin-bottom:8px}.offer-loader-copy strong{display:block;font-family:"Space Grotesk";font-size:clamp(24px,3vw,38px);line-height:1;letter-spacing:-.045em;color:var(--ink)}.offer-loader-copy p{margin:10px auto 0;font-size:9px;line-height:1.6;color:var(--muted)}.offer-loader-line{position:relative;width:min(320px,72%);height:2px;margin:20px auto 0;border-radius:999px;background:#e5f1f6;overflow:hidden}.offer-loader-line i{position:absolute;inset:0 auto 0 0;width:38%;border-radius:999px;background:linear-gradient(90deg,transparent,#1ca0e8,#0875c9,transparent);transform:translateX(-120%)}.offers-loading .offer-loader-line i{animation:offerLoadSweep 1.15s ease-in-out infinite}@keyframes offerLoadSweep{to{transform:translateX(360%)}}.offer-card-grid{position:relative;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.personal-offer{min-height:390px;border-radius:28px;border:1px solid rgba(16,43,60,.1);background:#fff;box-shadow:0 18px 45px rgba(17,64,88,.08);overflow:hidden;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(34px) scale(.58);filter:blur(7px);transform-origin:50% 58%;transition:transform 1.05s var(--delay) cubic-bezier(.12,.76,.14,1.08),opacity .55s var(--delay) ease,filter .72s var(--delay) ease,visibility 0s calc(var(--delay) + .02s),box-shadow .3s ease,border-color .3s ease}.offers-loaded .personal-offer{opacity:1;visibility:visible;transform:none;filter:none}.personal-offer:hover{transform:translateY(-7px)!important;border-color:rgba(8,117,201,.25);box-shadow:0 26px 60px rgba(17,64,88,.13)}.personal-offer-media{position:relative;height:165px;overflow:hidden;background:linear-gradient(145deg,#dff2fb,#edf8fc)}.personal-offer-media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(6,25,37,.18));pointer-events:none}.personal-offer-media img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .65s var(--spring),filter .4s ease}.personal-offer:hover .personal-offer-media img{transform:scale(1.045)}.personal-offer[data-media="map"] .personal-offer-media{background:#082636}.personal-offer[data-media="map"] .personal-offer-media img{object-fit:contain;padding:16px;filter:brightness(1.45) saturate(1.15)}.personal-offer[data-media="deal"] .personal-offer-media img{object-position:center}.personal-offer-body{padding:23px 25px 25px;display:flex;flex:1;flex-direction:column}.personal-offer-top{display:flex;align-items:center;justify-content:space-between}.personal-offer-tag,.personal-offer-index{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.personal-offer-tag{color:var(--blue)}.personal-offer-index{color:#91a5af}.personal-offer-icon{width:42px;height:42px;margin:22px 0 18px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:#8edbff;font-size:18px;box-shadow:0 14px 30px rgba(6,25,37,.12)}.personal-offer h3{font-family:"Space Grotesk";font-size:29px;line-height:.97;letter-spacing:-.05em;margin:0 0 11px}.personal-offer p{font-size:10px;line-height:1.65;color:var(--muted);margin:0 0 22px;max-width:320px}.personal-offer a{margin-top:auto;align-self:flex-start;font-size:9px;font-weight:800;color:var(--blue)}.offer-personal-note{position:relative;z-index:5;margin-top:18px;display:flex;align-items:center;gap:8px;color:#7d949f;font-size:8px;font-weight:700;opacity:0;transform:translateY(8px);transition:.55s .85s}.offer-personal-note span{width:6px;height:6px;border-radius:50%;background:#20a957;box-shadow:0 0 0 4px rgba(32,169,87,.1)}.offers-loaded .offer-personal-note{opacity:1;transform:none}.offers-loaded .offer-loading-stage{padding-top:18px}@media(max-width:820px){.offer-loading-stage{min-height:830px;padding-top:170px}.offer-loader{top:0}.offer-card-grid{grid-template-columns:1fr;gap:10px}.personal-offer{min-height:330px;transform:translateY(24px) scale(.72)}.personal-offer-media{height:150px}.personal-offer-icon{margin:18px 0 14px}.offers-loaded .offer-loading-stage{padding-top:10px}}'''
          css_pat=r'\.raffle-offers\{.*?(?=\.services\{background:var\(--ice\)\})'
          m=re.search(css_pat,s,re.S); assert m,'raffle css block missing'
          s=s[:m.start()]+css+s[m.end():]

          js='''const personalizedOfferPool=[{tag:'Mobile',icon:'⌁',title:'More data for today.',body:'Explore Telikom mobile data options and choose the bundle that fits what you are doing.',cta:'See mobile options ↗',href:'#services',image:'assets/banners/research/festive-png-telecom-deals.webp',alt:'Telikom mobile offer artwork',media:'deal'},{tag:'Self Care',icon:'＋',title:'Top up in a few taps.',body:'Open Self Care to recharge, check your balance or manage voice and data bundles.',cta:'Open Self Care ↗',href:'#top',selfcare:true,image:'assets/design42/png-people.jpg',alt:'People in Papua New Guinea',media:'people'},{tag:'Home Internet',icon:'⌂',title:'Bring more home online.',body:'Explore fixed broadband and home internet options for everyday browsing and streaming.',cta:'Explore home internet ↗',href:'#services',image:'assets/design42/png-people.jpg',alt:'People in Papua New Guinea',media:'people'},{tag:'Remote',icon:'◌',title:'Connect beyond the network edge.',body:'Explore VSAT and remote connectivity options for business and communities across PNG.',cta:'Explore remote connectivity ↗',href:'#business',image:'assets/design42/png-remote-coast.jpg',alt:'Remote coastline in Papua New Guinea',media:'coast'},{tag:'Business',icon:'↗',title:'Keep business connected.',body:'Explore Telikom connectivity, fixed voice, hosting and business data services.',cta:'Explore business services ↗',href:'#business',image:'assets/design42/png-admin1-simplemaps.svg',alt:'Map of Papua New Guinea',media:'map'},{tag:'Support',icon:'?',title:'Need a hand?',body:'Customer Care is available on 1555 when you need help with your Telikom service.',cta:'Get support ↗',href:'#support',image:'assets/design42/png-people.jpg',alt:'People in Papua New Guinea',media:'people'}];const offersSection=document.getElementById('offers'),personalOfferCards=[...document.querySelectorAll('.personal-offer')];function shuffleOffers(){const pool=[...personalizedOfferPool];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}pool.slice(0,3).forEach((o,i)=>{const card=personalOfferCards[i];card.dataset.media=o.media||'';const img=card.querySelector('.personal-offer-media img');img.src=o.image;img.alt=o.alt||'';card.querySelector('.personal-offer-tag').textContent=o.tag;card.querySelector('.personal-offer-icon').textContent=o.icon;card.querySelector('h3').textContent=o.title;card.querySelector('p').textContent=o.body;const a=card.querySelector('a');a.textContent=o.cta;a.href=o.href;if(o.selfcare){a.onclick=e=>{e.preventDefault();openPhone('home')}}else a.onclick=null})}shuffleOffers();if(offersSection){let offerLoadDone=false,offerInView=false;const runOfferLoad=()=>{if(offerLoadDone)return;offerLoadDone=true;offersSection.classList.add('offers-loading');setTimeout(()=>{offersSection.classList.remove('offers-loading');offersSection.classList.add('offers-loaded')},2000)};const maybeRunOfferLoad=()=>{if(offerLoadDone||!offerInView||scrollY<=1)return;runOfferLoad();offerObserver.disconnect();removeEventListener('scroll',maybeRunOfferLoad)};const offerObserver=new IntersectionObserver(([entry])=>{offerInView=entry.isIntersecting;if(offerInView)maybeRunOfferLoad()},{threshold:.22,rootMargin:'0px 0px -7% 0px'});offerObserver.observe(offersSection);addEventListener('scroll',maybeRunOfferLoad,{passive:true})};'''
          js_pat=r'const personalizedOfferPool=.*?(?=const offerData=)'
          m=re.search(js_pat,s,re.S); assert m,'offer js block missing'
          s=s[:m.start()]+js+s[m.end():]
          p.write_text(s)
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('42.html').read_text()
          pathlib.Path('/tmp/42.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/42.js
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const gate=await browser.newPage({viewport:{width:1440,height:2500}});
            await gate.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});await gate.waitForTimeout(600);
            const zero=await gate.evaluate(()=>({y:scrollY,loading:offers.classList.contains('offers-loading'),loaded:offers.classList.contains('offers-loaded'),machine:!!document.querySelector('.raffle-machine')}));
            if(zero.y!==0||zero.loading||zero.loaded||zero.machine)throw Error('zero-scroll or machine regression '+JSON.stringify(zero));await gate.close();
            const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});await page.evaluate(()=>offers.scrollIntoView({block:'center'}));await page.waitForTimeout(500);
            const loading=await page.evaluate(()=>({loading:offers.classList.contains('offers-loading'),loaded:offers.classList.contains('offers-loaded'),opacity:parseFloat(getComputedStyle(offerLoader).opacity),card:parseFloat(getComputedStyle(document.querySelector('.personal-offer')).opacity)}));if(!loading.loading||loading.loaded||loading.opacity<.8||loading.card>.05)throw Error('loader phase failed '+JSON.stringify(loading));
            await page.waitForTimeout(1100);const still=await page.evaluate(()=>({loading:offers.classList.contains('offers-loading'),loaded:offers.classList.contains('offers-loaded')}));if(!still.loading||still.loaded)throw Error('loader did not last about two seconds '+JSON.stringify(still));
            await page.waitForTimeout(1000);const loaded=await page.evaluate(()=>({loaded:offers.classList.contains('offers-loaded'),loader:parseFloat(getComputedStyle(offerLoader).opacity),cards:[...document.querySelectorAll('.personal-offer')].map(c=>({o:parseFloat(getComputedStyle(c).opacity),img:c.querySelector('img').getAttribute('src'),w:c.querySelector('img').naturalWidth,title:c.querySelector('h3').textContent.trim()}))}));if(!loaded.loaded||loaded.loader>.15||loaded.cards.some(c=>c.o<.7||c.w<1||!c.img||!c.title||c.title.includes('Finding')))throw Error('offer reveal failed '+JSON.stringify(loaded));
            await page.waitForTimeout(1200);const settled=await page.evaluate(()=>[...document.querySelectorAll('.personal-offer')].every(c=>parseFloat(getComputedStyle(c).opacity)>.98&&getComputedStyle(c).transform==='none'));if(!settled)throw Error('cards did not settle');
            await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(250);await page.click('.scene-tab[data-scene="1"]');await page.waitForTimeout(760);await page.mouse.move(1080,180);await page.waitForTimeout(300);const a=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));await page.mouse.move(760,430);await page.waitForTimeout(300);const b=await page.evaluate(()=>({s:getComputedStyle(document.querySelector('.satellite')).transform,d:getComputedStyle(document.querySelector('.dish-head-svg')).transform}));if(a.s===b.s||a.d===b.d)throw Error('satellite/dish regression');
            await page.click('.scene-tab[data-scene="2"]');await page.waitForTimeout(720);await page.mouse.move(430,250);let pulse=0,max=0,end=Date.now()+2300;while(Date.now()<end){const v=await page.evaluate(()=>({c:Number(document.querySelector('.tower').dataset.pulseCount||0),o:parseFloat(getComputedStyle(document.querySelector('.tower-pulse-track.p1 i')).opacity)}));pulse=Math.max(pulse,v.c);max=Math.max(max,v.o||0);await page.waitForTimeout(30)}if(pulse<1||max<.7)throw Error('laser regression '+JSON.stringify({pulse,max}));if(errors.length)throw Error(errors.join(' | '));console.log('Offer loader + featured images OK',loaded);console.log('Hero interactions OK',{pulse,max});await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit safely on latest main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/design42-offer-loader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-offer-loader.yml
          git commit -m 'Replace Design 42 raffle with offer loading reveal'
          git fetch origin main
          git rebase origin/main
          git push origin main
