name: Apply Design 42 AI assistant panel

on:
  push:
    branches:
      - feature/design42-ai-assistant-panel
    paths:
      - .github/workflows/design42-ai-assistant-panel.yml
      - scripts/patch_design42_ai.py

permissions:
  contents: write

jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/design42-ai-assistant-panel
          fetch-depth: 0
      - name: Patch Design 42
        run: python scripts/patch_design42_ai.py
      - name: Commit result
        run: |
          rm -f .github/workflows/design42-ai-assistant-panel.yml scripts/patch_design42_ai.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add Ask Telikom side assistant to Design 42"
          git push origin HEAD:feature/design42-ai-assistant-panel
