name: Design 42 Typography Ownership Apply

on:
  push:
    branches:
      - refactor/design42-css-cleanup
    paths:
      - '.github/workflows/design42-typography-ownership-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Move leaked rendered typography into Core ownership
        run: |
          python3 <<'PY'
          from pathlib import Path
          path=Path('assets/design42/design42-core.css')
          text=path.read_text()
          old='body{margin:0;font-family:Manrope,Arial,sans-serif;color:var(--ink);background:var(--ice);overflow-x:hidden}'
          new='body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--ice);overflow-x:hidden}'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one canonical Core body typography rule, found {count}. Refusing migration.')
          path.write_text(text.replace(old,new,1))
          print('Core now explicitly owns the pre-refactor rendered body font stack.')
          PY
      - name: Verify architecture guardrails
        run: node tests/design42-css-architecture.test.mjs
      - name: Remove one-shot migration workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/design42-typography-ownership-apply.yml
          git add assets/design42/design42-core.css
          git commit -m "refactor: make Design 42 typography ownership explicit"
          git push
