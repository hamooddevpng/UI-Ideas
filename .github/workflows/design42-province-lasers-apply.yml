name: Apply Design 42 province lasers

on:
  push:
    branches:
      - fix/design42-province-lasers-visible
    paths:
      - .github/workflows/design42-province-lasers-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-province-lasers-visible
          fetch-depth: 0
      - name: Apply patch
        run: python3 .patches/apply_design42_lasers.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make Design 42 province lasers visible"
          git push origin HEAD:fix/design42-province-lasers-visible
