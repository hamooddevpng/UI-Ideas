name: Finalize Design 40

on:
  push:
    paths:
      - '.github/workflows/finalize-design40.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Design 40
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('40.html')
          s = p.read_text(encoding='utf-8')

          travel = 'https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/assets/design40/banner-travel.jpg'
          festive = 'https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/assets/design40/banner-festive.jpg'

          s, n1 = re.subn(r'--banner-one:url\(".*?"\);', f'--banner-one:url("{travel}");', s, count=1, flags=re.S)
          s, n2 = re.subn(r'--banner-two:url\(".*?"\);', f'--banner-two:url("{festive}");', s, count=1, flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not patch banner variables: one={n1}, two={n2}')

          # The generated banners already contain their campaign copy. Keep 40 simple and let the artwork speak.
          final_css = '''\n/* Design 40 final: generated campaign artwork is the banner itself. */\n@media (min-width:901px){.campaign{height:clamp(320px,40vw,520px);min-height:320px}}\n.campaign-slide:after{display:none!important}\n.campaign-copy{display:none!important}\n'''
          s = s.replace('</style>', final_css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate image assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/design40/banner-travel.jpg
          test -s assets/design40/banner-festive.jpg
          file assets/design40/banner-travel.jpg | grep -qi 'JPEG image data'
          file assets/design40/banner-festive.jpg | grep -qi 'JPEG image data'
          grep -q 'assets/design40/banner-travel.jpg' 40.html
          grep -q 'assets/design40/banner-festive.jpg' 40.html
          grep -q 'data:image/png;base64' 40.html

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Render and test Design 40
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/d40-http.log 2>&1 &
          sleep 1
          node <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            for (const viewport of [{width:1366,height:768},{width:1440,height:900}]) {
              const page = await browser.newPage({viewport, deviceScaleFactor:1});
              const failed=[];
              page.on('requestfailed', r => failed.push(`${r.url()} ${r.failure()?.errorText||''}`));
              await page.goto('http://127.0.0.1:4173/40.html', {waitUntil:'networkidle', timeout:30000});
              await page.waitForTimeout(700);
              const result = await page.evaluate(()=>({
                foldBottom: Math.ceil(document.querySelector('.quick-more').getBoundingClientRect().bottom),
                viewport: innerHeight,
                banner1: getComputedStyle(document.querySelector('.campaign-slide.one')).backgroundImage,
                banner2: getComputedStyle(document.querySelector('.campaign-slide.two')).backgroundImage,
                logo: getComputedStyle(document.querySelector('.brand')).backgroundImage,
                copyHidden: getComputedStyle(document.querySelector('.campaign-copy')).display === 'none'
              }));
              console.log(viewport, result, failed);
              if (failed.length) throw new Error(`Failed requests: ${failed.join('\n')}`);
              if (!result.banner1.includes('banner-travel.jpg') || !result.banner2.includes('banner-festive.jpg')) throw new Error('Generated banners not applied');
              if (!result.logo.includes('data:image/png;base64')) throw new Error('Exact embedded Telikom logo missing');
              if (!result.copyHidden) throw new Error('Redundant campaign overlay still visible');
              if (result.foldBottom > result.viewport) throw new Error(`First view overflow at ${viewport.width}x${viewport.height}: ${result.foldBottom} > ${result.viewport}`);
              await page.screenshot({path:`design40-${viewport.width}x${viewport.height}.jpg`,type:'jpeg',quality:80,fullPage:false});
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: design40-final-verification
          path: design40-*.jpg
          retention-days: 1

      - name: Commit final Design 40 and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 40.html assets/design40
          git rm -f --ignore-unmatch .github/workflows/finalize-design40.yml
          git rm -f --ignore-unmatch .github/workflows/build-design40-selfcontained.yml
          git rm -f --ignore-unmatch .github/workflows/verify-design40-render.yml
          git rm -f --ignore-unmatch 40-selfcontained-template.html
          git commit -m 'Finalize Design 40 with working generated banners'
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
