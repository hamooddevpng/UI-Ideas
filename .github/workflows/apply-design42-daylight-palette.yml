name: Apply Design 42 Daylight Palette

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-design42-daylight-palette.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply palette
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text()
          marker='/* Design 42: daylight Telikom palette v3 */'
          if marker in s:
              raise SystemExit(0)
          css=r'''
          <style>
          /* Design 42: daylight Telikom palette v3 */
          :root{
            --blue:#0878be;
            --cyan:#22a7d4;
            --green:#68b84b;
            --navy:#124764;
            --navy2:#175b79;
            --deep-bg:#0b78b6;
            --ink:#173543;
            --muted:#647c87;
            --ice:#f5f2eb;
            --sky:#eaf4f7;
            --white:#fff;
            --line:rgba(23,53,67,.12);
            --warm:#f5f2eb;
            --warm-2:#faf8f3;
            --mist:#eaf4f7;
            --mist-2:#deeff4;
            --mint:#edf5ec;
          }
          html{background:#f5f2eb!important}
          body{background:#f5f2eb!important;color:#173543!important}
          .lead{color:#647c87!important}
          .kicker{color:#0878be!important}

          /* Overall page rhythm: warm ivory + cool mist, not teal-on-teal */
          .offers,.raffle-offers{background:#faf8f3!important}
          .services,.service-lab,.service-stories{background:#eaf4f7!important}
          .digital-ecosystem{background:#f7f5ef!important}
          .updates,.updates-live{background:#eef6f8!important}
          .support,.support-orbit{background:#f5f2eb!important}
          .quick-actions,.quick-launchpad{background:transparent!important}
          .quick-launchpad .quick-deck{background:rgba(255,255,255,.95)!important;box-shadow:0 24px 66px rgba(25,76,96,.13)!important}
          .quick-launchpad .quick-card{background:rgba(255,255,255,.92)!important;border-color:rgba(20,86,113,.10)!important}
          .quick-launchpad .q-icon{background:linear-gradient(145deg,#edf7fb,#dfeff5)!important;color:#0878be!important}
          .quick-launchpad .quick-card:hover .q-icon,.quick-launchpad .quick-card:focus-visible .q-icon{background:#0878be!important;color:#fff!important}

          /* Header: clean brand blue only after scroll */
          .site-header.scrolled{background:rgba(8,104,155,.95)!important;border-bottom-color:rgba(255,255,255,.20)!important}

          /* Hero: proper Telikom blue with a little sky, no greenish cast */
          .hero{background:#0878be!important}
          .scene-phone{
            background:
              radial-gradient(circle at 80% 42%,rgba(180,236,255,.30),transparent 31%),
              linear-gradient(118deg,#086aa8 0%,#0d84bd 48%,#3aadd0 100%)!important;
          }
          .scene-phone:after{background:linear-gradient(90deg,rgba(6,79,125,.58) 0%,rgba(8,112,165,.27) 43%,rgba(35,160,198,.03) 75%,transparent 100%)!important}
          .scene-enterprise{
            background:
              radial-gradient(circle at 77% 48%,rgba(188,239,255,.28),transparent 29%),
              linear-gradient(120deg,#0a6ea9 0%,#148cc1 58%,#45b2cf 100%)!important;
          }
          .hero[data-scene-index="2"] .scene-enterprise:after{background:linear-gradient(90deg,rgba(5,75,117,.48) 0%,rgba(9,116,163,.18) 50%,rgba(46,166,199,.02) 78%,transparent 100%)!important}
          .scene-tabs{background:rgba(8,74,112,.46)!important;border-color:rgba(255,255,255,.24)!important}
          .eyebrow{color:#d7f5ff!important}
          .hero-copy p{color:#e7f4f9!important}

          /* Service visual: blue panel, but surrounding section stays light */
          .service-stage{background:linear-gradient(145deg,#0d73a9 0%,#178fc0 58%,#43b1cb 100%)!important;box-shadow:0 24px 58px rgba(16,96,136,.15)!important}
          .service-art{background:radial-gradient(circle at 72% 35%,rgba(202,243,255,.34),transparent 28%),linear-gradient(145deg,#0e79ad,#28a1c6)!important}
          .service-caption p{color:#e8f8fc!important}

          /* Business & Government: return the large canvas to daylight */
          .business,.business-dual{
            background:
              radial-gradient(circle at 84% 12%,rgba(34,167,212,.10),transparent 27%),
              linear-gradient(180deg,#e7f2f4 0%,#f4f2ec 100%)!important;
            color:#173543!important;
          }
          .business-dual-head .title,.business .title{color:#173543!important}
          .business .lead{color:#607984!important}
          .business .kicker{color:#0878be!important}
          .business-dual .dual-world{
            background:rgba(255,255,255,.78)!important;
            border:1px solid rgba(21,92,118,.12)!important;
            box-shadow:0 14px 34px rgba(31,87,106,.07)!important;
          }
          .business-dual .dual-world-top{color:#54737f!important}
          .business-dual .dual-world-copy h3{color:#173543!important}
          .business-dual .dual-world-copy>p{color:#617c87!important}
          .business-dual .dual-world-copy>small{color:#0878be!important;background:#eaf5fa!important}
          .business-dual .government-world .dual-world-copy>small{color:#4b8b3f!important;background:#eef6ea!important}
          .business-dual .dual-art-wrap{background:linear-gradient(145deg,#eaf6fa,#dceef3)!important;border-radius:18px!important}
          .business-dual .government-world .dual-art-wrap{background:linear-gradient(145deg,#edf6ed,#e2f0e2)!important}
          .mission-service-card{background:rgba(255,255,255,.92)!important;border-color:rgba(20,99,132,.11)!important}
          .portfolio-rail-heading small{color:#5e7c88!important}
          .portfolio-rail-heading b{color:#173543!important}

          /* Digital ecosystem: soften the clinical cyan with neutral ground */
          .digital-ecosystem-board{background:#fff!important;border-color:rgba(23,77,98,.10)!important;box-shadow:0 16px 44px rgba(35,83,101,.07)!important}
          .eco-map{background:linear-gradient(180deg,#eef7f9 0 49%,#f0f5ed 49% 100%)!important}
          .eco-water{fill:#dceff4!important}.eco-land{fill:#edf3e9!important}
          .eco-insight{background:#fbfaf6!important}

          /* National story already works better light: warm it slightly */
          .national-story-map{background:radial-gradient(circle at 78% 42%,rgba(34,167,212,.12),transparent 27%),linear-gradient(118deg,#fbfaf6 0%,#edf6f7 46%,#dfeff3 100%)!important}
          .national-story-map:after{background:linear-gradient(90deg,rgba(251,250,246,.98) 0%,rgba(248,249,246,.94) 25%,rgba(236,246,248,.62) 39%,rgba(225,241,245,.10) 55%,rgba(225,241,245,0) 74%)!important}

          /* News: neutral cards on a pale blue-grey section */
          .updates-console,.news-feature{background:#fff!important;border-color:rgba(25,87,109,.10)!important;box-shadow:0 18px 44px rgba(35,84,101,.08)!important}
          .live-feed-card{background:#f8fbfb!important;border-color:rgba(27,91,114,.08)!important}

          /* Customer care: light section with a single contained blue experience */
          .support-orbit .support-stage{
            background:
              radial-gradient(circle at 84% 44%,rgba(194,239,255,.20),transparent 34%),
              linear-gradient(145deg,#0c6fa5 0%,#1688b6 55%,#32a8c5 100%)!important;
            box-shadow:0 24px 56px rgba(24,92,122,.15)!important;
          }
          .support-orbit .support-link{background:rgba(7,78,115,.28)!important;border-color:rgba(236,250,255,.30)!important}
          .support-orbit .support-link:hover{background:#fff!important;color:#14506a!important}
          .support-hint{color:#d6eef5!important}

          /* Assistant: brand blue rather than murky teal */
          .telikom-ai-panel{background:radial-gradient(circle at 86% 8%,rgba(187,239,255,.22),transparent 29%),linear-gradient(180deg,#0b6fa7 0%,#1588b7 58%,#0e729f 100%)!important;box-shadow:-20px 0 60px rgba(16,78,105,.18)!important}
          .telikom-ai-head{background:rgba(7,90,132,.80)!important;border-bottom-color:rgba(255,255,255,.18)!important}
          .telikom-ai-chip,.telikom-ai-msg.bot,.telikom-ai-form{background:rgba(5,70,105,.30)!important;border-color:rgba(229,248,255,.25)!important}
          .telikom-ai-compose{background:rgba(6,78,115,.84)!important;border-top-color:rgba(255,255,255,.17)!important}
          .telikom-ai-panel p,.telikom-ai-panel small{color:#e4f4f9!important}

          /* Small accents */
          .btn.dark,.personal-offer-icon{background:#0878be!important;border-color:#0878be!important}
          .offer-option:hover,.offer-option.active{background:#0878be!important;color:#fff!important}
          .offer-option:hover small,.offer-option.active small{color:#dff3fb!important}
          .float-pill,.news-live-badge{background:rgba(8,92,137,.88)!important}

          /* Footer: the only intentionally deep large surface */
          footer{background:linear-gradient(180deg,#0b5f89 0%,#084b6d 100%)!important}
          .footer-top{border-bottom-color:rgba(255,255,255,.20)!important}
          .footer-brand p,.footer-col a,.footer-bottom{color:#d6e8ef!important}
          .footer-col b{color:#fff!important}
          .footer-social-icon{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.24)!important}

          @media(max-width:820px){
            .business-dual .dual-art-wrap{background:linear-gradient(145deg,#eaf6fa,#dceef3)!important}
            .business-dual .government-world .dual-art-wrap{background:linear-gradient(145deg,#edf6ed,#e2f0e2)!important}
          }
          </style>
          '''
          s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Commit palette
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: use warmer daylight palette for Design 42"
          git pull --rebase origin main
          git push origin main
