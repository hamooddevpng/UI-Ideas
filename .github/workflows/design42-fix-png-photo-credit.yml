name: One-time Design 42 PNG photo attribution cleanup
on:
  push:
    paths:
      - '.github/workflows/design42-fix-png-photo-credit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix replacement photo semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text()
          old='''<img class="service-story-photo" loading="lazy" src="assets/design42/png-people.jpg" alt="Women at Ela Beach, Port Moresby, Papua New Guinea"><div class="story-shade"></div><div class="story-copy"><span>03 / Devices</span>'''
          new='''<img class="service-story-photo" loading="lazy" src="assets/design42/png-people.jpg" alt="People in Papua New Guinea"><div class="story-shade"></div><div class="story-copy"><span>03 / Devices</span>'''
          if old not in s:
              raise SystemExit('Devices replacement image target missing')
          s=s.replace(old,new,1)
          old_credit='''<a class="story-credit" href="https://unsplash.com/photos/9bmuXZWB4W4" target="_blank" rel="noreferrer">Photo · PNG</a>'''
          new_credit='''<a class="story-credit" href="https://commons.wikimedia.org/wiki/File:Happy_people_in_PNG_(6357491621).jpg" target="_blank" rel="noreferrer">Photo · PNG</a>'''
          if old_credit not in s:
              raise SystemExit('stale Devices photo credit target missing')
          s=s.replace(old_credit,new_credit,1)
          p.write_text(s)
          PY
          ! grep -q 'photo-1728957467648-ad5e95eafa1e' 42.html
          ! grep -q 'unsplash.com/photos/9bmuXZWB4W4' 42.html
          grep -q 'commons.wikimedia.org/wiki/File:Happy_people_in_PNG_' 42.html
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/design42-fix-png-photo-credit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-fix-png-photo-credit.yml
          git commit -m 'Fix Design 42 PNG replacement photo credit'
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
