name: One-time Design 42 navbar patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_design42-navbar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch navbar
        run: python scripts/_design42_navbar_patch.py
      - name: Verify patch
        run: |
          git diff --check
          grep -F '.main-nav a{font-size:13px;font-weight:700}' 42.html
      - name: Commit patch and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_design42-navbar.yml scripts/_design42_navbar_patch.py
          git add 42.html
          git commit -m 'Improve Design 42 navbar readability [skip ci]'
          git push origin main
