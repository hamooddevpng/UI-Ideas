name: Capture Responsive Design Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ui-ideas-http.log 2>&1 &
          sleep 1
      - name: Capture desktop gallery
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const outDir = path.join(root, 'screenshots', 'desktop-1440');
          fs.rmSync(path.join(root,'screenshots'), {recursive:true, force:true});
          fs.mkdirSync(outDir, {recursive:true});
          const files = fs.readdirSync(root).filter(f => /^\d+\.html$/i.test(f)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1});
            for (const file of files) {
              const page = await context.newPage();
              const id = file.replace(/\.html$/i,'');
              try {
                await page.goto(`http://127.0.0.1:4173/${file}`, {waitUntil:'commit', timeout:5000});
                await page.waitForTimeout(650);
                await page.screenshot({path:path.join(outDir,`${id}.jpg`),type:'jpeg',quality:68,fullPage:true,animations:'disabled',timeout:10000});
                console.log(`Captured ${file}`);
              } catch (e) {
                console.warn(`Skipped ${file}: ${e.message}`);
              } finally {
                await page.close().catch(()=>{});
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
      - name: Build README gallery
        run: |
          node <<'EOF'
          const fs=require('fs');const path=require('path');
          const root=process.cwd(), readmePath=path.join(root,'README.md');
          const start='<!-- DESIGN_GALLERY_START -->', end='<!-- DESIGN_GALLERY_END -->';
          const designs=fs.readdirSync(root).filter(f=>/^\d+\.html$/i.test(f)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
          const lines=['','## Design Gallery','',`Generated from ${designs.length} top-level design page(s).`,''];
          for(const f of designs){const id=f.replace(/\.html$/i,'');lines.push(`### Design ${id}`,'',`[Open HTML design](./${f})`,'');if(fs.existsSync(path.join(root,'screenshots','desktop-1440',`${id}.jpg`))) lines.push(`[![Design ${id} — desktop](./screenshots/desktop-1440/${id}.jpg)](./screenshots/desktop-1440/${id}.jpg)`,'',`[desktop-1440](./screenshots/desktop-1440/${id}.jpg)`,'');}
          let r=fs.existsSync(readmePath)?fs.readFileSync(readmePath,'utf8'):'# UI Ideas\n\n';
          if(!r.includes(start)||!r.includes(end)) r+=`\n${start}\n${end}\n`;
          r=r.slice(0,r.indexOf(start)+start.length)+'\n'+lines.join('\n')+'\n'+r.slice(r.indexOf(end));
          fs.writeFileSync(readmePath,r);
          EOF
      - name: Create ZIP
        run: |
          mkdir -p screenshot-archives
          rm -f screenshot-archives/ui-ideas-screenshots.zip
          zip -qr -9 screenshot-archives/ui-ideas-screenshots.zip screenshots
          ls -lh screenshot-archives/ui-ideas-screenshots.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ui-ideas-screenshots
          path: screenshot-archives/ui-ideas-screenshots.zip
          retention-days: 30
      - name: Commit gallery and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots screenshot-archives README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh fast desktop design gallery"
          git pull --rebase origin main
          git push origin main
