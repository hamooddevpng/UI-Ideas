name: One-time Design 42 service photo swap
on:
  push:
    paths:
      - '.github/workflows/design42-service-photo-swap.yml'
permissions:
  contents: write
jobs:
  swap-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace featured service photo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('42.html')
          s=p.read_text()
          old='https://images.unsplash.com/photo-1728957437280-4010c8a8a627?auto=format&fit=crop&w=1500&q=82'
          new='https://images.unsplash.com/photo-1590364623978-7268baee5715?auto=format&fit=crop&w=1500&q=82'
          if old not in s:
              raise SystemExit('old service image URL not found')
          s=s.replace(old,new,1)
          s=s.replace('alt="People at Ela Beach, Port Moresby, Papua New Guinea"','alt="Papua New Guinea siblings and family outdoors"',1)
          s=s.replace('href="https://unsplash.com/photos/Hd8iV-pVdoU"','href="https://unsplash.com/photos/2d6UohbZWS0"',1)
          p.write_text(s)
          PY
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/verify42.js <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'networkidle'});
            await page.evaluate(()=>document.getElementById('services').scrollIntoView({block:'center'}));
            await page.waitForTimeout(800);
            const check=await page.evaluate(()=>{
              const img=document.querySelector('.service-story-card.story-feature .service-story-photo');
              const credit=document.querySelector('.service-story-card.story-feature .story-credit');
              const section=document.getElementById('services');
              return {src:img?.src||'',w:img?.naturalWidth||0,credit:credit?.href||'',height:section?.getBoundingClientRect().height||0};
            });
            if(!check.src.includes('photo-1590364623978-7268baee5715')) throw Error('replacement image missing '+JSON.stringify(check));
            if(check.w<200) throw Error('replacement image failed to load '+JSON.stringify(check));
            if(!check.credit.includes('2d6UohbZWS0')) throw Error('replacement credit missing '+JSON.stringify(check));
            if(check.height>810) throw Error('services section exceeds 90vh comfort limit '+check.height);
            console.log('Featured service image OK',check);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify42.js
      - name: Commit and clean up
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/design42-service-photo-swap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42.html .github/workflows/design42-service-photo-swap.yml
          git commit -m 'Replace Design 42 featured service photo'
          git push origin main
