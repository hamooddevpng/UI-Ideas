name: Apply Design 40 full SEO

on:
  push:
    paths:
      - '.github/workflows/apply-design40-full-seo.yml'
      - 'scripts/apply_design40_seo.py'

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Apply and validate SEO package
        run: python scripts/apply_design40_seo.py

      - name: Commit SEO package
        run: |
          rm -f .github/workflows/apply-design40-full-seo.yml scripts/apply_design40_seo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 40.html robots.txt sitemap.xml .github/workflows/apply-design40-full-seo.yml scripts/apply_design40_seo.py
          git commit -m 'Add comprehensive SEO metadata to Design 40'
          git pull --rebase origin main
          git push origin HEAD:main
