name: Patch Design 41 carousel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-design41-carousel.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch page
        run: |
          sed -i 's/id="home"/id="top"/g' .github/scripts/patch_design41.py
          sed -i 's/telikom-stay-connected-from-png-to-the-world.webp/stay-connected-from-png-to-the-world.webp/g' .github/scripts/patch_design41.py
          sed -i 's/telikom-festive-png-telecom-deals.webp/festive-png-telecom-deals.webp/g' .github/scripts/patch_design41.py
          python3 .github/scripts/patch_design41.py

      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-design41-carousel.yml
          rm .github/scripts/patch_design41.py
          git add 41.html .github/workflows/patch-design41-carousel.yml .github/scripts/patch_design41.py
          git commit -m "Make Design 41 hero a moving carousel"
          git pull --rebase origin main
          git push origin main
