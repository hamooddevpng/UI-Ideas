name: One-time Design 41 proximity field

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-design41-proximity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate Design 41
        run: python3 scripts/patch_design41_proximity.py

      - name: Commit safely and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-design41-proximity.yml scripts/patch_design41_proximity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 41.html .github/workflows/patch-design41-proximity.yml scripts/patch_design41_proximity.py
          git commit -m 'Add ambient proximity motion to Design 41'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
