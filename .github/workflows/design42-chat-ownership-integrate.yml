name: Design 42 Chat Ownership Integrate

on:
  push:
    branches:
      - refactor/design42-css-cleanup
    paths:
      - '.github/workflows/design42-chat-ownership-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Make chat ownership guard permanent
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/design42-refactor-qa.yml')
          text = path.read_text()

          trigger = "      - 'tests/design42-css-architecture.test.mjs'\n"
          chat_trigger = "      - 'tests/design42-chat-ownership.test.mjs'\n"
          if chat_trigger not in text:
              if trigger not in text:
                  raise SystemExit('Could not find architecture test path trigger in Design 42 QA workflow.')
              text = text.replace(trigger, trigger + chat_trigger, 1)

          old = "      - name: Run architecture guardrails\n        run: node tests/design42-css-architecture.test.mjs\n"
          new = "      - name: Run architecture guardrails\n        run: |\n          node tests/design42-css-architecture.test.mjs\n          node tests/design42-chat-ownership.test.mjs\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif 'node tests/design42-chat-ownership.test.mjs' not in text:
              raise SystemExit('Could not wire chat ownership test into Design 42 QA workflow.')

          path.write_text(text)
          PY

          node tests/design42-css-architecture.test.mjs
          node tests/design42-chat-ownership.test.mjs

          rm -f .github/workflows/design42-chat-ownership-red.yml
          rm -f .github/workflows/design42-chat-ownership-integrate.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/design42-refactor-qa.yml .github/workflows/design42-chat-ownership-red.yml .github/workflows/design42-chat-ownership-integrate.yml
          git commit -m 'test: enforce single-owner Ask Telikom CSS'
          git push origin HEAD:refactor/design42-css-cleanup
