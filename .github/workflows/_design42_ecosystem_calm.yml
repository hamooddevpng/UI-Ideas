name: Design 42 ecosystem cleanup

on:
  push:
    paths:
      - '.github/workflows/_design42_ecosystem_calm.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calm and simplify ecosystem
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('42.html')
          text = path.read_text(encoding='utf-8')
          original = text

          if 'Design 42 ecosystem iteration 2: live routes + story overlays.' not in text:
              raise SystemExit('Current ecosystem iteration not found')
          if 'Design 42 ecosystem iteration 3: calm topology.' in text:
              raise SystemExit('Calm topology already present')

          hero_start = original.index('<section class="hero"')
          hero_end = original.index('</section>', hero_start) + len('</section>')
          hero_before = original[hero_start:hero_end]
          services_start = original.index('<section class="services service-stories"')
          services_end = original.index('</section>', services_start) + len('</section>')
          services_before = original[services_start:services_end]

          css = r'''

/* Design 42 ecosystem iteration 3: calm topology. */
.digital-ecosystem-board{box-shadow:0 16px 42px rgba(25,86,108,.055)}
.eco-grid{opacity:.17!important}
.eco-water{opacity:.28!important}
.eco-road-edge{opacity:.18!important}
.eco-road-mark{opacity:.18!important}
.eco-label{opacity:.7;transition:opacity .24s var(--ease),fill .24s var(--ease)}
.eco-small{opacity:.38;transition:opacity .24s var(--ease),fill .24s var(--ease)}
.eco-zone.is-active .eco-label{opacity:1}
.eco-zone.is-active .eco-small{opacity:.72}

/* Idle view reads like a miniature world. Routes become expressive only on interaction. */
.eco-route{opacity:.105!important;stroke-width:1.35!important;stroke-dasharray:none!important;animation:none!important;filter:none!important}
.eco-beam{opacity:.11!important;stroke-width:1.2!important;stroke-dasharray:3 12!important;animation-duration:6.2s!important}
.eco-board-focused .eco-route{opacity:.035!important}
.eco-board-focused .eco-route.is-active{opacity:.88!important;stroke-width:2.35!important;stroke-dasharray:6 10!important;animation:ecoRouteFlow 2s linear infinite!important;filter:drop-shadow(0 0 3px rgba(42,173,214,.18))!important}
.eco-board-focused .eco-beam{opacity:.03!important}
.eco-board-focused .eco-beam.is-active{opacity:.48!important;stroke-dasharray:5 10!important;animation:ecoRouteFlow 2.4s linear infinite!important}

/* Keep motion alive, but remove the visual traffic jam. */
.eco-data-dot,.eco-starlink-dot,.eco-compute-dot,.eco-kina-token{opacity:.46;transition:opacity .22s var(--ease)}
.eco-data-dot[opacity=".58"],.eco-starlink-dot[opacity=".62"],.eco-compute-dot[opacity=".54"]{display:none!important}
.eco-board-focused .eco-data-dot,.eco-board-focused .eco-starlink-dot,.eco-board-focused .eco-compute-dot,.eco-board-focused .eco-kina-token{opacity:.08}
.digital-ecosystem-board:has(.eco-node[data-eco="network"].active) .eco-data-dot{opacity:.92}
.digital-ecosystem-board:has(.eco-node[data-eco="starlink"].active) .eco-starlink-dot{opacity:.92}
.digital-ecosystem-board:has(.eco-node[data-eco="compute"].active) .eco-compute-dot{opacity:.92}
.digital-ecosystem-board:has(.eco-node[data-eco="tcash"].active) .eco-kina-token{opacity:1}
.digital-ecosystem-board:has(.eco-node[data-eco="telikom"].active) .eco-data-dot,
.digital-ecosystem-board:has(.eco-node[data-eco="telikom"].active) .eco-starlink-dot,
.digital-ecosystem-board:has(.eco-node[data-eco="telikom"].active) .eco-compute-dot,
.digital-ecosystem-board:has(.eco-node[data-eco="telikom"].active) .eco-kina-token{opacity:.7}

/* Hotspots are quiet dots until the user asks for a label. */
.eco-node{width:28px;height:28px;padding:4px;gap:0;justify-content:center;border-color:rgba(27,108,137,.10);box-shadow:0 5px 14px rgba(28,88,108,.055);background:rgba(255,255,255,.86)}
.eco-node i{width:18px;height:18px;flex:0 0 18px;font-size:7px}
.eco-node span{position:absolute;left:34px;top:50%;max-width:0;padding:0;overflow:hidden;white-space:nowrap;opacity:0;transform:translateY(-50%) translateX(-4px);border:1px solid transparent;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 7px 18px rgba(28,88,108,.07);font-size:6.5px;line-height:24px;pointer-events:none;transition:max-width .3s var(--spring),padding .3s var(--spring),opacity .18s,transform .3s var(--spring),border-color .2s}
.eco-node:hover span,.eco-node:focus-visible span,.eco-node.active span{max-width:150px;padding:0 9px;opacity:1;transform:translateY(-50%) translateX(0);border-color:rgba(27,108,137,.11)}
.eco-node[data-eco="compute"] span,.eco-node[data-eco="tcash"] span{left:auto;right:34px;transform:translateY(-50%) translateX(4px)}
.eco-node[data-eco="compute"]:hover span,.eco-node[data-eco="compute"]:focus-visible span,.eco-node[data-eco="compute"].active span,
.eco-node[data-eco="tcash"]:hover span,.eco-node[data-eco="tcash"]:focus-visible span,.eco-node[data-eco="tcash"].active span{transform:translateY(-50%) translateX(0)}
.eco-node[data-eco="starlink"]{left:25%;top:34%}
.eco-node[data-eco="network"]{left:23%;top:70%}
.eco-node[data-eco="telikom"]{left:48.5%;top:46%}
.eco-node[data-eco="compute"]{right:22%;top:37%}
.eco-node[data-eco="tcash"]{right:19%;top:73%}
.eco-board-focused .eco-node:not(.active){opacity:.38}

/* Focus is softer, so the selected story stands out without blanking the scene. */
.eco-board-focused .eco-zone{opacity:.68!important;filter:saturate(.88)}
.eco-board-focused .eco-zone.is-active{opacity:1!important;filter:saturate(1.03)}
.eco-hub-ring{opacity:.11}

/* The story is a readable side sheet, not another floating object in the middle. */
.eco-story-overlay{top:18px;bottom:auto;left:auto;right:18px;width:min(340px,calc(100% - 36px));padding:16px 17px 15px;border-radius:16px;background:rgba(255,255,255,.975);box-shadow:0 18px 44px rgba(18,72,93,.13);transform:translateY(-6px) scale(.99);transform-origin:right top}
.eco-story-overlay.show{transform:none}
.digital-ecosystem-board[data-eco-story="compute"] .eco-story-overlay,
.digital-ecosystem-board[data-eco-story="tcash"] .eco-story-overlay{left:18px;right:auto;transform-origin:left top}
.eco-story-overlay h3{font-size:20px;margin-bottom:7px}
.eco-story-overlay p{font-size:8.5px;line-height:1.48}
.eco-story-steps{margin:11px 0 10px}
.eco-story-steps span{padding:4px 6px}

/* Bottom bar becomes a clean context strip. The overlay carries the longer story. */
.eco-insight{min-height:70px;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;padding:12px 18px}
.eco-insight-copy h3{font-size:16px;margin-bottom:0}
.eco-insight-copy p{display:none}
.eco-more{height:31px;padding:0 11px}
.eco-hint{opacity:.62}

@media(max-width:820px){
  .eco-node[data-eco="starlink"]{left:24%;top:33%}.eco-node[data-eco="network"]{left:22%;top:70%}.eco-node[data-eco="telikom"]{left:48%;top:46%}.eco-node[data-eco="compute"]{right:21%;top:37%}.eco-node[data-eco="tcash"]{right:18%;top:73%}
  .eco-node span{display:none}
  .eco-story-overlay,.digital-ecosystem-board[data-eco-story="compute"] .eco-story-overlay,.digital-ecosystem-board[data-eco-story="tcash"] .eco-story-overlay{left:12px;right:12px;top:auto;bottom:96px;width:auto;transform-origin:center bottom}
  .eco-insight{min-height:66px;grid-template-columns:1fr auto;padding:11px 13px}.eco-insight-key{display:none}.eco-insight-copy{grid-column:1;grid-row:1}.eco-more{grid-column:2;grid-row:1}
}
@media(prefers-reduced-motion:reduce){.eco-route,.eco-beam,.eco-data-dot,.eco-starlink-dot,.eco-compute-dot,.eco-kina-token,.eco-node span{animation:none!important;transition:none!important}}
'''

          style_end = text.index('\n</style>\n</head>')
          text = text[:style_end] + css + text[style_end:]

          old_clear = "const clear=()=>{board.classList.remove('eco-board-focused');nodes.forEach(n=>n.classList.remove('active'));routes.forEach(r=>r.classList.remove('is-active'));zones.forEach(z=>z.classList.remove('is-active'));hideStory()};"
          new_clear = "const clear=()=>{delete board.dataset.ecoStory;board.classList.remove('eco-board-focused');nodes.forEach(n=>n.classList.remove('active'));routes.forEach(r=>r.classList.remove('is-active'));zones.forEach(z=>z.classList.remove('is-active'));hideStory()};"
          if old_clear not in text:
              raise SystemExit('clear handler marker not found')
          text = text.replace(old_clear, new_clear, 1)

          old_activate = "const activate=key=>{const d=data[key];if(!d)return;board.classList.add('eco-board-focused');"
          new_activate = "const activate=key=>{const d=data[key];if(!d)return;board.dataset.ecoStory=key;board.classList.add('eco-board-focused');"
          if old_activate not in text:
              raise SystemExit('activate handler marker not found')
          text = text.replace(old_activate, new_activate, 1)

          hero_after = text[hero_start:hero_end]
          services_after = text[services_start:services_end]
          if hero_before != hero_after:
              raise SystemExit('Hero changed unexpectedly')
          if services_before != services_after:
              raise SystemExit('Services changed unexpectedly')
          if text.count('Design 42 ecosystem iteration 3: calm topology.') != 1:
              raise SystemExit('Calm CSS marker verification failed')
          if 'data-eco-story' not in text:
              raise SystemExit('Story positioning hook missing')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused change
        run: |
          grep -q 'Design 42 ecosystem iteration 3: calm topology' 42.html
          grep -q 'Services for every<br>part of PNG.' 42.html
          grep -q 'eco-story-overlay' 42.html
          git diff --check
          git diff -- 42.html | grep -q 'calm topology'
      - name: Commit cleanup and remove helper
        run: |
          rm .github/workflows/_design42_ecosystem_calm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Calm Design 42 digital ecosystem'
          git push