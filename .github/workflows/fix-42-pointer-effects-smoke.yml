name: One-time Design 42 pointer effects repair

on:
  push:
    paths:
      - '.github/workflows/fix-42-pointer-effects-smoke.yml'

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair hero pointer effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('42.html')
          s = p.read_text()

          old = "active=i;setTimeout(()=>locked=false,650)"
          new = "active=i;syncHeroSceneEffects();setTimeout(()=>locked=false,650)"
          assert old in s, 'setScene hook not found'
          s = s.replace(old, new, 1)

          pattern = re.compile(r"const tower=document\.querySelector\('\.tower'\);let heroVisible=true.*?hero\.classList\.add\('hero-in-view'\);startAuto\(\);", re.S)
          replacement = r"""const tower=document.querySelector('.tower');let heroVisible=true,satTX=0,satTY=0,satX=0,satY=0,heroHX=0,heroHY=0,satRAF=null;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function effectsLive(){return heroVisible&&!document.hidden}function clearTowerAim(){if(tower)tower.classList.remove('aiming')}function runSatellite(){if(!effectsLive()||active!==1){satRAF=null;return}satX+=(satTX-satX)*.14;satY+=(satTY-satY)*.14;hero.style.setProperty('--sat-x',satX.toFixed(3));hero.style.setProperty('--sat-y',satY.toFixed(3));const depth=1+Math.min(.075,Math.hypot(satX,satY)*.05);hero.style.setProperty('--sat-scale',depth.toFixed(3));hero.style.setProperty('--dish-yaw',(satX*30).toFixed(2)+'deg');hero.style.setProperty('--dish-pitch',(satY*-20).toFixed(2)+'deg');hero.style.setProperty('--dish-beam',(satX*5.2).toFixed(2)+'deg');if(Math.abs(satTX-satX)>.0015||Math.abs(satTY-satY)>.0015)satRAF=requestAnimationFrame(runSatellite);else satRAF=null}function startSatellite(){if(!effectsLive()||active!==1)return;satTX=clamp(heroHX*1.08,-1,1);satTY=clamp(heroHY*.88,-.88,.88);if(!satRAF)satRAF=requestAnimationFrame(runSatellite)}function aimTowerAt(clientX,clientY){if(!effectsLive()||active!==2||!tower)return;const tr=tower.getBoundingClientRect(),sx=tr.left+tr.width/2,sy=tr.top+14,dx=clientX-sx,dy=clientY-sy;const len=Math.min(1600,Math.max(36,Math.hypot(dx,dy))),ang=Math.atan2(dy,dx)*180/Math.PI;tower.style.setProperty('--laser-length',len.toFixed(1)+'px');tower.style.setProperty('--laser-angle',ang.toFixed(2)+'deg');tower.classList.add('aiming')}function syncHeroSceneEffects(){clearTowerAim();if(!effectsLive()){if(satRAF){cancelAnimationFrame(satRAF);satRAF=null}return}if(active===1)startSatellite()}hero.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!effectsLive())return;const r=hero.getBoundingClientRect();heroHX=clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1);heroHY=clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1);hero.style.setProperty('--hx',heroHX.toFixed(3));hero.style.setProperty('--hy',heroHY.toFixed(3));if(active===1){satTX=clamp(heroHX*1.08,-1,1);satTY=clamp(heroHY*.88,-.88,.88);startSatellite()}else if(active===2)aimTowerAt(e.clientX,e.clientY)});hero.addEventListener('pointerleave',()=>{heroHX=0;heroHY=0;hero.style.setProperty('--hx','0');hero.style.setProperty('--hy','0');clearTowerAim()});const heroObserver=new IntersectionObserver(([entry])=>{heroVisible=entry.isIntersecting;hero.classList.toggle('hero-in-view',heroVisible);syncHeroSceneEffects()},{threshold:.04});heroObserver.observe(hero);hero.classList.add('hero-in-view');document.addEventListener('visibilitychange',()=>syncHeroSceneEffects());startAuto();"""
          s, n = pattern.subn(replacement, s, count=1)
          assert n == 1, f'interaction block replacement count={n}'

          css_repls = [
            (".tower{position:absolute;right:14%;bottom:7%;width:190px;height:270px;filter:drop-shadow(0 28px 32px rgba(0,0,0,.35))}",
             ".tower{position:absolute;right:14%;bottom:7%;width:190px;height:270px;filter:drop-shadow(0 28px 32px rgba(0,0,0,.35));overflow:visible;z-index:6}"),
            (".tower-laser{position:absolute;left:50%;top:10px;width:var(--laser-length,0px);height:1px;transform-origin:0 50%;transform:rotate(var(--laser-angle,0deg));background:linear-gradient(90deg,rgba(130,224,255,.34),rgba(104,207,248,.16) 55%,rgba(104,207,248,.04));box-shadow:0 0 6px rgba(104,207,248,.18);opacity:0;pointer-events:none;transition:opacity .22s ease,width .08s linear,transform .08s linear}",
             ".tower-laser{position:absolute;left:50%;top:10px;width:var(--laser-length,0px);height:1.5px;z-index:8;transform-origin:0 50%;transform:rotate(var(--laser-angle,0deg));background:linear-gradient(90deg,rgba(151,231,255,.48),rgba(104,207,248,.22) 58%,rgba(104,207,248,.05));box-shadow:0 0 8px rgba(104,207,248,.24);opacity:0;pointer-events:none;transition:opacity .18s ease,width .08s linear,transform .08s linear}"),
            (".hero[data-scene-index=\"2\"].hero-in-view .tower.aiming .tower-laser{opacity:.24}.hero[data-scene-index=\"2\"].hero-in-view .tower.aiming .tower-laser.l2{opacity:.11}",
             ".hero[data-scene-index=\"2\"].hero-in-view .tower.aiming .tower-laser{opacity:.36}.hero[data-scene-index=\"2\"].hero-in-view .tower.aiming .tower-laser.l2{opacity:.16}")
          ]
          for old_css, new_css in css_repls:
              assert old_css in s, f'CSS target missing: {old_css[:60]}'
              s = s.replace(old_css, new_css, 1)

          p.write_text(s)
          PY

      - name: Syntax check Design 42 JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('42.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/42.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/42.js

      - name: Browser smoke test satellite dish and tower beams
        run: |
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/42-http.log 2>&1 &
          cat > /tmp/hero-smoke.js <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            await page.goto('http://127.0.0.1:8000/42.html',{waitUntil:'domcontentloaded'});
            await page.click('.scene-tab[data-scene="1"]');
            await page.waitForTimeout(750);
            await page.mouse.move(1120,170);
            await page.waitForTimeout(350);
            const a=await page.evaluate(()=>({sat:getComputedStyle(document.querySelector('.satellite')).transform,dish:getComputedStyle(document.querySelector('.dish-head')).transform,sx:getComputedStyle(document.querySelector('.hero')).getPropertyValue('--sat-x')}));
            await page.mouse.move(760,430);
            await page.waitForTimeout(350);
            const b=await page.evaluate(()=>({sat:getComputedStyle(document.querySelector('.satellite')).transform,dish:getComputedStyle(document.querySelector('.dish-head')).transform,sx:getComputedStyle(document.querySelector('.hero')).getPropertyValue('--sat-x')}));
            if(a.sat===b.sat || a.dish===b.dish || a.sx===b.sx) throw new Error('Satellite/dish tracking did not change across pointer positions: '+JSON.stringify({a,b}));
            await page.click('.scene-tab[data-scene="2"]');
            await page.waitForTimeout(750);
            await page.mouse.move(420,260);
            await page.waitForTimeout(300);
            const laser=await page.evaluate(()=>{const t=document.querySelector('.tower'),l=document.querySelector('.tower-laser');const cs=getComputedStyle(l);return {aiming:t.classList.contains('aiming'),width:parseFloat(cs.width),opacity:parseFloat(cs.opacity),transform:cs.transform}});
            if(!laser.aiming || !(laser.width>40) || !(laser.opacity>0)) throw new Error('Tower beam did not activate: '+JSON.stringify(laser));
            console.log('Satellite A',a);
            console.log('Satellite B',b);
            console.log('Tower laser',laser);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/hero-smoke.js

      - name: Commit repair and remove one-time workflow
        run: |
          rm .github/workflows/fix-42-pointer-effects-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 42.html .github/workflows/fix-42-pointer-effects-smoke.yml
          git commit -m "Repair Design 42 satellite tracking and tower beams"
          git push
