name: Apply Design 42 laser track v17
on:
  push:
    branches:
      - fix/design42-laser-track-v17
    paths:
      - .github/workflows/design42-laser-track-v17-apply.yml
permissions:
  contents: write
jobs:
  patch-design-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design42-laser-track-v17
          fetch-depth: 0
      - name: Apply laser patch
        run: python .patches/apply_design42_laser_v17.py
      - name: Verify laser patch
        run: |
          grep -q 'province laser track v17' 42-base.html
          grep -q 'width:5px;height:1.5px' 42-base.html
          grep -q 'province-laser-track-v17' 42-base.html
          grep -q 'translateX(var(--laser-travel)) scaleX(0)' 42-base.html
          grep -q 'stage.appendChild(layer)' 42-base.html
      - name: Remove temporary patch files
        run: rm .patches/apply_design42_laser_v17.py .github/workflows/design42-laser-track-v17-apply.yml
      - name: Commit isolated laser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 42-base.html .patches/apply_design42_laser_v17.py .github/workflows/design42-laser-track-v17-apply.yml
          git commit -m 'fix: move a literal 5px laser along province tracks'
          git push origin HEAD:fix/design42-laser-track-v17
