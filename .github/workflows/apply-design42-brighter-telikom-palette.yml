name: Apply brighter Telikom palette to Design 42

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-design42-brighter-telikom-palette.yml

permissions:
  contents: write

jobs:
  apply-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply brighter palette
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('42.html')
          s = p.read_text(encoding='utf-8')
          marker = 'Design 42: brighter Telikom palette v2'
          if marker not in s:
              css_b64 = ''
              block = base64.b64decode(css_b64).decode('utf-8')
              if '</body>' not in s:
                  raise SystemExit('body close not found')
              s = s.replace('</body>', block + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit palette
        shell: bash
        run: |
          rm -f .github/workflows/apply-design42-brighter-telikom-palette.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: rework Design 42 into brighter Telikom palette"
          git push origin HEAD:main
