name: Rebuild Design 41 clean
on:
  push:
    paths:
      - '.github/workflows/rebuild-design41-clean.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write clean rebuilt Design 41
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          parts = [
          """""",
          """""",
          """""",
          """""",
          """"""
          ]
          data = gzip.decompress(base64.b64decode(''.join(parts)))
          pathlib.Path('41.html').write_bytes(data)
          print('wrote', len(data), 'bytes')
          PY
      - name: Validate clean rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('41.html').read_text()
          assert 'gerehu-market-wide.jpg' not in s
          assert 'data-react' not in s
          assert 'proximity-float' not in s
          assert s.count('data-depth') >= 90
          assert 'main>.screen{height:80svh;max-height:80svh;min-height:0!important}' in s
          for sid in ['top','offers','services','business','story','updates','support']:
              assert f'id="{sid}"' in s
          for src in re.findall(r'<img[^>]+src="([^"]+)"',s):
              if src.startswith('assets/'):
                  assert Path(src).exists(), src
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/design41.js').write_text(scripts[-1])
          print('depth layers',s.count('data-depth'),'images',len(re.findall(r'<img',s)))
          PY
          node --check /tmp/design41.js
      - name: Commit rebuilt Design 41
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rebuild-design41-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 41.html .github/workflows/rebuild-design41-clean.yml
          git commit -m 'Rebuild Design 41 from the ground up'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
