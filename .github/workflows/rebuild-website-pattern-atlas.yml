name: Rebuild Website Pattern Atlas

on:
  push:
    paths:
      - "research/website-patterns/taxonomy.json"
      - "research/website-patterns/cohorts/**/cohort.json"
      - "research/website-patterns/cohorts/**/sites/*.json"
      - "scripts/render_website_pattern_atlas.py"
      - "reference-screenshots/**/*.png"
      - "reference-screenshots/**/capture-results.json"
      - "reference-screenshots/**/curated-results.json"
      - ".github/workflows/rebuild-website-pattern-atlas.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-pattern-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Validate inventory and semantic JSON, render atlases, update README
        run: python -c "from PIL import Image; Image.MAX_IMAGE_PIXELS=None; p='scripts/render_website_pattern_atlas.py'; code=open(p, encoding='utf-8').read(); exec(compile(code,p,'exec'), {'__name__':'__main__','__file__':p})"
      - name: Commit generated analysis and README
        run: |
          git add research/website-patterns/generated README.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: rebuild complete website pattern atlas and README"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
