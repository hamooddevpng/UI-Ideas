<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Ideas — All Designs</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #dfe3e8;
      --accent: #0b63ce;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .title-wrap { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2vw, 30px);
      line-height: 1.1;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .jump {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
      max-width: 55vw;
    }

    .jump a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 31px;
      height: 31px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .jump a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    main {
      width: min(1900px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .design {
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(17, 24, 39, .05);
    }

    .design-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--border);
    }

    .design-head strong { font-size: 15px; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions a {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .actions a:hover { text-decoration: underline; }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: white;
    }

    iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    @media (max-width: 980px) {
      .topbar {
        position: static;
        align-items: flex-start;
        flex-direction: column;
      }
      .jump {
        max-width: none;
        justify-content: flex-start;
      }
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      main { padding: 12px; }
      .grid { gap: 14px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title-wrap">
      <h1>UI Ideas — All Designs</h1>
      <p class="subtitle">Live 16:9 landscape previews of designs 1–34 via htmlpreview.github.io</p>
    </div>
    <nav class="jump" aria-label="Jump to design" id="jump"></nav>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    const owner = 'hamooddevpng';
    const repo = 'UI-Ideas';
    const branch = 'main';
    const designs = Array.from({ length: 34 }, (_, i) => i + 1);

    const githubUrl = n => `https://github.com/${owner}/${repo}/blob/${branch}/${n}.html`;
    const previewUrl = n => `https://htmlpreview.github.io/?${githubUrl(n)}`;

    const jump = document.getElementById('jump');
    const grid = document.getElementById('grid');

    designs.forEach(n => {
      const jumpLink = document.createElement('a');
      jumpLink.href = `#design-${n}`;
      jumpLink.textContent = n;
      jumpLink.title = `Jump to design ${n}`;
      jump.appendChild(jumpLink);

      const card = document.createElement('section');
      card.className = 'design';
      card.id = `design-${n}`;

      card.innerHTML = `
        <div class="design-head">
          <strong>Design ${n}</strong>
          <div class="actions">
            <a href="${previewUrl(n)}" target="_blank" rel="noopener noreferrer">Open full design ↗</a>
            <a href="${githubUrl(n)}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
          </div>
        </div>
        <div class="screen">
          <iframe
            src="${previewUrl(n)}"
            title="Design ${n} preview"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      `;

      grid.appendChild(card);
    });
  </script>
</body>
</html>
