<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telikom design ideas shared by Hamood</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--panel:#111722;--text:#f8fafc;--muted:#9aa4b2;--border:#293241;--accent:#26a7e8;--selected:#20b486;--selectedSoft:rgba(32,180,134,.14)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% -10%,rgba(38,167,232,.12),transparent 28%),radial-gradient(circle at 88% 0%,rgba(32,180,134,.07),transparent 24%),var(--bg);color:var(--text);padding-bottom:102px}button,a{font:inherit}.page{width:100%;margin:auto;padding:14px 14px 24px}.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}.title-group{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}h1{margin:0;font-size:clamp(23px,3vw,38px);letter-spacing:-.03em;line-height:1}.collection-label,.counter-pill{flex:0 0 auto;padding:7px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(17,23,34,.86);color:var(--muted);font-size:12px;font-weight:800}.collection-label{color:#c8d1dc}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.control-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.btn,.open-link{min-height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:#dce3ec;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none;transition:.16s ease}.btn:hover,.open-link:hover{border-color:var(--accent);color:#fff;background:#142232}.btn:disabled{opacity:.34;cursor:not-allowed}.shortlist-btn.active{border-color:var(--selected);color:#fff;background:#0f7b60}.browser{overflow:hidden;width:100%;border-radius:14px;border:1px solid #364153;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.45)}.browser-chrome{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:42px;padding:6px 9px;background:linear-gradient(180deg,#242b36,#1b222c);border-bottom:1px solid #343d4a}.browser-dots{display:flex;gap:6px}.browser-dots span{width:10px;height:10px;border-radius:50%;display:block}.browser-dots span:nth-child(1){background:#ff5f57}.browser-dots span:nth-child(2){background:#febc2e}.browser-dots span:nth-child(3){background:#28c840}.address-bar{min-width:0;height:29px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 11px;border:1px solid #343e4c;border-radius:999px;background:#10151d;color:#9ca7b5;font-size:11px;font-weight:650;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.browser-label{min-width:72px;text-align:right;color:#c6cfda;font-size:11px;font-weight:900}.screen{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#fff}.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.design-info{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 14px 13px;border-top:1px solid #e5e7eb;background:#fff;color:#111827}.design-kicker{margin:0 0 3px;color:#0875c9;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.design-title{margin:0;font-size:clamp(18px,1.8vw,25px);line-height:1.08;letter-spacing:-.02em}.design-description{margin:5px 0 0;max-width:1100px;color:#667085;font-size:12.5px;line-height:1.45}.jump-groups{display:grid;gap:8px;margin-top:9px}.jump-section{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:8px;min-width:0;padding:7px;border:1px solid var(--border);border-radius:11px;background:rgba(17,23,34,.9)}.jump-section-label{display:flex;flex-direction:column;gap:2px;padding-left:3px;color:#f7f9fc;font-size:11px;font-weight:900;line-height:1.1}.jump-section-label small{color:var(--muted);font-size:9px;font-weight:750}.jump-strip{display:flex;gap:6px;overflow-x:auto;min-width:0;padding:1px 1px 4px;scrollbar-width:thin;scrollbar-color:#465266 transparent}.jump-btn{flex:0 0 auto;min-width:38px;height:31px;border:1px solid #344052;border-radius:7px;background:#151c27;color:#aeb8c5;cursor:pointer;font-size:11px;font-weight:900}.jump-btn:hover{border-color:var(--accent);color:#fff}.jump-btn.current{border-color:var(--accent);background:#0875c9;color:#fff}.jump-btn.selected:not(.current){border-color:var(--selected);background:var(--selectedSoft);color:#61d3ae}.jump-empty{display:inline-flex;align-items:center;min-height:31px;color:#748094;font-size:10px;font-weight:750;white-space:nowrap}.shortlist-bar{position:fixed;left:50%;bottom:10px;z-index:50;width:min(1160px,calc(100% - 22px));transform:translateX(-50%);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 11px;border-radius:13px;background:rgba(14,19,28,.95);color:#fff;border:1px solid #333d4d;box-shadow:0 18px 46px rgba(0,0,0,.36);backdrop-filter:blur(16px)}.shortlist-heading{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12px;font-weight:900}.count{min-width:24px;height:24px;display:inline-grid;place-items:center;padding:0 6px;border-radius:999px;background:#fff;color:#111827;font-size:11px}.shortlist-items{display:flex;gap:6px;overflow-x:auto;padding:1px}.empty{color:rgba(255,255,255,.5);font-size:11px;white-space:nowrap}.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;min-height:27px;padding:0 7px 0 9px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-size:11px;font-weight:800}.chip button{border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;font-weight:800;padding:0}.chip .remove{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.12)}.cart-actions{display:flex;gap:6px}.cart-actions button{min-height:29px;padding:0 9px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;font-size:11px;font-weight:800;white-space:nowrap}.cart-actions button:disabled{opacity:.34;cursor:not-allowed}
@media(max-width:900px){.hero{align-items:flex-start}.collection-label{display:none}.controls{flex-wrap:wrap}.browser-chrome{grid-template-columns:auto minmax(0,1fr)}.browser-label{display:none}.design-info{grid-template-columns:1fr}.shortlist-bar{grid-template-columns:1fr auto}.shortlist-items{grid-column:1/-1;grid-row:2}.jump-section{grid-template-columns:98px minmax(0,1fr)}}
@media(max-width:560px){body{padding-bottom:132px}.page{padding:10px 7px 18px}.hero{gap:8px}h1{font-size:22px}.browser{border-radius:10px}.address-bar{justify-content:flex-start}.shortlist-bar{bottom:6px;width:calc(100% - 12px)}.cart-actions #openSelected{display:none}.jump-section{grid-template-columns:1fr;gap:5px}.jump-section-label{flex-direction:row;align-items:baseline;gap:6px}}
</style>
</head>
<body>
<main class="page">
<header class="hero"><div class="title-group"><h1>Telikom design ideas shared by Hamood</h1><span class="collection-label" id="collectionLabel">38 homepage concepts</span></div><div class="counter-pill" id="positionCounter">1 / 38</div></header>
<section class="controls" aria-label="Carousel controls"><div class="control-group"><button class="btn" id="prevBtn" type="button">← Previous</button><button class="btn" id="nextBtn" type="button">Next →</button></div><div class="control-group"><button class="btn shortlist-btn" id="shortlistTop" type="button">♡ Shortlist</button><a class="open-link" id="openFull" href="#" target="_blank" rel="noopener noreferrer">Open full design ↗</a></div></section>
<section class="browser" aria-live="polite"><div class="browser-chrome"><div class="browser-dots" aria-hidden="true"><span></span><span></span><span></span></div><div class="address-bar"><span>●</span><span id="addressText">Telikom concept preview</span></div><div class="browser-label" id="browserLabel">Design 38</div></div><div class="screen"><iframe id="designFrame" title="Telikom design preview" loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe></div><div class="design-info"><div><p class="design-kicker" id="designKicker">Design 38</p><h2 class="design-title" id="designTitle">Signal One</h2><p class="design-description" id="designDescription"></p></div><button class="btn shortlist-btn" id="shortlistBottom" type="button">♡ Shortlist</button></div></section>
<section class="jump-groups" aria-label="Jump to a design"><div class="jump-section"><div class="jump-section-label"><span>New designs</span><small>35 and above</small></div><nav class="jump-strip" id="newDesignsStrip" aria-label="New designs"></nav></div><div class="jump-section"><div class="jump-section-label"><span>Old designs</span><small>Designs 7 to 34</small></div><nav class="jump-strip" id="oldDesignsStrip" aria-label="Old designs"></nav></div><div class="jump-section"><div class="jump-section-label"><span>Initial designs</span><small>Designs 1 to 6</small></div><nav class="jump-strip" id="initialDesignsStrip" aria-label="Initial designs"></nav></div></section>
</main>
<aside class="shortlist-bar" aria-label="Shortlisted designs"><div class="shortlist-heading">♥ Shortlist <span class="count" id="shortlistCount">0</span></div><div class="shortlist-items" id="shortlistItems"></div><div class="cart-actions"><button type="button" id="openSelected">Open selected</button><button type="button" id="clearSelected">Clear</button></div></aside>
<script>
const owner='hamooddevpng',repo='UI-Ideas',branch='main';
const fallbackDesigns=Array.from({length:38},(_,i)=>38-i);
let designs=[...fallbackDesigns];
const shortlistKey='ui-ideas-shortlist-v1',currentKey='ui-ideas-carousel-current-design-v2';
const designMeta={
38:{title:'Signal One',description:'A premium light Telikom direction built around a blue signal ribbon, simple service paths and persistent first-screen actions.'},
37:{title:'Pick Your Path',description:'An interaction-led homepage where users choose Mobile, Internet, Business or Help, with persistent action shortcuts.'},
36:{title:'The PNG Connection',description:'A bright visual portal with circular PNG imagery, orbiting service actions and simple task-first navigation.'},
35:{title:'Telikom Pulse',description:'A bright mixed-literacy-friendly campaign carousel with large visual actions, clear PNG messaging and no dark hero.'},
34:{title:'Executive Telikom',description:'A restrained, boardroom-grade direction with disciplined typography, whitespace, clear audience pathways and strong service discovery.'},
33:{title:'Infrastructure First',description:'An architectural, engineering-led concept that presents Telikom first as national telecommunications infrastructure.'},
32:{title:'Swiss Telikom',description:'A rigorous International-style system built around grid discipline, numbered navigation, strong alignment and typography.'},
31:{title:'PNG Modernism',description:'A distinctly Papua New Guinean modernist visual language using abstract geometry, repetition and rhythm.'},
30:{title:'Cardless Corporate',description:'An ultra-refined corporate homepage that avoids the usual rounded-card layout, using type, whitespace, rules and photography.'},
29:{title:'Network Observatory',description:'A premium, information-rich network concept with a technical, dynamic and enterprise-oriented personality.'},
28:{title:'Nation Connected',description:'A PNG-first concept centred on Telikom’s national role and connecting people and places across the country.'},
27:{title:'PNG Editorial',description:'A publication-inspired direction led by strong photography, editorial typography and Papua New Guinean storytelling.'},
26:{title:'Service Exchange',description:'A service-discovery concept focused on clarity and movement between Telikom service categories.'},
25:{title:'Coverage First',description:'A practical direction that makes coverage and service availability the main entry point.'},
24:{title:'Guided Connection',description:'A guided service-selection journey that routes visitors toward relevant Telikom services.'},
23:{title:'Telikom OS',description:'An operating-system-inspired concept that makes Telikom feel like a connected digital platform.'},
22:{title:'People × Technology',description:'A balanced direction pairing PNG human stories with infrastructure and digital capability.'},
21:{title:'PNG Signal Map',description:'Papua New Guinea becomes the main storytelling and navigation surface.'},
20:{title:'Telikom Command',description:'A task-first homepage where search and command are central.'},
19:{title:'Choose Your World',description:'Distinct audience pathways replace one generic hero.'},
18:{title:'Signal Wave',description:'A visual concept built around a continuous signal line.'},
17:{title:'Pocket Telikom',description:'A mobile-minded youthful concept focused on direct actions.'},
16:{title:'Telikom Buddy',description:'A conversational task-chooser approach.'},
15:{title:'Type Storm',description:'A typography-led experiment where type and movement become the interface.'},
14:{title:'Signal Quest',description:'A gamified exploration concept.'},
13:{title:'Telikom Stories',description:'A youthful, story-led direction focused on people and motion.'},
12:{title:'Neo-Brutal Telikom',description:'A bold neo-brutalist direction with hard-edged hierarchy.'},
11:{title:'Sticker Signal',description:'A playful expressive motion-heavy direction.'},
10:{title:'Earlier Exploration 10',description:'An earlier homepage exploration retained for comparison.'},
9:{title:'Earlier Exploration 9',description:'An earlier Telikom homepage experiment.'},
8:{title:'Earlier Exploration 8',description:'An earlier alternate homepage direction.'},
7:{title:'Earlier Exploration 7',description:'A first-round Telikom homepage exploration.'},
6:{title:'Earlier Exploration 6',description:'One of the original homepage mockups.'},
5:{title:'Self-Service Focus',description:'An early direction that gives self-service actions more prominence.'},
4:{title:'PNG / Community Focus',description:'An early concept with a stronger PNG and community feel.'},
3:{title:'Balanced Homepage Direction',description:'An early balanced concept with familiar structure and cleaner presentation.'},
2:{title:'Service-Led Exploration',description:'An early service-oriented homepage direction.'},
1:{title:'Navigation-First Exploration',description:'An early concept focused on simple navigation.'}
};
const $=id=>document.getElementById(id),getMeta=n=>designMeta[n]||{title:`Design ${n}`,description:'A Telikom homepage concept.'},sourceUrl=n=>`https://github.com/${owner}/${repo}/blob/${branch}/${n}.html`,previewUrl=n=>`https://htmlpreview.github.io/?${sourceUrl(n)}`;
const frame=$('designFrame'),collectionLabel=$('collectionLabel'),positionCounter=$('positionCounter'),browserLabel=$('browserLabel'),addressText=$('addressText'),designKicker=$('designKicker'),designTitle=$('designTitle'),designDescription=$('designDescription'),openFull=$('openFull'),prevBtn=$('prevBtn'),nextBtn=$('nextBtn'),shortlistTop=$('shortlistTop'),shortlistBottom=$('shortlistBottom'),newDesignsStrip=$('newDesignsStrip'),oldDesignsStrip=$('oldDesignsStrip'),initialDesignsStrip=$('initialDesignsStrip'),shortlistCount=$('shortlistCount'),shortlistItems=$('shortlistItems'),openSelected=$('openSelected'),clearSelected=$('clearSelected');
let currentIndex=0,selected=loadSelected();
function loadSelected(){try{const v=JSON.parse(localStorage.getItem(shortlistKey));return Array.isArray(v)?v.map(Number).filter(Number.isFinite).filter((n,i,a)=>a.indexOf(n)===i):[]}catch{return[]}}
function saveSelected(){localStorage.setItem(shortlistKey,JSON.stringify(selected))}
function currentDesign(){return designs[currentIndex]||designs[0]||1}
function restoreCurrent(){const s=Number(localStorage.getItem(currentKey)),i=designs.indexOf(s);currentIndex=i>=0?i:0}
function goToIndex(i){currentIndex=Math.max(0,Math.min(designs.length-1,i));localStorage.setItem(currentKey,String(currentDesign()));renderCurrent()}
function goToDesign(n){const i=designs.indexOf(n);if(i>=0)goToIndex(i)}
function toggleSelected(n){selected=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n].sort((a,b)=>b-a);saveSelected();renderSelection()}
function makeJumpButton(n){const b=document.createElement('button');b.type='button';b.className='jump-btn';b.dataset.design=n;b.textContent=n;b.title=`${n}: ${getMeta(n).title}`;b.onclick=()=>goToDesign(n);return b}
function renderStrip(el,vals,empty=''){el.innerHTML='';if(!vals.length){const s=document.createElement('span');s.className='jump-empty';s.textContent=empty;el.appendChild(s);return}vals.forEach(n=>el.appendChild(makeJumpButton(n)))}
function renderJumpGroups(){renderStrip(newDesignsStrip,designs.filter(n=>n>34).sort((a,b)=>b-a),'No designs above 34 yet.');renderStrip(oldDesignsStrip,designs.filter(n=>n>=7&&n<=34).sort((a,b)=>b-a));renderStrip(initialDesignsStrip,designs.filter(n=>n>=1&&n<=6).sort((a,b)=>b-a))}
function renderCurrent(){const n=currentDesign(),m=getMeta(n),url=previewUrl(n);frame.src=url;frame.title=`Design ${n}: ${m.title}`;collectionLabel.textContent=`${designs.length} homepage concepts in one place`;positionCounter.textContent=`${currentIndex+1} / ${designs.length}`;browserLabel.textContent=`Design ${n}`;addressText.textContent=`Telikom concept ${n}: ${m.title}`;designKicker.textContent=`Design ${n}`;designTitle.textContent=m.title;designDescription.textContent=m.description;openFull.href=url;prevBtn.disabled=currentIndex===0;nextBtn.disabled=currentIndex===designs.length-1;renderSelection();requestAnimationFrame(()=>document.querySelector('.jump-btn.current')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}))}
function renderSelection(){const n=currentDesign(),picked=selected.includes(n);[shortlistTop,shortlistBottom].forEach(b=>{b.classList.toggle('active',picked);b.setAttribute('aria-pressed',String(picked));b.textContent=picked?'✓ Shortlisted':'♡ Shortlist'});selected=selected.filter(x=>designs.includes(x));saveSelected();shortlistCount.textContent=selected.length;openSelected.disabled=clearSelected.disabled=!selected.length;document.querySelectorAll('.jump-btn').forEach(b=>{const d=Number(b.dataset.design);b.classList.toggle('current',d===n);b.classList.toggle('selected',selected.includes(d))});shortlistItems.innerHTML='';if(!selected.length){shortlistItems.innerHTML='<span class="empty">Pick the designs you like most.</span>';return}selected.forEach(d=>{const c=document.createElement('div');c.className='chip';const v=document.createElement('button');v.type='button';v.textContent=`Design ${d}`;v.onclick=()=>goToDesign(d);const r=document.createElement('button');r.type='button';r.className='remove';r.textContent='×';r.setAttribute('aria-label',`Remove Design ${d} from shortlist`);r.onclick=()=>toggleSelected(d);c.append(v,r);shortlistItems.appendChild(c)})}
async function discoverDesigns(){try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}`,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(r.status);const f=await r.json(),d=f.map(x=>x.name).map(n=>n.match(/^(\d+)\.html$/)).filter(Boolean).map(m=>Number(m[1])).filter(Number.isFinite).sort((a,b)=>b-a);if(d.length)designs=d}catch(e){console.warn('Could not discover design files. Using the 1 to 38 fallback.',e);designs=[...fallbackDesigns]}selected=selected.filter(n=>designs.includes(n));restoreCurrent();renderJumpGroups();renderCurrent()}
prevBtn.onclick=()=>goToIndex(currentIndex-1);nextBtn.onclick=()=>goToIndex(currentIndex+1);shortlistTop.onclick=shortlistBottom.onclick=()=>toggleSelected(currentDesign());clearSelected.onclick=()=>{selected=[];saveSelected();renderSelection()};openSelected.onclick=()=>selected.forEach(n=>window.open(previewUrl(n),'_blank','noopener,noreferrer'));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')goToIndex(currentIndex-1);if(e.key==='ArrowRight')goToIndex(currentIndex+1);if(e.key.toLowerCase()==='s')toggleSelected(currentDesign())});renderJumpGroups();renderCurrent();discoverDesigns();
</script>
</body>
</html>
