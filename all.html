<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telikom design ideas shared by Hamood</title><style>
:root{color-scheme:dark;--bg:#080b11;--panel:#111722;--text:#f8fafc;--muted:#9aa4b2;--border:#293241;--accent:#26a7e8;--selected:#20b486}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:96px}.page{padding:14px}.hero,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.title-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:clamp(22px,3vw,38px);letter-spacing:-.03em}.pill,.btn,.open-link{border:1px solid var(--border);background:var(--panel);color:#dce3ec;border-radius:9px}.pill{padding:7px 10px;font-size:12px;font-weight:800;color:var(--muted)}.control-group{display:flex;gap:7px}.btn,.open-link{min-height:34px;padding:0 11px;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none}.btn:hover,.open-link:hover{border-color:var(--accent);color:#fff}.browser{overflow:hidden;border:1px solid #364153;border-radius:14px;background:#fff}.chrome{min-height:42px;padding:6px 9px;background:#1c2430;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.dots{display:flex;gap:6px}.dots span{width:10px;height:10px;border-radius:50%;display:block}.dots span:nth-child(1){background:#ff5f57}.dots span:nth-child(2){background:#febc2e}.dots span:nth-child(3){background:#28c840}.address{height:29px;border:1px solid #343e4c;border-radius:999px;background:#10151d;color:#9ca7b5;display:flex;align-items:center;justify-content:center;font-size:11px}.browser-label{font-size:11px;font-weight:900;color:#c6cfda}.screen{position:relative;aspect-ratio:16/9;background:#fff}.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.info{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:6px;padding:7px 10px;background:#0d131d;color:#f8fafc;border:1px solid #263140;border-radius:10px}.kicker{margin:0 0 1px;color:#4db8ef;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.title{margin:0;font-size:14px;line-height:1.2}.desc{margin:3px 0 0;color:#98a4b3;font-size:10px;line-height:1.35;max-width:980px}.info .btn{min-height:29px;padding:0 9px;font-size:10px}.jump-groups{display:grid;gap:8px;margin-top:9px}.jump-section{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center;padding:7px;border:1px solid var(--border);border-radius:11px;background:var(--panel)}.jump-label{font-size:11px;font-weight:900}.jump-label small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.jump-strip{display:flex;gap:6px;overflow-x:auto}.jump-btn{flex:0 0 auto;min-width:38px;height:31px;border:1px solid #344052;border-radius:7px;background:#151c27;color:#aeb8c5;cursor:pointer;font-size:11px;font-weight:900}.jump-btn.current{border-color:var(--accent);background:#0875c9;color:#fff}.jump-btn.selected:not(.current){border-color:var(--selected);color:#61d3ae}.shortlist{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(1160px,calc(100% - 22px));z-index:50;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:9px 11px;border:1px solid #333d4d;border-radius:13px;background:rgba(14,19,28,.96)}.shortlist-items{display:flex;gap:6px;overflow-x:auto}.chip{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px}.chip button{border:0;background:transparent;color:#fff;cursor:pointer}.empty{font-size:11px;color:#8c98a8}.shortlist-btn.active{border-color:var(--selected);background:#0f7b60;color:#fff}@media(max-width:700px){.chrome{grid-template-columns:auto 1fr}.browser-label{display:none}.info{grid-template-columns:1fr;padding:7px 9px}.desc{font-size:9.5px}.jump-section{grid-template-columns:1fr}.shortlist{grid-template-columns:1fr auto}.shortlist-items{grid-column:1/-1}.openSelected{display:none}}
</style></head><body><main class="page"><header class="hero"><div class="title-group"><h1>Telikom design ideas shared by Hamood</h1><span class="pill" id="collectionLabel">38 homepage concepts</span></div><span class="pill" id="positionCounter">1 / 38</span></header><section class="controls"><div class="control-group"><button class="btn" id="prevBtn">← Previous</button><button class="btn" id="nextBtn">Next →</button></div><div class="control-group"><button class="btn shortlist-btn" id="shortlistTop">♡ Shortlist</button><a class="open-link" id="openFull" href="#" target="_blank" rel="noopener noreferrer">Open full design ↗</a></div></section><section class="browser"><div class="chrome"><div class="dots"><span></span><span></span><span></span></div><div class="address" id="addressText">Telikom concept preview</div><div class="browser-label" id="browserLabel">Design 42</div></div><div class="screen"><iframe id="designFrame" title="Telikom design preview"></iframe></div></section><section class="info"><div><p class="kicker" id="designKicker">Design 42</p><h2 class="title" id="designTitle">Telikom Horizon</h2><p class="desc" id="designDescription"></p></div><button class="btn shortlist-btn" id="shortlistBottom">♡ Shortlist</button></section><section class="jump-groups"><div class="jump-section"><div class="jump-label">New designs<small>40 and above</small></div><nav class="jump-strip" id="newDesignsStrip"></nav></div><div class="jump-section"><div class="jump-label">Old designs<small>Designs 7 to 39</small></div><nav class="jump-strip" id="oldDesignsStrip"></nav></div><div class="jump-section"><div class="jump-label">Initial designs<small>Designs 1 to 6</small></div><nav class="jump-strip" id="initialDesignsStrip"></nav></div></section></main><aside class="shortlist"><strong>♥ Shortlist <span id="shortlistCount">0</span></strong><div class="shortlist-items" id="shortlistItems"></div><div class="control-group"><button class="btn openSelected" id="openSelected">Open selected</button><button class="btn" id="clearSelected">Clear</button></div></aside><script>
const owner='hamooddevpng',repo='UI-Ideas',branch='main';const randomCache=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const fallbackDesigns=[42,...Array.from({length:37},(_,i)=>37-i)];let designs=[...fallbackDesigns];const shortlistKey='ui-ideas-shortlist-v1',currentKey='ui-ideas-carousel-current-design-v2';const designMeta={42:{title:'Telikom Horizon',description:'The advanced showcase concept. A user-controlled three-scene hero combines Pocket Telikom, remote connectivity and enterprise infrastructure with reactive motion, tactile utilities and a cinematic but stable homepage architecture.'},37:{title:'Direct Service Console',description:'A sharp task-first utility interface with selectable Mobile, Internet, Business and Help routes, a live service console and persistent command actions for Recharge, Pay Bill, Self Care, Coverage and Support.'},36:{title:'PNG Stories',description:'A photographic editorial direction with warm neutral tones, large story-led typography, rotating PNG, Mobile and Business narratives, and a compact vertical quick-action rail.'},35:{title:'Telikom Hub',description:'A service-first hub with Recharge, Pay Bill, Buy Data and My Telikom at the centre, a supporting service rail, campaign carousel, Mobile, Home Internet and Business and Government discovery, plus support and official links.'},34:{title:'Executive Telikom',description:'A restrained, boardroom-grade direction with disciplined typography, whitespace, clear audience pathways and strong service discovery.'},33:{title:'Infrastructure First',description:'An architectural, engineering-led concept that presents Telikom first as national telecommunications infrastructure.'},32:{title:'Swiss Telikom',description:'A rigorous International-style system built around grid discipline, numbered navigation, strong alignment and typography.'},31:{title:'PNG Modernism',description:'A distinctly Papua New Guinean modernist visual language using abstract geometry, repetition and rhythm.'},30:{title:'Cardless Corporate',description:'An ultra-refined corporate homepage that avoids the usual rounded-card layout.'},29:{title:'Network Observatory',description:'A premium, information-rich network concept.'},28:{title:'Nation Connected',description:'A PNG-first concept centred on Telikom’s national role.'},27:{title:'PNG Editorial',description:'A publication-inspired direction led by photography and storytelling.'},26:{title:'Service Exchange',description:'A service-discovery concept focused on clarity.'},25:{title:'Coverage First',description:'Coverage and service availability as the main entry point.'},24:{title:'Guided Connection',description:'A guided service-selection journey.'},23:{title:'Telikom OS',description:'An operating-system-inspired concept.'},22:{title:'People × Technology',description:'PNG human stories paired with technology.'},21:{title:'PNG Signal Map',description:'Papua New Guinea becomes the navigation surface.'},20:{title:'Telikom Command',description:'A task-first homepage where search and command are central.'},19:{title:'Choose Your World',description:'Distinct audience pathways.'},18:{title:'Signal Wave',description:'A continuous signal-line concept.'},17:{title:'Pocket Telikom',description:'A mobile-minded youthful concept.'},16:{title:'Telikom Buddy',description:'A conversational task chooser.'},15:{title:'Type Storm',description:'A typography-led experiment.'},14:{title:'Signal Quest',description:'A gamified exploration concept.'},13:{title:'Telikom Stories',description:'A youthful story-led direction.'},12:{title:'Neo-Brutal Telikom',description:'A bold neo-brutalist direction.'},11:{title:'Sticker Signal',description:'A playful expressive direction.'},10:{title:'Earlier Exploration 10',description:'Earlier homepage exploration.'},9:{title:'Earlier Exploration 9',description:'Earlier homepage experiment.'},8:{title:'Earlier Exploration 8',description:'Earlier alternate homepage direction.'},7:{title:'Earlier Exploration 7',description:'First-round homepage exploration.'},6:{title:'Earlier Exploration 6',description:'Original homepage mockup.'},5:{title:'Self-Service Focus',description:'An early self-service direction.'},4:{title:'PNG / Community Focus',description:'An early PNG and community direction.'},3:{title:'Balanced Homepage Direction',description:'An early balanced concept.'},2:{title:'Service-Led Exploration',description:'An early service-oriented direction.'},1:{title:'Navigation-First Exploration',description:'An early navigation-focused concept.'}};const $=id=>document.getElementById(id),meta=n=>designMeta[n]||{title:`Design ${n}`,description:'A Telikom homepage concept.'},src=n=>`https://github.com/${owner}/${repo}/blob/${branch}/${n}.html?cache=${randomCache()}`,preview=n=>`https://htmlpreview.github.io/?${src(n)}`;let currentIndex=0,selected=(()=>{try{return JSON.parse(localStorage.getItem(shortlistKey))||[]}catch{return[]}})();const frame=$('designFrame');function cur(){return designs[currentIndex]||42}function save(){localStorage.setItem(shortlistKey,JSON.stringify(selected))}function goto(i){currentIndex=Math.max(0,Math.min(designs.length-1,i));localStorage.setItem(currentKey,String(cur()));render()}function gotoDesign(n){const i=designs.indexOf(n);if(i>=0)goto(i)}function toggle(n){selected=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n].sort((a,b)=>b-a);save();renderSelection()}function strip(el,vals){el.innerHTML='';vals.forEach(n=>{const b=document.createElement('button');b.className='jump-btn';b.dataset.design=n;b.textContent=n;b.onclick=()=>gotoDesign(n);el.appendChild(b)})}function renderStrips(){strip($('newDesignsStrip'),designs.filter(n=>n>=40).sort((a,b)=>b-a));strip($('oldDesignsStrip'),designs.filter(n=>n>=7&&n<=39).sort((a,b)=>b-a));strip($('initialDesignsStrip'),designs.filter(n=>n<=6).sort((a,b)=>b-a))}function render(){const n=cur(),m=meta(n),u=preview(n);frame.src=u;$('collectionLabel').textContent=`${designs.length} homepage concepts`;$('positionCounter').textContent=`${currentIndex+1} / ${designs.length}`;$('browserLabel').textContent=`Design ${n}`;$('addressText').textContent=`Telikom concept ${n}: ${m.title}`;$('designKicker').textContent=`Design ${n}`;$('designTitle').textContent=m.title;$('designDescription').textContent=m.description;$('openFull').href=u;$('prevBtn').disabled=currentIndex===0;$('nextBtn').disabled=currentIndex===designs.length-1;renderSelection()}function renderSelection(){const n=cur(),picked=selected.includes(n);[$('shortlistTop'),$('shortlistBottom')].forEach(b=>{b.classList.toggle('active',picked);b.textContent=picked?'✓ Shortlisted':'♡ Shortlist'});selected=selected.filter(x=>designs.includes(x));save();$('shortlistCount').textContent=selected.length;document.querySelectorAll('.jump-btn').forEach(b=>{const d=+b.dataset.design;b.classList.toggle('current',d===n);b.classList.toggle('selected',selected.includes(d))});const box=$('shortlistItems');box.innerHTML='';if(!selected.length){box.innerHTML='<span class="empty">Pick the designs you like most.</span>';return}selected.forEach(d=>{const c=document.createElement('span');c.className='chip';const v=document.createElement('button');v.textContent=`Design ${d}`;v.onclick=()=>gotoDesign(d);const x=document.createElement('button');x.textContent=' ×';x.onclick=()=>toggle(d);c.append(v,x);box.appendChild(c)})}async function discover(){try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}`);if(!r.ok)throw 0;const f=await r.json();const d=f.map(x=>x.name.match(/^(\d+)\.html$/)).filter(Boolean).map(m=>+m[1]).sort((a,b)=>b-a);if(d.length)designs=d}catch{designs=[...fallbackDesigns]}const saved=+localStorage.getItem(currentKey),i=designs.indexOf(saved);currentIndex=i>=0?i:0;renderStrips();render()}$('prevBtn').onclick=()=>goto(currentIndex-1);$('nextBtn').onclick=()=>goto(currentIndex+1);$('shortlistTop').onclick=$('shortlistBottom').onclick=()=>toggle(cur());$('clearSelected').onclick=()=>{selected=[];save();renderSelection()};$('openSelected').onclick=()=>selected.forEach(n=>window.open(preview(n),'_blank','noopener,noreferrer'));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')goto(currentIndex-1);if(e.key==='ArrowRight')goto(currentIndex+1)});renderStrips();render();discover();
</script></body></html>
