<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Telikom PNG | Loading Design 42…</title>
<style>
html,body{margin:0;min-height:100%;font-family:Manrope,Arial,sans-serif;background:#f4fafc;color:#10384c}
#boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
#boot b{display:block;font-size:22px;letter-spacing:-.03em;margin-bottom:7px}
#boot span{font-size:12px;color:#6d8794}
</style>
</head>
<body>
<div id="boot"><div><b>Loading Design 42…</b><span>Preparing the Digital PNG experience.</span></div></div>
<script>
(async()=>{
  const resolveSourceRoot=()=>{
    const embedded=decodeURIComponent(location.search.slice(1));
    if(/^https:\/\/raw\.githubusercontent\.com\//i.test(embedded)){
      try{
        const raw=new URL(embedded);
        raw.hash='';
        raw.search='';
        raw.pathname=raw.pathname.replace(/\/42\.html$/,'/');
        return raw.href;
      }catch(error){console.warn('Could not parse htmlpreview source URL.',error)}
    }
    return new URL('./',location.href).href;
  };

  const sourceRoot=resolveSourceRoot();
  const source=name=>new URL(name,sourceRoot).href;
  const fetchText=async url=>{
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error(`${response.status} ${response.statusText} · ${url}`);
    return response.text();
  };
  const addStyle=(page,css,attribute)=>{
    const style=page.createElement('style');
    style.setAttribute(attribute,'');
    style.textContent=css;
    page.head.appendChild(style);
  };

  try{
    const [baseHtml,ecosystemHtml,chatCss]=await Promise.all([
      fetchText(source('42-base.html')),
      fetchText(source('design42-ecosystem-v2.html')).catch(error=>{console.warn('Digital PNG enhancement could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-chat.css'))
    ]);

    const parser=new DOMParser();
    const page=parser.parseFromString(baseHtml,'text/html');
    const base=page.createElement('base');
    base.href=sourceRoot;
    page.head.prepend(base);

    if(ecosystemHtml){
      const prototype=parser.parseFromString(ecosystemHtml,'text/html');
      const oldSection=page.querySelector('.digital-ecosystem');
      const newSection=prototype.querySelector('.eco-section');
      if(oldSection&&newSection){
        const prototypeStyle=prototype.querySelector('style');
        if(prototypeStyle)addStyle(page,prototypeStyle.textContent,'data-design42-ecosystem-v2');
        oldSection.replaceWith(page.importNode(newSection,true));
        const prototypeScript=prototype.querySelector('body > script');
        if(prototypeScript){
          const script=page.createElement('script');
          script.setAttribute('data-design42-ecosystem-v2','');
          script.textContent=prototypeScript.textContent;
          page.body.appendChild(script);
        }
      }else{
        console.warn('Digital PNG enhancement target was not found; stable base section retained.');
      }
    }

    addStyle(page,chatCss,'data-design42-chat-popup');

    document.open();
    document.write('<!doctype html>'+page.documentElement.outerHTML);
    document.close();
  }catch(error){
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML=`<div><b>Design 42 could not load.</b><span>${String(error.message||error)}</span></div>`;
    console.error(error);
  }
})();
</script>
</body>
</html>
