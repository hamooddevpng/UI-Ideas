<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Telikom PNG | Loading Design 42…</title>
<style>
html,body{margin:0;min-height:100%;font-family:Manrope,Arial,sans-serif;background:#f4fafc;color:#10384c}
#boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
#boot b{display:block;font-size:22px;letter-spacing:-.03em;margin-bottom:7px}
#boot span{font-size:12px;color:#6d8794}
</style>
</head>
<body>
<div id="boot"><div><b>Loading Design 42…</b><span>Preparing the Digital PNG experience.</span></div></div>
<script>
(async()=>{
  const resolveSourceRoot=()=>{
    const injectedBase=new URL('./',document.baseURI).href;
    if(/^https:\/\/raw\.githubusercontent\.com\//i.test(injectedBase))return injectedBase;

    const embedded=decodeURIComponent(location.search.slice(1));
    if(/^https:\/\/raw\.githubusercontent\.com\//i.test(embedded)){
      try{
        const raw=new URL(embedded);
        raw.hash='';
        raw.search='';
        raw.pathname=raw.pathname.replace(/\/42\.html$/,'/');
        return raw.href;
      }catch(error){console.warn('Could not parse htmlpreview source URL.',error)}
    }
    return new URL('./',location.href).href;
  };

  const sourceRoot=resolveSourceRoot();
  const source=name=>new URL(name,sourceRoot).href;
  const fetchText=async url=>{
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error(`${response.status} ${response.statusText} · ${url}`);
    return response.text();
  };
  const addStyle=(page,css,attribute)=>{
    if(!css)return;
    const style=page.createElement('style');
    style.setAttribute(attribute,'');
    style.textContent=css;
    page.head.appendChild(style);
  };
  const syncQuickActions=(page)=>{
    const deck=page.getElementById('quickDeck');
    if(!deck)return;

    deck.classList.remove('quick-deck-eight');
    deck.classList.add('quick-deck-nine');

    let cards=[...deck.querySelectorAll('.quick-card')];
    const transferCard=cards.find(card=>card.querySelector('h3')?.textContent.trim()==='Transfer');
    if(transferCard){
      transferCard.querySelector('h3').textContent='T-Cash';
    }

    const hasPersonal=cards.some(card=>card.querySelector('h3')?.textContent.trim()==='Personal');
    if(!hasPersonal){
      const personal=page.createElement('a');
      personal.className='quick-card';
      personal.href='/personal/mobile';
      personal.style.setProperty('--qrot','-1.1deg');
      personal.innerHTML='<div class="q-top"><span class="q-num">06 / PERSONAL</span><span class="q-icon">◎</span></div><h3>Personal</h3><p>Mobile, home internet and devices for you.</p>';
      if(transferCard?.parentNode)transferCard.parentNode.insertBefore(personal,transferCard.nextSibling);
      else deck.appendChild(personal);
    }

    const categories={
      'Top Up':'RECHARGE',
      'Balance':'ACCOUNT',
      'Pay Bill':'BILLING',
      'Bundles':'BUNDLES',
      'T-Cash':'T-CASH',
      'Personal':'PERSONAL',
      'Internet':'INTERNET',
      'Business':'BUSINESS',
      'Support':'HELP'
    };
    cards=[...deck.querySelectorAll('.quick-card')];
    cards.forEach((card,index)=>{
      card.dataset.quickIndex=String(index+1);
      card.style.setProperty('--qdelay',`${index*55}ms`);
      const title=card.querySelector('h3')?.textContent.trim();
      const number=String(index+1).padStart(2,'0');
      const label=categories[title];
      const qnum=card.querySelector('.q-num');
      if(qnum&&label)qnum.textContent=`${number} / ${label}`;
    });
  };

  try{
    const [baseHtml,coreCss,ecosystemHtml,ecosystemCss,ecosystemCleanCss,ecosystemCleanJs,serviceScrollCss,serviceScrollJs,componentCss,themeCss,chatCss,shellCss,shellJs,actionsCss,actionsJs,productsCss,productsJs,brandCss]=await Promise.all([
      fetchText(source('42-base.html')),
      fetchText(source('assets/design42/design42-core.css')),
      fetchText(source('design42-ecosystem-v2.html')).catch(error=>{console.warn('Digital PNG enhancement markup could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-ecosystem.css')).catch(error=>{console.warn('Digital PNG enhancement styles could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-ecosystem-clean.css')).catch(error=>{console.warn('Digital PNG cleanup styles could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-ecosystem-clean.js')).catch(error=>{console.warn('Digital PNG cleanup behavior could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-service-scroll.css')).catch(error=>{console.warn('Service scroll styles could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-service-scroll.js')).catch(error=>{console.warn('Service scroll behavior could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-components.css')),
      fetchText(source('assets/design42/design42-theme.css')),
      fetchText(source('assets/design42/design42-chat.css')),
      fetchText(source('assets/design42/design42-shell-sync.css')).catch(error=>{console.warn('Concise shell sync styles could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-shell-sync.js')).catch(error=>{console.warn('Concise shell sync behavior could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-actions-sync.css')).catch(error=>{console.warn('Quick action sync styles could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-actions-sync.js')).catch(error=>{console.warn('Self Care link sync could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-products.css')).catch(error=>{console.warn('Featured products styles could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-products.js')).catch(error=>{console.warn('Featured products behavior could not be loaded.',error);return ''}),
      fetchText(source('assets/design42/design42-brand-guidelines.css')).catch(error=>{console.warn('Telikom brand guidelines could not be loaded.',error);return ''})
    ]);

    const parser=new DOMParser();
    const page=parser.parseFromString(baseHtml,'text/html');
    const base=page.createElement('base');
    base.href=sourceRoot;
    page.head.prepend(base);
    syncQuickActions(page);

    // 1. Core page/component structure and motion.
    addStyle(page,coreCss,'data-design42-core');

    // 2. Digital PNG prototype owns its isolated ecosystem section.
    if(ecosystemHtml&&ecosystemCss){
      const prototype=parser.parseFromString(ecosystemHtml,'text/html');
      const oldSection=page.querySelector('.digital-ecosystem');
      const newSection=prototype.querySelector('.eco-section');
      if(oldSection&&newSection){
        addStyle(page,ecosystemCss,'data-design42-ecosystem-v2');
        oldSection.replaceWith(page.importNode(newSection,true));
        const prototypeScript=prototype.querySelector('body > script');
        if(prototypeScript){
          const script=page.createElement('script');
          script.setAttribute('data-design42-ecosystem-v2','');
          script.textContent=prototypeScript.textContent;
          page.body.appendChild(script);
        }
        if(ecosystemCleanJs){
          const cleanupScript=page.createElement('script');
          cleanupScript.setAttribute('data-design42-ecosystem-clean','');
          cleanupScript.textContent=ecosystemCleanJs;
          page.body.appendChild(cleanupScript);
        }
      }else{
        console.warn('Digital PNG enhancement target was not found; stable base section retained.');
      }
    }

    // 3. Components added after the original core prototype.
    addStyle(page,componentCss,'data-design42-components');
    // 4. One page theme owns color treatment.
    addStyle(page,themeCss,'data-design42-theme');
    // 5. Mobile service stories use an isolated vertical-to-horizontal scroll layer.
    addStyle(page,serviceScrollCss,'data-design42-service-scroll');
    if(serviceScrollJs){
      const serviceScrollScript=page.createElement('script');
      serviceScrollScript.setAttribute('data-design42-service-scroll','');
      serviceScrollScript.textContent=serviceScrollJs;
      page.body.appendChild(serviceScrollScript);
    }
    // 6. Ecosystem cleanup is intentionally late for the Digital PNG section.
    addStyle(page,ecosystemCleanCss,'data-design42-ecosystem-clean');
    // 7. Popup chat presentation is intentionally last and isolated.
    addStyle(page,chatCss,'data-design42-chat-popup');
    // 8. Concise Home shell content is applied last without disturbing Design 42 sections.
    addStyle(page,shellCss,'data-design42-shell-sync');
    if(shellJs){
      const shellScript=page.createElement('script');
      shellScript.setAttribute('data-design42-shell-sync','');
      shellScript.textContent=shellJs.replace("document.querySelector('footer')","document.querySelector('main + footer')");
      page.body.appendChild(shellScript);
    }
    // 9. Quick Actions layout and Self Care destinations are the final shell-level sync.
    addStyle(page,actionsCss,'data-design42-actions-sync');
    if(actionsJs){
      const actionsScript=page.createElement('script');
      actionsScript.setAttribute('data-design42-actions-sync','');
      actionsScript.textContent=actionsJs;
      page.body.appendChild(actionsScript);
    }
    // 10. Featured devices are isolated from the core page and inserted before Support.
    addStyle(page,productsCss,'data-design42-products');
    if(productsJs){
      const productsScript=page.createElement('script');
      productsScript.setAttribute('data-design42-products','');
      productsScript.textContent=productsJs;
      page.body.appendChild(productsScript);
    }
    // 11. Official Telikom brand guidelines are the final visual authority.
    addStyle(page,brandCss,'data-design42-brand-guidelines');

    document.open();
    document.write('<!doctype html>'+page.documentElement.outerHTML);
    document.close();
  }catch(error){
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML=`<div><b>Design 42 could not load.</b><span>${String(error.message||error)}</span></div>`;
    console.error(error);
  }
})();
</script>
</body>
</html>
