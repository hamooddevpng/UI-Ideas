<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Telikom PNG | Loading Design 42…</title>
<style>
html,body{margin:0;min-height:100%;font-family:Manrope,Arial,sans-serif;background:#f4fafc;color:#10384c}#boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}#boot b{display:block;font-size:22px;letter-spacing:-.03em;margin-bottom:7px}#boot span{font-size:12px;color:#6d8794}
</style>
</head>
<body>
<div id="boot"><div><b>Loading Design 42…</b><span>Preparing the Digital PNG experience.</span></div></div>
<script>
(async()=>{
  const BASE='https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/42-base.html?v=20260911';
  const ECOSYSTEM='https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/design42-ecosystem-v2.html?v=20260911';
  const fetchText=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.text()};
  try{
    const baseHtml=await fetchText(BASE);
    const parser=new DOMParser();
    const page=parser.parseFromString(baseHtml,'text/html');
    const base=page.createElement('base');
    base.href='https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/';
    page.head.prepend(base);

    try{
      const protoHtml=await fetchText(ECOSYSTEM);
      const proto=parser.parseFromString(protoHtml,'text/html');
      const oldSection=page.querySelector('.digital-ecosystem');
      const newSection=proto.querySelector('.eco-section');
      if(oldSection&&newSection){
        const prototypeStyle=proto.querySelector('style');
        if(prototypeStyle){const style=page.createElement('style');style.setAttribute('data-design42-ecosystem-v2','');style.textContent=prototypeStyle.textContent;page.head.appendChild(style)}
        oldSection.replaceWith(page.importNode(newSection,true));
        const prototypeScript=proto.querySelector('body > script');
        if(prototypeScript){const script=page.createElement('script');script.setAttribute('data-design42-ecosystem-v2','');script.textContent=prototypeScript.textContent;page.body.appendChild(script)}
      }else console.warn('Design 42 ecosystem enhancement was not applied because the target section was not found.');
    }catch(ecosystemError){console.warn('Design 42 ecosystem enhancement failed; loading the stable base instead.',ecosystemError)}

    const backupPaletteStyle=page.createElement('style');
    backupPaletteStyle.setAttribute('data-design42-backup-palette-v2','');
    backupPaletteStyle.textContent=`
/* Design 42: rendered backup palette fidelity */
:root{
  --blue:#0875c9!important;
  --cyan:#1ca0e8!important;
  --green:#20a957!important;
  --navy:#061925!important;
  --navy2:#0a2838!important;
  --deep-bg:#061925!important;
  --ink:#102b3c!important;
  --ice:#f5fafc!important;
  --sky:#e9f6fc!important;
  --white:#fff!important;
  --muted:#708995!important;
  --line:rgba(16,43,60,.12)!important;
}
html{background:#061925!important}
body{background:#f5fafc!important;color:#102b3c!important}
.site-header.scrolled{background:rgba(6,25,37,.9)!important;border-bottom-color:rgba(255,255,255,.09)!important}
.hero{background:#061925!important}
.scene-phone{background:radial-gradient(circle at 76% 43%,rgba(29,156,227,.25),transparent 28%),linear-gradient(115deg,#061925 0 52%,#0a2e42 100%)!important}
.scene-phone:after{background:linear-gradient(90deg,rgba(6,25,37,.56) 0%,rgba(6,25,37,.26) 45%,rgba(6,25,37,.05) 72%,transparent 100%)!important}
.scene-enterprise{background:radial-gradient(circle at 76% 50%,rgba(33,160,243,.18),transparent 25%),linear-gradient(120deg,#03151e,#072535 65%,#0a3347)!important}
.scene-tabs{background:rgba(4,23,33,.45)!important;border-color:rgba(255,255,255,.14)!important}
.float-pill{background:rgba(10,42,59,.74)!important}
.btn.dark{background:#061925!important;color:#fff!important;border-color:#061925!important}
.overlay-action:hover,.overlay-action.active{background:#061925!important;color:#fff!important}

.quick-launchpad .quick-deck{background:radial-gradient(430px circle at var(--deck-x) var(--deck-y),rgba(117,218,255,.17),transparent 60%),rgba(255,255,255,.96)!important;box-shadow:0 28px 76px rgba(4,28,41,.18)!important}
.quick-launchpad .quick-card{background:rgba(255,255,255,.88)!important;border-color:rgba(16,43,60,.085)!important;color:#102b3c!important}
.quick-launchpad .quick-card:hover,.quick-launchpad .quick-card:focus-visible{background:#fbfeff!important;border-color:rgba(28,160,232,.38)!important}
.quick-launchpad .q-icon{background:linear-gradient(145deg,#e7f7fd,#d8f0fb)!important;color:#0875c9!important}
.quick-launchpad .quick-card:hover .q-icon,.quick-launchpad .quick-card:focus-visible .q-icon{background:#061925!important;color:#9ee7ff!important}

.offers,.raffle-offers{background:#fff!important}
.offer-feature{background:linear-gradient(145deg,#e5f5fc,#f9fdff)!important}
.offer-option{background:#fff!important;border-color:rgba(16,43,60,.12)!important}
.offer-option:hover,.offer-option.active{background:#061925!important;color:#fff!important}
.personal-offer{background:#fff!important;border-color:rgba(16,43,60,.1)!important}
.personal-offer-media{background:linear-gradient(145deg,#dff2fb,#edf8fc)!important}
.personal-offer-icon{background:#061925!important;color:#8edbff!important}

.services,.service-lab{background:#f5fafc!important}
.service-stage{background:#061925!important;color:#fff!important}
.service-art{background:radial-gradient(circle at 72% 35%,rgba(33,160,243,.26),transparent 24%),linear-gradient(145deg,#071f2c,#0a3246)!important}
.service-caption small{color:#8edbff!important}
.service-caption p{color:#a9c2ce!important}

.business.business-dual,.business-dual{
  color:#102b3c!important;
  background:radial-gradient(circle at 18% 18%,rgba(66,190,235,.16),transparent 30%),radial-gradient(circle at 84% 72%,rgba(65,188,148,.13),transparent 30%),linear-gradient(135deg,#eef9fc 0%,#f8fcfd 48%,#eef9f5 100%)!important;
}
.business-dual:before{background-image:linear-gradient(rgba(31,117,151,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(31,117,151,.055) 1px,transparent 1px)!important;opacity:.72!important}
.business-dual-head .kicker{color:#0875c9!important}
.business-dual-head .title{color:#102b3c!important}
.business-dual-head .lead{color:#617d8b!important}
.business-dual .dual-world{background:linear-gradient(150deg,rgba(255,255,255,.96),rgba(221,244,251,.94))!important;border-color:rgba(21,116,157,.17)!important;box-shadow:0 22px 54px rgba(28,92,117,.11),inset 0 1px rgba(255,255,255,.92)!important}
.business-dual .government-world{background:linear-gradient(150deg,rgba(255,255,255,.97),rgba(225,247,239,.95))!important;border-color:rgba(37,139,109,.17)!important}
.business-dual .dual-world-top{color:#6a8795!important}
.business-dual .business-world .dual-world-top b{color:#0875c9!important}
.business-dual .government-world .dual-world-top b{color:#16875f!important}
.business-dual .dual-world-copy h3{color:#15394a!important}
.business-dual .dual-world-copy>p{color:#637f8b!important}
.business-dual .mission-service-head b{color:#2f7d9e!important}
.business-dual .mission-service-head span{color:#0875c9!important}
.business-dual .government-services .mission-service-head b{color:#2e8468!important}
.business-dual .government-services .mission-service-head span{color:#16875f!important}
.business-dual .mission-service-card{background:rgba(255,255,255,.76)!important;border-color:rgba(20,99,132,.12)!important;box-shadow:0 7px 16px rgba(20,87,112,.045)!important}
.business-dual .mission-service-card small{color:#4f8398!important}
.business-dual .mission-service-card b{color:#15394a!important}
.business-dual .mission-service-card em{color:#6d8792!important}
.business-dual .government-services .mission-service-card{border-color:rgba(37,139,109,.12)!important}

.png-live{background:#092b2f!important}
.png-live .png-story-wash{background:linear-gradient(90deg,rgba(3,23,28,.88) 0%,rgba(3,23,28,.67) 35%,rgba(3,23,28,.18) 65%,rgba(3,23,28,.32) 100%)!important}
.story-marker{background:rgba(4,25,34,.2)!important;border-color:rgba(255,255,255,.24)!important}

.updates,.updates-live{background:#f9fcfd!important}
.updates-console{background:#fff!important;border-color:rgba(16,43,60,.11)!important;box-shadow:0 18px 45px rgba(25,70,91,.07)!important}
.news-feature{background:#f5fafc!important;box-shadow:0 22px 55px rgba(16,43,60,.1)!important}
.updates-live .news-art{background:#0b2d3a!important}
.news-live-badge{background:rgba(6,25,37,.74)!important;color:#fff!important}

.support,.support-orbit{background:linear-gradient(180deg,#e9f6fc,#f5fafc)!important}
.support-orbit .support-stage{background:#061925!important;color:#fff!important}
.support-orbit .support-stage .kicker{color:#8edbff!important}
.support-orbit .support-stage .lead{color:#a6bfca!important}
.support-orbit .support-link{background:rgba(255,255,255,.075)!important;color:#fff!important;border-color:rgba(255,255,255,.16)!important}
.support-orbit .support-link small{color:#9bb6c4!important}
.support-orbit .support-link:hover{background:#fff!important;color:#061925!important;border-color:#fff!important}
.support-orbit .support-link:hover small{color:#66828f!important}
.support-hint{color:#7195a6!important}

footer{background:#061925!important;color:#fff!important}
.footer-top{border-bottom-color:rgba(255,255,255,.12)!important}
.footer-brand p{color:#8ea8b6!important}
.footer-col a{color:#88a2af!important}
.footer-bottom{color:#6f8996!important}
`;
    page.head.appendChild(backupPaletteStyle);

    const chatbotPopupStyle=page.createElement('style');
    chatbotPopupStyle.setAttribute('data-design42-chat-popup-v1','');
    chatbotPopupStyle.textContent=`
/* Design 42: conventional floating support-chat popup */
body.telikom-ai-open .site-viewport{width:100%!important}
body.telikom-ai-open .site-header{right:0!important}
.telikom-ai-launcher{
  width:58px!important;
  height:58px!important;
  padding:0!important;
  right:24px!important;
  bottom:24px!important;
  border-radius:50%!important;
  justify-content:center!important;
  background:#0875c9!important;
  border:1px solid rgba(255,255,255,.34)!important;
  box-shadow:0 14px 32px rgba(30,74,103,.24)!important;
}
.telikom-ai-launcher>span:last-child{display:none!important}
.telikom-ai-launcher .spark{
  width:34px!important;
  height:34px!important;
  background:transparent!important;
  box-shadow:none!important;
  font-size:17px!important;
}
.telikom-ai-panel{
  inset:auto 24px 94px auto!important;
  width:min(380px,calc(100vw - 32px))!important;
  height:min(540px,calc(100dvh - 126px))!important;
  border:1px solid rgba(38,83,105,.16)!important;
  border-radius:20px!important;
  background:#f7fafb!important;
  color:#173546!important;
  transform:translateY(16px) scale(.97)!important;
  transform-origin:bottom right!important;
  opacity:0!important;
  visibility:hidden!important;
  pointer-events:none!important;
  box-shadow:0 24px 64px rgba(31,67,88,.24)!important;
  overflow:hidden!important;
}
.telikom-ai-panel:before{display:none!important}
body.telikom-ai-open .telikom-ai-panel{
  transform:none!important;
  opacity:1!important;
  visibility:visible!important;
  pointer-events:auto!important;
}
.telikom-ai-head{
  min-height:64px!important;
  padding:12px 12px 11px 14px!important;
  background:#0875c9!important;
  color:#fff!important;
  border-bottom:0!important;
  backdrop-filter:none!important;
}
.telikom-ai-title b{color:#fff!important}
.telikom-ai-status{color:#d9effb!important}
.telikom-ai-lang,
.telikom-ai-close{
  border-color:rgba(255,255,255,.24)!important;
  background:rgba(255,255,255,.12)!important;
  color:#fff!important;
}
.telikom-ai-scroll{padding:15px 14px 18px!important;background:#f7fafb!important}
.telikom-ai-intro{padding:2px 2px 11px!important}
.telikom-ai-intro .eyebrow{color:#0875c9!important}
.telikom-ai-intro h3{font-size:22px!important;margin:7px 0 7px!important;color:#173546!important}
.telikom-ai-intro p{font-size:10px!important;color:#627d89!important}
.telikom-ai-suggestions{grid-template-columns:1fr 1fr!important;gap:7px!important;margin:7px 0 14px!important}
.telikom-ai-chip{
  min-height:38px!important;
  padding:8px 10px!important;
  border-radius:10px!important;
  background:#fff!important;
  border-color:rgba(43,91,112,.14)!important;
  color:#173546!important;
  box-shadow:0 4px 12px rgba(45,86,104,.05)!important;
}
.telikom-ai-chip:hover{background:#edf6fb!important;border-color:rgba(8,117,201,.26)!important;transform:none!important}
.telikom-ai-msg.bot{background:#edf2f4!important;border-color:rgba(43,91,112,.10)!important;color:#173546!important}
.telikom-ai-msg.bot b{color:#173546!important}
.telikom-ai-msg.bot a{color:#0875c9!important}
.telikom-ai-compose{padding:10px 11px 12px!important;background:#eef3f5!important;border-top-color:rgba(38,83,105,.10)!important;backdrop-filter:none!important}
.telikom-ai-form{background:#fff!important;border-color:rgba(43,91,112,.16)!important;color:#173546!important}
.telikom-ai-input{color:#173546!important}
.telikom-ai-input::placeholder{color:#81939c!important}
.telikom-ai-send{background:#0875c9!important;box-shadow:none!important}
.telikom-ai-note{color:#728791!important}
@media(max-width:560px){
  .telikom-ai-launcher{right:14px!important;bottom:14px!important;width:56px!important;height:56px!important}
  .telikom-ai-panel{
    inset:auto 12px 82px 12px!important;
    width:auto!important;
    height:min(590px,calc(100dvh - 104px))!important;
    border-radius:18px!important;
    transform-origin:bottom right!important;
  }
  .telikom-ai-suggestions{grid-template-columns:1fr 1fr!important}
}
@media(max-width:390px){.telikom-ai-suggestions{grid-template-columns:1fr!important}}
`;
    page.head.appendChild(chatbotPopupStyle);

    document.open();
    document.write('<!doctype html>'+page.documentElement.outerHTML);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<div><b>Design 42 could not load.</b><span>'+String(err.message||err)+'</span></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
