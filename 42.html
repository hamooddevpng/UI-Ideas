<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Telikom PNG | Loading Design 42…</title>
<style>
html,body{margin:0;min-height:100%;font-family:Manrope,Arial,sans-serif;background:#f3f4f1;color:#173546}#boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}#boot b{display:block;font-size:22px;letter-spacing:-.03em;margin-bottom:7px}#boot span{font-size:12px;color:#6d8794}
</style>
</head>
<body>
<div id="boot"><div><b>Loading Design 42…</b><span>Preparing the Digital PNG experience.</span></div></div>
<script>
(async()=>{
  const BASE='https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/42-base.html?v=20260911b';
  const ECOSYSTEM='https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/design42-ecosystem-v2.html?v=20260911b';
  const fetchText=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.text()};
  try{
    const baseHtml=await fetchText(BASE);
    const parser=new DOMParser();
    const page=parser.parseFromString(baseHtml,'text/html');
    const base=page.createElement('base');
    base.href='https://raw.githubusercontent.com/hamooddevpng/UI-Ideas/main/';
    page.head.prepend(base);

    try{
      const protoHtml=await fetchText(ECOSYSTEM);
      const proto=parser.parseFromString(protoHtml,'text/html');
      const oldSection=page.querySelector('.digital-ecosystem');
      const newSection=proto.querySelector('.eco-section');
      if(oldSection&&newSection){
        const prototypeStyle=proto.querySelector('style');
        if(prototypeStyle){const style=page.createElement('style');style.setAttribute('data-design42-ecosystem-v2','');style.textContent=prototypeStyle.textContent;page.head.appendChild(style)}
        oldSection.replaceWith(page.importNode(newSection,true));
        const prototypeScript=proto.querySelector('body > script');
        if(prototypeScript){const script=page.createElement('script');script.setAttribute('data-design42-ecosystem-v2','');script.textContent=prototypeScript.textContent;page.body.appendChild(script)}
      }
    }catch(ecosystemError){console.warn('Design 42 ecosystem enhancement failed; loading the stable base instead.',ecosystemError)}

    const palette=page.createElement('style');
    palette.setAttribute('data-design42-liquid-glass-v5','');
    palette.textContent=String.raw`
/* Design 42 liquid glass v5 */
:root{--deep-bg:#356f8f;--ink:#173546;--muted:#657e89}
html,body{background:#f3f4f1!important;color:#173546!important}
.offers,.raffle-offers,.updates,.updates-live{background:#f6f7f4!important}
.services,.service-lab{background:#edf1f0!important}
.business.business-dual{background:#eef2f2!important;color:#173546!important}
.site-header.scrolled{background:rgba(46,91,118,.95)!important}
.hero{background:#315f7d!important}
.scene-phone{background:radial-gradient(circle at 78% 42%,rgba(151,205,228,.18),transparent 30%),linear-gradient(118deg,#28556f 0%,#376c88 56%,#527f95 100%)!important}
.scene-phone:after{background:linear-gradient(90deg,rgba(29,61,79,.54) 0%,rgba(42,83,103,.25) 45%,rgba(75,126,145,.03) 76%,transparent 100%)!important}
.scene-enterprise{background:radial-gradient(circle at 77% 49%,rgba(162,215,234,.17),transparent 29%),linear-gradient(120deg,#2c5b76 0%,#3d728a 58%,#568396 100%)!important}
.hero[data-scene-index="2"] .scene-enterprise:after{background:linear-gradient(90deg,rgba(30,65,82,.42) 0%,rgba(46,91,108,.17) 52%,transparent 80%)!important}

.business-dual .business-dual-head .title,.business-dual .dual-world-copy h3{color:#173546!important}
.business-dual .business-dual-head .lead,.business-dual .dual-world-copy>p{color:#607985!important}
.business-dual .business-dual-head .kicker{color:#0875c9!important}
.business-dual .dual-world,.business-dual .business-world,.business-dual .government-world{background:rgba(255,255,255,.10)!important;border:1px solid rgba(255,255,255,.68)!important;box-shadow:0 16px 38px rgba(45,86,104,.055)!important;-webkit-backdrop-filter:blur(16px) saturate(130%)!important;backdrop-filter:blur(16px) saturate(130%)!important}
.business-dual .mission-service-card{background:rgba(255,255,255,.24)!important;border-color:rgba(255,255,255,.62)!important;box-shadow:none!important}
.business-dual .dual-world-top{color:#607c88!important}
.business-dual .dual-world-top b{color:#2c6f93!important}
.business-dual .government-world .dual-world-top b{color:#278263!important}

.support-orbit{position:relative!important;isolation:isolate!important;overflow:hidden!important;background:radial-gradient(circle at 18% 24%,rgba(8,117,201,.11),transparent 25%),radial-gradient(circle at 82% 28%,rgba(88,190,220,.15),transparent 26%),radial-gradient(circle at 68% 78%,rgba(111,196,170,.08),transparent 24%),linear-gradient(135deg,#eef2f1 0%,#f4f4ef 48%,#e9f0f2 100%)!important;background-size:115% 115%,120% 120%,118% 118%,100% 100%!important;animation:supportCanvasBreath 18s ease-in-out infinite alternate}
@keyframes supportCanvasBreath{from{background-position:0% 0%,100% 0%,100% 100%,0 0}to{background-position:6% 5%,92% 8%,94% 90%,0 0}}
.support-orbit:before{content:""!important;position:absolute!important;z-index:0!important;width:650px!important;height:650px!important;right:-180px!important;top:-240px!important;border-radius:50%!important;background:radial-gradient(circle at 42% 42%,rgba(74,174,210,.20),rgba(49,139,177,.07) 38%,transparent 68%)!important;filter:blur(10px)!important;pointer-events:none!important;animation:supportAmbientFloatV5 14s ease-in-out infinite alternate!important}
.support-orbit:after{content:""!important;position:absolute!important;z-index:0!important;inset:-18%!important;pointer-events:none!important;opacity:.24!important;background-image:linear-gradient(rgba(47,102,124,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(47,102,124,.055) 1px,transparent 1px)!important;background-size:54px 54px!important;mask-image:radial-gradient(ellipse at 70% 54%,#000 0 13%,rgba(0,0,0,.56) 34%,transparent 72%)!important;animation:supportGridDriftV5 26s linear infinite!important}
@keyframes supportAmbientFloatV5{from{transform:translate3d(-26px,24px,0) scale(.96)}to{transform:translate3d(34px,-18px,0) scale(1.08)}}
@keyframes supportGridDriftV5{to{background-position:54px 27px,27px 54px}}

.support-orbit .support-stage{position:relative!important;z-index:2!important;background-color:rgba(255,255,255,.035)!important;background-image:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.025))!important;color:#173546!important;border:1px solid rgba(255,255,255,.74)!important;box-shadow:0 24px 70px rgba(37,72,88,.10),inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(39,91,111,.08)!important;-webkit-backdrop-filter:blur(28px) saturate(145%)!important;backdrop-filter:blur(28px) saturate(145%)!important}
.support-orbit .support-stage:before{content:"";position:absolute;z-index:2;inset:1px;border-radius:35px;pointer-events:none;border:1px solid rgba(255,255,255,.35);background:linear-gradient(155deg,rgba(255,255,255,.16),transparent 24%,transparent 76%,rgba(8,117,201,.035))}
.support-orbit .support-stage:after{content:"";position:absolute;z-index:2;top:-42%;left:-46%;width:26%;height:190%;pointer-events:none;transform:rotate(15deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);filter:blur(1px);opacity:.5;animation:supportGlassSheen 10s ease-in-out infinite}
@keyframes supportGlassSheen{0%,18%{left:-46%;opacity:0}34%{opacity:.45}58%{left:122%;opacity:.22}100%{left:122%;opacity:0}}
.support-orbit .support-copy{position:relative!important;z-index:6!important}
.support-orbit .support-stage .title{color:#173546!important;text-shadow:none!important}
.support-orbit .support-stage .lead{color:#59737e!important}
.support-orbit .support-stage .kicker{color:#0875c9!important}
.support-orbit .support-search{background:rgba(255,255,255,.58)!important;border:1px solid rgba(255,255,255,.88)!important;box-shadow:0 12px 32px rgba(41,78,94,.08),inset 0 1px rgba(255,255,255,.8)!important;-webkit-backdrop-filter:blur(22px) saturate(135%)!important;backdrop-filter:blur(22px) saturate(135%)!important}
.support-orbit .support-search input{background:transparent!important}
.support-orbit .support-link{background-color:rgba(255,255,255,.075)!important;background-image:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.025))!important;color:#173546!important;border:1px solid rgba(255,255,255,.66)!important;box-shadow:0 12px 28px rgba(42,79,95,.06),inset 0 1px rgba(255,255,255,.62)!important;-webkit-backdrop-filter:blur(20px) saturate(145%)!important;backdrop-filter:blur(20px) saturate(145%)!important}
.support-orbit .support-link:hover{background:rgba(255,255,255,.40)!important;color:#173546!important;border-color:rgba(255,255,255,.92)!important;box-shadow:0 16px 34px rgba(42,79,95,.09),inset 0 1px rgba(255,255,255,.88)!important}
.support-orbit .support-link small{color:#667f89!important}
.support-orbit .support-radar i,.support-orbit .support-radar span{border-color:rgba(42,112,145,.17)!important}
.support-orbit .support-radar span{background:linear-gradient(rgba(63,143,177,.34),transparent)!important}
.support-hint{color:#708892!important}

.telikom-ai-panel{background:rgba(241,244,242,.78)!important;color:#173546!important;box-shadow:-18px 0 55px rgba(42,77,94,.16)!important;border-left:1px solid rgba(255,255,255,.72)!important;-webkit-backdrop-filter:blur(24px) saturate(135%)!important;backdrop-filter:blur(24px) saturate(135%)!important}
.telikom-ai-head{background:rgba(255,255,255,.18)!important;border-bottom-color:rgba(38,83,105,.12)!important;color:#173546!important}
.telikom-ai-chip,.telikom-ai-msg.bot,.telikom-ai-form{background:rgba(255,255,255,.22)!important;border-color:rgba(255,255,255,.66)!important;color:#173546!important;box-shadow:none!important}
.telikom-ai-chip:hover{background:rgba(255,255,255,.52)!important;border-color:rgba(8,117,201,.28)!important}
.telikom-ai-compose{background:rgba(229,236,237,.76)!important;border-top-color:rgba(38,83,105,.12)!important}
.telikom-ai-panel p,.telikom-ai-panel small{color:#627d89!important}
.telikom-ai-panel input{color:#173546!important}
.telikom-ai-panel input::placeholder{color:#7f949d!important}

footer{background:linear-gradient(180deg,#315b75 0%,#284b63 100%)!important}
.footer-brand p,.footer-col a,.footer-bottom{color:#d6e3e8!important}
.footer-col b{color:#fff!important}

@media(max-width:820px){
  .support-orbit{background-size:140% 140%,150% 150%,145% 145%,100% 100%!important}
  .support-orbit:before{width:500px!important;height:500px!important;right:-240px!important;top:210px!important;opacity:.72!important}
  .support-orbit:after{background-size:42px 42px!important;opacity:.18!important}
  .support-orbit .support-stage{background-color:rgba(255,255,255,.028)!important;background-image:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.018))!important;border-color:rgba(255,255,255,.78)!important;-webkit-backdrop-filter:blur(24px) saturate(145%)!important;backdrop-filter:blur(24px) saturate(145%)!important}
  .support-orbit .support-link{background-color:rgba(255,255,255,.055)!important;border-color:rgba(255,255,255,.62)!important}
}
@media(prefers-reduced-motion:reduce){.support-orbit,.support-orbit:before,.support-orbit:after,.support-orbit .support-stage:after{animation:none!important}}
`;
    page.head.appendChild(palette);

    document.open();
    document.write('<!doctype html>'+page.documentElement.outerHTML);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<div><b>Design 42 could not load.</b><span>'+String(err.message||err)+'</span></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
