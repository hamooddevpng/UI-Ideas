<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telikom Website Scorecard Report &amp; Benchmark Analysis | Telikom</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f9fd;color:#173e60}
#boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
#boot b{display:block;font-size:22px;color:#07376f;margin-bottom:7px}
#boot span{font-size:12px;color:#748ca1}
</style>
</head>
<body>
<div id="boot"><div><b>Loading Telikom website scorecard…</b><span>Preparing the benchmark report.</span></div></div>
<script>
(async()=>{
  const resolveSourceRoot=()=>{
    const injectedBase=new URL('./',document.baseURI).href;
    if(/^https:\/\/raw\.githubusercontent\.com\//i.test(injectedBase))return injectedBase;

    const embedded=decodeURIComponent(location.search.slice(1));
    if(/^https:\/\/raw\.githubusercontent\.com\//i.test(embedded)){
      try{
        const raw=new URL(embedded);
        raw.hash='';
        raw.search='';
        raw.pathname=raw.pathname.replace(/\/website-benchmark\.html$/,'/');
        return raw.href;
      }catch(error){console.warn('Could not parse htmlpreview source URL.',error)}
    }
    return new URL('./',location.href).href;
  };

  try{
    const sourceRoot=resolveSourceRoot();
    const sourceUrl=new URL('website-benchmark-source.html',sourceRoot).href;
    const response=await fetch(sourceUrl,{cache:'no-store'});
    if(!response.ok)throw new Error(`${response.status} ${response.statusText}`);

    let html=await response.text();
    html=html.replace('Stage 2 • Close the gaps','Stage 2 • Closing the gaps');

    const cleanupScript=`<script data-scorecard-dedup>\n(()=>{\n  const groupOrder=['Experience & Service Journey','SEO & Discovery','Trust & Resilience'];\n\n  const regroup=(rootId,rowSelector)=>{\n    const root=document.getElementById(rootId);\n    if(!root)return;\n\n    const knownGroups=new Map(groupOrder.map(group=>[group,[]]));\n    const extraGroups=new Map();\n    const seenIds=new Set();\n    const seenLabels=new Set();\n\n    [...root.querySelectorAll(rowSelector)].forEach(row=>{\n      const label=row.querySelector('.metric-cell b')?.textContent.trim()||'';\n      const group=row.querySelector('.metric-cell small')?.textContent.trim()||'';\n      const id=(row.dataset.metric||label).trim().toLowerCase();\n      const labelKey=label.toLowerCase();\n\n      if(!label||!group||seenIds.has(id)||seenLabels.has(labelKey)){\n        row.remove();\n        return;\n      }\n\n      seenIds.add(id);\n      seenLabels.add(labelKey);\n      row.querySelector('.metric-cell small')?.remove();\n\n      if(knownGroups.has(group))knownGroups.get(group).push(row);\n      else{\n        if(!extraGroups.has(group))extraGroups.set(group,[]);\n        extraGroups.get(group).push(row);\n      }\n    });\n\n    root.replaceChildren();\n    const appendGroup=(group,rows)=>{\n      if(!rows?.length)return;\n      const heading=document.createElement('div');\n      heading.className='group-row';\n      heading.textContent=group;\n      root.appendChild(heading);\n      rows.forEach(row=>root.appendChild(row));\n    };\n\n    groupOrder.forEach(group=>appendGroup(group,knownGroups.get(group)));\n    extraGroups.forEach((rows,group)=>appendGroup(group,rows));\n  };\n\n  regroup('legacyTable','.legacy-row');\n  regroup('newTable','.new-row');\n})();\n<\/script>`;

    html=html.replace('</body>',cleanupScript+'\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML=`<div><b>Scorecard could not load.</b><span>${String(error.message||error)}</span></div>`;
    console.error(error);
  }
})();
</script>
</body>
</html>
