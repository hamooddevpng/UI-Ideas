<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telikom Website Scorecard Report &amp; Benchmark Analysis | Telikom</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f9fd;color:#173e60}
#boot{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
#boot b{display:block;font-size:22px;color:#07376f;margin-bottom:7px}
#boot span{font-size:12px;color:#748ca1}
</style>
</head>
<body>
<div id="boot"><div><b>Loading Telikom website scorecard…</b><span>Preparing the benchmark report.</span></div></div>
<script>
(async()=>{
  const resolveSourceRoot=()=>{
    const injectedBase=new URL('./',document.baseURI).href;
    if(/^https:\/\/raw\.githubusercontent\.com\//i.test(injectedBase))return injectedBase;

    const embedded=decodeURIComponent(location.search.slice(1));
    if(/^https:\/\/raw\.githubusercontent\.com\//i.test(embedded)){
      try{
        const raw=new URL(embedded);
        raw.hash='';
        raw.search='';
        raw.pathname=raw.pathname.replace(/\/website-benchmark\.html$/,'/');
        return raw.href;
      }catch(error){console.warn('Could not parse htmlpreview source URL.',error)}
    }
    return new URL('./',location.href).href;
  };

  try{
    const sourceRoot=resolveSourceRoot();
    const sourceUrl=new URL('website-benchmark-source.html',sourceRoot).href;
    const response=await fetch(sourceUrl,{cache:'no-store'});
    if(!response.ok)throw new Error(`${response.status} ${response.statusText}`);

    let html=await response.text();

    const textReplacements=[
      ['Stage 2 • Close the gaps','Stage 2 • Closing the gaps'],
      ['Then, show exactly how the new website closes those gaps.','Then, show exactly how the Telikom New Website closes those gaps.'],
      ['<div class="newcol">New Website</div>','<div class="newcol">Telikom New Website</div>'],
      ['<b>31 Oct</b><span>delivery target</span>','<b>15 Nov</b><span>final deadline</span>'],
      ['Target: 31 Oct 2026','Target: 15 Nov 2026'],
      ['through planned completion.','through planned completion, Self Care integration and final testing.'],
      ['The final two weeks are reserved for QA, production readiness, deployment and handover.','Post-completion plan: 1 week for Self Care integration finalisation, then 1 week of internal and external testing. Final deadline: 15 Nov 2026.'],
      ['Programme scorecard • Tracker-based view • 20 Jul–31 Oct 2026','Programme scorecard • Tracker-based view • 20 Jul–15 Nov 2026']
    ];
    textReplacements.forEach(([from,to])=>{html=html.replace(from,to)});

    html=html.replace('grid-template-columns:260px repeat(15,minmax(66px,1fr))','grid-template-columns:260px repeat(17,minmax(66px,1fr))');
    html=html.replace(
      "const weeks=['20 Jul','27 Jul','3 Aug','10 Aug','17 Aug','24 Aug','31 Aug','7 Sep','14 Sep','21 Sep','28 Sep','5 Oct','12 Oct','19 Oct','26 Oct'];",
      "const weeks=['20 Jul','27 Jul','3 Aug','10 Aug','17 Aug','24 Aug','31 Aug','7 Sep','14 Sep','21 Sep','28 Sep','5 Oct','12 Oct','19 Oct','26 Oct','2 Nov','9 Nov'];"
    );
    html=html.replace(
      "['Production readiness, deployment & handover','.............AA']\n];",
      "['Production readiness, deployment & handover','.............AA'],\n['Self Care integration finalisation','...............A.'],\n['Internal & external testing period','................A']\n];"
    );
    html=html.replace('[...status].forEach(s=>root.insertAdjacentHTML', '[...status.padEnd(weeks.length,\'.\').slice(0,weeks.length)].forEach(s=>root.insertAdjacentHTML');

    const cleanupScript=`<script data-scorecard-dedup>\n(()=>{\n  const groupOrder=['Experience & Service Journey','SEO & Discovery','Trust & Resilience'];\n\n  document.querySelectorAll('.newcol').forEach(el=>{\n    if(el.textContent.trim()==='New Website')el.textContent='Telikom New Website';\n  });\n\n  const regroup=(rootId,rowSelector)=>{\n    const root=document.getElementById(rootId);\n    if(!root)return;\n\n    const knownGroups=new Map(groupOrder.map(group=>[group,[]]));\n    const extraGroups=new Map();\n    const seenIds=new Set();\n    const seenLabels=new Set();\n\n    [...root.querySelectorAll(rowSelector)].forEach(row=>{\n      const label=row.querySelector('.metric-cell b')?.textContent.trim()||'';\n      const group=row.querySelector('.metric-cell small')?.textContent.trim()||'';\n      const id=(row.dataset.metric||label).trim().toLowerCase();\n      const labelKey=label.toLowerCase();\n\n      if(!label||!group||seenIds.has(id)||seenLabels.has(labelKey)){\n        row.remove();\n        return;\n      }\n\n      seenIds.add(id);\n      seenLabels.add(labelKey);\n      row.querySelector('.metric-cell small')?.remove();\n\n      if(knownGroups.has(group))knownGroups.get(group).push(row);\n      else{\n        if(!extraGroups.has(group))extraGroups.set(group,[]);\n        extraGroups.get(group).push(row);\n      }\n    });\n\n    root.replaceChildren();\n    const appendGroup=(group,rows)=>{\n      if(!rows?.length)return;\n      const heading=document.createElement('div');\n      heading.className='group-row';\n      heading.textContent=group;\n      root.appendChild(heading);\n      rows.forEach(row=>root.appendChild(row));\n    };\n\n    groupOrder.forEach(group=>appendGroup(group,knownGroups.get(group)));\n    extraGroups.forEach((rows,group)=>appendGroup(group,rows));\n  };\n\n  regroup('legacyTable','.legacy-row');\n  regroup('newTable','.new-row');\n})();\n<\/script>`;

    html=html.replace('</body>',cleanupScript+'\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML=`<div><b>Scorecard could not load.</b><span>${String(error.message||error)}</span></div>`;
    console.error(error);
  }
})();
</script>
</body>
</html>
